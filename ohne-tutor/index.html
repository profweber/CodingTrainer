lause)."}, "starter": {"de": "def parse_all(texts):\n    ...\n", "en": "def parse_all(texts):\n    ...\n"}, "solution": "def parse_all(texts):\n    numbers = []\n    invalid = []\n    for i, t in enumerate(texts):\n        try:\n            x = float(t.replace(\",\", \".\"))\n        except ValueError:\n            invalid.append(i)\n        else:\n            numbers.append(x)\n    return numbers, invalid\n\nprint(parse_all([\"21,4\", \"abc\", \"23.9\", \"\", \"1e3\"]))\n", "tests": "\nns, out = run()\ncases = [([\"21,4\", \"abc\", \"23.9\", \"\", \"1e3\"], ([21.4, 23.9, 1000.0], [1, 3])), ([], ([], [])), ([\"1,2,3\", \"-0,5\"], ([-0.5], [0]))]\nfor t, (en, ei) in cases:\n    r = call(ns, \"parse_all\", t)\n    check(isinstance(r, tuple) and len(r) == 2 and sorted(r[0]) == sorted(en) and sorted(r[1]) == ei, f\"parse_all({t}) = ({en}, {ei})\", f\"parse_all({t}) = ({en}, {ei})\")\n", "require": ["try"], "refs": ["B.3", "B.3e"], "forbid": [], "stdin": "", "topics": []}, {"id": "kB-finally", "ch": "B", "lvl": 2, "title": {"de": "Messgerät immer abschalten", "en": "Always switching off the instrument"}, "task": {"de": "Ein Messgerät muss nach jeder Messreihe abgeschaltet werden – auch wenn dabei ein Fehler auftritt. Simuliert wird das Gerät durch die Liste `log`, in die Ereignisse geschrieben werden.\n\nSchreiben Sie `measure(log, raw_values, gain)`:\n- Hängen Sie zuerst `\"an\"` an `log`.\n- Rechnen Sie dann alle Rohwerte um (`raw / gain`) und sammeln Sie die Ergebnisse.\n- Im `finally`-Zweig wird **immer** `\"aus\"` an `log` gehängt.\n- Die Funktion gibt die Liste der Ergebnisse in der Reihenfolge der Rohwerte zurück. Tritt ein Fehler auf (z.B. `ZeroDivisionError` bei `gain = 0`), wird er **nicht** abgefangen, sondern an den Aufrufer weitergegeben – nur das Abschalten muss trotzdem passieren.", "en": "An instrument must be switched off after every measurement series – even if an error occurs. The instrument is simulated by the list `log`, into which events are written.\n\nWrite `measure(log, raw_values, gain)`:\n- First append `\"an\"` (on) to `log`.\n- Then convert all raw values (`raw / gain`) and collect the results.\n- In the `finally` clause, `\"aus\"` (off) is **always** appended to `log`.\n- The function returns the list of results in the order of the raw values. If an error occurs (e.g. `ZeroDivisionError` for `gain = 0`), it is **not** caught but passed on to the caller – only the switching off must happen anyway."}, "starter": {"de": "def measure(log, raw_values, gain):\n    ...\n", "en": "def measure(log, raw_values, gain):\n    ...\n"}, "solution": "def measure(log, raw_values, gain):\n    log.append(\"an\")\n    try:\n        results = []\n        for raw in raw_values:\n            results.append(raw / gain)\n        return results\n    finally:\n        log.append(\"aus\")\n\nlog = []\nprint(measure(log, [100, 250], 50), log)\n", "tests": "\nns, out = run()\nlog = []\nr = call(ns, \"measure\", log, [100, 250, 0], 50)\ncheck(r == [2.0, 5.0, 0.0] and log == [\"an\", \"aus\"], \"measure(log, [100, 250, 0], 50) = [2.0, 5.0, 0.0], log = ['an', 'aus']\", \"measure(log, [100, 250, 0], 50) = [2.0, 5.0, 0.0], log = ['an', 'aus']\")\nf = ns[\"measure\"]\nlog2 = []\ncheck(raises(ZeroDivisionError, lambda: f(log2, [1, 2], 0)), \"gain = 0: ZeroDivisionError wird weitergegeben\", \"gain = 0: ZeroDivisionError is passed on\")\ncheck(log2 == [\"an\", \"aus\"], \"Auch bei einem Fehler wird abgeschaltet: log = ['an', 'aus']\", \"Switched off even on an error: log = ['an', 'aus']\")\nlog3 = []\ncheck(raises(TypeError, lambda: f(log3, [1, \"x\"], 2)) and log3 == [\"an\", \"aus\"], \"Auch bei TypeError wird abgeschaltet\", \"Also switched off on a TypeError\")\ncheck(\"finally\" in SOURCE, \"Mit finally gelöst\", \"Solved with finally\")\n", "require": ["try", "def"], "refs": ["B.3e", "B.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "kB-linenumbers", "ch": "B", "lvl": 2, "title": {"de": "Fehlermeldung mit Zeilennummer", "en": "Error message with line number"}, "task": {"de": "Eine Liste von Textzeilen (`lines`) soll in Zahlen umgewandelt werden (Dezimalkomma erlaubt). Wenn eine Zeile ungültig ist, soll **nicht** einfach Pythons Originalmeldung erscheinen, sondern eine verständliche: Schreiben Sie `parse_lines(lines)`, die die Liste der Zahlen in der Reihenfolge der Zeilen zurückgibt. Tritt bei einer Zeile ein `ValueError` auf, fangen Sie ihn ab und lösen Sie einen neuen `ValueError` mit der Meldung `Zeile 3: 'abc' ist keine Zahl` aus (Zeilen gezählt ab 1, der Originaltext in Anführungszeichen – `{text!r}` im f-String erzeugt sie automatisch).\n\nLeere Zeilen (nach `strip()`) werden übersprungen, zählen aber bei der Nummerierung mit.", "en": "A list of text lines (`lines`) is to be converted into numbers (decimal comma allowed). If a line is invalid, Python's original message should **not** simply appear, but an understandable one: write `parse_lines(lines)` that returns the list of numbers in the order of the lines. If a `ValueError` occurs for a line, catch it and raise a new `ValueError` with the message `Zeile 3: 'abc' ist keine Zahl` (line 3: 'abc' is not a number; lines counted from 1, the original text in quotes – `{text!r}` in the f-string adds them automatically).\n\nEmpty lines (after `strip()`) are skipped but still count for the numbering."}, "starter": {"de": "def parse_lines(lines):\n    ...\n", "en": "def parse_lines(lines):\n    ...\n"}, "solution": "def parse_lines(lines):\n    numbers = []\n    for nr, line in enumerate(lines, start=1):\n        text = line.strip()\n        if text == \"\":\n            continue\n        try:\n            numbers.append(float(text.replace(\",\", \".\")))\n        except ValueError:\n            raise ValueError(f\"Zeile {nr}: {text!r} ist keine Zahl\")\n    return numbers\n\nprint(parse_lines([\"21,4\", \"\", \"23.9\"]))\n", "tests": "\nns, out = run()\nf = ns.get(\"parse_lines\")\ncheck(call(ns, \"parse_lines\", [\"21,4\", \"\", \"23.9\", \" 1e2 \"]) == [21.4, 23.9, 100.0] and call(ns, \"parse_lines\", []) == [], \"Gültige Zeilen werden umgewandelt, leere übersprungen\", \"Valid lines are converted, empty ones skipped\")\nfor lines, nr, bad in [([\"1\", \"2\", \"abc\"], 3, \"abc\"), ([\"\", \"x1\"], 2, \"x1\"), ([\"5,5,5\"], 1, \"5,5,5\")]:\n    msg = \"\"\n    try:\n        f(lines)\n    except ValueError as e:\n        msg = str(e)\n    except Exception as e:\n        msg = \"anderer Fehler \" + type(e).__name__\n    check((f\"zeile {nr}\" in msg.lower() or f\"line {nr}\" in msg.lower()) and repr(bad) in msg, f\"{lines}: Meldung nennt Zeile {nr} und {bad!r}\", f\"{lines}: message names line {nr} and {bad!r}\")\n", "require": ["try", "raise"], "refs": ["B.4", "B.3", "B.2"], "forbid": [], "stdin": "", "topics": []}, {"id": "kB-validate", "ch": "B", "lvl": 2, "title": {"de": "Bauteildaten prüfen", "en": "Validating part data"}, "task": {"de": "Aus einem ERP-System kommen Bauteildaten als Dictionaries mit den Schlüsseln `\"nr\"`, `\"length\"` und `\"mass\"`. Schreiben Sie `validate(part)`:\n- Fehlt ein Schlüssel, entsteht beim Zugriff ein `KeyError` – lassen Sie ihn einfach durch (nicht abfangen).\n- Ist `length` oder `mass` keine Zahl (`int`/`float`), lösen Sie einen `TypeError` aus.\n- Ist `length` oder `mass` nicht positiv, lösen Sie einen `ValueError` aus.\n- Sonst wird `True` zurückgegeben.\n\nSchreiben Sie dann `check_batch(parts)`, die für eine Liste von Bauteilen ein Dictionary mit den Zählern `\"ok\"`, `\"KeyError\"`, `\"TypeError\"` und `\"ValueError\"` zurückgibt (alle vier Schlüssel immer vorhanden). Tipp: `type(e).__name__` liefert den Namen des Fehlertyps.", "en": "Part data come from an ERP system as dictionaries with the keys `\"nr\"`, `\"length\"` and `\"mass\"`. Write `validate(part)`:\n- If a key is missing, accessing it raises a `KeyError` – simply let it through (don't catch it).\n- If `length` or `mass` is not a number (`int`/`float`), raise a `TypeError`.\n- If `length` or `mass` is not positive, raise a `ValueError`.\n- Otherwise return `True`.\n\nThen write `check_batch(parts)` that returns, for a list of parts, a dictionary with the counters `\"ok\"`, `\"KeyError\"`, `\"TypeError\"` and `\"ValueError\"` (all four keys always present). Tip: `type(e).__name__` gives the name of the error type."}, "starter": {"de": "def validate(part):\n    ...\n", "en": "def validate(part):\n    ...\n"}, "solution": "def validate(part):\n    length = part[\"length\"]\n    mass = part[\"mass\"]\n    nr = part[\"nr\"]\n    for x in (length, mass):\n        if not isinstance(x, (int, float)):\n            raise TypeError(f\"{nr}: Zahl erwartet, nicht {x!r}\")\n        if x <= 0:\n            raise ValueError(f\"{nr}: Wert muss positiv sein, nicht {x}\")\n    return True\n\ndef check_batch(parts):\n    counts = {\"ok\": 0, \"KeyError\": 0, \"TypeError\": 0, \"ValueError\": 0}\n    for part in parts:\n        try:\n            validate(part)\n        except (KeyError, TypeError, ValueError) as e:\n            counts[type(e).__name__] += 1\n        else:\n            counts[\"ok\"] += 1\n    return counts\n\nprint(check_batch([{\"nr\": \"A1\", \"length\": 120, \"mass\": 0.4}, {\"nr\": \"A2\", \"length\": \"120\", \"mass\": 1}]))\n", "tests": "\nns, out = run()\nf = ns.get(\"validate\")\ncheck(call(ns, \"validate\", {\"nr\": \"A1\", \"length\": 120, \"mass\": 0.4}) is True, \"Gültiges Bauteil → True\", \"Valid part → True\")\ncheck(raises(KeyError, lambda: f({\"nr\": \"A2\", \"length\": 10})), \"Fehlender Schlüssel → KeyError\", \"Missing key → KeyError\")\ncheck(raises(TypeError, lambda: f({\"nr\": \"A3\", \"length\": \"10\", \"mass\": 1})) and raises(TypeError, lambda: f({\"nr\": \"A3\", \"length\": 10, \"mass\": None})), \"Text/None → TypeError\", \"Text/None → TypeError\")\ncheck(raises(ValueError, lambda: f({\"nr\": \"A4\", \"length\": 0, \"mass\": 1})) and raises(ValueError, lambda: f({\"nr\": \"A4\", \"length\": 5, \"mass\": -2.0})), \"Nicht positiv → ValueError\", \"Not positive → ValueError\")\nbatch = [{\"nr\": \"1\", \"length\": 1, \"mass\": 1}, {\"nr\": \"2\", \"length\": 2}, {\"nr\": \"3\", \"length\": \"x\", \"mass\": 1}, {\"nr\": \"4\", \"length\": -1, \"mass\": 1}, {\"nr\": \"5\", \"length\": 3.5, \"mass\": 2}, {\"mass\": 1, \"length\": 1}]\ncheck(call(ns, \"check_batch\", batch) == {\"ok\": 2, \"KeyError\": 2, \"TypeError\": 1, \"ValueError\": 1}, \"check_batch zählt 2 ok, 2 KeyError, 1 TypeError, 1 ValueError\", \"check_batch counts 2 ok, 2 KeyError, 1 TypeError, 1 ValueError\")\ncheck(call(ns, \"check_batch\", []) == {\"ok\": 0, \"KeyError\": 0, \"TypeError\": 0, \"ValueError\": 0}, \"Leere Liste → alle Zähler 0\", \"Empty list → all counters 0\")\n", "require": ["try", "raise"], "refs": ["B.4", "B.3", "8.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "kB-device", "ch": "B", "lvl": 2, "title": {"de": "Messgerät mit Wiederholversuchen abfragen", "en": "Querying an instrument with retries"}, "task": {"de": "Ein Messgerät antwortet über eine gestörte Schnittstelle nicht immer brauchbar. Simuliert wird es durch die Liste `replies` mit den Antworten als Text in zeitlicher Reihenfolge, z.B. `[\"ERR\", \"\", \"23.7\"]`. Schreiben Sie `query(replies, attempts=3)`:\n- Holen Sie die jeweils nächste Antwort mit `replies.pop(0)` und wandeln Sie sie mit `float()` um. Gelingt das, wird der Wert sofort zurückgegeben (übrige Antworten bleiben in der Liste).\n- Ist eine Antwort unbrauchbar (`ValueError`), wird es mit der nächsten Antwort erneut versucht – insgesamt höchstens `attempts`-mal.\n- Sind alle Versuche verbraucht oder ist die Liste vorher leer (`IndexError` bei `pop`), lösen Sie einen `ValueError` mit der Meldung `Keine gültige Antwort nach <n> Versuchen` aus; `<n>` ist die Anzahl der tatsächlich gelesenen Antworten.\n\nFangen Sie die beiden Fehlertypen gezielt ab.", "en": "An instrument does not always give a usable answer over a noisy interface. It is simulated by the list `replies` with the answers as text in chronological order, e.g. `[\"ERR\", \"\", \"23.7\"]`. Write `query(replies, attempts=3)`:\n- Fetch the next answer with `replies.pop(0)` and convert it with `float()`. If that works, return the value immediately (the remaining answers stay in the list).\n- If an answer is unusable (`ValueError`), try again with the next answer – at most `attempts` times in total.\n- If all attempts are used up or the list runs empty first (`IndexError` on `pop`), raise a `ValueError` with the message `Keine gültige Antwort nach <n> Versuchen` (no valid answer after n attempts); `<n>` is the number of answers actually read.\n\nCatch the two error types specifically."}, "starter": {"de": "def query(replies, attempts=3):\n    pass   # Ihr Code\n\n\nprint(query([\"ERR\", \"\", \"23.7\"]))\n", "en": "def query(replies, attempts=3):\n    pass   # your code\n\n\nprint(query([\"ERR\", \"\", \"23.7\"]))\n"}, "solution": "def query(replies, attempts=3):\n    tries = 0\n    while tries < attempts:\n        try:\n            reply = replies.pop(0)\n        except IndexError:\n            break\n        tries += 1\n        try:\n            return float(reply)\n        except ValueError:\n            pass\n    raise ValueError(f\"Keine gültige Antwort nach {tries} Versuchen\")\n\n\nprint(query([\"ERR\", \"\", \"23.7\"]))\n", "tests": "\nns, out = run()\nf = ns.get(\"query\")\nif f is None:\n    raise TestFailure(\"Es gibt keine Funktion query. / There is no function query.\")\nr = [\"21.5\", \"ERR\"]\ncheck(approx(call(ns, \"query\", r), 21.5) and r == [\"ERR\"], \"Erste Antwort gültig → 21.5, die übrige Antwort bleibt in der Liste\", \"First answer valid → 21.5, the remaining answer stays in the list\")\nr = [\"ERR\", \"\", \"23.7\", \"24.0\"]\ncheck(approx(call(ns, \"query\", r), 23.7) and r == [\"24.0\"], \"Zwei Störungen, dann 23.7 (dritter Versuch)\", \"Two faults, then 23.7 (third attempt)\")\ndef msg(replies, **kw):\n    try:\n        f(replies, **kw)\n    except ValueError as e:\n        return str(e)\n    except Exception as e:\n        return \"anderer Fehler \" + type(e).__name__\n    return None\nr = [\"x\", \"y\", \"z\", \"5.0\"]\nm = msg(r)\ncheck(m is not None and not m.startswith(\"anderer\") and \"3\" in m and r == [\"5.0\"], \"Drei unbrauchbare Antworten → ValueError mit 3 Versuchen, die vierte Antwort wird nicht gelesen\", \"Three unusable answers → ValueError with 3 attempts, the fourth answer is not read\")\nm = msg([\"ERR\"])\ncheck(m is not None and not m.startswith(\"anderer\") and \"1\" in m, \"Liste nach einer Antwort leer → ValueError (1 Versuch), kein IndexError\", \"List empty after one answer → ValueError (1 attempt), no IndexError\")\nm = msg([])\ncheck(m is not None and not m.startswith(\"anderer\") and \"0\" in m, \"Leere Liste → ValueError (0 Versuche)\", \"Empty list → ValueError (0 attempts)\")\nr = [\"a\", \"b\", \"c\", \"d\", \"7\"]\ncheck(approx(call(ns, \"query\", r, attempts=5), 7.0) and r == [], \"attempts=5: fünfter Versuch gültig\", \"attempts=5: fifth attempt valid\")\ncheck(msg([\"a\", \"b\"], attempts=1) is not None and \"1\" in msg([\"a\", \"b\"], attempts=1), \"attempts=1: nach einer Störung ValueError\", \"attempts=1: ValueError after one fault\")\n", "require": ["try", "raise", "def"], "refs": ["B.3", "B.4"], "forbid": [], "stdin": "", "topics": []}, {"id": "kB-retry", "ch": "B", "lvl": 3, "title": {"de": "Robuste Eingabe", "en": "Robust input"}, "task": {"de": "Fragen Sie in einer Schleife so lange nach einer ganzen Zahl zwischen 1 und 10, bis eine gültige Eingabe kommt. Bei Text (`ValueError`) geben Sie `Keine Zahl!` aus, bei Zahlen außerhalb des Bereichs `Nicht zwischen 1 und 10!`. Speichern Sie die gültige Zahl in `choice` und zählen Sie die Fehlversuche in `errors`.", "en": "In a loop, keep asking for an integer between 1 and 10 until a valid input arrives. For text (`ValueError`) print `Not a number!`, for numbers outside the range print `Not between 1 and 10!`. Store the valid number in `choice` and count the failed attempts in `errors`."}, "starter": {"de": "errors = 0\n\n# Ihr Code:\n", "en": "errors = 0\n\n# your code:\n"}, "solution": "errors = 0\nwhile True:\n    try:\n        choice = int(input(\"Zahl (1-10): \"))\n    except ValueError:\n        print(\"Keine Zahl!\")\n        errors += 1\n        continue\n    if 1 <= choice <= 10:\n        break\n    print(\"Nicht zwischen 1 und 10!\")\n    errors += 1\nprint(\"Gewählt:\", choice)\n", "tests": "\nfor inp, ec, ee in [([\"abc\", \"12\", \"7\"], 7, 2), ([\"3\"], 3, 0), ([\"\", \"x\", \"0\", \"11\", \"10\"], 10, 4), ([\"1\"], 1, 0)]:\n    ns, out = run(inputs=inp)\n    c, e = need(ns, \"choice\", \"errors\")\n    check(c == ec, f\"Eingaben {inp}: choice = {ec}\", f\"Inputs {inp}: choice = {ec}\")\n    check(e == ee, f\"Eingaben {inp}: errors = {ee}\", f\"Inputs {inp}: errors = {ee}\")\nns, out = run(inputs=[\"abc\", \"12\", \"7\"])\no = out.lower()\ncheck((\"keine zahl\" in o or \"not a number\" in o) and (\"zwischen 1 und 10\" in o or \"between 1 and 10\" in o), \"Beide Fehlermeldungen werden ausgegeben\", \"Both error messages are printed\")\n", "stdin": "abc\n12\n7\n", "require": ["try", "while"], "refs": ["B.3", "6.2c"], "forbid": [], "topics": []}, {"id": "kB-thermo", "ch": "B", "lvl": 3, "title": {"de": "Thermoelement mit Plausibilitätsprüfung", "en": "Thermocouple with plausibility check"}, "task": {"de": "Klasse `Thermocouple(name, t_min=-200.0, t_max=1250.0)` mit dem Attribut `history` (leere Liste).\n- `add(t)`: löst `TypeError` aus, wenn `t` keine Zahl ist (Wahrheitswerte zählen nicht als Zahl), und `ValueError`, wenn `t` außerhalb von [`t_min`, `t_max`] liegt. Sonst wird `t` an `history` angehängt.\n- `load(values)`: ruft für jeden Wert `add` auf, fängt die beiden Fehlertypen ab und gibt die Anzahl der abgelehnten Werte zurück.\n- `mean()`: Mittelwert von `history`, `None` bei leerer Historie.", "en": "Class `Thermocouple(name, t_min=-200.0, t_max=1250.0)` with the attribute `history` (empty list).\n- `add(t)`: raises `TypeError` if `t` is not a number (booleans don't count as numbers), and `ValueError` if `t` lies outside [`t_min`, `t_max`]. Otherwise `t` is appended to `history`.\n- `load(values)`: calls `add` for every value, catches both error types and returns the number of rejected values.\n- `mean()`: mean of `history`, `None` for an empty history."}, "starter": {"de": "class Thermocouple:\n    def __init__(self, name, t_min=-200.0, t_max=1250.0):\n        ...\n", "en": "class Thermocouple:\n    def __init__(self, name, t_min=-200.0, t_max=1250.0):\n        ...\n"}, "solution": "class Thermocouple:\n    def __init__(self, name, t_min=-200.0, t_max=1250.0):\n        self.name = name\n        self.t_min = t_min\n        self.t_max = t_max\n        self.history = []\n\n    def add(self, t):\n        if isinstance(t, bool) or not isinstance(t, (int, float)):\n            raise TypeError(f\"Zahl erwartet, nicht {t!r}\")\n        if not self.t_min <= t <= self.t_max:\n            raise ValueError(f\"{t} °C liegt außerhalb von [{self.t_min}, {self.t_max}]\")\n        self.history.append(t)\n\n    def load(self, values):\n        rejected = 0\n        for v in values:\n            try:\n                self.add(v)\n            except (TypeError, ValueError):\n                rejected += 1\n        return rejected\n\n    def mean(self):\n        if len(self.history) == 0:\n            return None\n        return sum(self.history) / len(self.history)\n\ntc = Thermocouple(\"TC1\")\nprint(tc.load([20.5, \"x\", 1500, 22.0, True]), tc.mean())\n", "tests": "\nns, out = run()\ntc = call(ns, \"Thermocouple\", \"TC1\")\ncheck(getattr(tc, \"history\", None) == [] and method(tc, \"mean\") is None, \"Neues Objekt: leere history, mean() = None\", \"New object: empty history, mean() = None\")\nmethod(tc, \"add\", 20.5)\ncheck(tc.history == [20.5], \"add(20.5) speichert den Wert\", \"add(20.5) stores the value\")\ncheck(raises(ValueError, lambda: tc.add(1300)) and raises(ValueError, lambda: tc.add(-250)), \"Werte außerhalb des Bereichs → ValueError\", \"Values out of range → ValueError\")\ncheck(raises(TypeError, lambda: tc.add(\"25\")) and raises(TypeError, lambda: tc.add(True)), \"String oder bool → TypeError\", \"string or bool → TypeError\")\nr = method(tc, \"load\", [22.0, \"x\", 1500, 23.5, None, 1250])\ncheck(r == 3 and tc.history == [20.5, 22.0, 23.5, 1250], \"load() lehnt 3 Werte ab und übernimmt die gültigen\", \"load() rejects 3 values and keeps the valid ones\")\ncheck(approx(method(tc, \"mean\"), (20.5 + 22.0 + 23.5 + 1250) / 4), \"mean() stimmt\", \"mean() is correct\")\nsmall = call(ns, \"Thermocouple\", \"PT\", t_min=0, t_max=100)\ncheck(method(small, \"load\", [-1, 50, 101]) == 2, \"Eigene Grenzen t_min/t_max werden beachtet\", \"Custom limits t_min/t_max are respected\")\n", "require": ["try", "raise", "class"], "refs": ["B.4", "B.3", "10.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "kB-config", "ch": "B", "lvl": 3, "title": {"de": "Konfigurationsdatei laden", "en": "Loading a configuration file"}, "task": {"de": "Schreiben Sie `load_config(path)`, die eine Datei mit Zeilen `schlüssel = wert` einliest und ein Dictionary zurückgibt.\n- Leerzeilen und Kommentare (`#` am Zeilenanfang) werden übersprungen; Schlüssel und Wert werden mit `strip()` bereinigt.\n- Werte, die sich in `float` umwandeln lassen, werden als Zahl gespeichert, alle anderen als String.\n- Existiert die Datei nicht, wird ein leeres Dictionary zurückgegeben.\n- Eine Zeile ohne `=` löst einen `ValueError` aus, der die Zeilennummer nennt (`Zeile 3: …`, gezählt ab 1). Tipp: `split(\"=\", 1)` teilt nur am ersten `=`.", "en": "Write `load_config(path)` that reads a file with lines `key = value` and returns a dictionary.\n- Blank lines and comments (`#` at the start of a line) are skipped; key and value are cleaned with `strip()`.\n- Values that can be converted to `float` are stored as numbers, all others as strings.\n- If the file doesn't exist, return an empty dictionary.\n- A line without `=` raises a `ValueError` naming the line number (`line 3: …`, counted from 1). Tip: `split(\"=\", 1)` splits at the first `=` only."}, "starter": {"de": "def load_config(path):\n    ...\n", "en": "def load_config(path):\n    ...\n"}, "solution": "def load_config(path):\n    config = {}\n    try:\n        with open(path, encoding=\"utf-8\") as f:\n            text = f.read()\n    except FileNotFoundError:\n        return {}\n    for nr, line in enumerate(text.split(\"\\n\"), start=1):\n        line = line.strip()\n        if line == \"\" or line.startswith(\"#\"):\n            continue\n        if \"=\" not in line:\n            raise ValueError(f\"Zeile {nr}: kein '=' gefunden\")\n        key, value = line.split(\"=\", 1)\n        key = key.strip()\n        value = value.strip()\n        try:\n            config[key] = float(value)\n        except ValueError:\n            config[key] = value\n    return config\n\nprint(load_config(\"data/anlage.cfg\"))\n", "tests": "\nCFG = \"# Anlage 3\\nname = Pumpe P-301\\n\\nmax_druck = 6.5\\ndrehzahl=1450\\nmodus = auto\\nformel = P=U*I\\n\"\nns, out = run(files={\"data/anlage.cfg\": CFG})\nf = ns.get(\"load_config\")\nif f is None:\n    raise TestFailure(\"Es gibt keine Funktion load_config. / There is no function load_config.\")\nr = call(ns, \"load_config\", \"data/anlage.cfg\")\ncheck(r == {\"name\": \"Pumpe P-301\", \"max_druck\": 6.5, \"drehzahl\": 1450.0, \"modus\": \"auto\", \"formel\": \"P=U*I\"}, \"Datei wird korrekt in ein Dictionary übersetzt (Zahlen als float)\", \"File is correctly turned into a dictionary (numbers as float)\")\ncheck(call(ns, \"load_config\", \"data/gibtsnicht.cfg\") == {}, \"Fehlende Datei → leeres Dictionary\", \"Missing file → empty dictionary\")\nwith open(\"data/kaputt.cfg\", \"w\", encoding=\"utf-8\") as fh:\n    fh.write(\"a = 1\\n# ok\\nb 2\\n\")\nmsg = \"\"\ntry:\n    f(\"data/kaputt.cfg\")\nexcept ValueError as e:\n    msg = str(e)\nexcept Exception as e:\n    msg = \"anderer Fehler: \" + type(e).__name__\ncheck((\"3\" in msg) and not msg.startswith(\"anderer\"), \"Zeile ohne '=' → ValueError mit Zeilennummer 3\", \"Line without '=' → ValueError with line number 3\")\n", "require": ["try", "raise", "with"], "refs": ["B.4", "B.3", "A.3"], "files": {"data/anlage.cfg": "# Anlage 3\nname = Pumpe P-301\n\nmax_druck = 6.5\ndrehzahl=1450\nmodus = auto\n"}, "forbid": [], "stdin": "", "topics": []}, {"id": "kB-import", "ch": "B", "lvl": 3, "title": {"de": "Robuster Import mit Fehlerprotokoll", "en": "Robust import with an error log"}, "task": {"de": "Die Datei `data/import.csv` hat eine Kopfzeile und danach Zeilen der Form `zeit_s;druck_bar`. In der Praxis enthält sie Fehler: fehlende Trennzeichen, Text statt Zahl, Dezimalkommas (diese sind erlaubt!). Schreiben Sie `import_file(path)`:\n- Gibt **zwei Werte** zurück: die Liste der gültigen Datensätze als Tupel `(zeit, druck)` (beide `float`) und die Liste der Fehler als Tupel `(zeilennummer, meldung)` – Zeilen gezählt ab 1 inklusive Kopfzeile.\n- Pro Zeile: `split(\";\")` und Indexzugriff auf beide Teile; fangen Sie `ValueError` **und** `IndexError` gemeinsam ab (`except (…, …) as e`) und speichern Sie `str(e)` als Meldung.\n- Leerzeilen werden übersprungen.\n- Existiert die Datei nicht, wird `([], [(0, \"Datei fehlt\")])` zurückgegeben.\n- Schreiben Sie die Fehler zusätzlich in die Datei `data/import_fehler.txt` (eine Zeile pro Fehler: `Zeile 4: …`) – aber nur, wenn es Fehler gibt.", "en": "The file `data/import.csv` has a header line followed by lines of the form `zeit_s;druck_bar` (time;pressure). In practice it contains errors: missing separators, text instead of numbers, decimal commas (these are allowed!). Write `import_file(path)`:\n- Returns **two values**: the list of valid records as tuples `(time, pressure)` (both `float`) and the list of errors as tuples `(line_number, message)` – lines counted from 1 including the header.\n- Per line: `split(\";\")` and indexing of both parts; catch `ValueError` **and** `IndexError` together (`except (…, …) as e`) and store `str(e)` as the message.\n- Blank lines are skipped.\n- If the file doesn't exist, `([], [(0, \"Datei fehlt\")])` is returned.\n- Additionally write the errors to the file `data/import_fehler.txt` (one line per error: `Zeile 4: …`) – but only if there are errors."}, "starter": {"de": "def import_file(path):\n    ...\n", "en": "def import_file(path):\n    ...\n"}, "solution": "def import_file(path):\n    records = []\n    errors = []\n    try:\n        with open(path, encoding=\"utf-8\") as f:\n            lines = f.read().split(\"\\n\")\n    except FileNotFoundError:\n        return [], [(0, \"Datei fehlt\")]\n    for nr, line in enumerate(lines, start=1):\n        if nr == 1 or line.strip() == \"\":\n            continue\n        try:\n            parts = line.strip().split(\";\")\n            t = float(parts[0].replace(\",\", \".\"))\n            p = float(parts[1].replace(\",\", \".\"))\n        except (ValueError, IndexError) as e:\n            errors.append((nr, str(e)))\n        else:\n            records.append((t, p))\n    if len(errors) > 0:\n        with open(\"data/import_fehler.txt\", \"w\", encoding=\"utf-8\") as f:\n            for nr, msg in errors:\n                f.write(f\"Zeile {nr}: {msg}\\n\")\n    return records, errors\n\nprint(import_file(\"data/import.csv\"))\n", "tests": "\nF1 = \"zeit_s;druck_bar\\n0;1,02\\n10;1.35\\n20 1.6\\n30;abc\\n\\n40;2,10\\n\"\nF2 = \"zeit_s;druck_bar\\n1;2\\n\"\nns, out = run(files={\"data/import.csv\": F1, \"data/ok.csv\": F2})\nr = call(ns, \"import_file\", \"data/import.csv\")\ncheck(isinstance(r, tuple) and len(r) == 2 and sorted(r[0]) == [(0.0, 1.02), (10.0, 1.35), (40.0, 2.1)], \"Gültige Datensätze: (0, 1.02), (10, 1.35), (40, 2.1)\", \"Valid records: (0, 1.02), (10, 1.35), (40, 2.1)\")\nerrs = list(r[1]) if isinstance(r, tuple) and len(r) == 2 else []\ncheck(sorted(e[0] for e in errs) == [4, 5] and all(isinstance(e[1], str) and e[1] for e in errs), \"Fehler in Zeile 4 (Trennzeichen fehlt) und 5 (Text) mit Meldung\", \"Errors in line 4 (separator missing) and 5 (text) with message\")\ntry:\n    lines = [l for l in read_file(\"data/import_fehler.txt\").split(\"\\n\") if l.strip()]\nexcept FileNotFoundError:\n    lines = []\ncheck(len(lines) == 2 and any(l.lower().startswith((\"zeile 4:\", \"line 4:\")) for l in lines) and any(l.lower().startswith((\"zeile 5:\", \"line 5:\")) for l in lines), \"import_fehler.txt enthält zwei Fehlerzeilen\", \"import_fehler.txt contains two error lines\")\nns, out = run(files={\"data/ok.csv\": F2})\nr2 = call(ns, \"import_file\", \"data/ok.csv\")\nimport os as _os\ncheck(tuple(r2) == ([(1.0, 2.0)], []) and not _os.path.exists(\"data/import_fehler.txt\"), \"Fehlerfreie Datei: keine Fehlerdatei\", \"Error-free file: no error file\")\ncheck(tuple(call(ns, \"import_file\", \"data/fehlt.csv\")) == ([], [(0, \"Datei fehlt\")]), \"Fehlende Datei → ([], [(0, 'Datei fehlt')])\", \"Missing file → ([], [(0, 'Datei fehlt')])\")\nns, out = run(files={\"data/eins.csv\": \"zeit_s;druck_bar\\n1;2\\n2;x\\n\"})\nr3 = call(ns, \"import_file\", \"data/eins.csv\")\ntry:\n    lines = [l for l in read_file(\"data/import_fehler.txt\").split(\"\\n\") if l.strip()]\nexcept FileNotFoundError:\n    lines = []\ncheck(len(lines) == 1 and lines[0].lower().startswith((\"zeile 3:\", \"line 3:\")), \"Auch ein einzelner Fehler wird in import_fehler.txt geschrieben\", \"A single error is also written to import_fehler.txt\")\n", "require": ["try", "with"], "refs": ["B.3", "B.3e", "A.3"], "files": {"data/import.csv": "zeit_s;druck_bar\n0;1,02\n10;1.35\n20 1.6\n30;abc\n\n40;2,10\n"}, "forbid": [], "stdin": "", "topics": []}, {"id": "kB-units", "ch": "B", "lvl": 3, "title": {"de": "Kraftangaben mit Einheit einlesen", "en": "Reading forces with units"}, "task": {"de": "In einem Lastenheft stehen Kräfte als Text mit Einheit, z.B. `\"12.5 kN\"`, `\"300 N\"` oder `\"0,2 MN\"` (Zahl, Leerzeichen, Einheit; Dezimalkomma erlaubt). Schreiben Sie `to_newton(text)`, die die Kraft in N als `float` zurückgibt:\n- Zerlegen Sie den Text mit `split()` in Zahl und Einheit. Entstehen dabei nicht genau zwei Teile, lösen Sie einen `ValueError` mit der Meldung `Format: <Zahl> <Einheit>` aus.\n- Erlaubte Einheiten (Groß-/Kleinschreibung beachten): `N`, `kN`, `MN`. Speichern Sie die Faktoren in einem Dictionary; eine unbekannte Einheit führt zu einem `KeyError` beim Zugriff – fangen Sie ihn ab und lösen Sie stattdessen einen `ValueError` mit der Meldung `Unbekannte Einheit: <einheit>` aus.\n- Ist die Zahl ungültig, entsteht beim Umwandeln ohnehin ein `ValueError` – den lassen Sie durch.\n\nSchreiben Sie außerdem `total_force(texts)`, die die Summe einer Liste von Kraftangaben in kN zurückgibt.", "en": "A requirements specification lists forces as text with a unit, e.g. `\"12.5 kN\"`, `\"300 N\"` or `\"0,2 MN\"` (number, space, unit; decimal comma allowed). Write `to_newton(text)` that returns the force in N as a `float`:\n- Split the text with `split()` into number and unit. If this does not give exactly two parts, raise a `ValueError` with the message `Format: <number> <unit>`.\n- Allowed units (case-sensitive): `N`, `kN`, `MN`. Store the factors in a dictionary; an unknown unit leads to a `KeyError` on access – catch it and raise a `ValueError` with the message `Unbekannte Einheit: <unit>` (unknown unit) instead.\n- If the number is invalid, a `ValueError` occurs anyway when converting – let it through.\n\nAlso write `total_force(texts)` that returns the sum of a list of force entries in kN."}, "starter": {"de": "FACTORS = {'N': 1.0, 'kN': 1e3, 'MN': 1e6}\n\ndef to_newton(text):\n    ...\n", "en": "FACTORS = {'N': 1.0, 'kN': 1e3, 'MN': 1e6}\n\ndef to_newton(text):\n    ...\n"}, "solution": "FACTORS = {'N': 1.0, 'kN': 1e3, 'MN': 1e6}\n\ndef to_newton(text):\n    parts = text.split()\n    if len(parts) != 2:\n        raise ValueError(\"Format: <Zahl> <Einheit>\")\n    number, unit = parts\n    try:\n        factor = FACTORS[unit]\n    except KeyError:\n        raise ValueError(f\"Unbekannte Einheit: {unit}\")\n    return float(number.replace(\",\", \".\")) * factor\n\ndef total_force(texts):\n    total = 0.0\n    for t in texts:\n        total += to_newton(t)\n    return total / 1000\n\nprint(to_newton(\"12.5 kN\"), to_newton(\"0,2 MN\"), total_force([\"300 N\", \"1.2 kN\"]))\n", "tests": "\nns, out = run()\nf = ns.get(\"to_newton\")\nfor t, e in [(\"12.5 kN\", 12500.0), (\"300 N\", 300.0), (\"0,2 MN\", 200000.0), (\"  7 kN \", 7000.0)]:\n    check(approx(call(ns, \"to_newton\", t), e), f\"to_newton({t!r}) = {e:g} N\", f\"to_newton({t!r}) = {e:g} N\")\ndef msg_of(arg):\n    try:\n        f(arg)\n    except ValueError as e:\n        return \"VE:\" + str(e)\n    except Exception as e:\n        return \"other:\" + type(e).__name__\n    return \"none\"\nm1, m2, m3 = msg_of(\"12.5\"), msg_of(\"5 kg\"), msg_of(\"abc kN\")\ncheck(m1.startswith(\"VE:\") and \"Format\" in m1, \"Fehlende Einheit → ValueError mit 'Format…'\", \"Missing unit → ValueError with 'Format…'\")\ncheck(m2.startswith(\"VE:\") and \"kg\" in m2, \"Unbekannte Einheit → ValueError (kein KeyError), Meldung nennt 'kg'\", \"Unknown unit → ValueError (not KeyError), message names 'kg'\")\ncheck(m3.startswith(\"VE:\") and msg_of(\"3 kn\").startswith(\"VE:\"), \"Ungültige Zahl oder falsche Schreibweise → ValueError\", \"Invalid number or wrong spelling → ValueError\")\ncheck(approx(call(ns, \"total_force\", [\"300 N\", \"1.2 kN\", \"0,001 MN\"]), 2.5) and approx(call(ns, \"total_force\", []), 0), \"total_force(['300 N', '1.2 kN', '0,001 MN']) = 2.5 kN\", \"total_force(['300 N', '1.2 kN', '0,001 MN']) = 2.5 kN\")\n", "require": ["try", "raise", "dict"], "refs": ["B.4", "B.3", "8.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "kB-statemachine", "ch": "B", "lvl": 3, "title": {"de": "Zustandsautomat einer Anlage", "en": "State machine of a plant"}, "task": {"de": "Eine Anlage kennt die Zustände `\"aus\"`, `\"bereit\"`, `\"läuft\"` und `\"störung\"`. Erlaubt sind nur diese Übergänge:\n- `power_on()`: aus → bereit\n- `start()`: bereit → läuft\n- `stop()`: läuft → bereit\n- `fault(code)`: aus jedem Zustand außer „aus“ → störung (der Fehlercode wird im Attribut `last_fault` gespeichert)\n- `reset()`: störung → bereit\n- `power_off()`: bereit → aus\n\nSchreiben Sie die Klasse `Plant` (Startzustand `\"aus\"` im Attribut `state`, `last_fault` = `None`, `history` = Liste aller erreichten Zustände, beginnend mit `\"aus\"`). Ein nicht erlaubter Übergang löst einen `ValueError` mit einer Meldung wie `start() im Zustand 'aus' nicht erlaubt` aus; der Zustand bleibt dann unverändert.\n\nSchreiben Sie außerdem die Funktion `run_commands(plant, commands)`, die eine Liste von Methodennamen (z.B. `[\"power_on\", \"start\"]`; für `fault` wird der Code `\"E99\"` verwendet) der Reihe nach ausführt, ungültige Befehle per `try`/`except` überspringt und deren Anzahl zurückgibt. Unbekannte Befehlsnamen zählen ebenfalls als ungültig. Tipp: Ordnen Sie den Namen mit `if`/`elif` den Methodenaufruf zu.", "en": "A plant knows the states `\"aus\"` (off), `\"bereit\"` (ready), `\"läuft\"` (running) and `\"störung\"` (fault). Only these transitions are allowed:\n- `power_on()`: aus → bereit\n- `start()`: bereit → läuft\n- `stop()`: läuft → bereit\n- `fault(code)`: from any state except “aus” → störung (the error code is stored in the attribute `last_fault`)\n- `reset()`: störung → bereit\n- `power_off()`: bereit → aus\n\nWrite the class `Plant` (initial state `\"aus\"` in the attribute `state`, `last_fault` = `None`, `history` = list of all states reached, starting with `\"aus\"`). A transition that is not allowed raises a `ValueError` with a message like `start() im Zustand 'aus' nicht erlaubt`; the state then stays unchanged. Keep the German state names.\n\nAlso write the function `run_commands(plant, commands)` that executes a list of method names (e.g. `[\"power_on\", \"start\"]`; for `fault` the code `\"E99\"` is used) in order, skips invalid commands with `try`/`except` and returns their number. Unknown command names also count as invalid. Tip: map the name to the method call with `if`/`elif`."}, "starter": {"de": "class Plant:\n    def __init__(self):\n        self.state = \"aus\"\n        self.last_fault = None\n        self.history = [\"aus\"]\n", "en": "class Plant:\n    def __init__(self):\n        self.state = \"aus\"\n        self.last_fault = None\n        self.history = [\"aus\"]\n"}, "solution": "class Plant:\n    def __init__(self):\n        self.state = \"aus\"\n        self.last_fault = None\n        self.history = [\"aus\"]\n\n    def _go(self, name, allowed_from, new_state):\n        if self.state not in allowed_from:\n            raise ValueError(f\"{name}() im Zustand {self.state!r} nicht erlaubt\")\n        self.state = new_state\n        self.history.append(new_state)\n\n    def power_on(self):\n        self._go(\"power_on\", [\"aus\"], \"bereit\")\n\n    def start(self):\n        self._go(\"start\", [\"bereit\"], \"läuft\")\n\n    def stop(self):\n        self._go(\"stop\", [\"läuft\"], \"bereit\")\n\n    def fault(self, code):\n        self._go(\"fault\", [\"bereit\", \"läuft\", \"störung\"], \"störung\")\n        self.last_fault = code\n\n    def reset(self):\n        self._go(\"reset\", [\"störung\"], \"bereit\")\n\n    def power_off(self):\n        self._go(\"power_off\", [\"bereit\"], \"aus\")\n\n\ndef run_commands(plant, commands):\n    invalid = 0\n    for cmd in commands:\n        try:\n            if cmd == \"power_on\":\n                plant.power_on()\n            elif cmd == \"start\":\n                plant.start()\n            elif cmd == \"stop\":\n                plant.stop()\n            elif cmd == \"fault\":\n                plant.fault(\"E99\")\n            elif cmd == \"reset\":\n                plant.reset()\n            elif cmd == \"power_off\":\n                plant.power_off()\n            else:\n                raise ValueError(f\"Unbekannter Befehl: {cmd}\")\n        except ValueError:\n            invalid += 1\n    return invalid\n\np = Plant()\nprint(run_commands(p, [\"start\", \"power_on\", \"start\", \"fault\", \"start\", \"reset\", \"stop\"]), p.history)\n", "tests": "\nns, out = run()\np = call(ns, \"Plant\")\ncheck(p.state == \"aus\" and p.history == [\"aus\"] and p.last_fault is None, \"Startzustand 'aus'\", \"Initial state 'aus'\")\ncheck(raises(ValueError, lambda: p.start()) and p.state == \"aus\", \"start() im Zustand 'aus' → ValueError, Zustand bleibt\", \"start() in state 'aus' → ValueError, state unchanged\")\nmsg = \"\"\ntry:\n    p.start()\nexcept ValueError as e:\n    msg = str(e)\nexcept Exception:\n    pass\ncheck(\"start\" in msg and \"aus\" in msg, \"Die Meldung nennt Methode und Zustand\", \"The message names method and state\")\nmethod(p, \"power_on\"); method(p, \"start\")\ncheck(p.state == \"läuft\", \"power_on(), start() → 'läuft'\", \"power_on(), start() → 'läuft'\")\ncheck(raises(ValueError, lambda: p.power_off()) and p.state == \"läuft\", \"power_off() im Zustand 'läuft' nicht erlaubt\", \"power_off() not allowed in state 'läuft'\")\nmethod(p, \"fault\", \"E12\")\ncheck(p.state == \"störung\" and p.last_fault == \"E12\", \"fault('E12') → 'störung', last_fault = 'E12'\", \"fault('E12') → 'störung', last_fault = 'E12'\")\nmethod(p, \"reset\"); method(p, \"power_off\")\ncheck(p.history == [\"aus\", \"bereit\", \"läuft\", \"störung\", \"bereit\", \"aus\"], \"history stimmt\", \"history is correct\")\ncheck(raises(ValueError, lambda: p.fault(\"E1\")) and p.last_fault == \"E12\", \"fault() im Zustand 'aus' nicht erlaubt\", \"fault() not allowed in state 'aus'\")\nq = call(ns, \"Plant\")\nn0 = call(ns, \"run_commands\", call(ns, \"Plant\"), [\"power_on\", \"start\", \"fault\", \"reset\"])\nn1 = call(ns, \"run_commands\", call(ns, \"Plant\"), [\"xyz\"])\ncheck(n0 == 0 and n1 == 1, \"run_commands: gültige Folge → 0, unbekannter Befehl → 1\", \"run_commands: valid sequence → 0, unknown command → 1\")\nn = call(ns, \"run_commands\", q, [\"start\", \"power_on\", \"start\", \"fault\", \"start\", \"reset\", \"stop\", \"xyz\"])\ncheck(n == 4 and q.state == \"bereit\" and q.last_fault == \"E99\", \"run_commands: 4 ungültige Befehle, Endzustand 'bereit'\", \"run_commands: 4 invalid commands, final state 'bereit'\")\n", "require": ["class", "raise", "try"], "refs": ["B.4", "B.3", "10.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "kB-calc", "ch": "B", "lvl": 3, "title": {"de": "Taschenrechner mit Fehlermeldungen", "en": "Calculator with error messages"}, "task": {"de": "Ein Prüfstand protokolliert Rechenschritte als Text der Form `<Zahl> <Operator> <Zahl>`, z.B. `\"12,5 * 4\"` (Dezimalkomma erlaubt, Operatoren `+`, `-`, `*`, `/`).\n\n1. Schreiben Sie `calculate(a, op, b)` für zwei Zahlen. Bei einem unbekannten Operator lösen Sie einen `ValueError` aus; eine Division durch 0 führt ohnehin zu einem `ZeroDivisionError` – den lassen Sie durch.\n2. Schreiben Sie `evaluate(expr)`, die **zwei Werte** zurückgibt: `(ergebnis, None)` bei Erfolg, sonst `(None, meldung)` mit genau einer dieser Meldungen:\n   - `\"Format\"`: der Text besteht nicht aus genau drei durch Leerzeichen getrennten Teilen (`split()`)\n   - `\"Zahl ungültig\"`: eine der Zahlen lässt sich nicht umwandeln (`ValueError` beim Umwandeln)\n   - `\"Operator unbekannt\"`: `calculate` meldet einen `ValueError`\n   - `\"Division durch 0\"`: `calculate` meldet einen `ZeroDivisionError`\n\n   Verwenden Sie dafür zwei getrennte `try`-Blöcke: einen für das Umwandeln der Zahlen, einen für den Aufruf von `calculate`.\n3. Schreiben Sie `evaluate_all(lines)`, die **zwei Werte** zurückgibt: die Liste der Ergebnisse aller erfolgreichen Zeilen (in der Reihenfolge der Zeilen) und ein Dictionary Meldung → Anzahl (nur Meldungen, die vorkommen).", "en": "A test bench logs calculation steps as text of the form `<number> <operator> <number>`, e.g. `\"12,5 * 4\"` (decimal comma allowed, operators `+`, `-`, `*`, `/`).\n\n1. Write `calculate(a, op, b)` for two numbers. For an unknown operator raise a `ValueError`; a division by 0 leads to a `ZeroDivisionError` anyway – let it through.\n2. Write `evaluate(expr)` that returns **two values**: `(result, None)` on success, otherwise `(None, message)` with exactly one of these messages (keep the German texts):\n   - `\"Format\"`: the text does not consist of exactly three parts separated by spaces (`split()`)\n   - `\"Zahl ungültig\"` (invalid number): one of the numbers cannot be converted (`ValueError` when converting)\n   - `\"Operator unbekannt\"` (unknown operator): `calculate` reports a `ValueError`\n   - `\"Division durch 0\"` (division by 0): `calculate` reports a `ZeroDivisionError`\n\n   Use two separate `try` blocks for this: one for converting the numbers, one for calling `calculate`.\n3. Write `evaluate_all(lines)` that returns **two values**: the list of the results of all successful lines (in the order of the lines) and a dictionary message → count (only messages that occur)."}, "starter": {"de": "def calculate(a, op, b):\n    pass   # Ihr Code\n\n\ndef evaluate(expr):\n    pass   # Ihr Code\n", "en": "def calculate(a, op, b):\n    pass   # your code\n\n\ndef evaluate(expr):\n    pass   # your code\n"}, "solution": "def calculate(a, op, b):\n    if op == \"+\":\n        return a + b\n    elif op == \"-\":\n        return a - b\n    elif op == \"*\":\n        return a * b\n    elif op == \"/\":\n        return a / b\n    raise ValueError(f\"Unbekannter Operator: {op}\")\n\n\ndef evaluate(expr):\n    parts = expr.split()\n    if len(parts) != 3:\n        return None, \"Format\"\n    try:\n        a = float(parts[0].replace(\",\", \".\"))\n        b = float(parts[2].replace(\",\", \".\"))\n    except ValueError:\n        return None, \"Zahl ungültig\"\n    try:\n        return calculate(a, parts[1], b), None\n    except ValueError:\n        return None, \"Operator unbekannt\"\n    except ZeroDivisionError:\n        return None, \"Division durch 0\"\n\n\ndef evaluate_all(lines):\n    results = []\n    errors = {}\n    for line in lines:\n        value, message = evaluate(line)\n        if message is None:\n            results.append(value)\n        else:\n            errors[message] = errors.get(message, 0) + 1\n    return results, errors\n\n\nprint(evaluate(\"12,5 * 4\"), evaluate(\"3 / 0\"), evaluate(\"2 ^ 3\"))\nprint(evaluate_all([\"1 + 2\", \"x * 3\", \"4 / 0\", \"5\", \"6 - 1,5\"]))\n", "tests": "\nns, out = run()\nc = ns.get(\"calculate\")\ncheck(approx(call(ns, \"calculate\", 6.0, \"+\", 1.5), 7.5) and approx(call(ns, \"calculate\", 6.0, \"/\", 1.5), 4.0) and approx(call(ns, \"calculate\", 6.0, \"-\", 1.5), 4.5) and approx(call(ns, \"calculate\", 6.0, \"*\", 1.5), 9.0), \"calculate rechnet + - * /\", \"calculate computes + - * /\")\ncheck(c is not None and raises(ValueError, lambda: c(1.0, \"^\", 2.0)) and raises(ZeroDivisionError, lambda: c(1.0, \"/\", 0.0)), \"calculate: unbekannter Operator → ValueError, Division durch 0 → ZeroDivisionError\", \"calculate: unknown operator → ValueError, division by 0 → ZeroDivisionError\")\ncases = [(\"12,5 * 4\", (50.0, None)), (\"3 / 0\", (None, \"Division durch 0\")), (\"2 ^ 3\", (None, \"Operator unbekannt\")), (\"x * 3\", (None, \"Zahl ungültig\")), (\"4,5,1 + 1\", (None, \"Zahl ungültig\")), (\"5\", (None, \"Format\")), (\"1 + 2 + 3\", (None, \"Format\")), (\"-2 - -3\", (1.0, None)), (\"\", (None, \"Format\"))]\nfor expr, e in cases:\n    r = call(ns, \"evaluate\", expr)\n    ok = isinstance(r, tuple) and len(r) == 2 and r[1] == e[1] and (approx(r[0], e[0]) if e[0] is not None else r[0] is None)\n    check(ok, f\"evaluate({expr!r}) = {e}\", f\"evaluate({expr!r}) = {e}\")\nr = call(ns, \"evaluate_all\", [\"1 + 2\", \"x * 3\", \"4 / 0\", \"5\", \"6 - 1,5\", \"8 / 0\"])\ncheck(isinstance(r, tuple) and len(r) == 2 and [round(x, 9) fo   if (r.top < 0 || r.bottom > window.innerHeight) el.scrollIntoView({ block: "nearest", behavior: reduceMotion() ? "auto" : "smooth" });
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pips = (n, max = 3) => `<span class="pips" role="img" aria-label="${esc(t("levelOf", { l: n }))}">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;

function refChip(id) {
  const s = SEC[id];
  if (!s) return esc(id);
  return `<a class="ref" href="${s.url}" target="_blank" rel="noopener"><b>${esc(s.num)}</b>${esc(L(s))}</a>`;
}

/* ---- Python-Hervorhebung */
const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const BI = new Set("print input len range int float str bool list dict set tuple type sum min max sorted abs round enumerate zip isinstance super open id bin hex oct ord chr divmod help complex".split(" "));
const TOKEN_RE = /(#[^\n]*)|((?:[rRbBuUfF]{1,2})?(?:"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?))|(\b\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?j?\b|\.\d+(?:[eE][+-]?\d+)?)|([A-Za-z_\u00C0-\u024F][\w\u00C0-\u024F]*)|([\s\S])/g;
function highlight(src) {
  let out = "", prev = "", m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(src))) {
    const [tok, com, str, num, word] = m;
    if (com) out += `<span class="tk-com">${esc(tok)}</span>`;
    else if (str) out += `<span class="tk-str">${esc(tok)}</span>`;
    else if (num) out += `<span class="tk-num">${esc(tok)}</span>`;
    else if (word) {
      let cls = "";
      if (KW.has(word)) cls = "tk-kw";
      else if (prev === "def" || prev === "class") cls = "tk-fn";
      else if (word === "self") cls = "tk-self";
      else if (BI.has(word)) cls = "tk-bi";
      out += cls ? `<span class="${cls}">${esc(word)}</span>` : esc(word);
    } else out += esc(tok);
    if (word) prev = word; else if (!/^\s$/.test(tok)) prev = "";
  }
  return out;
}

/* ---- Formeln: $…$ im Text, $$…$$ abgesetzt (LaTeX-Schreibweise), gesetzt mit KaTeX (lokal unter katex/) */
function texHtml(src, display) {
  if (window.katex) {
    try { return katex.renderToString(src, { displayMode: display, throwOnError: false, output: "html", strict: "ignore" }); } catch (e) {}
  }
  return `<code class="tex">${esc(src)}</code>`;
}
function mathOut(text, store) {
  const keep = html => { store.push(html); return "\u0000" + (store.length - 1) + "\u0000"; };
  // nur außerhalb von `Code`
  return text.split(/(`[^`\n]*`)/).map((seg, i) => i % 2 ? seg : seg
    .replace(/\$\$([^$]+?)\$\$/g, (a, m) => keep(texHtml(m.trim(), true)))
    .replace(/(^|[^\\$\w])\$(?=\S)([^$\n]*?\S)\$(?![\w$])/g, (a, pre, m) => pre + keep(texHtml(m, false)))
  ).join("");
}
const mathIn = (html, store) => html.replace(/\u0000(\d+)\u0000/g, (a, n) => store[+n]);

/* ---- Mini-Markdown (Aufgaben & Tutor) */
function inlineMd(s) {
  // s ist bereits escaped; Code-Abschnitte zuerst herausnehmen, damit * darin nicht als Hervorhebung gilt
  const codes = [];
  return s
    .replace(/`([^`\n]+)`/g, (all, c) => { codes.push(c); return "\u0001" + (codes.length - 1) + "\u0001"; })
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[\[\s*([0-9AB]+(?:\.[0-9]+)?[a-z]?)\s*\]\]/g, (all, id) => SEC[id] ? refChip(id) : all)
    .replace(/\u0001(\d+)\u0001/g, (all, n) => `<code>${codes[+n]}</code>`);
}
function md(text) {
  const parts = String(text).split(/```[a-zA-Z]*\n?/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1) { html += `<pre><code>${highlight(part.replace(/\n$/, ""))}</code></pre>`; return; }
    const store = [], start = html.length;
    const lines = esc(mathOut(part, store)).split("\n");
    let list = null, para = [];
    const flush = () => { if (para.length) { html += `<p>${inlineMd(para.join("<br>"))}</p>`; para = []; } };
    const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const raw of lines) {
      const line = raw.trimEnd();
      const ul = /^\s*[-*]\s+(.*)$/.exec(line), ol = /^\s*\d+\.\s+(.*)$/.exec(line);
      if (ul || ol) {
        flush();
        const type = ul ? "ul" : "ol";
        if (list !== type) { closeList(); html += `<${type}>`; list = type; }
        html += `<li>${inlineMd((ul || ol)[1])}</li>`;
      } else if (line.trim() === "") { flush(); closeList(); }
      else if (/^#{1,4}\s/.test(line)) { flush(); closeList(); html += `<p><strong>${inlineMd(line.replace(/^#+\s/, ""))}</strong></p>`; }
      else { closeList(); para.push(line); }
    }
    flush(); closeList();
    if (store.length) html = html.slice(0, start) + mathIn(html.slice(start), store);
  });
  return html;
}

/* ====================================================================== Python-Laufzeit */
const Engine = {
  worker: null, local: null, ready: null, seq: 0, pending: new Map(), failed: false, version: "",
  status(state, text) {
    const el = $("py-status");
    el.firstElementChild.className = "dot" + (state === "ready" ? " ready" : state === "error" ? " err" : "");
    // „Python 3.13.2 · bereit“: die Versionsnummer darf auf schmalen Bildschirmen wegfallen
    const i = text.indexOf(" · ");
    el.lastElementChild.innerHTML = i < 0 ? esc(text) : `<span class="pyver">${esc(text.slice(0, i))} · </span>${esc(text.slice(i + 3))}`;
    el.title = text;
  },
  start() {
    this.status("loading", t("pyLoading"));
    this.ready = this._startWorker().catch(() => this._startLocal()).then(info => {
      this.version = info.version; this.status("ready", "Python " + info.version + " · " + t("pyReady"));
      liveCheck();
      return true;
    }).catch(err => {
      this.failed = true; this.status("error", t("pyError"));
      writeConsole([{ cls: "stderr", text: t("engineFail") + "\n" + err }]);
      return false;
    });
    return this.ready;
  },
  _startWorker() {
    return new Promise((resolve, reject) => {
      let w;
      try { w = new Worker("worker.js"); } catch (e) { reject(e); return; }
      this.worker = w;
      w.onmessage = e => this._onMessage(e.data);
      w.onerror = e => { e.preventDefault && e.preventDefault(); if (!this._booted) { w.terminate(); this.worker = null; reject(new Error("worker error")); } };
      this._send({ type: "init" }, 120000).then(r => { this._booted = true; resolve(r); }, err => { try { w.terminate(); } catch (e) {} this.worker = null; reject(err); });
    });
  },
  async _startLocal() {
    await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "worker.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    this.local = window.CTLocalEngine;
    if (!this.local) throw new Error("no local engine");
    return this._send({ type: "init" }, 120000);
  },
  _onMessage(msg) {
    const p = this.pending.get(msg.id);
    if (!p) return;
    if (msg.status) { if (msg.status === "packages") this.status("loading", t("pyPackages")); return; }
    clearTimeout(p.timer);
    this.pending.delete(msg.id);
    if (this.version) this.status("ready", "Python " + this.version + " · " + t("pyReady"));
    msg.ok ? p.resolve(msg.result) : p.reject(new Error(msg.error));
  },
  _send(msg, timeout) {
    const id = ++this.seq;
    msg.id = id;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        this.pending.delete(id);
        reject(Object.assign(new Error("timeout"), { timeout: true }));
        if (this.worker && this._booted) this._restart();
      }, timeout);
      this.pending.set(id, { resolve, reject, timer });
      if (this.worker) this.worker.postMessage(msg);
      else if (this.local) this.local.handle(msg, r => this._onMessage(r));
      else { clearTimeout(timer); this.pending.delete(id); reject(new Error("no engine")); }
    });
  },
  _restart() {
    try { this.worker.terminate(); } catch (e) {}
    this.worker = null; this._booted = false;
    for (const p of this.pending.values()) { clearTimeout(p.timer); p.reject(new Error("restart")); }
    this.pending.clear();
    this.start();
  },
  async call(type, payload) {
    const ok = await this.ready;
    if (!ok) throw new Error("engine unavailable");
    const heavy = /\b(numpy|pandas)\b/.test((payload.code || "") + (payload.tests || ""));
    return this._send(Object.assign({ type }, payload), heavy ? 120000 : 25000);
  },
};

const ta = $("ed-ta"), hl = $("ed-hl"), gutter = $("ed-gutter");

function renderEditor() {
  const v = ta.value;

  for (let i = 1; i <= n; i++) g += (i === errorLine ? `<span class="err">${i}</span>` : i) + "\n";
  gutter.innerHTML = g;

function replaceSel(text, selStart, selEnd) {
  ta.focus();
  ta.setSelectionRange(selStart, selEnd);
  if (!document.execCommand || !document.execCommand("insertText", false, text)) {
    ta.setRangeText(text, selStart, selEnd, "end");
    ta.dispatchEvent(new Event("input"));
  }
}
let tabLeaves = false;
ta.addEventListener("blur", () => { tabLeaves = false; });
ta.addEventListener("keydown", e => {
  const { selectionStart: a, selectionEnd: b, value: v } = ta;
  if (e.key === "Escape") { tabLeaves = true; return; }
  if (e.key === "Tab" && tabLeaves) { tabLeaves = false; return; }
  if (e.key !== "Shift") tabLeaves = false;
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); e.shiftKey ? doCheck() : doRun(); return; }
  if (e.key === "Tab" && !e.altKey && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    const ls = v.lastIndexOf("\n", a - 1) + 1;
    const block = v.slice(ls, b);
    if (a === b && !e.shiftKey) { replaceSel("    ", a, b); return; }
    const lines = block.split("\n");
    const out = lines.map(l => e.shiftKey ? l.replace(/^ {1,4}/, "") : "    " + l).join("\n");
    replaceSel(out, ls, b);
    ta.setSelectionRange(ls, ls + out.length);
    return;
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const ls = v.lastIndexOf("\n", a - 1) + 1;
    const line = v.slice(ls, a);
    let ind = (/^\s*/.exec(line) || [""])[0];
    if (/:\s*(#.*)?$/.test(line)) ind += "    ";
    else if (/^\s*(return|break|continue|pass|raise)\b/.test(line)) ind = ind.slice(0, Math.max(0, ind.length - 4));
    replaceSel("\n" + ind, a, b);
    return;
  }
  if (e.key === "Backspace" && a === b && a > 0) {
    const ls = v.lastIndexOf("\n", a - 1) + 1;
    const before = v.slice(ls, a);
    if (before.length && /^ +$/.test(before) && before.length % 4 === 0) { e.preventDefault(); replaceSel("", a - 4, a); }
  }
});

function current() { return examRunning() ? byId(S.exam.ids[S.exam.idx]) : byId(S.currentId); }
function chapterExercises(ch) { return allExercises().filter(e => e.ch === ch); }

function targetLevel(ch) { return S.mode === "auto" ? lvlState(ch).level : Number(S.mode); }
function pickNext(excludeId, preferCh) {
  const chs = CH_ORDER.filter(c => S.selected.has(c));
  if (!chs.length) return null;
  // Kapitel mit dem geringsten Fortschritt bevorzugen, bei Gleichstand zufällig
  const score = c => { const ex = chapterExercises(c); return ex.length ? ex.filter(e => prog(e.id).solved).length / ex.length : 1; };
  const order = chs.map(c => ({ c, s: (c === preferCh ? -1 : 0) + score(c) + Math.random() * 0.25 })).sort((x, y) => x.s - y.s).map(x => x.c);
  const cand = [];
  order.forEach((c, rank) => {
    const want = targetLevel(c);
    chapterExercises(c).filter(e => !prog(e.id).solved && e.id !== excludeId)
      .forEach(e => cand.push({ e, d: Math.abs(e.lvl - want), rank }));
  });
  if (!cand.length) return null;
  const bestD = Math.min(...cand.map(x => x.d));
  const close = cand.filter(x => x.d === bestD);
  const bestRank = Math.min(...close.map(x => x.rank));
  const pool = close.filter(x => x.rank === bestRank).map(x => x.e);
  return pool[Math.floor(Math.random() * pool.length)];
}

function openExercise(id) {
  const ex = byId(id);

}

/* ====================================================================== Ausführen & Prüfen */
function parseErrorLine(tb) {
  const m = [...String(tb || "").matchAll(/File "<dein Code>", line (\d+)/g)];
  return m.length ? Number(m[m.length - 1][1]) : null;
}

async function doRun() {
  const ex = current();
  if (!ex || Engine.failed) return;
  if (S.view === "exam" && (!examRunning() || !S.exam.allowRun)) return;
  $("run-btn").disabled = true; $("run-btn").setAttribute("aria-busy", "true");
  writeConsole([{ cls: "muted", text: t("running") }]);
  try {
    const r = await Engine.call("run", { code: ta.value, stdin: $("stdin").value, lang: LANG, files: ex.files || null });
    if (current() !== ex) return;
    S.lastOut = r.out || "";
    S.lastError = r.error || null;
    const parts = [];
    if (r.out) parts.push({ text: r.out });
    if (r.error) parts.push({ cls: "stderr", text: (r.out && !r.out.endsWith("\n") ? "\n" : "") + r.error });
    if (!parts.length) parts.push({ cls: "muted", text: t("noOutput") });
    writeConsole(parts);
    errorLine = r.error ? parseErrorLine(r.error) : null;
    renderEditor();
    announce(r.error ? (errorLine ? t("runErr", { l: errorLine }) : t("runtimeError")) : t("runDone"));
    revealIfHidden($("console"));
  } catch (e) {
    writeConsole([{ cls: "stderr", text: e.timeout ? t("timeout") : String(e.message || e) }]);
  } finally { $("run-btn").disabled = false; $("run-btn").removeAttribute("aria-busy"); }
}

async function doCheck() {
  const ex = current();
  if (!ex || Engine.failed || S.view === "exam") return;
  $("check-btn").disabled = true; $("check-btn").setAttribute("aria-busy", "true");
  setCheckStatus("");
  const p = prog(ex.id);
  try {
    const r = await Engine.call("check", { off: offKeys(), code: ta.value, tests: ex.tests, chapter: ex.ch, require: ex.require || [], forbid: ex.forbid || [], lang: LANG });
    p.attempts += 1;
    if (current() !== ex) { save(); renderChapters(); return; }
    S.lastResult = r;
    S.lastError = r.error || null;
    errorLine = r.error ? parseErrorLine(r.error) : null;
    renderEditor();
    if (r.out) { S.lastOut = r.out; }
    const solved = isSolved(r);
    if (solved && !p.solved) {
      p.solved = true;
      p.clean = p.attempts <= 2 && p.hints <= 1 && !p.peeked;
      adapt(ex, p.clean ? "clean" : "solved");
    } else if (!solved && p.attempts >= 4 && p.attempts % 2 === 0) {
      adapt(ex, "struggle");
    }
    save();
    renderResult(r);
    renderChapters();
    const passed = r.checks.filter(c => c.ok).length, n = r.checks.length;
    const msg = r.error ? t("checkErr") : solved ? t("checkOk", { n }) : (n && passed === n) ? t("checkWarn") : t("checkSome", { p: passed, n });
    setCheckStatus(msg, r.error ? "bad" : solved ? "ok" : (n && passed === n) ? "warn" : "bad");
    announce(msg);
    revealIfHidden($("result-panel").querySelector(".verdict"));
  } catch (e) {
    S.lastResult = null;
    const panel = $("result-panel");
    panel.hidden = false;
    panel.innerHTML = `<div class="verdict bad"><strong>${esc(e.timeout ? t("timeout") : String(e.message || e))}</strong></div>`;
  } finally { $("check-btn").disabled = false; $("check-btn").removeAttribute("aria-busy"); Tutor.renderChrome(); }
}

function constructBlocking(rep) {
  if (!rep) return false;
  if (rep.missing.length || rep.forbidden.length) return true;
  return S.strict && rep.items.length > 0;
}
function isSolved(r) {
  return !r.error && r.checks.length > 0 && r.checks.every(c => c.ok) && !constructBlocking(r.constructs);
}

const noteText = it => it.status === "later" ? t("constructLater", { ch: it.chapter }) : it.status === "off" ? t("constructOff") : t("constructAbsent");
let adaptMsg = "";
function adapt(ex, kind) {
  const st = lvlState(ex.ch);
  adaptMsg = "";
  if (kind === "clean") {
    st.streak += 1; st.struggle = 0;
    if (st.streak >= 2 && st.level < 3) { st.level += 1; st.streak = 0; adaptMsg = t("levelUp", { ch: ex.ch, l: st.level }); }
  } else if (kind === "solved") {
    st.streak = 0;
  } else if (kind === "struggle" || kind === "peek") {
    st.streak = 0; st.struggle += 1;
    if (st.struggle >= (kind === "peek" ? 1 : 2) && st.level > 1) { st.level -= 1; st.struggle = 0; adaptMsg = t("levelDown", { ch: ex.ch, l: st.level }); }
  }
  save(); renderLevel();
}

function renderResult(r) {
  const ex = current();
  const panel = $("result-panel");
  panel.hidden = false;
  const p = prog(ex.id);
  const passed = r.checks.filter(c => c.ok).length;
  const allOk = !r.error && r.checks.length && passed === r.checks.length;
  const blocking = constructBlocking(r.constructs);
  let cls, head;
  if (r.kind === "syntax") { cls = "bad"; head = t("syntaxError"); }
  else if (r.error) { cls = "bad"; head = t("runtimeError"); }
  else if (allOk && blocking) { cls = "warn"; head = t("passedButConstructs"); }
  else if (allOk) { cls = "ok"; head = t("allPassed"); }
  else { cls = "bad"; head = t("someFailed"); }
  let html = `<div class="verdict ${cls}"><div><strong>${esc(head)}</strong>${allOk && !blocking ? `<p>${esc(adaptMsg || t("solvedMsg"))}</p>` : ""}</div>
    ${r.checks.length ? `<span class="meter">${passed}/${r.checks.length}</span>` : ""}</div>`;
  if (r.error) html += `<pre class="console stderr" style="margin:12px 16px;border:1px solid var(--line);border-radius:4px">${esc(r.error)}</pre>`;
  if (r.checks.length) html += `<ul class="checks">${r.checks.map(c => `<li class="${c.ok ? "ok" : "no"}">${esc(c[LANG] || c.de)}</li>`).join("")}</ul>`;
  const rep = r.constructs || { items: [], missing: [], forbidden: [] };
  const notes = [];
  rep.missing.forEach(m => notes.push(`<div class="note missing">${esc(t("constructMissing"))} <strong>${esc(m[LANG])}</strong>${m.section ? refChip(m.section) : ""}</div>`));
  rep.forbidden.forEach(m => notes.push(`<div class="note forbidden">${esc(t("constructForbidden"))} <strong>${esc(m[LANG])}</strong> (${esc(t("line"))} ${m.line})</div>`));
  rep.items.filter(it => !rep.forbidden.some(f => f.key === it.key)).forEach(it => notes.push(`<div class="note ${it.status}"><code>${esc(it[LANG])}</code> (${esc(t("line"))} ${it.line}) ${esc(noteText(it))}${it.section && it.status !== "off" ? refChip(it.section) : ""}</div>`));
  if (notes.length) html += `<div class="notes">${notes.join("")}</div>`;
  if (allOk && !blocking) html += `<div style="padding:0 16px 16px"><button type="button" class="btn dark" id="res-next">${esc(t("next"))}</button></div>`;
  // Musterlösung
  const unlocked = p.solved || p.attempts >= 2 || Tutor.hintLevel() >= 3;
  if (ex.solution) {
    html += unlocked
      ? `<details class="solution" id="sol-details"><summary>${esc(t("showSolution"))}</summary>${p.solved ? "" : `<p style="margin:0;padding:0 12px 8px;color:var(--muted);font-size:13px">${esc(t("solutionNote"))}</p>`}<pre class="codeblock">${highlight(ex.solution)}</pre></details>`
      : `<p style="margin:0;padding:0 16px 14px;color:var(--muted);font-size:13px">${esc(t("solutionLocked"))}</p>`;
  }
  panel.innerHTML = html;
  const nb = $("res-next");
  if (nb) nb.onclick = goNext;
  const sd = $("sol-details");
  if (sd) sd.addEventListener("toggle", () => {
    if (sd.open && !p.solved && !p.peeked) { p.peeked = true; adapt(ex, "peek"); save(); renderChapters(); }
  });
}

/* ====================================================================== KI-Tutor */
const Tutor = {
  sample: undefined, turns: [], hints: {}, ctl: null, busy: false, disabled: false,

  renderChrome() {

    const ex = current();
    ["ai-feedback", "ai-hint", "ai-error"].forEach(id => { $(id).disabled = !on || this.busy || !ex; });
    $("chat-form").querySelector("button").disabled = !on || this.busy || !ex;
    $("chat-input").disabled = !on || !ex;
    $("gen-btn").disabled = !on || this.busy || Gen.busy;

    const h = this.hintLevel();

  },
  renderChat(streamText) {
    const chat = $("chat");
    if (S.view === "exam") { chat.innerHTML = `<div class="ai-off">${esc(examRunning() ? t("tutorExamOff") : t("tutorExamDone"))}</div>`; return; }
    const mode = this.mode();
    if (mode === "pending") { chat.innerHTML = ""; return; }
    if (mode === "off") { chat.innerHTML = `<div class="ai-off">${esc(this.disabled ? t("aiDenied") : t("aiUnavailable"))}</div>`; return; }
    if (mode === "goto") {
      chat.innerHTML = `<div class="link-intro">${md(t("gotoIntro"))}<p style="margin-top:10px"><a class="btn primary" style="text-decoration:none" href="${esc(CONFIG.tutor.artifact_url)}" target="_top">${esc(t("gotoBtn"))}</a></p></div>`;
      return;
    }
    if (mode === "link") {
      let h = `<div class="link-intro">${md(t("linkIntro"))}</div>`;
      this.turns.forEach((turn, i) => {
        if (turn.role === "link") h += `<div class="msg user">${esc(turn.shown)} ↗</div><div class="msg sys">${esc(turn.long ? t("linkOpenedLong") : t("linkOpened"))} <a href="${esc(turn.href)}" target="_blank" rel="noopener">${esc(t("openAgain"))}</a> · <button type="button" class="btn ghost" data-copy="${i}" style="padding:1px 6px;font-size:12px">${esc(t("copyPrompt"))}</button></div>`;
        else if (turn.role === "sys") h += `<div class="msg sys">${esc(turn.content)}</div>`;
      });
      chat.innerHTML = h;
      chat.scrollTop = chat.scrollHeight;
      return;
    }

    for (const turn of this.turns) {

      else if (turn.role === "assistant") html += `<div class="msg ai"><div class="who">${esc(t("tutor"))}</div><div class="md">${md(turn.content)}</div></div>`;
      else html += `<div class="msg sys">${esc(turn.content)}</div>`;
    }
    if (streamText !== undefined) html += `<div class="msg ai"><div class="who">${esc(t("tutor"))}</div><div class="md">${streamText ? md(streamText) : `<span class="thinking">${esc(t("aiThinking"))}</span>`}</div></div>`;
    chat.innerHTML = html;
    chat.scrollTop = chat.scrollHeight;
  },
  async ask(kind, userText) {
    const ex = current();
    const mode = this.mode();
    if (!ex || this.busy || S.view === "exam" || (mode !== "inline" && mode !== "link")) return;
    let shown, request;
    if (kind === "hint") {
      const lvl = Math.min(3, (this.hints[ex.id] || 0) + 1);
      this.hints[ex.id] = lvl;
      prog(ex.id).hints = lvl; save();
      shown = `${t("aiHint")} ${lvl}/3`;
      request = hintRequest(lvl);
    } else if (kind === "feedback") {
      shown = t("aiFeedback");
      request = LANG === "de"
        ? "Gib mir Feedback zu meinem aktuellen Code: Was ist schon richtig? Was fehlt oder ist falsch (beziehe dich auf die fehlgeschlagenen Tests)? Ein Hinweis zum Stil (Variablennamen, Lesbarkeit) nach den Konventionen im Skript. Schließe mit genau einem konkreten nächsten Schritt. Keine vollständige Lösung."
        : "Give me feedback on my current code: What is already right? What is missing or wrong (refer to the failed tests)? One remark on style (variable names, readability) following the conventions in the notes. End with exactly one concrete next step. No complete solution.";
    } else if (kind === "error") {
      if (!S.lastError) { this.turns.push({ role: "sys", content: t("noError") }); this.renderChat(); return; }
      shown = t("aiError");
      request = LANG === "de"
        ? "Erkläre mir die Fehlermeldung in einfachen Worten: Was bedeutet der Fehlertyp, in welcher Zeile entsteht er und warum? Wie lese ich so einen Traceback (siehe Skript)? Wie kann ich ihn beheben – als Hinweis, nicht als fertige Lösung."
        : "Explain the error message in simple words: What does the error type mean, in which line does it occur and why? How do I read a traceback like this (see the notes)? How can I fix it – as a hint, not as a finished solution.";
    } else {
      shown = userText;
      request = userText;
    }
    if (mode === "link") { this.openInClaude(linkPrompt(ex, request), shown); return; }
    const content = contextBlock(ex) + "\n\n" + (LANG === "de" ? "ANFRAGE DES STUDIERENDEN:\n" : "STUDENT'S REQUEST:\n") + request;
    this.turns.push({ role: "user", content, shown });
    await this._send();
  },
  openInClaude(prompt, shown) {
    // läuft synchron im Klick-Handler, damit Zwischenablage und neuer Tab erlaubt sind
    copyText(prompt);
    const enc = encodeURIComponent(prompt);
    const long = enc.length > 14000;
    const href = long ? "https://claude.ai/new" : "https://claude.ai/new?q=" + enc;
    const a = document.createElement("a");
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    this.turns.push({ role: "link", shown, long, prompt, href });
    this.renderChat();
  },
  async _send() {
    this.busy = true; this.renderChrome();
    this.ctl = new AbortController();
    this.renderChat("");
    const msgs = [{ role: "user", content: tutorRules() }];
    // nur die letzten Runden mitschicken
    const hist = this.turns.filter(x => x.role !== "sys").slice(-8);
    for (const x of hist) msgs.push({ role: x.role, content: x.content });
    try {
      const { text } = await this.sample(msgs, {
        signal: this.ctl.signal, cache: false,
        onText: ({ text }) => this.renderChat(text),
      });
      this.turns.push({ role: "assistant", content: text });
    } catch (e) {
      const code = e && e.code;
      if (e && e.text) this.turns.push({ role: "assistant", content: e.text });
      if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed") this.disabled = true;
      else if (code === "rate_limited") this.turns.push({ role: "sys", content: t("aiRate") });
      else if (code !== "cancelled") this.turns.push({ role: "sys", content: t("aiFail") });
      // fehlgeschlagene Nutzerzeile entfernen, damit die Liste mit user endet
      if (!(e && e.text)) { const last = this.turns.map(x => x.role).lastIndexOf("user"); if (last >= 0) this.turns[last].role = "sys-user"; }
    } finally {
      this.busy = false; this.ctl = null;
      this.turns = this.turns.map(x => x.role === "sys-user" ? { role: "sys", content: "↳ " + x.shown } : x);
      this.renderChat(); this.renderChrome();
    }
  },
};

// Kopiert synchron (funktioniert auch, wenn gleich danach ein neuer Tab den Fokus übernimmt)
function copyText(text) {
  let ok = false;
  const ta2 = document.createElement("textarea");
  ta2.value = text; ta2.setAttribute("readonly", ""); ta2.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
  const prev = document.activeElement;
  document.body.appendChild(ta2); ta2.select();
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta2.remove();
  if (prev && prev.focus) prev.focus({ preventScroll: true });
  if (!ok) { try { navigator.clipboard?.writeText(text)?.catch?.(() => {}); ok = !!navigator.clipboard; } catch (e) {} }
  return ok;
}

function allowedConstructs(ch) {
  const idx = chIdx(ch);
  const allowed = [], later = [], absent = [];
  for (const [key, [c, sec, de, en]] of Object.entries(CONSTRUCTS)) {
    const label = LANG === "de" ? de : en;
    if (offKeys().includes(key)) absent.push(label + (LANG === "de" ? " (in diesem Semester nicht behandelt)" : " (not covered this semester)"));

    else if (chIdx(c) <= idx) allowed.push(`${label} (Kap. ${c})`);
    else later.push(`${label} (Kap. ${c})`);
  }
  return { allowed, later, absent };
}
function sectionIndex(ch) {

}

function allowedConstructsFor(ch) {

    else if (chIdx(c) <= idx) allowed.push(de);

}
function normalizeGenerated(d, ch, level) {

  const ex = {
    id: "gen-" + ch + "-" + Date.now().toString(36), ch, lvl: level, generated: true,
    title: two(d.title), task: two(d.task), starter: two(d.starter) || { de: "", en: "" },
    solution: typeof d.solution === "string" ? d.solution : null, tests: typeof d.tests === "string" ? d.tests : null,
    refs: Array.isArray(d.refs) ? d.refs.filter(x => SEC[x]).slice(0, 3) : [],
    require: Array.isArray(d.require) ? d.require.filter(k => CONSTRUCTS[k] && CONSTRUCTS[k][0] && chIdx(CONSTRUCTS[k][0]) <= chIdx(ch)) : [],
    forbid: [], stdin: typeof d.stdin === "string" ? d.stdin : "",

async function validateGenerated(ex) {
  try {
    const a = await Engine.call("check", { off: offKeys(), code: ex.solution, tests: ex.tests, chapter: ex.ch, require: ex.require, forbid: [], lang: "de" });
    if (a.error || a.checks.length < 3 || !a.checks.every(c => c.ok)) return false;
    const rep = a.constructs;
    if (rep.items.length || rep.missing.length || rep.forbidden.length) return false;
    const b = await Engine.call("check", { off: offKeys(), code: ex.starter.de, tests: ex.tests, chapter: ex.ch, require: ex.require, forbid: [], lang: "de" });
    if (!b.error && b.checks.length && b.checks.every(c => c.ok) && !b.constructs.missing.length) return false;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function weightedPick(list, w) {
  const total = list.reduce((s, e) => s + w(e), 0);
  let r = Math.random() * total;
  for (const e of list) { r -= w(e); if (r <= 0) return e; }
  return list[list.length - 1];
}
function pickExam(cfg) {
  const chs = shuffle(CH_ORDER.filter(c => S.selected.has(c)));
  const weights = cfg.mix === "hard" ? { 1: 0, 2: 1, 3: 2 } : { 1: 1, 2: 2, 3: 2 };
  let pool = allExercises().filter(e => S.selected.has(e.ch) && weights[e.lvl] > 0);
  if (!pool.length) pool = allExercises().filter(e => S.selected.has(e.ch));
  const w = e => weights[e.lvl] || 1;
  const picked = [];
  for (let k = 0; picked.length < cfg.count && k < cfg.count * 4; k++) {
    const c = chs[k % chs.length];
    let cand = pool.filter(e => e.ch === c && !picked.includes(e));
    if (!cand.length) cand = pool.filter(e => !picked.includes(e));
    if (!cand.length) break;
    picked.push(weightedPick(cand, w));
  }
  picked.sort((a, b) => chIdx(a.ch) - chIdx(b.ch) || a.lvl - b.lvl);
  return picked.map(e => e.id);
}

function fmtClock(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function tickExam() {

  const el = $("exam-clock");

    const left = S.exam.start + S.exam.minutes * 60000 - Date.now();
    if (el) { el.textContent = fmtClock(left); el.classList.toggle("low", left < 5 * 60000); }
    if (left <= 0) submitExam(true);
  } else if (el) {
    el.textContent = fmtClock(Date.now() - S.exam.start);
  }
}

function scoreTask(ex, r) {
  const max = PTS[ex.lvl];
  const total = r.checks.length, passed = r.checks.filter(c => c.ok).length;
  let pts = total ? max * passed / total : 0;
  const penalty = pts > 0 && constructBlocking(r.constructs);
  if (penalty) pts /= 2;
  return { pts: Math.round(pts * 2) / 2, max, passed, total, penalty };
}

async function submitExam(auto) {
  if (!S.exam || S.exam.submitted || gradingInfo) return;
  const exam = S.exam;
  examConfirm = null;
  gradingInfo = { i: 0, n: exam.ids.length };
  renderExamRun();
  const results = {};
  try {
    for (let k = 0; k < exam.ids.length; k++) {
      gradingInfo.i = k + 1; renderExamRun();
      const ex = byId(exam.ids[k]);
      const code = exam.codes[ex.id] ?? L(ex.starter);
      const r = await Engine.call("check", { off: offKeys(), code, tests: ex.tests, chapter: ex.ch, require: ex.require || [], forbid: ex.forbid || [], lang: LANG });
      const edited = exam.codes[ex.id] !== undefined && exam.codes[ex.id].trim() !== L(ex.starter).trim();
      const sc = scoreTask(ex, r);
      if (!edited) { sc.pts = 0; sc.penalty = false; }   // unveränderter Startcode gibt keine Punkte
      results[ex.id] = Object.assign(sc, { r, code, edited });
    }
  } catch (e) {
    gradingInfo = null;
    renderExamRun();
    const box = $("exam-run").querySelector(".panel-b");
    if (box) box.insertAdjacentHTML("afterbegin", `<div class="note absent">${esc(t("examGradeFail"))}</div>`);
    return;

  window.scrollTo({ top: 0 });
}
