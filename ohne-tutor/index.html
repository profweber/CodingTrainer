en Sie mit `** 0.5`. Speichern Sie die Ergebnisse in `t`, `x`, `v`. Der Behälter beginnt bei `x_start` und endet bei `x_end` (m, gemessen ab der Bandkante): Speichern Sie in `hits_bin`, ob die Teile im Behälter landen (Grenzen eingeschlossen). Ausgabe mit drei Nachkommastellen.", "en": "At the end of a conveyor belt (height `h` in m above the bottom of a bin), parts leave horizontally with the belt speed `v0` (m/s) (air resistance neglected, $g = 9.81\\,\\mathrm{m/s^2}$).\n- fall time $t = \\sqrt{2h/g}$\n- throw distance $x = v_0 \\cdot t$\n- impact speed $v = \\sqrt{v_0^2 + (g t)^2}$\n\nCompute roots with `** 0.5`. Store the results in `t`, `x`, `v`. The bin starts at `x_start` and ends at `x_end` (m, measured from the belt edge): store in `hits_bin` whether the parts land in the bin (limits included). Output with three decimals."}, "starter": {"de": "h = 0.8        # m\nv0 = 1.2       # m/s\nx_start = 0.3  # m\nx_end = 0.7    # m\n\n# Ihr Code:\n", "en": "h = 0.8        # m\nv0 = 1.2       # m/s\nx_start = 0.3  # m\nx_end = 0.7    # m\n\n# your code:\n"}, "solution": "h = 0.8\nv0 = 1.2\nx_start = 0.3\nx_end = 0.7\nt = (2 * h / 9.81) ** 0.5\nx = v0 * t\nv = (v0**2 + (9.81 * t)**2) ** 0.5\nhits_bin = x_start <= x <= x_end\nprint(f\"t = {t:.3f} s, x = {x:.3f} m, v = {v:.3f} m/s, im Behälter: {hits_bin}\")\n", "tests": "\nfor h, v0 in [(0.8, 1.2), (0.8, 2.5), (1.5, 0.4), (0.2, 1.0)]:\n    ns, out = run(sub={\"h\": h, \"v0\": v0})\n    t, x, v, hb = need(ns, \"t\", \"x\", \"v\", \"hits_bin\")\n    et = (2 * h / 9.81) ** 0.5; ex_ = v0 * et; ev = (v0**2 + (9.81 * et)**2) ** 0.5\n    check(approx(t, et) and approx(x, ex_), f\"h = {h} m, v0 = {v0} m/s: t = {et:.3f} s, x = {ex_:.3f} m\", f\"h = {h} m, v0 = {v0} m/s: t = {et:.3f} s, x = {ex_:.3f} m\")\n    check(approx(v, ev), f\"Aufprallgeschwindigkeit {ev:.3f} m/s\", f\"impact speed {ev:.3f} m/s\")\n    check(hb is (0.3 <= ex_ <= 0.7), f\"hits_bin = {0.3 <= ex_ <= 0.7}\", f\"hits_bin = {0.3 <= ex_ <= 0.7}\")\n", "refs": ["4.2", "4.4"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-fit", "ch": "4", "lvl": 3, "title": {"de": "Passung: Spiel oder Übermaß?", "en": "Fit: clearance or interference?"}, "task": {"de": "Eine Bohrung hat das Mindestmaß `hole_min` und das Höchstmaß `hole_max`, die Welle `shaft_min` und `shaft_max` (alle in mm). Berechnen Sie\n- `clearance_max` = Höchstmaß Bohrung − Mindestmaß Welle (Höchstspiel)\n- `clearance_min` = Mindestmaß Bohrung − Höchstmaß Welle (Mindestspiel; negativ bedeutet Übermaß)\n\nDie Passung ist eine\n- **Spielpassung** (`clearance_fit`), wenn das Mindestspiel größer als 0 ist,\n- **Übermaßpassung** (`interference_fit`), wenn das Höchstspiel kleiner als 0 ist,\n- sonst eine **Übergangspassung** (`transition_fit`) – ohne `if`, mit `not` und `and`.\n\nRunden Sie die beiden Spiele auf drei Nachkommastellen (`round`), damit keine Rundungsfehler stören, und geben Sie alles aus.", "en": "A bore has the minimum size `hole_min` and the maximum size `hole_max`, the shaft `shaft_min` and `shaft_max` (all in mm). Compute\n- `clearance_max` = bore maximum − shaft minimum (maximum clearance)\n- `clearance_min` = bore minimum − shaft maximum (minimum clearance; negative means interference)\n\nThe fit is a\n- **clearance fit** (`clearance_fit`) if the minimum clearance is greater than 0,\n- **interference fit** (`interference_fit`) if the maximum clearance is less than 0,\n- otherwise a **transition fit** (`transition_fit`) – without `if`, using `not` and `and`.\n\nRound both clearances to three decimals (`round`) so that rounding errors don't interfere, and print everything."}, "starter": {"de": "hole_min = 25.000\nhole_max = 25.021\nshaft_min = 24.959\nshaft_max = 24.980\n\n# Ihr Code:\n", "en": "hole_min = 25.000\nhole_max = 25.021\nshaft_min = 24.959\nshaft_max = 24.980\n\n# your code:\n"}, "solution": "hole_min = 25.000\nhole_max = 25.021\nshaft_min = 24.959\nshaft_max = 24.980\nclearance_max = round(hole_max - shaft_min, 3)\nclearance_min = round(hole_min - shaft_max, 3)\nclearance_fit = clearance_min > 0\ninterference_fit = clearance_max < 0\ntransition_fit = not clearance_fit and not interference_fit\nprint(clearance_max, clearance_min, clearance_fit, interference_fit, transition_fit)\n", "tests": "\ncases = [(25.000, 25.021, 24.959, 24.980), (25.000, 25.021, 25.035, 25.048), (25.000, 25.021, 24.991, 25.015), (40.0, 40.025, 39.95, 39.975), (25.000, 25.021, 25.021, 25.040), (25.000, 25.021, 24.980, 25.000)]\nfor a, b, c, d in cases:\n    ns, out = run(sub={\"hole_min\": a, \"hole_max\": b, \"shaft_min\": c, \"shaft_max\": d})\n    cmax, cmin, cf, inf, tf = need(ns, \"clearance_max\", \"clearance_min\", \"clearance_fit\", \"interference_fit\", \"transition_fit\")\n    e1, e2 = round(b - c, 3), round(a - d, 3)\n    check(approx(cmax, e1) and approx(cmin, e2), f\"Bohrung {a}…{b}, Welle {c}…{d}: Höchstspiel {e1}, Mindestspiel {e2}\", f\"bore {a}…{b}, shaft {c}…{d}: max clearance {e1}, min clearance {e2}\")\n    exp = (e2 > 0, e1 < 0, not e2 > 0 and not e1 < 0)\n    check((cf, inf, tf) == exp, f\"Spiel/Übermaß/Übergang = {exp}\", f\"clearance/interference/transition = {exp}\")\n", "require": ["boolop", "round"], "refs": ["4.4", "4.2"], "forbid": [], "stdin": "", "topics": []}, {"id": "k5-profile", "ch": "5", "lvl": 1, "title": {"de": "Profilstahl bestellen", "en": "Ordering steel sections"}, "task": {"de": "Ein Händler verkauft Stahlprofile nach Gewicht. Lesen Sie mit `input()` die benötigte Länge in m und die Masse pro Meter in kg/m ein (Punkt als Dezimalzeichen) und wandeln Sie beide in `float` um. Berechnen Sie die Masse `mass_kg` und den Preis `price` beim Kilopreis `price_per_kg`. Ausgabe: `Masse: 73.20 kg, Preis: 135.42 €` (zwei Nachkommastellen).\n\nTipp: Eingaben für „Ausführen“ tragen Sie im Feld *Eingaben für input()* ein, eine pro Zeile.", "en": "A dealer sells steel sections by weight. Use `input()` to read the required length in m and the mass per metre in kg/m (dot as decimal separator) and convert both to `float`. Compute the mass `mass_kg` and the price `price` at the price per kilogram `price_per_kg`. Output: `Mass: 73.20 kg, price: 135.42 €` (two decimals).\n\nTip: inputs for “Run” go into the field *Input for input()*, one per line."}, "starter": {"de": "price_per_kg = 1.85  # € pro kg\n\n# Länge und Masse pro Meter einlesen\n", "en": "price_per_kg = 1.85  # € per kg\n\n# read length and mass per metre\n"}, "solution": "price_per_kg = 1.85\nlength = float(input(\"Länge in m: \"))\nmass_per_m = float(input(\"Masse pro Meter in kg/m: \"))\nmass_kg = length * mass_per_m\nprice = mass_kg * price_per_kg\nprint(f\"Masse: {mass_kg:.2f} kg, Preis: {price:.2f} €\")\n", "tests": "\nfor l, mpm in [(\"6\", \"12.2\"), (\"2.5\", \"4.04\"), (\"12\", \"0.89\")]:\n    ns, out = run(inputs=[l, mpm])\n    m, p = need(ns, \"mass_kg\", \"price\")\n    em = float(l) * float(mpm); ep = em * 1.85\n    check(approx(m, em), f\"{l} m × {mpm} kg/m = {em:.2f} kg\", f\"{l} m × {mpm} kg/m = {em:.2f} kg\")\n    check(approx(p, ep), f\"Preis = {ep:.2f} €\", f\"price = {ep:.2f} €\")\n    check(f\"{em:.2f}\" in out and f\"{ep:.2f}\" in out, \"Ausgabe mit zwei Nachkommastellen\", \"Output with two decimals\")\n", "stdin": "6\n12.2\n", "require": ["cast"], "refs": ["4.3e", "5.2e"], "forbid": [], "topics": []}, {"id": "k5-list", "ch": "5", "lvl": 1, "title": {"de": "Bauteilliste bearbeiten", "en": "Editing a parts list"}, "task": {"de": "Bearbeiten Sie die Liste `parts` mit Listen-Methoden, und zwar in dieser Reihenfolge:\n1. Hängen Sie `'Mutter M8'` an.\n2. Entfernen Sie `'Unterlegscheibe'`.\n3. Fügen Sie `'Schraube M8'` ganz vorne ein.\n4. Sortieren Sie die Liste.\n5. Speichern Sie die Anzahl der Einträge in `n` und geben Sie Liste und Anzahl aus.", "en": "Edit the list `parts` with list methods, in this order:\n1. Append `'Mutter M8'`.\n2. Remove `'Unterlegscheibe'`.\n3. Insert `'Schraube M8'` at the very front.\n4. Sort the list.\n5. Store the number of entries in `n` and print list and count."}, "starter": {"de": "parts = ['Lager 6204', 'Unterlegscheibe', 'Dichtring', 'Passfeder']\n\n# Ihr Code:\n", "en": "parts = ['Lager 6204', 'Unterlegscheibe', 'Dichtring', 'Passfeder']\n\n# your code:\n"}, "solution": "parts = ['Lager 6204', 'Unterlegscheibe', 'Dichtring', 'Passfeder']\nparts.append('Mutter M8')\nparts.remove('Unterlegscheibe')\nparts.insert(0, 'Schraube M8')\nparts.sort()\nn = len(parts)\nprint(parts, n)\n", "tests": "\nns, out = run()\np, n = need(ns, \"parts\", \"n\")\ncheck(\"Mutter M8\" in p, \"'Mutter M8' ist in der Liste\", \"'Mutter M8' is in the list\")\ncheck(\"Unterlegscheibe\" not in p, \"'Unterlegscheibe' wurde entfernt\", \"'Unterlegscheibe' was removed\")\ncheck(\"Schraube M8\" in p, \"'Schraube M8' ist in der Liste\", \"'Schraube M8' is in the list\")\ncheck(p == sorted(['Lager 6204', 'Dichtring', 'Passfeder', 'Mutter M8', 'Schraube M8']), \"Die Liste ist sortiert\", \"The list is sorted\")\ncheck(n == 5, \"n = 5\", \"n = 5\")\nns2, _ = run(sub={\"parts\": ['Unterlegscheibe', 'Zahnrad']})\ncheck(ns2.get(\"n\") == 3, \"Funktioniert auch mit einer anderen Ausgangsliste (n berechnet, nicht fest)\", \"Works with another starting list too (n is computed, not fixed)\")\n", "require": ["list_methods"], "refs": ["5.3", "5.3m"], "forbid": [], "stdin": "", "topics": []}, {"id": "k5-cells", "ch": "5", "lvl": 1, "title": {"de": "Batteriepack", "en": "Battery pack"}, "task": {"de": "Lesen Sie mit `input()` die Spannung einer Zelle in V (Kommazahl) und die Anzahl der in Reihe geschalteten Zellen (ganze Zahl) ein. Berechnen Sie die Gesamtspannung `u_total`. Bauen Sie den Text `text = \"Gesamtspannung: \" + ... + \" V\"` mit `str()` zusammen (kein f-String!) und geben Sie ihn aus.", "en": "Use `input()` to read the voltage of one cell in V (decimal number) and the number of cells connected in series (integer). Compute the total voltage `u_total`. Build the text `text = \"Total voltage: \" + ... + \" V\"` using `str()` (no f-string!) and print it."}, "starter": {"de": "# Zellspannung und Anzahl einlesen\n", "en": "# read cell voltage and count\n"}, "solution": "u_cell = float(input(\"Zellspannung in V: \"))\nn = int(input(\"Anzahl Zellen: \"))\nu_total = u_cell * n\ntext = \"Gesamtspannung: \" + str(u_total) + \" V\"\nprint(text)\n", "tests": "\nfor u, n in [(\"3.7\", \"4\"), (\"1.2\", \"10\"), (\"3.2\", \"16\")]:\n    ns, out = run(inputs=[u, n])\n    ut, tx = need(ns, \"u_total\", \"text\")\n    e = float(u) * int(n)\n    check(approx(ut, e), f\"{n} Zellen à {u} V ergeben {e:g} V\", f\"{n} cells of {u} V give {e:g} V\")\n    check(isinstance(tx, str) and str(ut) in tx and tx.strip().endswith(\"V\"), \"text enthält die Gesamtspannung und endet mit 'V'\", \"text contains the total voltage and ends with 'V'\")\n", "stdin": "3.7\n4\n", "require": ["cast"], "forbid": ["fstring"], "refs": ["5.2e", "4.3e"], "topics": []}, {"id": "k5-index", "ch": "5", "lvl": 1, "title": {"de": "Indexzugriff auf Messwerte", "en": "Indexing measurements"}, "task": {"de": "Aus der Messreihe `values` sollen Sie nur per Indexzugriff ermitteln:\n- `first`: den ersten Wert\n- `last`: den letzten Wert (negativer Index)\n- `second_last`: den vorletzten Wert\n- `n`: die Anzahl der Werte\n- `middle`: den Wert in der Mitte, also beim Index `n // 2`", "en": "From the series `values`, determine using indexing only:\n- `first`: the first value\n- `last`: the last value (negative index)\n- `second_last`: the second-to-last value\n- `n`: the number of values\n- `middle`: the value in the middle, i.e. at index `n // 2`"}, "starter": {"de": "values = [12.1, 12.4, 13.0, 12.8, 12.9, 13.3, 13.1]\n\n# Ihr Code:\n", "en": "values = [12.1, 12.4, 13.0, 12.8, 12.9, 13.3, 13.1]\n\n# your code:\n"}, "solution": "values = [12.1, 12.4, 13.0, 12.8, 12.9, 13.3, 13.1]\nfirst = values[0]\nlast = values[-1]\nsecond_last = values[-2]\nn = len(values)\nmiddle = values[n // 2]\nprint(first, last, second_last, n, middle)\n", "tests": "\nfor v in [[12.1, 12.4, 13.0, 12.8, 12.9, 13.3, 13.1], [1, 2, 3, 4], [5.5, 6.6]]:\n    ns, out = run(sub={\"values\": v})\n    f, l, s, n, m = need(ns, \"first\", \"last\", \"second_last\", \"n\", \"middle\")\n    check((f, l, s) == (v[0], v[-1], v[-2]), f\"first/last/second_last für {v}\", f\"first/last/second_last for {v}\")\n    check(n == len(v) and m == v[len(v) // 2], f\"n = {len(v)}, middle = {v[len(v)//2]}\", f\"n = {len(v)}, middle = {v[len(v)//2]}\")\n", "require": ["index"], "refs": ["5.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "k5-rounding", "ch": "5", "lvl": 1, "title": {"de": "Rohre bestellen", "en": "Ordering pipes"}, "task": {"de": "Für eine Leitung werden `needed` Meter Rohr benötigt (Eingabe, Kommazahl mit Punkt). Rohre gibt es nur in Stangen zu 6 m. Importieren Sie das Modul `math` und berechnen Sie\n- `full_bars`: wie viele ganze Stangen vollständig verbraucht werden (`math.floor`)\n- `bars_to_buy`: wie viele Stangen gekauft werden müssen (`math.ceil`)\n- `leftover`: wie viele Meter übrig bleiben, auf zwei Stellen gerundet (`round`)\n- `exact`: ob die Länge genau ein Vielfaches von 6 m ist – vergleichen Sie `needed / 6` und `full_bars` mit `math.isclose` statt mit `==`.", "en": "A pipeline needs `needed` metres of pipe (input, decimal number with a dot). Pipes only come in 6 m bars. Import the module `math` and compute\n- `full_bars`: how many whole bars are used up completely (`math.floor`)\n- `bars_to_buy`: how many bars must be bought (`math.ceil`)\n- `leftover`: how many metres are left over, rounded to two decimals (`round`)\n- `exact`: whether the length is an exact multiple of 6 m – compare `needed / 6` and `full_bars` with `math.isclose` instead of `==`."}, "starter": {"de": "import math\n\n# Ihr Code:\n", "en": "import math\n\n# your code:\n"}, "solution": "import math\n\nneeded = float(input(\"Benötigte Länge in m: \"))\nfull_bars = math.floor(needed / 6)\nbars_to_buy = math.ceil(needed / 6)\nleftover = round(bars_to_buy * 6 - needed, 2)\nexact = math.isclose(needed / 6, full_bars)\nprint(full_bars, bars_to_buy, leftover, exact)\n", "tests": "\nimport math as _m\nfor t in [\"17.4\", \"18\", \"2.5\", \"36.0\", \"40\"]:\n    ns, out = run(inputs=[t])\n    fb, bb, lo, ex_ = need(ns, \"full_bars\", \"bars_to_buy\", \"leftover\", \"exact\")\n    x = float(t)\n    check(fb == _m.floor(x / 6) and bb == _m.ceil(x / 6), f\"{t} m: {_m.floor(x/6)} ganze Stangen, {_m.ceil(x/6)} kaufen\", f\"{t} m: {_m.floor(x/6)} whole bars, buy {_m.ceil(x/6)}\")\n    check(approx(lo, round(_m.ceil(x / 6) * 6 - x, 2)), f\"Rest = {round(_m.ceil(x/6)*6 - x, 2)} m\", f\"leftover = {round(_m.ceil(x/6)*6 - x, 2)} m\")\n    check(ex_ is _m.isclose(x / 6, _m.floor(x / 6)), f\"exact = {_m.isclose(x/6, _m.floor(x/6))}\", f\"exact = {_m.isclose(x/6, _m.floor(x/6))}\")\n", "stdin": "17.4\n", "require": ["import_math"], "refs": ["5.2e", "5.5f"], "forbid": [], "topics": []}, {"id": "k5-readings", "ch": "5", "lvl": 1, "title": {"de": "Messwerte sammeln", "en": "Collecting readings"}, "task": {"de": "Ein Prüfer liest an einem Manometer nacheinander drei Drücke ab. Legen Sie die leere Liste `readings` an, lesen Sie die drei Werte mit `input()` ein (Kommazahlen mit Punkt), wandeln Sie sie in `float` um und hängen Sie sie mit `append` an. Bestimmen Sie danach\n- `n`: die Anzahl der Messwerte\n- `first` und `last`: den ersten und den letzten Wert\n- `mean`: den Mittelwert (die drei Werte per Indexzugriff addieren)", "en": "An inspector reads three pressures from a gauge one after the other. Create the empty list `readings`, read the three values with `input()` (decimal numbers with a dot), convert them to `float` and append them with `append`. Then determine\n- `n`: the number of readings\n- `first` and `last`: the first and the last value\n- `mean`: the mean (add the three values via indexing)"}, "starter": {"de": "# Liste anlegen und drei Werte einlesen\n", "en": "# create the list and read three values\n"}, "solution": "readings = []\nreadings.append(float(input(\"Druck 1 in bar: \")))\nreadings.append(float(input(\"Druck 2 in bar: \")))\nreadings.append(float(input(\"Druck 3 in bar: \")))\nn = len(readings)\nfirst = readings[0]\nlast = readings[-1]\nmean = (readings[0] + readings[1] + readings[2]) / 3\nprint(readings, n, first, last, round(mean, 2))\n", "tests": "\nfor vals in [[\"4.2\", \"4.5\", \"4.1\"], [\"10\", \"12.5\", \"9.25\"], [\"0.5\", \"0.5\", \"0.5\"]]:\n    ns, out = run(inputs=vals)\n    r, n, f, l, m = need(ns, \"readings\", \"n\", \"first\", \"last\", \"mean\")\n    e = [float(v) for v in vals]\n    check(r == e and all(isinstance(x, float) for x in r), f\"readings = {e} (als float)\", f\"readings = {e} (as float)\")\n    check(n == 3 and f == e[0] and l == e[-1], \"n, first und last stimmen\", \"n, first and last are correct\")\n    check(approx(m, (e[0] + e[1] + e[2]) / 3), f\"Mittelwert = {(e[0] + e[1] + e[2]) / 3:.3f}\", f\"mean = {(e[0] + e[1] + e[2]) / 3:.3f}\")\n", "stdin": "4.2\n4.5\n4.1\n", "require": ["cast", "list_methods"], "refs": ["5.3", "5.3m", "5.2e"], "forbid": [], "topics": []}, {"id": "k5-register", "ch": "5", "lvl": 1, "title": {"de": "Modbus-Registeradresse", "en": "Modbus register address"}, "task": {"de": "In Datenblättern von Feldgeräten stehen Registeradressen oft hexadezimal, z.B. `0x1F4`. Lesen Sie eine solche Adresse als Text ein und wandeln Sie sie mit `int(text, 16)` in die Dezimalzahl `address` um. Ein Messwert belegt zwei aufeinanderfolgende Register: Speichern Sie die Adresse des zweiten Registers dezimal in `next_address` und hexadezimal (als String) in `next_hex`. Geben Sie alle drei aus.", "en": "Datasheets of field devices often give register addresses in hexadecimal, e.g. `0x1F4`. Read such an address as text and convert it to the decimal number `address` with `int(text, 16)`. A measured value occupies two consecutive registers: store the address of the second register in decimal in `next_address` and in hexadecimal (as a string) in `next_hex`. Print all three."}, "starter": {"de": "# Adresse einlesen (z.B. 0x1F4)\n", "en": "# read the address (e.g. 0x1F4)\n"}, "solution": "text = input(\"Registeradresse (hex): \")\naddress = int(text, 16)\nnext_address = address + 1\nnext_hex = hex(next_address)\nprint(address, next_address, next_hex)\n", "tests": "\nfor t in [\"0x1F4\", \"0x0\", \"0xFFFE\", \"0x7d0\"]:\n    ns, out = run(inputs=[t])\n    a, na, nh = need(ns, \"address\", \"next_address\", \"next_hex\")\n    e = int(t, 16)\n    check(a == e, f\"{t} = {e}\", f\"{t} = {e}\")\n    check(na == e + 1 and nh == hex(e + 1), f\"nächstes Register: {e + 1} = {hex(e + 1)}\", f\"next register: {e + 1} = {hex(e + 1)}\")\n", "stdin": "0x1F4\n", "require": ["numsys", "cast"], "refs": ["5.5", "5.2e"], "forbid": [], "topics": []}, {"id": "k5-phasor", "ch": "5", "lvl": 1, "title": {"de": "Ströme als komplexe Zahlen", "en": "Currents as complex numbers"}, "task": {"de": "In einem Wechselstromknoten fließen zwei Ströme zusammen, die als komplexe Zahlen gegeben sind (Realteil + Imaginärteil·j, in A). Berechnen Sie\n- `I_total`: den Gesamtstrom $I_1 + I_2$\n- `U`: die Spannung an der Impedanz `Z` (Ω, ebenfalls komplex) nach dem ohmschen Gesetz $U = Z \\cdot I_\\mathrm{total}$\n- `kind`: den Datentyp von `U` (mit `type()`)\n\nGeben Sie `I_total` und `U` aus. Erinnerung: Die imaginäre Einheit schreibt man direkt hinter eine Zahl, z.B. `4j`.", "en": "Two currents meet at an AC node; they are given as complex numbers (real part + imaginary part·j, in A). Compute\n- `I_total`: the total current $I_1 + I_2$\n- `U`: the voltage across the impedance `Z` (Ω, also complex) according to Ohm's law $U = Z \\cdot I_\\mathrm{total}$\n- `kind`: the data type of `U` (using `type()`)\n\nPrint `I_total` and `U`. Reminder: the imaginary unit is written directly after a number, e.g. `4j`."}, "starter": {"de": "I1 = 3 + 4j    # A\nI2 = 2 - 1j    # A\nZ = 10 + 5j    # Ohm\n\n# Ihr Code:\n", "en": "I1 = 3 + 4j    # A\nI2 = 2 - 1j    # A\nZ = 10 + 5j    # Ohm\n\n# your code:\n"}, "solution": "I1 = 3 + 4j\nI2 = 2 - 1j\nZ = 10 + 5j\nI_total = I1 + I2\nU = Z * I_total\nkind = type(U)\nprint(I_total, U, kind)\n", "tests": "\nfor i1, i2, z in [(3 + 4j, 2 - 1j, 10 + 5j), (1j, 1j, 2 + 0j), (-2.5 + 0.5j, 4 + 0j, 1 - 1j)]:\n    ns, out = run(sub={\"I1\": i1, \"I2\": i2, \"Z\": z})\n    it, U, k = need(ns, \"I_total\", \"U\", \"kind\")\n    check(approx(it.real, (i1 + i2).real) and approx(it.imag, (i1 + i2).imag), f\"I₁ + I₂ = {i1 + i2}\", f\"I₁ + I₂ = {i1 + i2}\")\n    eU = z * (i1 + i2)\n    check(isinstance(U, complex) and approx(U.real, eU.real) and approx(U.imag, eU.imag), f\"U = {eU}\", f\"U = {eU}\")\n    check(k is complex, \"kind ist der Typ complex\", \"kind is the type complex\")\n", "require": ["complex", "type"], "refs": ["5.1"], "forbid": [], "stdin": "", "topics": []}, {"id": "k5-sortbug", "ch": "5", "lvl": 1, "title": {"de": "Fehler finden: Messwerte weg", "en": "Find the bug: readings gone"}, "task": {"de": "Der Code im Editor soll die Schwingungsmesswerte sortieren und danach den kleinsten Wert `lowest` und den größten Wert `highest` auslesen – stattdessen bricht er mit einem Fehler ab. Lesen Sie die Fehlermeldung, finden Sie die Ursache und korrigieren Sie den Code. Danach soll `values` die sortierte Liste sein.\n\nTipp: Was gibt die Methode `sort()` zurück?", "en": "The code in the editor is meant to sort the vibration readings and then read the smallest value `lowest` and the largest value `highest` – instead it stops with an error. Read the error message, find the cause and fix the code. Afterwards, `values` should be the sorted list.\n\nTip: what does the method `sort()` return?"}, "starter": {"de": "values = [2.8, 1.4, 3.9, 0.7, 2.1]  # mm/s\nvalues = values.sort()\nlowest = values[0]\nhighest = values[-1]\nprint(values, lowest, highest)\n", "en": "values = [2.8, 1.4, 3.9, 0.7, 2.1]  # mm/s\nvalues = values.sort()\nlowest = values[0]\nhighest = values[-1]\nprint(values, lowest, highest)\n"}, "solution": "values = [2.8, 1.4, 3.9, 0.7, 2.1]\nvalues.sort()\nlowest = values[0]\nhighest = values[-1]\nprint(values, lowest, highest)\n", "tests": "\nimport ast as _ast\nfor v in [[2.8, 1.4, 3.9, 0.7, 2.1], [5.0, -1.0], [3.3]]:\n    ns, out = run(sub={\"values\": list(v)})\n    vals, lo, hi = need(ns, \"values\", \"lowest\", \"highest\")\n    s = list(v); s.sort()\n    check(vals == s, f\"values ist sortiert: {s}\", f\"values is sorted: {s}\")\n    check(lo == s[0] and hi == s[-1], f\"lowest = {s[0]}, highest = {s[-1]}\", f\"lowest = {s[0]}, highest = {s[-1]}\")\ncheck(\"= values.sort()\" not in SOURCE.replace(\"  \", \" \"), \"Das Ergebnis von sort() wird nicht mehr zugewiesen\", \"The result of sort() is no longer assigned\")\n", "require": ["list_methods"], "forbid": ["seqfuncs"], "refs": ["5.3m"], "stdin": "", "topics": []}, {"id": "k5-qualitycheck", "ch": "5", "lvl": 1, "title": {"de": "Wie viele Prüfungen bestanden?", "en": "How many checks passed?"}, "task": {"de": "An einem Bauteil werden drei Merkmale geprüft:\n- Länge `length` im Bereich 99.8 bis 100.2 mm (Grenzen eingeschlossen)\n- Masse `mass` höchstens 250 g\n- Rauheit `roughness` kleiner als 1.6 µm\n\nSpeichern Sie die drei Ergebnisse als Wahrheitswerte in `c1`, `c2`, `c3`. Nutzen Sie dann **implizites Casting**: Wahrheitswerte verhalten sich beim Rechnen wie 1 und 0. Berechnen Sie damit `n_passed` (Anzahl bestandener Prüfungen) und `share` (Anteil in Prozent). Speichern Sie außerdem `all_ok`.", "en": "Three features of a part are checked:\n- length `length` within 99.8 to 100.2 mm (limits included)\n- mass `mass` at most 250 g\n- roughness `roughness` less than 1.6 µm\n\nStore the three results as booleans in `c1`, `c2`, `c3`. Then use **implicit casting**: booleans behave like 1 and 0 in arithmetic. Use that to compute `n_passed` (number of passed checks) and `share` (share in percent). Also store `all_ok`."}, "starter": {"de": "length = 100.15    # mm\nmass = 252.0       # g\nroughness = 0.8    # µm\n\n# Ihr Code:\n", "en": "length = 100.15    # mm\nmass = 252.0       # g\nroughness = 0.8    # µm\n\n# your code:\n"}, "solution": "length = 100.15\nmass = 252.0\nroughness = 0.8\nc1 = 99.8 <= length <= 100.2\nc2 = mass <= 250\nc3 = roughness < 1.6\nn_passed = c1 + c2 + c3\nshare = n_passed / 3 * 100\nall_ok = c1 and c2 and c3\nprint(n_passed, round(share, 1), all_ok)\n", "tests": "\nfor L, m, r in [(100.15, 252.0, 0.8), (100.0, 250.0, 1.0), (99.7, 260.0, 2.0), (100.2, 100.0, 1.6), (100.3, 250.5, 1.5)]:\n    ns, out = run(sub={\"length\": L, \"mass\": m, \"roughness\": r})\n    c1, c2, c3, n, s, a = need(ns, \"c1\", \"c2\", \"c3\", \"n_passed\", \"share\", \"all_ok\")\n    e = [99.8 <= L <= 100.2, m <= 250, r < 1.6]\n    check([c1, c2, c3] == e, f\"Länge {L}, Masse {m}, Rauheit {r}: {e}\", f\"length {L}, mass {m}, roughness {r}: {e}\")\n    check(n == sum(e) and approx(s, sum(e) / 3 * 100), f\"n_passed = {sum(e)}, share = {sum(e) / 3 * 100:.1f} %\", f\"n_passed = {sum(e)}, share = {sum(e) / 3 * 100:.1f} %\")\n    check(a is all(e), f\"all_ok = {all(e)}\", f\"all_ok = {all(e)}\")\n", "refs": ["5.2", "4.4"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k5-comma", "ch": "5", "lvl": 2, "title": {"de": "Eingabe mit Dezimalkomma", "en": "Input with decimal comma"}, "task": {"de": "Lesen Sie einen Messwert ein, den Nutzer oft mit deutschem Komma eingeben (z.B. `12,7`). Ersetzen Sie das Komma durch einen Punkt und wandeln Sie in `float` um (`value`). Speichern Sie außerdem `truncated = int(value)` und `rounded = round(value)` und geben Sie alle drei Werte aus. Was ist der Unterschied?", "en": "Read a measurement that users often type with a German decimal comma (e.g. `12,7`). Replace the comma by a dot and convert to `float` (`value`). Also store `truncated = int(value)` and `rounded = round(value)` and print all three values. What's the difference?"}, "starter": {"de": "# Messwert einlesen\n", "en": "# read the measurement\n"}, "solution": "text = input(\"Messwert: \")\nvalue = float(text.replace(\",\", \".\"))\ntruncated = int(value)\nrounded = round(value)\nprint(value, truncated, rounded)\n", "tests": "\nfor t in [\"12,7\", \"3.2\", \"-2,6\", \"8\"]:\n    ns, out = run(inputs=[t])\n    v, tr, ro = need(ns, \"value\", \"truncated\", \"rounded\")\n    e = float(t.replace(\",\", \".\"))\n    check(approx(v, e), f\"Eingabe ‚{t}‘ ergibt value = {e}\", f\"Input '{t}' gives value = {e}\")\n    check(tr == int(e) and ro == round(e), f\"truncated = {int(e)}, rounded = {round(e)} für ‚{t}‘\", f\"truncated = {int(e)}, rounded = {round(e)} for '{t}'\")\n", "stdin": "12,7\n", "require": ["replace"], "refs": ["5.2e", "4.3e"], "forbid": [], "topics": []}, {"id": "k5-numsys", "ch": "5", "lvl": 2, "title": {"de": "Zahlensysteme", "en": "Number systems"}, "task": {"de": "Lesen Sie eine ganze Zahl `n` ein. Speichern Sie ihre Binärdarstellung in `b` und ihre Hexadezimaldarstellung in `h` (jeweils als String, z.B. `'0b101010'`). Wandeln Sie `b` anschließend mit `int(..., 2)` zurück in `back`. Geben Sie alles aus.", "en": "Read an integer `n`. Store its binary representation in `b` and its hexadecimal one in `h` (as strings, e.g. `'0b101010'`). Then convert `b` back with `int(..., 2)` into `back`. Print everything."}, "starter": {"de": "# Zahl einlesen\n", "en": "# read the number\n"}, "solution": "n = int(input(\"Zahl: \"))\nb = bin(n)\nh = hex(n)\nback = int(b, 2)\nprint(n, b, h, back)\n", "tests": "\nfor t in [\"42\", \"255\", \"1000\"]:\n    ns, out = run(inputs=[t])\n    n, b, h, back = need(ns, \"n\", \"b\", \"h\", \"back\")\n    e = int(t)\n    check(n == e and isinstance(n, int), f\"n ist die ganze Zahl {e}\", f\"n is the integer {e}\")\n    check(b == bin(e) and h == hex(e), f\"b = {bin(e)}, h = {hex(e)}\", f\"b = {bin(e)}, h = {hex(e)}\")\n    check(back == e, f\"back = {e}\", f\"back = {e}\")\n", "stdin": "42\n", "require": ["numsys"], "refs": ["5.5", "5.5i"], "forbid": [], "topics": []}, {"id": "k5-ref", "ch": "5", "lvl": 2, "title": {"de": "Seiteneffekte vermeiden", "en": "Avoiding side effects"}, "task": {"de": "Bevor die Messreihe `values` sortiert und ihr größter Wert entfernt wird, soll eine **unabhängige** Sicherung `backup` angelegt werden. `backup = values` reicht nicht – warum? Erzeugen Sie die Sicherung mit `list(...)`. Sortieren Sie danach `values`, entfernen Sie mit `pop()` den größten Wert und geben Sie beide Listen aus.", "en": "Before the measurement series `values` is sorted and its largest value removed, create an **independent** backup `backup`. `backup = values` is not enough – why? Create the backup with `list(...)`. Then sort `values`, remove the largest value with `pop()` and print both lists."}, "starter": {"de": "values = [3.2, 1.5, 9.9, 2.8, 4.1]\n\n# Ihr Code:\n", "en": "values = [3.2, 1.5, 9.9, 2.8, 4.1]\n\n# your code:\n"}, "solution": "values = [3.2, 1.5, 9.9, 2.8, 4.1]\nbackup = list(values)\nvalues.sort()\nvalues.pop()\nprint(values, backup)\n", "tests": "\nns, out = run()\nv, b = need(ns, \"values\", \"backup\")\ncheck(b == [3.2, 1.5, 9.9, 2.8, 4.1], \"backup enthält die Originalreihenfolge\", \"backup holds the original order\")\ncheck(b is not v, \"backup ist eine eigene Instanz (kein Seiteneffekt)\", \"backup is a separate instance (no side effect)\")\ncheck(v == [1.5, 2.8, 3.2, 4.1], \"values ist sortiert und ohne den größten Wert\", \"values is sorted and without its largest value\")\nns, out = run(sub={\"values\": [5.0, 7.0, 1.0]})\ncheck(ns.get(\"values\") == [1.0, 5.0] and ns.get(\"backup\") == [5.0, 7.0, 1.0], \"Funktioniert auch mit anderen Messwerten\", \"Works with other measurements too\")\n", "refs": ["5.4s", "5.4m", "5.3m"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k5-rl", "ch": "5", "lvl": 2, "title": {"de": "Impedanz einer Spule", "en": "Impedance of a coil"}, "task": {"de": "Eine reale Spule hat den Widerstand `R` (Ω) und die Induktivität `L` (H). Bei der Frequenz `f` (Hz) gilt $Z = R + j X_L$ mit dem Blindwiderstand $X_L = \\omega L$ und $\\omega = 2\\pi f$ (`pi = 3.14159` ist vorgegeben). Berechnen Sie\n- `X_L`: den Blindwiderstand in Ω\n- `Z` als komplexe Zahl (`1j` verwenden)\n- `Z_abs`: den Betrag $\\sqrt{R^2 + X_L^2}$\n- `I`: den Strom bei der Spannung `U` als komplexe Zahl ($I = U / Z$)\n- `I_abs`: den Betrag des Stroms, U / |Z|\n\n`abs()` lernen wir erst in Kapitel 6 kennen.", "en": "A real coil has resistance `R` (Ω) and inductance `L` (H). At frequency `f` (Hz), $Z = R + j X_L$ with the reactance $X_L = \\omega L$ and $\\omega = 2\\pi f$ (`pi = 3.14159` is given). Compute\n- `X_L`: the reactance in Ω\n- `Z` as a complex number (use `1j`)\n- `Z_abs`: the magnitude $\\sqrt{R^2 + X_L^2}$\n- `I`: the current at voltage `U` as a complex number ($I = U / Z$)\n- `I_abs`: the magnitude of the current, U / |Z|\n\n`abs()` only comes in chapter 6."}, "starter": {"de": "pi = 3.14159\nR = 12.0     # Ohm\nL = 0.05     # H\nf = 50.0     # Hz\nU = 230.0    # V\n\n# Ihr Code:\n", "en": "pi = 3.14159\nR = 12.0     # Ohm\nL = 0.05     # H\nf = 50.0     # Hz\nU = 230.0    # V\n\n# your code:\n"}, "solution": "pi = 3.14159\nR = 12.0\nL = 0.05\nf = 50.0\nU = 230.0\nomega = 2 * pi * f\nX_L = omega * L\nZ = R + 1j * X_L\nZ_abs = (R**2 + X_L**2) ** 0.5\nI = U / Z\nI_abs = U / Z_abs\nprint(Z, round(Z_abs, 2), round(I_abs, 2))\n", "tests": "\nimport math as _m\nfor R, L, f in [(12.0, 0.05, 50.0), (100.0, 0.2, 1000.0), (5.0, 0.001, 50.0)]:\n    ns, out = run(sub={\"R\": R, \"L\": L, \"f\": f})\n    X, Z, Za, I, Ia = need(ns, \"X_L\", \"Z\", \"Z_abs\", \"I\", \"I_abs\")\n    eZ = complex(R, 2 * 3.14159 * f * L)\n    check(approx(X, eZ.imag), f\"X_L ≈ {eZ.imag:.3f} Ω\", f\"X_L ≈ {eZ.imag:.3f} Ω\")\n    check(isinstance(Z, complex) and approx(Z.real, R) and approx(Z.imag, eZ.imag), f\"Z = {eZ:.3f}\", f\"Z = {eZ:.3f}\")\n    check(approx(Za, abs(eZ)), f\"|Z| ≈ {abs(eZ):.3f} Ω\", f\"|Z| ≈ {abs(eZ):.3f} Ω\")\n    check(isinstance(I, complex) and approx(abs(I - 230 / eZ), 0) and approx(Ia, 230 / abs(eZ)), f\"I = U / Z ≈ {230/eZ:.4f} A, |I| ≈ {230/abs(eZ):.4f} A\", f\"I = U / Z ≈ {230/eZ:.4f} A, |I| ≈ {230/abs(eZ):.4f} A\")\n", "require": ["complex"], "forbid": ["abs"], "refs": ["5.1"], "stdin": "", "topics": []}, {"id": "k5-queue", "ch": "5", "lvl": 2, "title": {"de": "Prüfaufträge in der Warteschlange", "en": "Test jobs in a queue"}, "task": {"de": "Die Liste `jobs` ist die Warteschlange eines Prüflabors (vorne = als Nächstes dran). Führen Sie nacheinander aus:\n1. Der Auftrag `'Härteprüfung'` wird hinten angehängt.\n2. Der vorderste Auftrag wird bearbeitet: Entfernen Sie ihn mit `pop(0)` und speichern Sie ihn in `done`.\n3. Ein Eilauftrag `'Bruchanalyse'` kommt ganz nach vorne.\n4. Speichern Sie in `n_tensile`, wie oft `'Zugversuch'` noch in der Liste steht, und in `pos`, an welcher Position der erste `'Zugversuch'` steht.", "en": "The list `jobs` is the queue of a testing lab (front = next). Perform in order:\n1. The job `'Härteprüfung'` is appended at the back.\n2. The front job is processed: remove it with `pop(0)` and store it in `done`.\n3. An urgent job `'Bruchanalyse'` goes to the very front.\n4. Store in `n_tensile` how often `'Zugversuch'` is still in the list, and in `pos` at which position the first `'Zugversuch'` is."}, "starter": {"de": "jobs = ['Kerbschlag', 'Zugversuch', 'Rauheit', 'Zugversuch']\n\n# Ihr Code:\n", "en": "jobs = ['Kerbschlag', 'Zugversuch', 'Rauheit', 'Zugversuch']\n\n# your code:\n"}, "solution": "jobs = ['Kerbschlag', 'Zugversuch', 'Rauheit', 'Zugversuch']\njobs.append('Härteprüfung')\ndone = jobs.pop(0)\njobs.insert(0, 'Bruchanalyse')\nn_tensile = jobs.count('Zugversuch')\npos = jobs.index('Zugversuch')\nprint(jobs, done, n_tensile, pos)\n", "tests": "\nfor start in [['Kerbschlag', 'Zugversuch', 'Rauheit', 'Zugversuch'], ['Zugversuch', 'Rauheit', 'Zugversuch', 'Zugversuch']]:\n    ns, out = run(sub={\"jobs\": list(start)})\n    j, d, n, p = need(ns, \"jobs\", \"done\", \"n_tensile\", \"pos\")\n    e = list(start); e.append('Härteprüfung'); ed = e.pop(0); e.insert(0, 'Bruchanalyse')\n    check(j == e, f\"Warteschlange danach: {e}\", f\"Queue afterwards: {e}\")\n    check(d == ed, f\"done = {ed!r}\", f\"done = {ed!r}\")\n    check(n == e.count('Zugversuch') and p == e.index('Zugversuch'), f\"n_tensile = {e.count('Zugversuch')}, pos = {e.index('Zugversuch')}\", f\"n_tensile = {e.count('Zugversuch')}, pos = {e.index('Zugversuch')}\")\n", "require": ["list_methods"], "refs": ["5.3m"], "forbid": [], "stdin": "", "topics": []}, {"id": "k5-dip", "ch": "5", "lvl": 2, "title": {"de": "DIP-Schalter und D/A-Wandler", "en": "DIP switches and a D/A converter"}, "task": {"de": "Mit acht DIP-Schaltern wird der Sollwert eines 8-Bit-D/A-Wandlers eingestellt. Lesen Sie die Schalterstellung als Text aus Nullen und Einsen ein, z.B. `10110010` (links das höchstwertige Bit). Bestimmen Sie\n- `code`: den Zahlenwert (`int(text, 2)`)\n- `code_hex`: die Hexadezimaldarstellung als String\n- `voltage`: die Ausgangsspannung bei der Referenzspannung `U_ref`: $U = \\dfrac{\\mathit{code}}{255} \\cdot U_\\mathrm{ref}$\n\nGeben Sie die Spannung mit drei Nachkommastellen aus.", "en": "Eight DIP switches set the value of an 8-bit D/A converter. Read the switch positions as a text of zeros and ones, e.g. `10110010` (most significant bit on the left). Determine\n- `code`: the numeric value (`int(text, 2)`)\n- `code_hex`: the hexadecimal representation as a string\n- `voltage`: the output voltage at the reference voltage `U_ref`: $U = \\dfrac{\\mathit{code}}{255} \\cdot U_\\mathrm{ref}$\n\nPrint the voltage with three decimals."}, "starter": {"de": "U_ref = 5.0  # V\n\n# Schalterstellung einlesen\n", "en": "U_ref = 5.0  # V\n\n# read the switch positions\n"}, "solution": "U_ref = 5.0\ntext = input(\"Schalterstellung (8 Bit): \")\ncode = int(text, 2)\ncode_hex = hex(code)\nvoltage = code / 255 * U_ref\nprint(f\"Code {code} ({code_hex}): {voltage:.3f} V\")\n", "tests": "\nfor b in [\"10110010\", \"00000000\", \"11111111\", \"00000001\"]:\n    ns, out = run(inputs=[b])\n    c, h, u = need(ns, \"code\", \"code_hex\", \"voltage\")\n    e = int(b, 2)\n    check(c == e and h == hex(e), f\"{b} = {e} = {hex(e)}\", f\"{b} = {e} = {hex(e)}\")\n    check(approx(u, e / 255 * 5.0), f\"U = {e / 255 * 5.0:.3f} V\", f\"U = {e / 255 * 5.0:.3f} V\")\n    check(f\"{e / 255 * 5.0:.3f}\" in out, \"Ausgabe mit drei Nachkommastellen\", \"Output with three decimals\")\nns, out = run(inputs=[\"11111111\"], sub={\"U_ref\": 3.3})\ncheck(approx(ns.get(\"voltage\"), 3.3), \"Mit U_ref = 3.3 V liefert 11111111 genau 3.3 V\", \"With U_ref = 3.3 V, 11111111 gives exactly 3.3 V\")\n", "stdin": "10110010\n", "require": ["numsys"], "refs": ["5.5", "5.5i"], "forbid": [], "topics": []}, {"id": "k5-isclose", "ch": "5", "lvl": 2, "title": {"de": "Maßkette mit Gleitkommazahlen", "en": "Dimension chain with floats"}, "task": {"de": "Drei Distanzscheiben mit den Dicken `t1`, `t2`, `t3` (mm) sollen zusammen genau das Sollmaß `target` ergeben. Berechnen Sie die Summe `total` und vergleichen Sie auf zwei Arten:\n- `exact`: Vergleich mit `==`\n- `close`: Vergleich mit `math.isclose`\n\nSpeichern Sie außerdem die Abweichung `diff = total - target`. Probieren Sie es mit den vorgegebenen Werten aus und erklären Sie das Ergebnis von `exact`!", "en": "Three spacer discs with thicknesses `t1`, `t2`, `t3` (mm) together should give exactly the target size `target`. Compute the sum `total` and compare in two ways:\n- `exact`: comparison with `==`\n- `close`: comparison with `math.isclose`\n\nAlso store the deviation `diff = total - target`. Try it with the given values and explain the result of `exact`!"}, "starter": {"de": "import math\n\nt1 = 0.1\nt2 = 0.2\nt3 = 0.4\ntarget = 0.7\n\n# Ihr Code:\n", "en": "import math\n\nt1 = 0.1\nt2 = 0.2\nt3 = 0.4\ntarget = 0.7\n\n# your code:\n"}, "solution": "import math\n\nt1 = 0.1\nt2 = 0.2\nt3 = 0.4\ntarget = 0.7\ntotal = t1 + t2 + t3\nexact = total == target\nclose = math.isclose(total, target)\ndiff = total - target\nprint(total, exact, close, diff)\n", "tests": "\nimport math as _m\nfor a, b, c, t in [(0.1, 0.2, 0.4, 0.7), (0.5, 0.25, 0.25, 1.0), (1.1, 2.2, 3.3, 6.6), (0.1, 0.2, 0.3, 0.7)]:\n    ns, out = run(sub={\"t1\": a, \"t2\": b, \"t3\": c, \"target\": t})\n    tot, ex_, cl, d = need(ns, \"total\", \"exact\", \"close\", \"diff\")\n    s = a + b + c\n    check(tot == s and d == s - t, f\"{a} + {b} + {c} = {s!r}\", f\"{a} + {b} + {c} = {s!r}\")\n    check(ex_ is (s == t) and cl is _m.isclose(s, t), f\"exact = {s == t}, close = {_m.isclose(s, t)}\", f\"exact = {s == t}, close = {_m.isclose(s, t)}\")\n", "require": ["import_math"], "refs": ["5.5f", "5.2e"], "forbid": [], "stdin": "", "topics": []}, {"id": "k5-magazine", "ch": "5", "lvl": 2, "title": {"de": "Werkzeugmagazin", "en": "Tool magazine"}, "task": {"de": "Das Werkzeugmagazin einer Fräsmaschine ist eine Liste; leere Plätze sind mit `None` markiert. Die Spindel enthält das Werkzeug `spindle`.\n1. Lesen Sie den Platz `pos` (ganze Zahl, Index ab 0) des nächsten Werkzeugs ein.\n2. Entnehmen Sie es mit `pop(pos)` und speichern Sie es in `new_tool`.\n3. Das bisherige Spindelwerkzeug kommt an genau diesen Platz zurück (`insert`). Danach steckt `new_tool` in der Spindel (`spindle` neu zuweisen).\n4. Speichern Sie in `free` die Anzahl der leeren Plätze und in `pos_t5` den Platz von `'T5'`.", "en": "The tool magazine of a milling machine is a list; empty slots are marked with `None`. The spindle holds the tool `spindle`.\n1. Read the slot `pos` (integer, index from 0) of the next tool.\n2. Take it out with `pop(pos)` and store it in `new_tool`.\n3. The previous spindle tool goes back into exactly this slot (`insert`). Afterwards `new_tool` is in the spindle (reassign `spindle`).\n4. Store the number of empty slots in `free` and the slot of `'T5'` in `pos_t5`."}, "starter": {"de": "magazine = ['T1', None, 'T3', 'T4', None, 'T5']\nspindle = 'T2'\n\n# Ihr Code:\n", "en": "magazine = ['T1', None, 'T3', 'T4', None, 'T5']\nspindle = 'T2'\n\n# your code:\n"}, "solution": "magazine = ['T1', None, 'T3', 'T4', None, 'T5']\nspindle = 'T2'\npos = int(input('Platz des nächsten Werkzeugs: '))\nnew_tool = magazine.pop(pos)\nmagazine.insert(pos, spindle)\nspindle = new_tool\nfree = magazine.count(None)\npos_t5 = magazine.index('T5')\nprint(magazine, spindle, free, pos_t5)\n", "tests": "\nstart = ['T1', None, 'T3', 'T4', None, 'T5']\nfor p in [2, 0, 3]:\n    ns, out = run(inputs=[str(p)])\n    m, s, nt, f, p5 = need(ns, \"magazine\", \"spindle\", \"new_tool\", \"free\", \"pos_t5\")\n    e = list(start); ent = e.pop(p); e.insert(p, 'T2')\n    check(nt == ent and s == ent, f\"Platz {p}: {ent!r} wandert in die Spindel\", f\"slot {p}: {ent!r} goes into the spindle\")\n    check(m == e, f\"Magazin danach: {e}\", f\"magazine afterwards: {e}\")\n    check(f == e.count(None) and p5 == e.index('T5'), f\"free = {e.count(None)}, pos_t5 = {e.index('T5')}\", f\"free = {e.count(None)}, pos_t5 = {e.index('T5')}\")\n", "stdin": "2\n", "require": ["list_methods", "none"], "refs": ["5.3m", "5.3"], "forbid": [], "topics": []}, {"id": "k5-twos", "ch": "5", "lvl": 2, "title": {"de": "Zweierkomplement mit 8 Bit", "en": "Two's complement with 8 bits"}, "task": {"de": "Ein Mikrocontroller speichert ganze Zahlen von −128 bis 127 als 8-Bit-Muster im Zweierkomplement. Für eine Zahl `n` aus diesem Bereich ergibt sich der gespeicherte Code (0 bis 255) aus `(n + 256) % 256` – probieren Sie nach, dass das für positive **und** negative Zahlen stimmt!\n\nLesen Sie `n` ein und bestimmen Sie\n- `code`: den gespeicherten Code\n- `bits`: dessen Binärdarstellung als String\n- `msb`: das höchstwertige Bit (0 oder 1) – es ist `code // 128`\n- `negative`: ob `msb` gleich 1 ist", "en": "A microcontroller stores integers from −128 to 127 as 8-bit patterns in two's complement. For a number `n` in this range, the stored code (0 to 255) is `(n + 256) % 256` – verify that this works for positive **and** negative numbers!\n\nRead `n` and determine\n- `code`: the stored code\n- `bits`: its binary representation as a string\n- `msb`: the most significant bit (0 or 1) – it is `code // 128`\n- `negative`: whether `msb` equals 1"}, "starter": {"de": "# Zahl einlesen (-128 bis 127)\n", "en": "# read the number (-128 to 127)\n"}, "solution": "n = int(input(\"Zahl (-128 bis 127): \"))\ncode = (n + 256) % 256\nbits = bin(code)\nmsb = code // 128\nnegative = msb == 1\nprint(n, code, bits, msb, negative)\n", "tests": "\nfor n in [-5, 5, -128, 127, 0, -1]:\n    ns, out = run(inputs=[str(n)])\n    c, b, m, neg = need(ns, \"code\", \"bits\", \"msb\", \"negative\")\n    e = (n + 256) % 256\n    check(c == e and b == bin(e), f\"{n} → Code {e} = {bin(e)}\", f\"{n} → code {e} = {bin(e)}\")\n    check(m == e // 128 and neg is (n < 0), f\"msb = {e // 128}, negative = {n < 0}\", f\"msb = {e // 128}, negative = {n < 0}\")\n", "stdin": "-5\n", "require": ["numsys"], "refs": ["5.5i"], "forbid": [], "topics": []}, {"id": "k5-protocol", "ch": "5", "lvl": 2, "title": {"de": "Messprotokoll als verschachtelte Liste", "en": "Measurement log as a nested list"}, "task": {"de": "Ein Prüfprotokoll ist eine Liste von Einträgen; jeder Eintrag ist selbst eine Liste `[zeit_min, temperatur]`.\n1. Speichern Sie die Temperatur des zweiten Eintrags in `second_temp`.\n2. Lesen Sie eine neue Messung ein: zuerst die Zeit (ganze Zahl), dann die Temperatur (Kommazahl). Hängen Sie sie als neuen Eintrag an.\n3. Der erste Eintrag war eine Fehlmessung: Entfernen Sie ihn mit `pop(0)` und speichern Sie ihn in `removed`.\n4. Speichern Sie in `last_time` die Zeit des letzten Eintrags und in `n_entries` die Anzahl der Einträge.", "en": "A test log is a list of entries; each entry is itself a list `[time_min, temperature]`.\n1. Store the temperature of the second entry in `second_temp`.\n2. Read a new measurement: first the time (integer), then the temperature (decimal number). Append it as a new entry.\n3. The first entry was a faulty measurement: remove it with `pop(0)` and store it in `removed`.\n4. Store the time of the last entry in `last_time` and the number of entries in `n_entries`."}, "starter": {"de": "protocol = [[0, 21.4], [5, 23.9], [10, 27.5]]\n\n# Ihr Code:\n", "en": "protocol = [[0, 21.4], [5, 23.9], [10, 27.5]]\n\n# your code:\n"}, "solution": "protocol = [[0, 21.4], [5, 23.9], [10, 27.5]]\nsecond_temp = protocol[1][1]\nt = int(input(\"Zeit in min: \"))\ntemp = float(input(\"Temperatur in °C: \"))\nprotocol.append([t, temp])\nremoved = protocol.pop(0)\nlast_time = protocol[-1][0]\nn_entries = len(protocol)\nprint(protocol, removed, last_time, n_entries)\n", "tests": "\nfor t, temp in [(\"15\", \"30.2\"), (\"120\", \"-4.5\")]:\n    ns, out = run(inputs=[t, temp])\n    p, st, r, lt, n = need(ns, \"protocol\", \"second_temp\", \"removed\", \"last_time\", \"n_entries\")\n    check(st == 23.9, \"second_temp = 23.9\", \"second_temp = 23.9\")\n    check(p == [[5, 23.9], [10, 27.5], [int(t), float(temp)]], f\"Protokoll danach: [[5, 23.9], [10, 27.5], [{int(t)}, {float(temp)}]]\", f\"log afterwards: [[5, 23.9], [10, 27.5], [{int(t)}, {float(temp)}]]\")\n    check(r == [0, 21.4] and lt == int(t) and n == 3, f\"removed = [0, 21.4], last_time = {int(t)}, n_entries = 3\", f\"removed = [0, 21.4], last_time = {int(t)}, n_entries = 3\")\nns, out = run(inputs=[\"7\", \"1.0\"], sub={\"protocol\": [[1, 5.0], [2, 6.0]]})\ncheck(ns.get(\"second_temp\") == 6.0 and ns.get(\"n_entries\") == 2 and ns.get(\"removed\") == [1, 5.0], \"Funktioniert auch mit einem anderen Protokoll\", \"Works with another log too\")\n", "stdin": "15\n30.2\n", "require": ["index", "list_methods"], "refs": ["5.3", "5.3m"], "forbid": [], "topics": []}, {"id": "k5-chars", "ch": "5", "lvl": 3, "title": {"de": "Caesar-Code für ein Zeichen", "en": "Caesar code for one character"}, "task": {"de": "Lesen Sie einen Großbuchstaben `c` (A–Z) und eine Verschiebung `k` ein. Berechnen Sie mit `ord()` und `chr()` den um `k` Stellen verschobenen Buchstaben `shifted`; nach Z geht es wieder bei A los (Tipp: Modulo 26 auf die Position im Alphabet). Geben Sie `shifted` aus.", "en": "Read an upper-case letter `c` (A–Z) and a shift `k`. Use `ord()` and `chr()` to compute the letter `shifted`, moved by `k` positions; after Z it wraps around to A (tip: modulo 26 on the position in the alphabet). Print `shifted`."}, "starter": {"de": "# Buchstabe und Verschiebung einlesen\n", "en": "# read letter and shift\n"}, "solution": "c = input(\"Buchstabe: \")\nk = int(input(\"Verschiebung: \"))\nshifted = chr((ord(c) - ord(\"A\") + k) % 26 + ord(\"A\"))\nprint(shifted)\n", "tests": "\nfor c, k in [(\"A\", 3), (\"X\", 5), (\"M\", 13), (\"B\", 27)]:\n    ns, out = run(inputs=[c, str(k)])\n    s = need(ns, \"shifted\")\n    e = chr((ord(c) - 65 + k) % 26 + 65)\n    check(s == e, f\"{c} um {k} verschoben ergibt {e}\", f\"{c} shifted by {k} gives {e}\")\n", "stdin": "X\n5\n", "require": ["numsys"], "refs": ["5.5s", "4.2"], "forbid": [], "topics": []}, {"id": "k5-parity", "ch": "5", "lvl": 3, "title": {"de": "Paritätsbit", "en": "Parity bit"}, "task": {"de": "Bei der seriellen Datenübertragung wird oft ein Paritätsbit angehängt. Lesen Sie ein Byte `n` (ganze Zahl 0–255) ein. Bestimmen Sie\n- `b`: die Binärdarstellung als String\n- `ones`: die Anzahl der Einsen darin (Tipp: `list(b)` liefert die Liste der Zeichen – und Listen haben die Methode `count`)\n- `parity_bit`: 1, wenn die Anzahl der Einsen ungerade ist, sonst 0 (ohne `if` – mit Modulo!)\n- `frame`: die Zahl, die entsteht, wenn man das Paritätsbit rechts an `n` anhängt (binär um eine Stelle nach links verschieben = mal 2)", "en": "Serial data transmission often appends a parity bit. Read a byte `n` (integer 0–255). Determine\n- `b`: the binary representation as a string\n- `ones`: the number of ones in it (tip: `list(b)` gives the list of characters – and lists have the method `count`)\n- `parity_bit`: 1 if the number of ones is odd, else 0 (without `if` – use modulo!)\n- `frame`: the number obtained by appending the parity bit to the right of `n` (shifting left by one binary digit = times 2)"}, "starter": {"de": "# Byte einlesen\n", "en": "# read the byte\n"}, "solution": "n = int(input(\"Byte (0-255): \"))\nb = bin(n)\nones = list(b).count(\"1\")\nparity_bit = ones % 2\nframe = n * 2 + parity_bit\nprint(b, ones, parity_bit, bin(frame))\n", "tests": "\nfor n in [0, 7, 170, 255, 128]:\n    ns, out = run(inputs=[str(n)])\n    b, o, p, fr = need(ns, \"b\", \"ones\", \"parity_bit\", \"frame\")\n    eo = bin(n).count(\"1\")\n    check(b == bin(n) and o == eo, f\"{n}: {bin(n)} hat {eo} Einsen\", f\"{n}: {bin(n)} has {eo} ones\")\n    check(p == eo % 2, f\"{n}: Paritätsbit {eo % 2}\", f\"{n}: parity bit {eo % 2}\")\n    check(fr == n * 2 + eo % 2, f\"{n}: frame = {n*2 + eo%2} ({bin(n*2 + eo%2)})\", f\"{n}: frame = {n*2 + eo%2} ({bin(n*2 + eo%2)})\")\n", "stdin": "170\n", "require": ["numsys"], "forbid": ["if"], "refs": ["5.5i", "4.2"], "topics": []}, {"id": "k5-det", "ch": "5", "lvl": 3, "title": {"de": "2×2-Matrix invertieren", "en": "Inverting a 2×2 matrix"}, "task": {"de": "Die Matrix `M` ist als verschachtelte Liste `[[a, b], [c, d]]` gegeben. Berechnen Sie nur mit Indexzugriff\n- `det` $= a d - b c$\n- `inv`: die inverse Matrix `[[d, −b], [−c, a]] / det` als verschachtelte Liste (jedes Element durch `det` teilen)\n- `check`: das Produkt M · inv als verschachtelte Liste (sollte die Einheitsmatrix sein). Element $(i, j)$ = `M[i][0]*inv[0][j] + M[i][1]*inv[1][j]`.\n\nSie dürfen voraussetzen, dass `det` nicht 0 ist.", "en": "The matrix `M` is given as a nested list `[[a, b], [c, d]]`. Using indexing only, compute\n- `det` $= a d - b c$\n- `inv`: the inverse matrix `[[d, −b], [−c, a]] / det` as a nested list (divide each element by `det`)\n- `check`: the product M · inv as a nested list (should be the identity). Element $(i, j)$ = `M[i][0]*inv[0][j] + M[i][1]*inv[1][j]`.\n\nYou may assume that `det` is not 0."}, "starter": {"de": "M = [[4.0, 7.0],\n     [2.0, 6.0]]\n\n# Ihr Code:\n", "en": "M = [[4.0, 7.0],\n     [2.0, 6.0]]\n\n# your code:\n"}, "solution": "M = [[4.0, 7.0],\n     [2.0, 6.0]]\ndet = M[0][0] * M[1][1] - M[0][1] * M[1][0]\ninv = [[M[1][1] / det, -M[0][1] / det],\n       [-M[1][0] / det, M[0][0] / det]]\ncheck = [[M[0][0] * inv[0][0] + M[0][1] * inv[1][0], M[0][0] * inv[0][1] + M[0][1] * inv[1][1]],\n         [M[1][0] * inv[0][0] + M[1][1] * inv[1][0], M[1][0] * inv[0][1] + M[1][1] * inv[1][1]]]\nprint(det, inv, check)\n", "tests": "\nfor M in [[[4.0, 7.0], [2.0, 6.0]], [[1.0, 2.0], [3.0, 4.0]], [[0.0, 1.0], [-1.0, 0.0]]]:\n    ns, out = run(sub={\"M\": M})\n    d, inv, c = need(ns, \"det\", \"inv\", \"check\")\n    (a, b), (cc, dd) = M; ed = a * dd - b * cc\n    check(approx(d, ed), f\"det von {M} = {ed:g}\", f\"det of {M} = {ed:g}\")\n    ei = [[dd / ed, -b / ed], [-cc / ed, a / ed]]\n    check(all(approx(inv[i][j], ei[i][j]) for i in range(2) for j in range(2)), f\"Inverse = {ei}\", f\"Inverse = {ei}\")\n    check(all(approx(c[i][j], 1.0 if i == j else 0.0) for i in range(2) for j in range(2)), \"M · inv ist die Einheitsmatrix\", \"M · inv is the identity matrix\")\n", "require": ["index"], "forbid": ["for", "while"], "refs": ["5.3"], "stdin": "", "topics": []}, {"id": "k5-median", "ch": "5", "lvl": 3, "title": {"de": "Median ohne Seiteneffekt", "en": "Median without side effects"}, "task": {"de": "Der Median ist robuster gegen Ausreißer als der Mittelwert. Berechnen Sie den Median der Liste `values` in der Variable `median`:\n- Legen Sie eine **Kopie** an und sortieren Sie diese (das Original muss unverändert bleiben).\n- Bei n Werten ist der Median `(s[(n - 1) // 2] + s[n // 2]) / 2` – diese Formel funktioniert für gerade und ungerade n. Prüfen Sie das an einem Beispiel nach!", "en": "The median is more robust against outliers than the mean. Compute the median of the list `values` in the variable `median`:\n- Create a **copy** and sort it (the original must stay unchanged).\n- For n values, the median is `(s[(n - 1) // 2] + s[n // 2]) / 2` – this formula works for both even and odd n. Verify it on an example!"}, "starter": {"de": "values = [4.1, 3.9, 47.0, 4.3, 4.0]\n\n# Ihr Code:\n", "en": "values = [4.1, 3.9, 47.0, 4.3, 4.0]\n\n# your code:\n"}, "solution": "values = [4.1, 3.9, 47.0, 4.3, 4.0]\ns = list(values)\ns.sort()\nn = len(s)\nmedian = (s[(n - 1) // 2] + s[n // 2]) / 2\nprint(median, values)\n", "tests": "\nimport statistics as _st\nfor v in [[4.1, 3.9, 47.0, 4.3, 4.0], [1.0, 2.0, 3.0, 10.0], [7.5], [3, 1, 2, 5, 4, 6]]:\n    orig = list(v)\n    ns, out = run(sub={\"values\": list(v)})\n    m = need(ns, \"median\")\n    check(approx(m, _st.median(v)), f\"Median von {orig} = {_st.median(v)}\", f\"Median of {orig} = {_st.median(v)}\")\n    check(ns[\"values\"] == orig, f\"values bleibt unverändert\", f\"values stays unchanged\")\n", "forbid": ["seqfuncs"], "refs": ["5.3m", "5.4s"], "require": [], "stdin": "", "topics": []}, {"id": "k5-rlc", "ch": "5", "lvl": 3, "title": {"de": "Reihenschwingkreis", "en": "Series RLC circuit"}, "task": {"de": "Für einen RLC-Reihenschwingkreis mit `R` (Ω), `L` (H) und `C` (F) berechnen Sie mit `pi = 3.14159` und Wurzeln über `** 0.5`\n- `f0`: die Resonanzfrequenz $f_0 = \\dfrac{1}{2\\pi\\sqrt{LC}}$\n- `X`: den Blindwiderstand bei der Frequenz `f`: $X = \\omega L - \\dfrac{1}{\\omega C}$ mit $\\omega = 2\\pi f$\n- `Z`: die komplexe Impedanz $Z = R + jX$\n- `Z_abs`: den Betrag $\\sqrt{R^2 + X^2}$\n- `inductive`: ob der Kreis bei `f` induktiv wirkt (X größer als 0)\n\nBei $f = f_0$ ist $X = 0$ und $|Z| = R$ – probieren Sie es aus!", "en": "For a series RLC circuit with `R` (Ω), `L` (H) and `C` (F), compute with `pi = 3.14159` and roots via `** 0.5`\n- `f0`: the resonance frequency $f_0 = \\dfrac{1}{2\\pi\\sqrt{LC}}$\n- `X`: the reactance at frequency `f`: $X = \\omega L - \\dfrac{1}{\\omega C}$ with $\\omega = 2\\pi f$\n- `Z`: the complex impedance $Z = R + jX$\n- `Z_abs`: the magnitude $\\sqrt{R^2 + X^2}$\n- `inductive`: whether the circuit behaves inductively at `f` (X greater than 0)\n\nAt $f = f_0$, $X = 0$ and $|Z| = R$ – try it!"}, "starter": {"de": "pi = 3.14159\nR = 10.0       # Ohm\nL = 0.01       # H\nC = 1e-6       # F\nf = 2000.0     # Hz\n\n# Ihr Code:\n", "en": "pi = 3.14159\nR = 10.0       # Ohm\nL = 0.01       # H\nC = 1e-6       # F\nf = 2000.0     # Hz\n\n# your code:\n"}, "solution": "pi = 3.14159\nR = 10.0\nL = 0.01\nC = 1e-6\nf = 2000.0\nf0 = 1 / (2 * pi * (L * C) ** 0.5)\nomega = 2 * pi * f\nX = omega * L - 1 / (omega * C)\nZ = R + 1j * X\nZ_abs = (R**2 + X**2) ** 0.5\ninductive = X > 0\nprint(round(f0, 1), Z, round(Z_abs, 2), inductive)\n", "tests": "\nP = 3.14159\nfor R, L, C, f in [(10.0, 0.01, 1e-6, 2000.0), (10.0, 0.01, 1e-6, 1000.0), (50.0, 0.1, 1e-5, 500.0)]:\n    ns, out = run(sub={\"R\": R, \"L\": L, \"C\": C, \"f\": f})\n    f0, X, Z, Za, ind = need(ns, \"f0\", \"X\", \"Z\", \"Z_abs\", \"inductive\")\n    ef0 = 1 / (2 * P * (L * C) ** 0.5); w = 2 * P * f; eZ = complex(R, w * L - 1 / (w * C))\n    check(approx(X, eZ.imag, 1e-6), f\"X bei {f:.0f} Hz ≈ {eZ.imag:.2f} Ω\", f\"X at {f:.0f} Hz ≈ {eZ.imag:.2f} Ω\")\n    check(approx(f0, ef0), f\"f₀ ≈ {ef0:.2f} Hz\", f\"f₀ ≈ {ef0:.2f} Hz\")\n    check(isinstance(Z, complex) and approx(Z.imag, eZ.imag, 1e-6) and approx(Z.real, R), f\"Z bei {f:.0f} Hz ≈ {eZ:.2f}\", f\"Z at {f:.0f} Hz ≈ {eZ:.2f}\")\n    check(approx(Za, abs(eZ)) and ind is (eZ.imag > 0), f\"|Z| ≈ {abs(eZ):.2f} Ω, induktiv = {eZ.imag > 0}\", f\"|Z| ≈ {abs(eZ):.2f} Ω, inductive = {eZ.imag > 0}\")\n", "require": ["complex"], "refs": ["5.1", "4.4"], "forbid": [], "stdin": "", "topics": []}, {"id": "k5-utf8", "ch": "5", "lvl": 3, "title": {"de": "Wie viele Bytes braucht ein Zeichen?", "en": "How many bytes does a character need?"}, "task": {"de": "In UTF-8 wird ein Zeichen je nach Codepunkt in 1 bis 4 Bytes gespeichert:\n- Codepunkt unter 0x80 (128): 1 Byte\n- ab 0x80: 2 Bytes, ab 0x800: 3 Bytes, ab 0x10000: 4 Bytes\n\nLesen Sie ein einzelnes Zeichen ein und bestimmen Sie\n- `cp`: den Codepunkt (`ord`) und `cp_hex`: dessen Hexadezimaldarstellung\n- `is_ascii`: ob das Zeichen im ASCII-Bereich liegt (Codepunkt kleiner als 128)\n- `n_bytes`: die Anzahl der UTF-8-Bytes – **ohne `if`**: Nutzen Sie, dass Vergleiche beim Rechnen als 1 bzw. 0 zählen (1 + (cp >= 0x80) + …).", "en": "In UTF-8, a character is stored in 1 to 4 bytes depending on its code point:\n- code point below 0x80 (128): 1 byte\n- from 0x80: 2 bytes, from 0x800: 3 bytes, from 0x10000: 4 bytes\n\nRead a single character and determine\n- `cp`: the code point (`ord`) and `cp_hex`: its hexadecimal representation\n- `is_ascii`: whether the character is in the ASCII range (code point less than 128)\n- `n_bytes`: the number of UTF-8 bytes – **without `if`**: use the fact that comparisons count as 1 or 0 in arithmetic (1 + (cp >= 0x80) + …)."}, "starter": {"de": "# Zeichen einlesen\n", "en": "# read the character\n"}, "solution": "c = input(\"Zeichen: \")\ncp = ord(c)\ncp_hex = hex(cp)\nis_ascii = cp < 128\nn_bytes = 1 + (cp >= 0x80) + (cp >= 0x800) + (cp >= 0x10000)\nprint(cp, cp_hex, is_ascii, n_bytes)\n", "tests": "\nfor c in [\"A\", \"ä\", \"€\", \"😊\", \"~\", \"ß\", chr(127), chr(128), chr(2047), chr(2048), chr(65535), chr(65536)]:\n    ns, out = run(inputs=[c])\n    cp, h, a, n = need(ns, \"cp\", \"cp_hex\", \"is_ascii\", \"n_bytes\")\n    check(cp == ord(c) and h == hex(ord(c)), f\"{c!r}: Codepunkt {ord(c)} = {hex(ord(c))}\", f\"{c!r}: code point {ord(c)} = {hex(ord(c))}\")\n    check(a is (ord(c) < 128) and n == len(c.encode(\"utf-8\")), f\"{c!r}: ASCII = {ord(c) < 128}, {len(c.encode('utf-8'))} Byte(s)\", f\"{c!r}: ASCII = {ord(c) < 128}, {len(c.encode('utf-8'))} byte(s)\")\n", "stdin": "€\n", "require": ["numsys"], "forbid": ["if"], "refs": ["5.5s", "5.2"], "topics": []}, {"id": "k5-adc", "ch": "5", "lvl": 3, "title": {"de": "Rohwert eines A/D-Wandlers", "en": "Raw value of an A/D converter"}, "task": {"de": "Ein Sensor liefert über einen n-Bit-A/D-Wandler einen Rohwert, den die Diagnosesoftware hexadezimal anzeigt (z.B. `0x9C4`). Gegeben sind die Auflösung `n_bits` und die Referenzspannung `U_ref`. Bestimmen Sie\n- `max_code`: den größten darstellbaren Code $2^n - 1$\n- `lsb`: die Spannung eines Schritts $U_\\mathrm{ref} / (2^n - 1)$ in V\n- `raw`: den eingelesenen Rohwert als Zahl\n- `voltage`: die gemessene Spannung $\\mathit{raw} \\cdot \\mathit{lsb}$\n- `valid`: ob der Rohwert im darstellbaren Bereich liegt (0 bis max_code)\n- `percent`: die Aussteuerung in Prozent, gerundet auf eine Nachkommastelle", "en": "A sensor delivers a raw value through an n-bit A/D converter, which the diagnostic software shows in hexadecimal (e.g. `0x9C4`). The resolution `n_bits` and the reference voltage `U_ref` are given. Determine\n- `max_code`: the largest representable code $2^n - 1$\n- `lsb`: the voltage of one step $U_\\mathrm{ref} / (2^n - 1)$ in V\n- `raw`: the raw value read in, as a number\n- `voltage`: the measured voltage $\\mathit{raw} \\cdot \\mathit{lsb}$\n- `valid`: whether the raw value is within the representable range (0 to max_code)\n- `percent`: the level in percent, rounded to one decimal"}, "starter": {"de": "n_bits = 12\nU_ref = 3.3  # V\n\n# Rohwert einlesen (hexadezimal)\n", "en": "n_bits = 12\nU_ref = 3.3  # V\n\n# read the raw value (hexadecimal)\n"}, "solution": "n_bits = 12\nU_ref = 3.3\nmax_code = 2**n_bits - 1\nlsb = U_ref / max_code\nraw = int(input(\"Rohwert (hex): \"), 16)\nvoltage = raw * lsb\nvalid = 0 <= raw <= max_code\npercent = round(raw / max_code * 100, 1)\nprint(f\"{voltage:.4f} V, gültig: {valid}, {percent} %\")\n", "tests": "\nfor t, nb, ur in [(\"0x9C4\", 12, 3.3), (\"0xFFF\", 12, 3.3), (\"0x3FF\", 10, 5.0), (\"0x1000\", 12, 3.3), (\"0x80\", 8, 2.5), (\"0x0\", 12, 3.3)]:\n    ns, out = run(inputs=[t], sub={\"n_bits\": nb, \"U_ref\": ur})\n    mc, l, r, u, v, p = need(ns, \"max_code\", \"lsb\", \"raw\", \"voltage\", \"valid\", \"percent\")\n    emc = 2**nb - 1; er = int(t, 16)\n    check(mc == emc and approx(l, ur / emc), f\"{nb} Bit: max_code = {emc}, lsb = {ur / emc:.6f} V\", f\"{nb} bit: max_code = {emc}, lsb = {ur / emc:.6f} V\")\n    check(r == er and approx(u, er * ur / emc), f\"{t} = {er} → {er * ur / emc:.4f} V\", f\"{t} = {er} → {er * ur / emc:.4f} V\")\n    check(v is (0 <= er <= emc) and approx(p, round(er / emc * 100, 1)), f\"valid = {0 <= er <= emc}, {round(er / emc * 100, 1)} %\", f\"valid = {0 <= er <= emc}, {round(er / emc * 100, 1)} %\")\n", "stdin": "0x9C4\n", "require": ["cast"], "refs": ["5.5", "5.5i", "5.2e"], "forbid": [], "topics": []}, {"id": "k5-ean8", "ch": "5", "lvl": 3, "title": {"de": "EAN-8-Prüfziffer", "en": "EAN-8 check digit"}, "task": {"de": "Ein EAN-8-Strichcode besteht aus 8 Ziffern; die letzte ist eine Prüfziffer. Sie berechnet sich aus den ersten sieben Ziffern $d_0 \\ldots d_6$: Gewichtete Summe $s = 3(d_0 + d_2 + d_4 + d_6) + (d_1 + d_3 + d_5)$, Prüfziffer = `(10 - s % 10) % 10`.\n\nLesen Sie den Code als Text ein. `list(code)` liefert die Liste der Zeichen; wandeln Sie die benötigten Zeichen per Indexzugriff mit `int()` in Ziffern um. Bestimmen Sie\n- `digits`: die Liste der 8 Zeichen\n- `weighted`: die gewichtete Summe s\n- `check_digit`: die berechnete Prüfziffer\n- `valid`: ob sie mit der letzten Ziffer des Codes übereinstimmt", "en": "An EAN-8 barcode consists of 8 digits; the last one is a check digit. It is computed from the first seven digits $d_0 \\ldots d_6$: weighted sum $s = 3(d_0 + d_2 + d_4 + d_6) + (d_1 + d_3 + d_5)$, check digit = `(10 - s % 10) % 10`.\n\nRead the code as text. `list(code)` gives the list of characters; convert the required characters into digits via indexing and `int()`. Determine\n- `digits`: the list of the 8 characters\n- `weighted`: the weighted sum s\n- `check_digit`: the computed check digit\n- `valid`: whether it matches the last digit of the code"}, "starter": {"de": "# EAN-8-Code einlesen\n", "en": "# read the EAN-8 code\n"}, "solution": "code = input(\"EAN-8: \")\ndigits = list(code)\nweighted = 3 * (int(digits[0]) + int(digits[2]) + int(digits[4]) + int(digits[6])) + int(digits[1]) + int(digits[3]) + int(digits[5])\ncheck_digit = (10 - weighted % 10) % 10\nvalid = check_digit == int(digits[7])\nprint(weighted, check_digit, valid)\n", "tests": "\ndef ref(code):\n    d = [int(c) for c in code]\n    s = 3 * (d[0] + d[2] + d[4] + d[6]) + d[1] + d[3] + d[5]\n    return s, (10 - s % 10) % 10\nfor c in [\"96385074\", \"40170725\", \"12345670\", \"96385075\", \"00000000\"]:\n    ns, out = run(inputs=[c])\n    dg, w, cd, v = need(ns, \"digits\", \"weighted\", \"check_digit\", \"valid\")\n    es, ec = ref(c)\n    check(dg == list(c), f\"digits = {list(c)}\", f\"digits = {list(c)}\")\n    check(w == es and cd == ec, f\"{c}: gewichtete Summe {es}, Prüfziffer {ec}\", f\"{c}: weighted sum {es}, check digit {ec}\")\n    check(v is (ec == int(c[7])), f\"valid = {ec == int(c[7])}\", f\"valid = {ec == int(c[7])}\")\n", "stdin": "96385074\n", "require": ["index", "cast"], "forbid": ["for", "while"], "refs": ["5.3", "5.2e"], "topics": []}, {"id": "k5-statusword", "ch": "5", "lvl": 3, "title": {"de": "Statuswort einer SPS auswerten", "en": "Decoding a PLC status word"}, "task": {"de": "Eine SPS meldet den Zustand eines Antriebs als Statuswort, das hexadezimal angezeigt wird (z.B. `0x2D`). Jedes Bit hat eine Bedeutung:\n- Bit 0: bereit\n- Bit 2: Motor läuft\n- Bit 3: Warnung\n- Bit 5: Störung\n\nBit k einer Zahl x erhält man **ohne Bit-Operatoren** mit `(x // 2**k) % 2` – machen Sie sich klar, warum. Lesen Sie das Statuswort ein, speichern Sie es als Zahl in `status` und die Bits als Zahlen 0/1 in `ready`, `running`, `warning`, `fault`. Speichern Sie außerdem `bits` (Binärdarstellung als String) und `ok` = bereit und nicht gestört.", "en": "A PLC reports the state of a drive as a status word shown in hexadecimal (e.g. `0x2D`). Each bit has a meaning:\n- bit 0: ready\n- bit 2: motor running\n- bit 3: warning\n- bit 5: fault\n\nYou get bit k of a number x **without bitwise operators** via `(x // 2**k) % 2` – make sure you understand why. Read the status word, store it as a number in `status` and the bits as numbers 0/1 in `ready`, `running`, `warning`, `fault`. Also store `bits` (binary representation as a string) and `ok` = ready and not faulty."}, "starter": {"de": "# Statuswort einlesen (hexadezimal)\n", "en": "# read the status word (hexadecimal)\n"}, "solution": "status = int(input(\"Statuswort (hex): \"), 16)\nbits = bin(status)\nready = (status // 2**0) % 2\nrunning = (status // 2**2) % 2\nwarning = (status // 2**3) % 2\nfault = (status // 2**5) % 2\nok = ready == 1 and fault == 0\nprint(bits, ready, running, warning, fault, ok)\n", "tests": "\nfor t in [\"0x2D\", \"0x05\", \"0x0\", \"0xFF\", \"0x21\", \"0x08\", \"0x61\", \"0x44\"]:\n    ns, out = run(inputs=[t])\n    s, b, r, ru, w, f, ok = need(ns, \"status\", \"bits\", \"ready\", \"running\", \"warning\", \"fault\", \"ok\")\n    x = int(t, 16); e = [(x >> k) & 1 for k in (0, 2, 3, 5)]\n    check(s == x and b == bin(x), f\"{t} = {x} = {bin(x)}\", f\"{t} = {x} = {bin(x)}\")\n    check([r, ru, w, f] == e, f\"bereit/läuft/Warnung/Störung = {e}\", f\"ready/running/warning/fault = {e}\")\n    check(ok is (e[0] == 1 and e[3] == 0), f\"ok = {e[0] == 1 and e[3] == 0}\", f\"ok = {e[0] == 1 and e[3] == 0}\")\n", "stdin": "0x2D\n", "require": ["numsys"], "forbid": ["if", "bitops"], "refs": ["5.5i", "4.2"], "topics": []}, {"id": "k5-lowpass", "ch": "5", "lvl": 3, "title": {"de": "RC-Tiefpass", "en": "RC low-pass filter"}, "task": {"de": "Ein RC-Tiefpass aus `R` (Ω) und `C` (F) dämpft hohe Frequenzen. Mit `pi = 3.14159` und Wurzeln über `** 0.5` gilt:\n- Grenzfrequenz $f_g = \\dfrac{1}{2\\pi R C}$\n- Verstärkung bei der Frequenz f: $A = \\dfrac{1}{\\sqrt{1 + (f/f_g)^2}}$\n\nLesen Sie die Signalfrequenz `f` (Hz, Kommazahl) und die Eingangsamplitude `U_in` (V) ein. Bestimmen Sie `f_g`, `gain`, die Ausgangsamplitude `U_out` und `passband`: ob die Verstärkung mindestens $1/\\sqrt{2}$ beträgt (dann liegt f im Durchlassbereich). Geben Sie `f_g` auf eine und `U_out` auf drei Nachkommastellen aus.", "en": "An RC low-pass filter made of `R` (Ω) and `C` (F) attenuates high frequencies. With `pi = 3.14159` and roots via `** 0.5`:\n- cut-off frequency $f_g = \\dfrac{1}{2\\pi R C}$\n- gain at frequency f: $A = \\dfrac{1}{\\sqrt{1 + (f/f_g)^2}}$\n\nRead the signal frequency `f` (Hz, decimal number) and the input amplitude `U_in` (V). Determine `f_g` (the cut-off frequency), `gain`, the output amplitude `U_out` and `passband`: whether the gain is at least $1/\\sqrt{2}$ (then f lies in the pass band). Print `f_g` with one and `U_out` with three decimals."}, "starter": {"de": "pi = 3.14159\nR = 1000.0     # Ohm\nC = 100e-9     # F\n\n# Frequenz und Amplitude einlesen\n", "en": "pi = 3.14159\nR = 1000.0     # Ohm\nC = 100e-9     # F\n\n# read frequency and amplitude\n"}, "solution": "pi = 3.14159\nR = 1000.0\nC = 100e-9\nf = float(input(\"Frequenz in Hz: \"))\nU_in = float(input(\"Amplitude in V: \"))\nf_g = 1 / (2 * pi * R * C)\ngain = 1 / (1 + (f / f_g)**2) ** 0.5\nU_out = gain * U_in\npassband = gain >= 1 / 2**0.5\nprint(f\"f_g = {f_g:.1f} Hz, U_out = {U_out:.3f} V, Durchlassbereich: {passband}\")\n", "tests": "\nP = 3.14159\nfor f, u, R, C in [(\"1000\", \"5\", 1000.0, 100e-9), (\"50000\", \"2.5\", 1000.0, 100e-9), (\"1591.55\", \"1\", 1000.0, 100e-9), (\"1860\", \"1\", 1000.0, 100e-9), (\"10\", \"10\", 10000.0, 1e-6)]:\n    ns, out = run(inputs=[f, u], sub={\"R\": R, \"C\": C})\n    fg, g, uo, pb = need(ns, \"f_g\", \"gain\", \"U_out\", \"passband\")\n    efg = 1 / (2 * P * R * C); eg = 1 / (1 + (float(f) / efg)**2) ** 0.5\n    check(approx(fg, efg), f\"R = {R:g} Ω, C = {C:g} F: f_g = {efg:.2f} Hz\", f\"R = {R:g} Ω, C = {C:g} F: f_g = {efg:.2f} Hz\")\n    check(approx(g, eg) and approx(uo, eg * float(u)), f\"f = {f} Hz: A = {eg:.4f}, U_out = {eg * float(u):.3f} V\", f\"f = {f} Hz: A = {eg:.4f}, U_out = {eg * float(u):.3f} V\")\n    check(pb is (eg >= 1 / 2**0.5), f\"passband = {eg >= 1 / 2**0.5}\", f\"passband = {eg >= 1 / 2**0.5}\")\n", "stdin": "1000\n5\n", "require": ["cast"], "refs": ["5.2e", "4.2"], "forbid": [], "topics": []}, {"id": "k6-breaker", "ch": "6", "lvl": 1, "title": {"de": "Leitungsschutzschalter", "en": "Circuit breaker"}, "task": {"de": "Ein Leitungsschutzschalter mit dem Nennstrom `I_n` reagiert (vereinfacht) je nach Verhältnis $r = I / I_n$ unterschiedlich. Lesen Sie den Strom `I` in A ein und speichern Sie die Stufe als Zahl in `stage`:\n- $r \\le 1$: Stufe 0, Meldung `normal`\n- $1 < r \\le 1.45$: Stufe 1, `Überlast – Auslösung nach Minuten`\n- $1.45 < r \\le 5$: Stufe 2, `Überlast – Auslösung nach Sekunden`\n- $r > 5$: Stufe 3, `Kurzschluss – sofortige Auslösung`\n\nGeben Sie die passende Meldung aus.", "en": "A circuit breaker with rated current `I_n` reacts (simplified) depending on the ratio $r = I / I_n$. Read the current `I` in A and store the stage as a number in `stage`:\n- $r \\le 1$: stage 0, message `normal`\n- $1 < r \\le 1.45$: stage 1, `Overload – trips after minutes`\n- $1.45 < r \\le 5$: stage 2, `Overload – trips after seconds`\n- $r > 5$: stage 3, `Short circuit – trips instantly`\n\nPrint the matching message."}, "starter": {"de": "I_n = 16.0  # A\nI = float(input(\"Strom in A: \"))\n\n# Ihr Code:\n", "en": "I_n = 16.0  # A\nI = float(input(\"Current in A: \"))\n\n# your code:\n"}, "solution": "I_n = 16.0\nI = float(input(\"Strom in A: \"))\nr = I / I_n\nif r <= 1:\n    stage = 0\n    print(\"normal\")\nelif r <= 1.45:\n    stage = 1\n    print(\"Überlast – Auslösung nach Minuten\")\nelif r <= 5:\n    stage = 2\n    print(\"Überlast – Auslösung nach Sekunden\")\nelse:\n    stage = 3\n    print(\"Kurzschluss – sofortige Auslösung\")\n", "tests": "\ndef exp(r):\n    return 0 if r <= 1 else 1 if r <= 1.45 else 2 if r <= 5 else 3\nfor I in [10.0, 16.0, 16.5, 23.2, 23.5, 80.0, 81.0, 300.0]:\n    ns, out = run(inputs=[str(I)])\n    check(need(ns, \"stage\") == exp(I / 16), f\"I = {I} A bei I_n = 16 A: Stufe {exp(I / 16)}\", f\"I = {I} A with I_n = 16 A: stage {exp(I / 16)}\")\nns, out = run(inputs=[\"30\"], sub={\"I_n\": 10.0})\ncheck(ns.get(\"stage\") == 2, \"Mit I_n = 10 A und I = 30 A: Stufe 2 (I_n wird verwendet, nicht 16 fest eingetippt)\", \"With I_n = 10 A and I = 30 A: stage 2 (I_n is used, not a hard-coded 16)\")\no = out.lower()\ncheck(\"sekund\" in o or \"second\" in o, \"Für Stufe 2 wird die passende Meldung ausgegeben\", \"The matching message is printed for stage 2\")\n", "stdin": "20\n", "require": ["if"], "refs": ["6.1b"], "forbid": [], "topics": []}, {"id": "k6-rms", "ch": "6", "lvl": 1, "title": {"de": "Effektivwert einer Wechselspannung", "en": "RMS value of an AC voltage"}, "task": {"de": "Für Wechselspannungen ist der Effektivwert wichtig: $U_\\mathrm{eff} = \\sqrt{\\dfrac{u_1^2 + u_2^2 + \\dots + u_n^2}{n}}$. Berechnen Sie mit einer `for`-Schleife die Summe der Quadrate `sum_sq` der Abtastwerte `samples` und daraus `u_rms` (Wurzel mit `** 0.5`). Verwenden Sie **nicht** `sum()` – die Schleife ist hier das Ziel. Geben Sie `u_rms` mit einer Nachkommastelle aus.\n\nZur Kontrolle: Bei einer Sinusspannung ist $U_\\mathrm{eff} \\approx \\hat{U} / \\sqrt{2}$, für $\\hat{U} = 325\\,\\mathrm{V}$ also etwa 230 V.", "en": "For AC voltages, the RMS value matters: $U_\\mathrm{rms} = \\sqrt{\\dfrac{u_1^2 + u_2^2 + \\dots + u_n^2}{n}}$. Use a `for` loop to compute the sum of squares `sum_sq` of the samples `samples`, and from it `u_rms` (root with `** 0.5`). Do **not** use `sum()` – the loop is the point here. Print `u_rms` with one decimal.\n\nCheck: for a sine voltage, $U_\\mathrm{rms} \\approx \\hat{U} / \\sqrt{2}$, i.e. about 230 V for $\\hat{U} = 325\\,\\mathrm{V}$."}, "starter": {"de": "samples = [0.0, 229.8, 325.0, 229.8, 0.0, -229.8, -325.0, -229.8]  # V\nsum_sq = 0\n\n# Ihr Code:\n", "en": "samples = [0.0, 229.8, 325.0, 229.8, 0.0, -229.8, -325.0, -229.8]  # V\nsum_sq = 0\n\n# your code:\n"}, "solution": "samples = [0.0, 229.8, 325.0, 229.8, 0.0, -229.8, -325.0, -229.8]\nsum_sq = 0\nfor u in samples:\n    sum_sq += u**2\nu_rms = (sum_sq / len(samples)) ** 0.5\nprint(f\"U_eff = {u_rms:.1f} V\")\n", "tests": "\nfor s in [[0.0, 229.8, 325.0, 229.8, 0.0, -229.8, -325.0, -229.8], [12.0, -12.0], [3.0, 4.0, 0.0, 5.0]]:\n    ns, out = run(sub={\"samples\": s})\n    sq, r = need(ns, \"sum_sq\", \"u_rms\")\n    esq = sum(x * x for x in s); er = (esq / len(s)) ** 0.5\n    check(approx(sq, esq), f\"Summe der Quadrate = {esq:g}\", f\"sum of squares = {esq:g}\")\n    check(approx(r, er), f\"U_eff ≈ {er:.2f} V\", f\"U_rms ≈ {er:.2f} V\")\n    check(f\"{er:.1f}\" in out, f\"Ausgabe zeigt {er:.1f}\", f\"Output shows {er:.1f}\")\n", "require": ["for"], "forbid": ["seqfuncs"], "refs": ["6.2b"], "stdin": "", "topics": []}, {"id": "k6-divider", "ch": "6", "lvl": 1, "title": {"de": "Spannungsteiler-Tabelle", "en": "Voltage divider table"}, "task": {"de": "Ein Spannungsteiler aus `R1` und einem veränderlichen `R2` liegt an der Spannung `U`. Durchlaufen Sie mit einer `for`-Schleife und `range()` die Werte R2 = 100, 200, …, 1000 Ω. Berechnen Sie jeweils $U_2 = U \\cdot \\dfrac{R_2}{R_1 + R_2}$, hängen Sie den Wert an die Liste `u2_values` an und geben Sie eine Zeile wie `R2 = 100 Ohm: U2 = 0.83 V` aus (U2 mit zwei Nachkommastellen).", "en": "A voltage divider made of `R1` and a variable `R2` is connected to voltage `U`. Use a `for` loop and `range()` to go through R2 = 100, 200, …, 1000 Ω. For each, compute $U_2 = U \\cdot \\dfrac{R_2}{R_1 + R_2}$, append the value to the list `u2_values` and print a line like `R2 = 100 Ohm: U2 = 0.83 V` (U2 with two decimals)."}, "starter": {"de": "U = 5.0     # V\nR1 = 500.0  # Ohm\nu2_values = []\n\n# Ihr Code:\n", "en": "U = 5.0     # V\nR1 = 500.0  # Ohm\nu2_values = []\n\n# your code:\n"}, "solution": "U = 5.0\nR1 = 500.0\nu2_values = []\nfor R2 in range(100, 1001, 100):\n    U2 = U * R2 / (R1 + R2)\n    u2_values.append(U2)\n    print(f\"R2 = {R2} Ohm: U2 = {U2:.2f} V\")\n", "tests": "\nfor U, R1 in [(5.0, 500.0), (12.0, 1000.0)]:\n    ns, out = run(sub={\"U\": U, \"R1\": R1})\n    v = need(ns, \"u2_values\")\n    e = [U * r / (R1 + r) for r in range(100, 1001, 100)]\n    check(len(v) == 10 and all(approx(a, b) for a, b in zip(v, e)), f\"u2_values für U = {U} V, R1 = {R1} Ω (10 Werte)\", f\"u2_values for U = {U} V, R1 = {R1} Ω (10 values)\")\n    check(f\"{e[0]:.2f}\" in out and f\"{e[-1]:.2f}\" in out and out.count(\"\\n\") >= 10, \"Für jedes R2 wird eine Zeile ausgegeben\", \"One line is printed for every R2\")\n", "require": ["for", "range"], "refs": ["6.2b"], "forbid": [], "stdin": "", "topics": []}, {"id": "k6-battery", "ch": "6", "lvl": 1, "title": {"de": "Akkuanzeige", "en": "Battery indicator"}, "task": {"de": "Lesen Sie den Ladezustand eines Akkus in Prozent ein (ganze Zahl) und geben Sie aus:\n- unter 5: `kritisch`\n- 5 bis unter 20: `niedrig`\n- 20 bis unter 80: `ok`\n- ab 80: `voll`\n- Werte unter 0 oder über 100: `ungültig`\n\nAchten Sie auf die Reihenfolge der Bedingungen.", "en": "Read a battery's state of charge in percent (integer) and print:\n- below 5: `critical`\n- 5 to below 20: `low`\n- 20 to below 80: `ok`\n- 80 or more: `full`\n- values below 0 or above 100: `invalid`\n\nMind the order of the conditions."}, "starter": {"de": "soc = int(input(\"Ladezustand in %: \"))\n\n# Ihr Code:\n", "en": "soc = int(input(\"State of charge in %: \"))\n\n# your code:\n"}, "solution": "soc = int(input(\"Ladezustand in %: \"))\nif soc < 0 or soc > 100:\n    print(\"ungültig\")\nelif soc < 5:\n    print(\"kritisch\")\nelif soc < 20:\n    print(\"niedrig\")\nelif soc < 80:\n    print(\"ok\")\nelse:\n    print(\"voll\")\n", "tests": "\nwords = {\"ungültig\": \"invalid\", \"kritisch\": \"critical\", \"niedrig\": \"low\", \"ok\": \"ok\", \"voll\": \"full\"}\ndef exp(s):\n    return \"ungültig\" if s < 0 or s > 100 else \"kritisch\" if s < 5 else \"niedrig\" if s < 20 else \"ok\" if s < 80 else \"voll\"\nfor s in [-3, 0, 4, 5, 19, 20, 79, 80, 100, 101]:\n    ns, out = run(inputs=[str(s)])\n    o = (out.split(\"\\n\", 1)[1] if \"\\n\" in out else out).lower()\n    e = exp(s)\n    found = [w for w in words if w in o or words[w] in o]\n    check(found == [e], f\"{s} %: genau die Meldung '{e}'\", f\"{s} %: exactly the message '{words[e]}'\")\n", "stdin": "57\n", "require": ["if"], "refs": ["6.1b"], "forbid": [], "topics": []}, {"id": "k6-count", "ch": "6", "lvl": 1, "title": {"de": "Grenzwertüberschreitungen zählen", "en": "Counting limit violations"}, "task": {"de": "Zählen Sie mit einer `for`-Schleife, wie viele Werte in `noise_db` (Lärmpegel in dB) über dem Grenzwert `limit` liegen (`n_over`), und sammeln Sie diese Werte in der Liste `over`. Geben Sie anschließend den Anteil der Überschreitungen in Prozent aus (`share`, auf eine Nachkommastelle gerundet).", "en": "Use a `for` loop to count how many values in `noise_db` (noise levels in dB) are above the limit `limit` (`n_over`), and collect those values in the list `over`. Then compute the share of violations in percent (`share`, rounded to one decimal)."}, "starter": {"de": "noise_db = [62.5, 71.0, 85.3, 68.2, 90.1, 79.9, 80.0, 84.7]\nlimit = 80.0\nn_over = 0\nover = []\n\n# Ihr Code:\n", "en": "noise_db = [62.5, 71.0, 85.3, 68.2, 90.1, 79.9, 80.0, 84.7]\nlimit = 80.0\nn_over = 0\nover = []\n\n# your code:\n"}, "solution": "noise_db = [62.5, 71.0, 85.3, 68.2, 90.1, 79.9, 80.0, 84.7]\nlimit = 80.0\nn_over = 0\nover = []\nfor level in noise_db:\n    if level > limit:\n        n_over += 1\n        over.append(level)\nshare = round(n_over / len(noise_db) * 100, 1)\nprint(n_over, over, share)\n", "tests": "\nfor d, lim in [([62.5, 71.0, 85.3, 68.2, 90.1, 79.9, 80.0, 84.7], 80.0), ([50.0, 55.0], 60.0), ([90.0, 91.0, 70.0], 85.0)]:\n    ns, out = run(sub={\"noise_db\": d, \"limit\": lim})\n    n, o, s = need(ns, \"n_over\", \"over\", \"share\")\n    eo = [x for x in d if x > lim]\n    check(n == len(eo) and o == eo, f\"Grenzwert {lim} dB: {len(eo)} Überschreitungen {eo}\", f\"limit {lim} dB: {len(eo)} violations {eo}\")\n    check(approx(s, round(len(eo) / len(d) * 100, 1)), f\"Anteil = {round(len(eo)/len(d)*100, 1)} %\", f\"share = {round(len(eo)/len(d)*100, 1)} %\")\n", "require": ["for", "if"], "refs": ["6.2b", "6.1a"], "forbid": [], "stdin": "", "topics": []}, {"id": "k6-pallet", "ch": "6", "lvl": 1, "title": {"de": "Palette beladen", "en": "Loading a pallet"}, "task": {"de": "Die Kisten aus der Liste `boxes` (Gewichte in kg) sollen auf eine Palette geladen werden. Addieren Sie die Gewichte mit einer `for`-Schleife zu `total` auf (ohne `sum()`). Die Palette trägt höchstens `max_load` kg: Speichern Sie in `overloaded`, ob sie überladen ist, und geben Sie mit `if`/`else` entweder `Überladen um 12.5 kg` oder `Noch 30.0 kg frei` aus (eine Nachkommastelle).", "en": "The boxes from the list `boxes` (weights in kg) are to be loaded onto a pallet. Add up the weights with a `for` loop into `total` (without `sum()`). The pallet carries at most `max_load` kg: store in `overloaded` whether it is overloaded and use `if`/`else` to print either `Overloaded by 12.5 kg` or `30.0 kg left` (one decimal)."}, "starter": {"de": "boxes = [120.5, 98.0, 210.0, 156.5, 85.0]  # kg\nmax_load = 700.0\n\n# Ihr Code:\n", "en": "boxes = [120.5, 98.0, 210.0, 156.5, 85.0]  # kg\nmax_load = 700.0\n\n# your code:\n"}, "solution": "boxes = [120.5, 98.0, 210.0, 156.5, 85.0]\nmax_load = 700.0\ntotal = 0\nfor b in boxes:\n    total += b\noverloaded = total > max_load\nif overloaded:\n    print(f\"Überladen um {total - max_load:.1f} kg\")\nelse:\n    print(f\"Noch {max_load - total:.1f} kg frei\")\n", "tests": "\nfor b, m in [([120.5, 98.0, 210.0, 156.5, 85.0], 700.0), ([300.0, 450.0], 700.0), ([10.0], 10.0)]:\n    ns, out = run(sub={\"boxes\": b, \"max_load\": m})\n    t, o = need(ns, \"total\", \"overloaded\")\n    e = 0\n    for x in b:\n        e += x\n    check(approx(t, e), f\"Gesamtgewicht {e:g} kg\", f\"total weigh
