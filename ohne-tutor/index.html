pprox(method(p, \"volume_l\"), A * L * 1000), f\"DN {d:g}, {L} m: A = {A:.6f} m², V = {A * L * 1000:.3f} l\", f\"DN {d:g}, {L} m: A = {A:.6f} m², V = {A * L * 1000:.3f} l\")\n    check(approx(method(p, \"velocity\", q), q / 1000 / A) and approx(method(p, \"fill_time\", q), A * L * 1000 / q), f\"Q = {q} l/s: v = {q / 1000 / A:.3f} m/s, Füllzeit {A * L * 1000 / q:.2f} s\", f\"Q = {q} l/s: v = {q / 1000 / A:.3f} m/s, fill time {A * L * 1000 / q:.2f} s\")\n", "require": ["class"], "refs": ["10.3", "10.2"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-sensor", "ch": "10", "lvl": 2, "title": {"de": "Vererbung: Sensoren", "en": "Inheritance: sensors"}, "task": {"de": "Basisklasse `Sensor(name)` mit Attributen `name` und `values` (leere Liste), Methoden `add(value)` und `mean()` (Mittelwert, bei leerer Liste `None`).\n\nAbgeleitete Klasse `TemperatureSensor(name, unit=\"C\")`: ruft mit `super().__init__(name)` den Basiskonstruktor auf, speichert `unit` und hat die Methode `mean_fahrenheit()`, die den Mittelwert in °F liefert (bei unit `\"C\"`). Ist `unit` schon `\"F\"`, wird der Mittelwert unverändert zurückgegeben.", "en": "Base class `Sensor(name)` with attributes `name` and `values` (empty list), methods `add(value)` and `mean()` (mean, `None` for an empty list).\n\nDerived class `TemperatureSensor(name, unit=\"C\")`: calls the base constructor with `super().__init__(name)`, stores `unit` and has the method `mean_fahrenheit()` returning the mean in °F (for unit `\"C\"`). If `unit` is already `\"F\"`, the mean is returned unchanged."}, "starter": {"de": "class Sensor:\n    def __init__(self, name):\n        ...\n\nclass TemperatureSensor(Sensor):\n    ...\n", "en": "class Sensor:\n    def __init__(self, name):\n        ...\n\nclass TemperatureSensor(Sensor):\n    ...\n"}, "solution": "class Sensor:\n    def __init__(self, name):\n        self.name = name\n        self.values = []\n\n    def add(self, value):\n        self.values.append(value)\n\n    def mean(self):\n        if len(self.values) == 0:\n            return None\n        return sum(self.values) / len(self.values)\n\n\nclass TemperatureSensor(Sensor):\n    def __init__(self, name, unit=\"C\"):\n        super().__init__(name)\n        self.unit = unit\n\n    def mean_fahrenheit(self):\n        m = self.mean()\n        if m is None or self.unit == \"F\":\n            return m\n        return m * 9 / 5 + 32\n\nt = TemperatureSensor(\"T1\")\nt.add(20.0)\nt.add(22.0)\nprint(t.mean(), t.mean_fahrenheit())\n", "tests": "\nns, out = run()\ns = call(ns, \"Sensor\", \"S1\")\ncheck(getattr(s, \"name\", None) == \"S1\" and getattr(s, \"values\", None) == [], \"Sensor hat name und leere values\", \"Sensor has name and empty values\")\ncheck(method(s, \"mean\") is None, \"mean() einer leeren Messreihe ist None\", \"mean() of an empty series is None\")\nmethod(s, \"add\", 2.0); method(s, \"add\", 4.0)\ncheck(approx(method(s, \"mean\"), 3.0), \"mean() nach add(2), add(4) = 3.0\", \"mean() after add(2), add(4) = 3.0\")\nt = call(ns, \"TemperatureSensor\", \"T1\")\ncheck(isinstance(t, ns[\"Sensor\"]), \"TemperatureSensor erbt von Sensor\", \"TemperatureSensor inherits from Sensor\")\ncheck(getattr(t, \"name\", None) == \"T1\" and getattr(t, \"values\", None) == [] and getattr(t, \"unit\", None) == \"C\", \"Konstruktor setzt name, values und unit\", \"Constructor sets name, values and unit\")\nmethod(t, \"add\", 20.0); method(t, \"add\", 22.0)\ncheck(approx(method(t, \"mean_fahrenheit\"), 69.8), \"mean_fahrenheit() = 69.8 °F für 21 °C\", \"mean_fahrenheit() = 69.8 °F for 21 °C\")\nf = call(ns, \"TemperatureSensor\", \"T2\", unit=\"F\")\nmethod(f, \"add\", 50.0)\ncheck(approx(method(f, \"mean_fahrenheit\"), 50.0), \"Bei unit='F' bleibt der Wert unverändert\", \"With unit='F' the value stays unchanged\")\n", "require": ["class", "super"], "refs": ["10.3", "10.5"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-tank", "ch": "10", "lvl": 2, "title": {"de": "Kapselung: Wassertank", "en": "Encapsulation: water tank"}, "task": {"de": "Klasse `Tank(capacity)` mit dem **protected** Attribut `_level` (Startwert 0).\n- `get_level()` gibt den Füllstand zurück.\n- `fill(amount)` füllt auf, höchstens bis `capacity`, und gibt die **übergelaufene** Menge zurück (0, wenn nichts überläuft).\n- `set_level(value)` setzt den Füllstand nur, wenn `0 <= value <= capacity`, und gibt `True`/`False` zurück, je nachdem ob gesetzt wurde.", "en": "Class `Tank(capacity)` with the **protected** attribute `_level` (initial value 0).\n- `get_level()` returns the level.\n- `fill(amount)` fills up, at most to `capacity`, and returns the **overflowing** amount (0 if nothing overflows).\n- `set_level(value)` sets the level only if `0 <= value <= capacity` and returns `True`/`False` depending on whether it was set."}, "starter": {"de": "class Tank:\n    def __init__(self, capacity):\n        ...\n", "en": "class Tank:\n    def __init__(self, capacity):\n        ...\n"}, "solution": "class Tank:\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self._level = 0\n\n    def get_level(self):\n        return self._level\n\n    def fill(self, amount):\n        self._level += amount\n        overflow = 0\n        if self._level > self.capacity:\n            overflow = self._level - self.capacity\n            self._level = self.capacity\n        return overflow\n\n    def set_level(self, value):\n        if 0 <= value <= self.capacity:\n            self._level = value\n            return True\n        return False\n\ntank = Tank(80)\nprint(tank.fill(50), tank.fill(50), tank.get_level())\n", "tests": "\nns, out = run()\nt = call(ns, \"Tank\", 80)\ncheck(hasattr(t, \"_level\") and method(t, \"get_level\") == 0, \"Neuer Tank: _level = 0\", \"New tank: _level = 0\")\ncheck(approx(method(t, \"fill\", 50), 0) and approx(method(t, \"get_level\"), 50), \"fill(50) → kein Überlauf, Füllstand 50\", \"fill(50) → no overflow, level 50\")\ncheck(approx(method(t, \"fill\", 50), 20) and approx(method(t, \"get_level\"), 80), \"fill(50) → 20 laufen über, Füllstand 80\", \"fill(50) → 20 overflow, level 80\")\ncheck(method(t, \"set_level\", 100) is False and approx(method(t, \"get_level\"), 80), \"set_level(100) wird abgelehnt\", \"set_level(100) is rejected\")\ncheck(method(t, \"set_level\", -1) is False, \"set_level(-1) wird abgelehnt\", \"set_level(-1) is rejected\")\ncheck(method(t, \"set_level\", 30) is True and approx(method(t, \"get_level\"), 30), \"set_level(30) setzt den Füllstand\", \"set_level(30) sets the level\")\ncheck(method(t, \"set_level\", 0) is True and method(t, \"set_level\", 80) is True and approx(method(t, \"get_level\"), 80), \"Die Grenzen 0 und capacity sind erlaubt\", \"The limits 0 and capacity are allowed\")\n", "require": ["class"], "refs": ["10.6", "10.6g"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-beams", "ch": "10", "lvl": 2, "title": {"de": "Profile und Polymorphie", "en": "Profiles and polymorphism"}, "task": {"de": "Basisklasse `Profile(length)` (Länge in m) mit der Methode `weight(rho=7850)`: Masse in kg = Querschnittsfläche (m²) · Länge · Dichte. Die Fläche liefert die Methode `area()`, die in der Basisklasse `0` zurückgibt.\n\nAbgeleitete Klassen (Konstruktor mit `super().__init__(length)`), Maße in mm:\n- `RectProfile(length, b, h)`: Rechteck-Vollprofil\n- `TubeProfile(length, d_out, d_in)`: Rundrohr, $A = \\frac{\\pi}{4}(D^2 - d^2)$\n\nBeide überschreiben nur `area()` (Ergebnis in m²!). `weight()` wird **nicht** überschrieben.", "en": "Base class `Profile(length)` (length in m) with the method `weight(rho=7850)`: mass in kg = cross-sectional area (m²) · length · density. The area comes from the method `area()`, which returns `0` in the base class.\n\nDerived classes (constructor with `super().__init__(length)`), dimensions in mm:\n- `RectProfile(length, b, h)`: solid rectangular profile\n- `TubeProfile(length, d_out, d_in)`: round tube, $A = \\frac{\\pi}{4}(D^2 - d^2)$\n\nBoth override only `area()` (result in m²!). `weight()` is **not** overridden."}, "starter": {"de": "import math\n\nclass Profile:\n    def __init__(self, length):\n        self.length = length\n", "en": "import math\n\nclass Profile:\n    def __init__(self, length):\n        self.length = length\n"}, "solution": "import math\n\nclass Profile:\n    def __init__(self, length):\n        self.length = length\n\n    def area(self):\n        return 0\n\n    def weight(self, rho=7850):\n        return self.area() * self.length * rho\n\n\nclass RectProfile(Profile):\n    def __init__(self, length, b, h):\n        super().__init__(length)\n        self.b = b\n        self.h = h\n\n    def area(self):\n        return self.b * self.h / 1e6\n\n\nclass TubeProfile(Profile):\n    def __init__(self, length, d_out, d_in):\n        super().__init__(length)\n        self.d_out = d_out\n        self.d_in = d_in\n\n    def area(self):\n        return math.pi / 4 * (self.d_out**2 - self.d_in**2) / 1e6\n\nfor p in [RectProfile(2.0, 40, 20), TubeProfile(2.0, 48.3, 40.3)]:\n    print(type(p).__name__, round(p.weight(), 2), \"kg\")\n", "tests": "\nimport math as _m\nns, out = run()\nr = call(ns, \"RectProfile\", 2.0, 40, 20)\nt = call(ns, \"TubeProfile\", 3.0, 48.3, 40.3)\ncheck(isinstance(r, ns[\"Profile\"]) and isinstance(t, ns[\"Profile\"]), \"Beide Klassen erben von Profile\", \"Both classes inherit from Profile\")\ncheck(getattr(r, \"length\", None) == 2.0 and getattr(t, \"length\", None) == 3.0, \"length wird über super().__init__ gesetzt\", \"length is set via super().__init__\")\ncheck(approx(method(r, \"area\"), 0.0008) and approx(method(r, \"weight\"), 0.0008 * 2 * 7850), \"Rechteck 40×20, 2 m: 12.56 kg\", \"Rectangle 40×20, 2 m: 12.56 kg\")\neA = _m.pi / 4 * (48.3**2 - 40.3**2) / 1e6\ncheck(approx(method(t, \"area\"), eA) and approx(method(t, \"weight\"), eA * 3 * 7850), f\"Rohr 48.3×4, 3 m: {eA*3*7850:.2f} kg\", f\"Tube 48.3×4, 3 m: {eA*3*7850:.2f} kg\")\ncheck(approx(method(t, \"weight\", 2700), eA * 3 * 2700), \"weight(2700) für Aluminium\", \"weight(2700) for aluminium\")\ncheck(\"weight\" not in vars(ns[\"RectProfile\"]) and \"weight\" not in vars(ns[\"TubeProfile\"]), \"weight() wird nur in der Basisklasse definiert\", \"weight() is only defined in the base class\")\n", "require": ["class", "super"], "refs": ["10.5", "10.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-inventory", "ch": "10", "lvl": 2, "title": {"de": "Lagerverwaltung mit Objekten", "en": "Inventory with objects"}, "task": {"de": "Zwei Klassen:\n- `Part(number, name, price, quantity)` mit der Methode `value()` = Preis · Menge.\n- `Inventory()` mit dem Attribut `parts` (leere Liste) und den Methoden\n  - `add(part)`: fügt ein `Part` hinzu\n  - `find(number)`: gibt das `Part` mit dieser Teilenummer zurück oder `None`\n  - `total_value()`: Gesamtwert des Lagers\n  - `low_stock(limit)`: Liste der Teilenummern aller Teile mit weniger als `limit` Stück", "en": "Two classes:\n- `Part(number, name, price, quantity)` with the method `value()` = price · quantity.\n- `Inventory()` with the attribute `parts` (empty list) and the methods\n  - `add(part)`: adds a `Part`\n  - `find(number)`: returns the `Part` with this part number or `None`\n  - `total_value()`: total value of the inventory\n  - `low_stock(limit)`: list of the part numbers of all parts with fewer than `limit` pieces"}, "starter": {"de": "class Part:\n    def __init__(self, number, name, price, quantity):\n        ...\n\nclass Inventory:\n    def __init__(self):\n        ...\n", "en": "class Part:\n    def __init__(self, number, name, price, quantity):\n        ...\n\nclass Inventory:\n    def __init__(self):\n        ...\n"}, "solution": "class Part:\n    def __init__(self, number, name, price, quantity):\n        self.number = number\n        self.name = name\n        self.price = price\n        self.quantity = quantity\n\n    def value(self):\n        return self.price * self.quantity\n\n\nclass Inventory:\n    def __init__(self):\n        self.parts = []\n\n    def add(self, part):\n        self.parts.append(part)\n\n    def find(self, number):\n        for part in self.parts:\n            if part.number == number:\n                return part\n        return None\n\n    def total_value(self):\n        total = 0\n        for part in self.parts:\n            total += part.value()\n        return total\n\n    def low_stock(self, limit):\n        return [p.number for p in self.parts if p.quantity < limit]\n\ninv = Inventory()\ninv.add(Part('M8-40', 'Schraube M8x40', 0.12, 500))\ninv.add(Part('L-6204', 'Kugellager 6204', 4.80, 6))\nprint(inv.total_value(), inv.low_stock(10))\n", "tests": "\nns, out = run()\ninv = call(ns, \"Inventory\")\ncheck(getattr(inv, \"parts\", None) == [], \"Neues Inventory hat eine leere Liste parts\", \"A new Inventory has an empty list parts\")\np1 = call(ns, \"Part\", \"M8-40\", \"Schraube M8x40\", 0.12, 500)\np2 = call(ns, \"Part\", \"L-6204\", \"Kugellager 6204\", 4.80, 6)\np3 = call(ns, \"Part\", \"D-35\", \"Dichtring\", 1.50, 9)\ncheck(approx(method(p2, \"value\"), 28.8), \"Part.value() = Preis · Menge\", \"Part.value() = price · quantity\")\nfor p in (p1, p2, p3):\n    method(inv, \"add\", p)\ncheck(method(inv, \"find\", \"L-6204\") is p2 and method(inv, \"find\", \"X-1\") is None, \"find() liefert das Objekt bzw. None\", \"find() returns the object or None\")\ncheck(approx(method(inv, \"total_value\"), 60 + 28.8 + 13.5), \"total_value() = 102.30\", \"total_value() = 102.30\")\ncheck(sorted(method(inv, \"low_stock\", 10)) == [\"D-35\", \"L-6204\"] and method(inv, \"low_stock\", 9) == [\"L-6204\"] and method(inv, \"low_stock\", 5) == [], \"low_stock(10) = ['L-6204', 'D-35'], low_stock(9) = ['L-6204'], low_stock(5) = []\", \"low_stock(10) = ['L-6204', 'D-35'], low_stock(9) = ['L-6204'], low_stock(5) = []\")\n", "require": ["class"], "refs": ["10.5", "10.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-vehicles", "ch": "10", "lvl": 2, "title": {"de": "Fahrzeuge und Vererbung", "en": "Vehicles and inheritance"}, "task": {"de": "Basisklasse `Vehicle(name, mass_kg)` mit den Methoden\n- `total_mass()`: gibt `mass_kg` zurück\n- `kinetic_energy(v_kmh)`: Bewegungsenergie $\\frac{1}{2} m v^2$ in kJ (Geschwindigkeit in km/h umrechnen!) – mit `total_mass()`\n\nAbgeleitete Klassen (Konstruktor mit `super().__init__(…)`):\n- `Truck(name, mass_kg, payload_kg)`: überschreibt `total_mass()` (Leermasse + Zuladung)\n- `ElectricCar(name, mass_kg, battery_kwh, consumption)`: zusätzliche Methode `range_km()` = `battery_kwh / consumption * 100` (Verbrauch in kWh/100 km)\n\n`kinetic_energy` wird **nur** in der Basisklasse geschrieben und funktioniert trotzdem für den Lkw mit Zuladung – warum?", "en": "Base class `Vehicle(name, mass_kg)` with the methods\n- `total_mass()`: returns `mass_kg`\n- `kinetic_energy(v_kmh)`: kinetic energy $\\frac{1}{2} m v^2$ in kJ (convert the speed from km/h!) – using `total_mass()`\n\nDerived classes (constructor with `super().__init__(…)`):\n- `Truck(name, mass_kg, payload_kg)`: overrides `total_mass()` (empty mass + payload)\n- `ElectricCar(name, mass_kg, battery_kwh, consumption)`: additional method `range_km()` = `battery_kwh / consumption * 100` (consumption in kWh/100 km)\n\n`kinetic_energy` is written **only** in the base class and still works for the truck with payload – why?"}, "starter": {"de": "class Vehicle:\n    def __init__(self, name, mass_kg):\n        ...\n", "en": "class Vehicle:\n    def __init__(self, name, mass_kg):\n        ...\n"}, "solution": "class Vehicle:\n    def __init__(self, name, mass_kg):\n        self.name = name\n        self.mass_kg = mass_kg\n\n    def total_mass(self):\n        return self.mass_kg\n\n    def kinetic_energy(self, v_kmh):\n        v = v_kmh / 3.6\n        return 0.5 * self.total_mass() * v**2 / 1000\n\n\nclass Truck(Vehicle):\n    def __init__(self, name, mass_kg, payload_kg):\n        super().__init__(name, mass_kg)\n        self.payload_kg = payload_kg\n\n    def total_mass(self):\n        return self.mass_kg + self.payload_kg\n\n\nclass ElectricCar(Vehicle):\n    def __init__(self, name, mass_kg, battery_kwh, consumption):\n        super().__init__(name, mass_kg)\n        self.battery_kwh = battery_kwh\n        self.consumption = consumption\n\n    def range_km(self):\n        return self.battery_kwh / self.consumption * 100\n\nfor v in [Truck(\"LKW\", 12000, 8000), ElectricCar(\"E-Auto\", 1800, 60, 16)]:\n    print(v.name, round(v.kinetic_energy(80), 1), \"kJ\")\n", "tests": "\nns, out = run()\nV = ns.get(\"Vehicle\")\nt = call(ns, \"Truck\", \"LKW\", 12000, 8000)\ne = call(ns, \"ElectricCar\", \"E-Auto\", 1800, 60, 16)\ncheck(isinstance(t, V) and isinstance(e, V), \"Truck und ElectricCar erben von Vehicle\", \"Truck and ElectricCar inherit from Vehicle\")\ncheck(getattr(t, \"name\", None) == \"LKW\" and getattr(t, \"mass_kg\", None) == 12000 and getattr(e, \"mass_kg\", None) == 1800, \"name und mass_kg werden über super().__init__ gesetzt\", \"name and mass_kg are set via super().__init__\")\ncheck(method(t, \"total_mass\") == 20000 and method(e, \"total_mass\") == 1800, \"total_mass: Lkw 20000 kg (mit Zuladung), E-Auto 1800 kg\", \"total_mass: truck 20000 kg (with payload), e-car 1800 kg\")\ncheck(approx(method(t, \"kinetic_energy\", 80), 0.5 * 20000 * (80 / 3.6)**2 / 1000) and approx(method(e, \"kinetic_energy\", 36), 0.5 * 1800 * 100 / 1000), \"kinetic_energy nutzt total_mass (Lkw bei 80 km/h ≈ 4938 kJ)\", \"kinetic_energy uses total_mass (truck at 80 km/h ≈ 4938 kJ)\")\ncheck(approx(method(e, \"range_km\"), 375), \"range_km() = 375 km\", \"range_km() = 375 km\")\ncheck(\"kinetic_energy\" not in vars(ns[\"Truck\"]) and \"kinetic_energy\" not in vars(ns[\"ElectricCar\"]), \"kinetic_energy steht nur in der Basisklasse\", \"kinetic_energy is only in the base class\")\n", "require": ["class", "super"], "refs": ["10.5", "10.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-setpoint", "ch": "10", "lvl": 2, "title": {"de": "Sollwert mit privatem Attribut", "en": "Setpoint with a private attribute"}, "task": {"de": "Ein Temperaturregler darf nur Sollwerte zwischen `low` und `high` annehmen. Schreiben Sie die Klasse `Setpoint(low, high, value)` mit dem **privaten** Attribut `__value` (zwei Unterstriche).\n- `get_value()`: Getter\n- `set_value(v)`: Setter mit Prüfung – liegt v außerhalb [low, high], wird der Wert auf die nächste Grenze begrenzt. Rückgabe: `True`, wenn v unverändert übernommen wurde, sonst `False`.\n- `step(delta)`: verändert den Sollwert um delta (über den Setter, also mit Begrenzung) und gibt den neuen Wert zurück.\n\nAuch der Startwert im Konstruktor soll über `set_value` begrenzt werden. Prüfen Sie: Warum funktioniert `regler.__value` von außen nicht?", "en": "A temperature controller may only accept setpoints between `low` and `high`. Write the class `Setpoint(low, high, value)` with the **private** attribute `__value` (two underscores).\n- `get_value()`: getter\n- `set_value(v)`: setter with a check – if v lies outside [low, high], the value is limited to the nearest limit. Returns `True` if v was taken over unchanged, otherwise `False`.\n- `step(delta)`: changes the setpoint by delta (through the setter, i.e. with limiting) and returns the new value.\n\nThe initial value in the constructor should also be limited via `set_value`. Check: why doesn't `controller.__value` work from outside?"}, "starter": {"de": "class Setpoint:\n    def __init__(self, low, high, value):\n        ...\n", "en": "class Setpoint:\n    def __init__(self, low, high, value):\n        ...\n"}, "solution": "class Setpoint:\n    def __init__(self, low, high, value):\n        self.low = low\n        self.high = high\n        self.__value = low\n        self.set_value(value)\n\n    def get_value(self):\n        return self.__value\n\n    def set_value(self, v):\n        if v < self.low:\n            self.__value = self.low\n            return False\n        if v > self.high:\n            self.__value = self.high\n            return False\n        self.__value = v\n        return True\n\n    def step(self, delta):\n        self.set_value(self.__value + delta)\n        return self.__value\n\nregler = Setpoint(15, 30, 21)\nprint(regler.step(5), regler.step(5), regler.get_value())\n", "tests": "\nns, out = run()\ns = call(ns, \"Setpoint\", 15, 30, 21)\ncheck(method(s, \"get_value\") == 21 and hasattr(s, \"_Setpoint__value\") and not hasattr(s, \"__value\"), \"Privates Attribut __value (Name Mangling: _Setpoint__value), Startwert 21\", \"Private attribute __value (name mangling: _Setpoint__value), initial value 21\")\ncheck(method(s, \"set_value\", 25) is True and method(s, \"get_value\") == 25, \"set_value(25) → True\", \"set_value(25) → True\")\ncheck(method(s, \"set_value\", 40) is False and method(s, \"get_value\") == 30, \"set_value(40) → False, begrenzt auf 30\", \"set_value(40) → False, limited to 30\")\ncheck(method(s, \"step\", -20) == 15 and method(s, \"step\", 3.5) == 18.5, \"step(-20) → 15 (Grenze), step(3.5) → 18.5\", \"step(-20) → 15 (limit), step(3.5) → 18.5\")\ncheck(method(s, \"set_value\", 15) is True and method(s, \"set_value\", 30) is True, \"Werte genau auf den Grenzen werden unverändert übernommen (True)\", \"Values exactly on the limits are taken over unchanged (True)\")\nt = call(ns, \"Setpoint\", 0, 10, -5)\ncheck(method(t, \"get_value\") == 0, \"Startwert außerhalb wird begrenzt (−5 → 0)\", \"Initial value outside is limited (−5 → 0)\")\n", "require": ["class"], "refs": ["10.6", "10.6g"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-components", "ch": "10", "lvl": 2, "title": {"de": "Bauelemente in Reihe (Polymorphie)", "en": "Components in series (polymorphism)"}, "task": {"de": "Drei Klassen beschreiben passive Bauelemente; jede hat die Methode `impedance(f)`, die die komplexe Impedanz (Ω) bei der Frequenz f (Hz) zurückgibt (`math.pi` verwenden):\n- `Resistor(name, r)`: $Z = R$\n- `Inductor(name, l)`: $Z = j \\cdot 2\\pi f L$\n- `Capacitor(name, c)`: $Z = \\dfrac{1}{j \\cdot 2\\pi f C}$\n\nGemeinsame Basisklasse ist `Component(name)` mit dem Attribut `name` und der Methode `describe(f)`, die einen Text wie `L1: |Z| = 31.4 Ohm bei 1000 Hz` zurückgibt (Betrag mit `abs()`, eine Nachkommastelle). `describe` steht nur in der Basisklasse.\n\nSchreiben Sie außerdem die Funktion `series_impedance(components, f)`, die die Summe der Impedanzen einer Liste von Bauelementen liefert – egal welcher Art.", "en": "Three classes describe passive components; each has the method `impedance(f)` returning the complex impedance (Ω) at frequency f (Hz) (use `math.pi`):\n- `Resistor(name, r)`: $Z = R$\n- `Inductor(name, l)`: $Z = j \\cdot 2\\pi f L$\n- `Capacitor(name, c)`: $Z = \\dfrac{1}{j \\cdot 2\\pi f C}$\n\nThe common base class is `Component(name)` with the attribute `name` and the method `describe(f)` returning a text like `L1: |Z| = 31.4 Ohm at 1000 Hz` (magnitude with `abs()`, one decimal). `describe` is only in the base class.\n\nAlso write the function `series_impedance(components, f)` that returns the sum of the impedances of a list of components – no matter of which kind."}, "starter": {"de": "import math\n\nclass Component:\n    def __init__(self, name):\n        self.name = name\n", "en": "import math\n\nclass Component:\n    def __init__(self, name):\n        self.name = name\n"}, "solution": "import math\n\nclass Component:\n    def __init__(self, name):\n        self.name = name\n\n    def impedance(self, f):\n        return 0\n\n    def describe(self, f):\n        return f\"{self.name}: |Z| = {abs(self.impedance(f)):.1f} Ohm bei {f} Hz\"\n\n\nclass Resistor(Component):\n    def __init__(self, name, r):\n        super().__init__(name)\n        self.r = r\n\n    def impedance(self, f):\n        return self.r\n\n\nclass Inductor(Component):\n    def __init__(self, name, l):\n        super().__init__(name)\n        self.l = l\n\n    def impedance(self, f):\n        return 1j * 2 * math.pi * f * self.l\n\n\nclass Capacitor(Component):\n    def __init__(self, name, c):\n        super().__init__(name)\n        self.c = c\n\n    def impedance(self, f):\n        return 1 / (1j * 2 * math.pi * f * self.c)\n\n\ndef series_impedance(components, f):\n    total = 0\n    for c in components:\n        total += c.impedance(f)\n    return total\n\nparts = [Resistor(\"R1\", 100), Inductor(\"L1\", 0.005), Capacitor(\"C1\", 1e-6)]\nfor p in parts:\n    print(p.describe(1000))\nprint(series_impedance(parts, 1000))\n", "tests": "\nimport math as _m\nns, out = run()\nr = call(ns, \"Resistor\", \"R1\", 100); l = call(ns, \"Inductor\", \"L1\", 0.005); c = call(ns, \"Capacitor\", \"C1\", 1e-6)\nC = ns.get(\"Component\")\ncheck(all(isinstance(x, C) for x in (r, l, c)) and r.name == \"R1\" and c.name == \"C1\", \"Alle drei erben von Component und haben einen Namen\", \"All three inherit from Component and have a name\")\nfor f in [50, 1000]:\n    zl, zc = 1j * 2 * _m.pi * f * 0.005, 1 / (1j * 2 * _m.pi * f * 1e-6)\n    ok = approx(abs(method(r, \"impedance\", f)), 100) and approx(abs(method(l, \"impedance\", f) - zl), 0) and approx(abs(method(c, \"impedance\", f) - zc), 0)\n    check(ok, f\"Impedanzen bei {f} Hz stimmen\", f\"Impedances at {f} Hz are correct\")\n    s = call(ns, \"series_impedance\", [r, l, c], f)\n    check(approx(abs(s - (100 + zl + zc)), 0, 1e-6), f\"Reihenschaltung bei {f} Hz: |Z| ≈ {abs(100 + zl + zc):.1f} Ω\", f\"series at {f} Hz: |Z| ≈ {abs(100 + zl + zc):.1f} Ω\")\nd = method(l, \"describe\", 1000)\ncheck(isinstance(d, str) and \"L1\" in d and f\"{2 * _m.pi * 1000 * 0.005:.1f}\" in d and \"describe\" not in vars(ns[\"Inductor\"]), \"describe(1000) für L1 enthält 31.4 und steht nur in der Basisklasse\", \"describe(1000) for L1 contains 31.4 and is only in the base class\")\n", "require": ["class", "super"], "refs": ["10.3", "10.5", "5.1"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-machine", "ch": "10", "lvl": 2, "title": {"de": "Maschine mit Sensoren", "en": "Machine with sensors"}, "task": {"de": "Zwei Klassen arbeiten zusammen (eine Maschine *hat* mehrere Sensoren):\n- `Sensor(name, limit)`: Attribute `name`, `limit` und `value` (Start `None`); Methode `update(value)` speichert den neuen Messwert; Methode `alarm()` gibt `True` zurück, wenn ein Wert vorliegt und er über `limit` liegt.\n- `Machine(name)`: Attribut `sensors` (leere Liste); Methoden\n  - `add_sensor(sensor)`\n  - `read(values)`: `values` ist ein Dictionary Sensorname → Messwert; jeder passende Sensor wird aktualisiert, unbekannte Namen werden ignoriert\n  - `alarms()`: Liste der Namen aller Sensoren im Alarm (in der Reihenfolge des Hinzufügens)\n  - `status()`: `\"OK\"`, `\"WARNUNG\"` (ein Alarm) oder `\"STOPP\"` (zwei oder mehr Alarme)", "en": "Two classes work together (a machine *has* several sensors):\n- `Sensor(name, limit)`: attributes `name`, `limit` and `value` (initially `None`); method `update(value)` stores the new reading; method `alarm()` returns `True` if there is a value and it is above `limit`.\n- `Machine(name)`: attribute `sensors` (empty list); methods\n  - `add_sensor(sensor)`\n  - `read(values)`: `values` is a dictionary sensor name → reading; each matching sensor is updated, unknown names are ignored\n  - `alarms()`: list of the names of all sensors in alarm (in the order they were added)\n  - `status()`: `\"OK\"`, `\"WARNUNG\"` (one alarm) or `\"STOPP\"` (two or more alarms)"}, "starter": {"de": "class Sensor:\n    def __init__(self, name, limit):\n        ...\n\nclass Machine:\n    def __init__(self, name):\n        ...\n", "en": "class Sensor:\n    def __init__(self, name, limit):\n        ...\n\nclass Machine:\n    def __init__(self, name):\n        ...\n"}, "solution": "class Sensor:\n    def __init__(self, name, limit):\n        self.name = name\n        self.limit = limit\n        self.value = None\n\n    def update(self, value):\n        self.value = value\n\n    def alarm(self):\n        return self.value is not None and self.value > self.limit\n\n\nclass Machine:\n    def __init__(self, name):\n        self.name = name\n        self.sensors = []\n\n    def add_sensor(self, sensor):\n        self.sensors.append(sensor)\n\n    def read(self, values):\n        for s in self.sensors:\n            if s.name in values:\n                s.update(values[s.name])\n\n    def alarms(self):\n        return [s.name for s in self.sensors if s.alarm()]\n\n    def status(self):\n        n = len(self.alarms())\n        if n == 0:\n            return \"OK\"\n        elif n == 1:\n            return \"WARNUNG\"\n        return \"STOPP\"\n\nm = Machine(\"Fräse\")\nm.add_sensor(Sensor(\"Temperatur\", 80))\nm.add_sensor(Sensor(\"Vibration\", 4.5))\nm.read({\"Temperatur\": 85, \"Vibration\": 2.0})\nprint(m.alarms(), m.status())\n", "tests": "\nns, out = run()\ns = call(ns, \"Sensor\", \"T\", 80)\ncheck(getattr(s, \"value\", 1) is None and method(s, \"alarm\") is False, \"Neuer Sensor: value None, kein Alarm\", \"New sensor: value None, no alarm\")\nmethod(s, \"update\", 85)\ncheck(s.value == 85 and method(s, \"alarm\") is True, \"update(85) bei Grenze 80 → Alarm\", \"update(85) with limit 80 → alarm\")\nmethod(s, \"update\", 80)\ncheck(method(s, \"alarm\") is False, \"update(80) bei Grenze 80 → kein Alarm (nur über der Grenze)\", \"update(80) with limit 80 → no alarm (only above the limit)\")\nm = call(ns, \"Machine\", \"Fräse\")\ncheck(getattr(m, \"sensors\", None) == [], \"Neue Maschine ohne Sensoren\", \"New machine without sensors\")\nfor name, lim in [(\"Temperatur\", 80), (\"Vibration\", 4.5), (\"Druck\", 6.0)]:\n    method(m, \"add_sensor\", call(ns, \"Sensor\", name, lim))\ncheck(method(m, \"status\") == \"OK\" and method(m, \"alarms\") == [], \"Ohne Messwerte: OK\", \"Without readings: OK\")\nmethod(m, \"read\", {\"Temperatur\": 85, \"Vibration\": 2.0, \"Strom\": 99})\ncheck(method(m, \"alarms\") == [\"Temperatur\"] and method(m, \"status\") == \"WARNUNG\", \"Ein Alarm → WARNUNG; unbekannter Name 'Strom' wird ignoriert\", \"One alarm → WARNUNG; unknown name 'Strom' is ignored\")\nmethod(m, \"read\", {\"Druck\": 7.2})\ncheck(method(m, \"alarms\") == [\"Temperatur\", \"Druck\"] and method(m, \"status\") == \"STOPP\", \"Zwei Alarme → STOPP (Reihenfolge des Hinzufügens)\", \"Two alarms → STOPP (order of adding)\")\n", "require": ["class"], "refs": ["10.3", "8.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-length", "ch": "10", "lvl": 2, "title": {"de": "Längenangaben mit Einheiten", "en": "Lengths with units"}, "task": {"de": "Auf Zeichnungen stehen Maße in unterschiedlichen Einheiten. Schreiben Sie die Klasse `Length(value, unit)` mit den Attributen `value` und `unit`; erlaubt sind die Einheiten `\"mm\"`, `\"cm\"`, `\"m\"` und `\"km\"` (speichern Sie die Umrechnungsfaktoren nach mm in einem Dictionary).\n- `to_mm()`: der Wert in mm\n- `to(unit)`: ein **neues** `Length`-Objekt mit derselben Länge in der Einheit `unit`\n- `__add__`: Summe zweier Längen, das Ergebnis in der Einheit des **linken** Operanden\n- `__eq__`: gleich lang (Abweichung in mm kleiner als `1e-9`), z.B. `Length(1, \"m\") == Length(100, \"cm\")`\n- `__lt__`: kürzer als – damit funktioniert auch `sorted()` mit einer Liste von Längen\n- `__str__`: Wert im Format `:g` und Einheit, z.B. `1.5 m` oder `250 mm`", "en": "Drawings show dimensions in different units. Write the class `Length(value, unit)` with the attributes `value` and `unit`; the units `\"mm\"`, `\"cm\"`, `\"m\"` and `\"km\"` are allowed (store the conversion factors to mm in a dictionary).\n- `to_mm()`: the value in mm\n- `to(unit)`: a **new** `Length` object with the same length in the unit `unit`\n- `__add__`: sum of two lengths, the result in the unit of the **left** operand\n- `__eq__`: equally long (difference in mm smaller than `1e-9`), e.g. `Length(1, \"m\") == Length(100, \"cm\")`\n- `__lt__`: shorter than – then `sorted()` also works with a list of lengths\n- `__str__`: value in the format `:g` and unit, e.g. `1.5 m` or `250 mm`"}, "starter": {"de": "class Length:\n    FACTOR = {\"mm\": 1, \"cm\": 10, \"m\": 1000, \"km\": 1000000}\n\n    def __init__(self, value, unit):\n        pass   # Ihr Code\n", "en": "class Length:\n    FACTOR = {\"mm\": 1, \"cm\": 10, \"m\": 1000, \"km\": 1000000}\n\n    def __init__(self, value, unit):\n        pass   # your code\n"}, "solution": "class Length:\n    FACTOR = {\"mm\": 1, \"cm\": 10, \"m\": 1000, \"km\": 1000000}\n\n    def __init__(self, value, unit):\n        self.value = value\n        self.unit = unit\n\n    def to_mm(self):\n        return self.value * self.FACTOR[self.unit]\n\n    def to(self, unit):\n        return Length(self.to_mm() / self.FACTOR[unit], unit)\n\n    def __add__(self, other):\n        return Length(self.value + other.to_mm() / self.FACTOR[self.unit], self.unit)\n\n    def __eq__(self, other):\n        return abs(self.to_mm() - other.to_mm()) < 1e-9\n\n    def __lt__(self, other):\n        return self.to_mm() < other.to_mm()\n\n    def __str__(self):\n        return f\"{self.value:g} {self.unit}\"\n\n\nparts = [Length(1.2, \"m\"), Length(450, \"mm\"), Length(30, \"cm\")]\nprint(parts[0] + parts[1], parts[1].to(\"cm\"), [str(p) for p in sorted(parts)])\n", "tests": "\nns, out = run()\nL = ns.get(\"Length\")\na = call(ns, \"Length\", 1.2, \"m\"); b = call(ns, \"Length\", 450, \"mm\"); c = call(ns, \"Length\", 30, \"cm\")\ncheck(getattr(a, \"value\", None) == 1.2 and getattr(a, \"unit\", None) == \"m\", \"Attribute value und unit\", \"Attributes value and unit\")\ncheck(approx(method(a, \"to_mm\"), 1200) and approx(method(c, \"to_mm\"), 300) and approx(method(call(ns, \"Length\", 0.5, \"km\"), \"to_mm\"), 500000), \"to_mm(): 1.2 m = 1200 mm, 30 cm = 300 mm, 0.5 km = 500000 mm\", \"to_mm(): 1.2 m = 1200 mm, 30 cm = 300 mm, 0.5 km = 500000 mm\")\nt = method(b, \"to\", \"cm\")\ncheck(isinstance(t, L) and t is not b and t.unit == \"cm\" and approx(t.value, 45) and b.unit == \"mm\", \"450 mm .to('cm') ist ein neues Objekt 45 cm\", \"450 mm .to('cm') is a new object 45 cm\")\ns = safe(lambda: a + b); s2 = safe(lambda: b + a)\ncheck(isinstance(s, L) and s.unit == \"m\" and approx(s.value, 1.65) and isinstance(s2, L) and s2.unit == \"mm\" and approx(s2.value, 1650), \"1.2 m + 450 mm = 1.65 m, 450 mm + 1.2 m = 1650 mm\", \"1.2 m + 450 mm = 1.65 m, 450 mm + 1.2 m = 1650 mm\")\ncheck(safe(lambda: call(ns, \"Length\", 1, \"m\") == call(ns, \"Length\", 100, \"cm\")) is True and safe(lambda: a == b) is False and safe(lambda: call(ns, \"Length\", 1000.5, \"mm\") == call(ns, \"Length\", 1, \"m\")) is False, \"1 m == 100 cm, aber 1.2 m != 450 mm\", \"1 m == 100 cm, but 1.2 m != 450 mm\")\ncheck(safe(lambda: c < b) is True and safe(lambda: a < c) is False and [str(x) for x in safe(lambda: sorted([a, b, c])) or []] == [\"30 cm\", \"450 mm\", \"1.2 m\"], \"__lt__ und sorted(): 30 cm < 450 mm < 1.2 m\", \"__lt__ and sorted(): 30 cm < 450 mm < 1.2 m\")\ncheck(safe(lambda: str(call(ns, \"Length\", 1.5, \"m\"))) == \"1.5 m\" and safe(lambda: str(call(ns, \"Length\", 250.0, \"mm\"))) == \"250 mm\", \"str: '1.5 m', '250 mm'\", \"str: '1.5 m', '250 mm'\")\n", "require": ["class", "magic", "dict"], "refs": ["10.7", "8.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-rangelogger", "ch": "10", "lvl": 2, "title": {"de": "Datenlogger mit Plausibilitätsfilter", "en": "Data logger with plausibility filter"}, "task": {"de": "Basisklasse `DataLogger(name)` mit den Attributen `name`, `times` und `values` (beide anfangs leere Listen) und den Methoden\n- `record(t, value)`: hängt die Zeit an `times` und den Messwert an `values` an und gibt `True` zurück\n- `count()`: Anzahl der gespeicherten Messwerte\n- `last()`: das Tupel `(t, value)` des zuletzt gespeicherten Messwerts oder `None`, wenn noch nichts gespeichert ist\n\nAbgeleitete Klasse `RangeLogger(name, low, high)` (Konstruktor mit `super().__init__(…)`) mit dem zusätzlichen Attribut `rejected` (Start 0). Sie **überschreibt** `record`: Liegt der Wert im Bereich `low` bis `high` (Grenzen eingeschlossen), wird er mit `super().record(…)` gespeichert und `True` zurückgegeben; sonst wird `rejected` um 1 erhöht und `False` zurückgegeben.\n\n`count()` und `last()` stehen **nur** in der Basisklasse.", "en": "Base class `DataLogger(name)` with the attributes `name`, `times` and `values` (both initially empty lists) and the methods\n- `record(t, value)`: appends the time to `times` and the reading to `values` and returns `True`\n- `count()`: number of stored readings\n- `last()`: the tuple `(t, value)` of the most recently stored reading, or `None` if nothing has been stored yet\n\nDerived class `RangeLogger(name, low, high)` (constructor with `super().__init__(…)`) with the additional attribute `rejected` (initially 0). It **overrides** `record`: if the value lies within `low` to `high` (limits included), it is stored with `super().record(…)` and `True` is returned; otherwise `rejected` is increased by 1 and `False` is returned.\n\n`count()` and `last()` are **only** in the base class."}, "starter": {"de": "class DataLogger:\n    def __init__(self, name):\n        pass   # Ihr Code\n", "en": "class DataLogger:\n    def __init__(self, name):\n        pass   # your code\n"}, "solution": "class DataLogger:\n    def __init__(self, name):\n        self.name = name\n        self.times = []\n        self.values = []\n\n    def record(self, t, value):\n        self.times.append(t)\n        self.values.append(value)\n        return True\n\n    def count(self):\n        return len(self.values)\n\n    def last(self):\n        if len(self.values) == 0:\n            return None\n        return (self.times[-1], self.values[-1])\n\n\nclass RangeLogger(DataLogger):\n    def __init__(self, name, low, high):\n        super().__init__(name)\n        self.low = low\n        self.high = high\n        self.rejected = 0\n\n    def record(self, t, value):\n        if self.low <= value <= self.high:\n            return super().record(t, value)\n        self.rejected += 1\n        return False\n\n\nlog = RangeLogger(\"T_Kühlwasser\", 0, 120)\nfor t, v in [(0, 21.5), (10, 999.0), (20, 23.0), (30, -40.0)]:\n    log.record(t, v)\nprint(log.count(), log.last(), log.rejected)\n", "tests": "\nns, out = run()\nD, R = ns.get(\"DataLogger\"), ns.get(\"RangeLogger\")\nd = call(ns, \"DataLogger\", \"p1\")\ncheck(getattr(d, \"name\", None) == \"p1\" and getattr(d, \"times\", None) == [] and getattr(d, \"values\", None) == [] and method(d, \"count\") == 0 and method(d, \"last\") is None, \"Neuer DataLogger: leere Listen, count 0, last None\", \"New DataLogger: empty lists, count 0, last None\")\ncheck(method(d, \"record\", 0, 1.5) is True and method(d, \"record\", 5, 99.0) is True and method(d, \"count\") == 2 and method(d, \"last\") == (5, 99.0) and d.times == [0, 5], \"DataLogger speichert alles; last() = (5, 99.0)\", \"DataLogger stores everything; last() = (5, 99.0)\")\nr = call(ns, \"RangeLogger\", \"T\", 0, 120)\ncheck(isinstance(r, D) and getattr(r, \"name\", None) == \"T\" and getattr(r, \"rejected\", None) == 0 and getattr(r, \"values\", None) == [], \"RangeLogger erbt von DataLogger, rejected = 0\", \"RangeLogger inherits from DataLogger, rejected = 0\")\nres = [method(r, \"record\", t, v) for t, v in [(0, 21.5), (10, 999.0), (20, 120), (30, -40.0), (40, 0)]]\ncheck(res == [True, False, True, False, True], \"record: 21.5 ✓, 999 ✗, 120 ✓ (Grenze), −40 ✗, 0 ✓ (Grenze)\", \"record: 21.5 ✓, 999 ✗, 120 ✓ (limit), −40 ✗, 0 ✓ (limit)\")\ncheck(r.values == [21.5, 120, 0] and r.times == [0, 20, 40] and r.rejected == 2 and method(r, \"count\") == 3 and method(r, \"last\") == (40, 0), \"Gespeichert: 21.5, 120, 0; rejected = 2; last() = (40, 0)\", \"Stored: 21.5, 120, 0; rejected = 2; last() = (40, 0)\")\ncheck(R is not None and \"count\" not in vars(R) and \"last\" not in vars(R) and \"record\" in vars(R), \"record überschrieben, count/last nur in der Basisklasse\", \"record overridden, count/last only in the base class\")\n", "require": ["class", "super"], "refs": ["10.5", "10.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-dimension", "ch": "10", "lvl": 3, "title": {"de": "Maße mit Abmaßen", "en": "Dimensions with tolerances"}, "task": {"de": "In technischen Zeichnungen werden Maße mit Abmaßen angegeben, z.B. $25^{+0.05}_{-0.02}$ mm. Schreiben Sie die Klasse `Dimension(nominal, upper, lower)` (`upper` ≥ 0, `lower` ≤ 0):\n- `max_size()` und `min_size()`: Höchst- und Mindestmaß\n- `fits(measured)`: ob ein Messwert im zulässigen Bereich liegt (Grenzen eingeschlossen)\n- `__add__`: Maßkette – Nennmaße, obere und untere Abmaße werden jeweils addiert; das Ergebnis ist eine neue `Dimension`\n- `__str__`: z.B. `25.00 +0.05/-0.02` (zwei Nachkommastellen, Vorzeichen immer angeben; Tipp: die Formatangabe `:+.2f` erzwingt ein Vorzeichen)", "en": "Technical drawings give dimensions with tolerances, e.g. $25^{+0.05}_{-0.02}$ mm. Write the class `Dimension(nominal, upper, lower)` (`upper` ≥ 0, `lower` ≤ 0):\n- `max_size()` and `min_size()`: maximum and minimum size\n- `fits(measured)`: whether a measurement lies within the permitted range (limits included)\n- `__add__`: dimension chain – nominal sizes, upper and lower deviations are added separately; the result is a new `Dimension`\n- `__str__`: e.g. `25.00 +0.05/-0.02` (two decimals, always show the sign; tip: the format spec `:+.2f` forces a sign)"}, "starter": {"de": "class Dimension:\n    def __init__(self, nominal, upper, lower):\n        self.nominal = nominal\n        self.upper = upper\n        self.lower = lower\n", "en": "class Dimension:\n    def __init__(self, nominal, upper, lower):\n        self.nominal = nominal\n        self.upper = upper\n        self.lower = lower\n"}, "solution": "class Dimension:\n    def __init__(self, nominal, upper, lower):\n        self.nominal = nominal\n        self.upper = upper\n        self.lower = lower\n\n    def max_size(self):\n        return self.nominal + self.upper\n\n    def min_size(self):\n        return self.nominal + self.lower\n\n    def fits(self, measured):\n        return self.min_size() <= measured <= self.max_size()\n\n    def __add__(self, other):\n        return Dimension(self.nominal + other.nominal, self.upper + other.upper, self.lower + other.lower)\n\n    def __str__(self):\n        return f\"{self.nominal:.2f} {self.upper:+.2f}/{self.lower:+.2f}\"\n\nshaft = Dimension(25, 0.05, -0.02)\nring = Dimension(40, 0.1, 0.0)\nprint(shaft, \"|\", shaft + ring, \"|\", shaft.fits(25.03))\n", "tests": "\nns, out = run()\nD = ns.get(\"Dimension\")\nd = call(ns, \"Dimension\", 25, 0.05, -0.02)\ncheck(approx(method(d, \"max_size\"), 25.05) and approx(method(d, \"min_size\"), 24.98), \"25 +0.05/-0.02: Höchstmaß 25.05, Mindestmaß 24.98\", \"25 +0.05/-0.02: max 25.05, min 24.98\")\ncheck(method(d, \"fits\", 25.0) is True and method(d, \"fits\", 24.99) is True and method(d, \"fits\", 25.06) is False and method(d, \"fits\", 24.97) is False, \"fits() prüft den zulässigen Bereich\", \"fits() checks the permitted range\")\ns = safe(lambda: d + call(ns, \"Dimension\", 40, 0.1, 0.0))\ncheck(isinstance(s, D) and approx(s.nominal, 65) and approx(s.upper, 0.15) and approx(s.lower, -0.02), \"Maßkette: 25 +0.05/-0.02 + 40 +0.10/+0.00 = 65 +0.15/-0.02\", \"Chain: 25 +0.05/-0.02 + 40 +0.10/+0.00 = 65 +0.15/-0.02\")\ns2 = safe(lambda: d + call(ns, \"Dimension\", 10, 0.02, -0.03))\ncheck(isinstance(s2, D) and approx(s2.nominal, 35) and approx(s2.upper, 0.07) and approx(s2.lower, -0.05), \"Maßkette: 25 +0.05/-0.02 + 10 +0.02/-0.03 = 35 +0.07/-0.05\", \"Chain: 25 +0.05/-0.02 + 10 +0.02/-0.03 = 35 +0.07/-0.05\")\ncheck(safe(lambda: str(d)) == \"25.00 +0.05/-0.02\", \"str() = '25.00 +0.05/-0.02'\", \"str() = '25.00 +0.05/-0.02'\")\ncheck(safe(lambda: str(call(ns, \"Dimension\", 12.5, 0.0, -0.1))) == \"12.50 +0.00/-0.10\", \"str() = '12.50 +0.00/-0.10'\", \"str() = '12.50 +0.00/-0.10'\")\n", "require": ["class", "magic"], "refs": ["10.7", "10.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-abstract", "ch": "10", "lvl": 3, "title": {"de": "Abstrakte Klasse: Lasten", "en": "Abstract class: loads"}, "task": {"de": "Definieren Sie die abstrakte Klasse `Load(ABC)` mit der abstrakten Methode `force()` (Kraft in N). Leiten Sie davon ab:\n- `PointLoad(f)`: Einzellast, `force()` gibt `f` zurück\n- `LineLoad(q, length)`: Streckenlast q (N/m) über die Länge (m), `force()` gibt `q * length` zurück\n\nSchreiben Sie außerdem die Funktion `total_force(loads)`, die die Summe der Kräfte einer Liste von Lasten liefert.", "en": "Define the abstract class `Load(ABC)` with the abstract method `force()` (force in N). Derive from it:\n- `PointLoad(f)`: point load, `force()` returns `f`\n- `LineLoad(q, length)`: distributed load q (N/m) over the length (m), `force()` returns `q * length`\n\nAlso write the function `total_force(loads)` returning the sum of the forces of a list of loads."}, "starter": {"de": "from abc import ABC, abstractmethod\n\nclass Load(ABC):\n    ...\n", "en": "from abc import ABC, abstractmethod\n\nclass Load(ABC):\n    ...\n"}, "solution": "from abc import ABC, abstractmethod\n\nclass Load(ABC):\n    @abstractmethod\n    def force(self):\n        pass\n\nclass PointLoad(Load):\n    def __init__(self, f):\n        self._f = f\n\n    def force(self):\n        return self._f\n\nclass LineLoad(Load):\n    def __init__(self, q, length):\n        self._q = q\n        self._length = length\n\n    def force(self):\n        return self._q * self._length\n\ndef total_force(loads):\n    total = 0\n    for load in loads:\n        total += load.force()\n    return total\n\nprint(total_force([PointLoad(500), LineLoad(200, 3)]))\n", "tests": "\nns, out = run()\ncheck(raises(TypeError, lambda: ns[\"Load\"]()), \"Load selbst kann nicht instanziiert werden (abstrakt)\", \"Load itself cannot be instantiated (abstract)\")\np = call(ns, \"PointLoad\", 500); l = call(ns, \"LineLoad\", 200, 3)\ncheck(isinstance(p, ns[\"Load\"]) and isinstance(l, ns[\"Load\"]), \"PointLoad und LineLoad erben von Load\", \"PointLoad and LineLoad inherit from Load\")\ncheck(approx(method(p, \"force\"), 500) and approx(method(l, \"force\"), 600), \"force(): 500 N bzw. 600 N\", \"force(): 500 N and 600 N\")\ncheck(approx(call(ns, \"total_force\", [p, l, call(ns, \"PointLoad\", 50)]), 1150), \"total_force(...) = 1150 N\", \"total_force(...) = 1150 N\")\ncheck(approx(call(ns, \"total_force\", []), 0), \"total_force([]) = 0\", \"total_force([]) = 0\")\n", "require": ["abc", "class"], "refs": ["10.8"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-resistor-ops", "ch": "10", "lvl": 3, "title": {"de": "Widerstände vergleichen und sortieren", "en": "Comparing and sorting resistors"}, "task": {"de": "Erweitern Sie die Idee eines Widerstands-Objekts: Klasse `R(ohm)` mit\n- `__add__`: Reihenschaltung, Ergebnis ist ein neues `R`\n- `parallel(other)`: Parallelschaltung, Ergebnis ist ein neues `R`\n- `__eq__` und `__lt__`: Vergleich über den Widerstandswert (dann funktioniert auch `sorted()` mit einer Liste von `R`-Objekten!)\n- `__str__`: `470 Ω` bzw. ab 1000 Ω in kΩ mit einer Nachkommastelle, z.B. `4.7 kΩ`", "en": "Extend the idea of a resistor object: class `R(ohm)` with\n- `__add__`: series connection, result is a new `R`\n- `parallel(other)`: parallel connection, result is a new `R`\n- `__eq__` and `__lt__`: comparison by resistance value (then `sorted()` also works on a list of `R` objects!)\n- `__str__`: `470 Ω`, or from 1000 Ω on in kΩ with one decimal, e.g. `4.7 kΩ`"}, "starter": {"de": "class R:\n    def __init__(self, ohm):\n        self.ohm = ohm\n", "en": "class R:\n    def __init__(self, ohm):\n        self.ohm = ohm\n"}, "solution": "class R:\n    def __init__(self, ohm):\n        self.ohm = ohm\n\n    def __add__(self, other):\n        return R(self.ohm + other.ohm)\n\n    def parallel(self, other):\n        return R(self.ohm * other.ohm / (self.ohm + other.ohm))\n\n    def __eq__(self, other):\n        return isinstance(other, R) and self.ohm == other.ohm\n\n    def __lt__(self, other):\n        return self.ohm < other.ohm\n\n    def __str__(self):\n        if self.ohm >= 1000:\n            return f\"{self.ohm / 1000:.1f} kΩ\"\n        return f\"{self.ohm} Ω\"\n\nparts = [R(4700), R(220), R(1000)]\nprint([str(p) for p in sorted(parts)])\nprint(R(220) + R(250), R(100).parallel(R(100)))\n", "tests": "\nns, out = run()\nRc = ns.get(\"R\")\na = call(ns, \"R\", 220); b = call(ns, \"R\", 250)\ns = safe(lambda: a + b)\ncheck(isinstance(s, Rc) and s.ohm == 470, \"R(220) + R(250) = R(470)\", \"R(220) + R(250) = R(470)\")\np = method(call(ns, \"R\", 100), \"parallel\", call(ns, \"R\", 300))\ncheck(isinstance(p, Rc) and approx(p.ohm, 75), \"R(100) parallel R(300) = R(75)\", \"R(100) parallel R(300) = R(75)\")\ncheck(safe(lambda: a == call(ns, \"R\", 220)) is True and safe(lambda: a == b) is False, \"== vergleicht die Werte\", \"== compares the values\")\nlst = [call(ns, \"R\", 4700), call(ns, \"R\", 220), call(ns, \"R\", 1000)]\nsrt = safe(lambda: sorted(lst))\ncheck([x.ohm for x in srt] == [220, 1000, 4700], \"sorted() sortiert nach Widerstand\", \"sorted() sorts by resistance\")\ncheck(safe(lambda: str(call(ns, \"R\", 470))) == \"470 Ω\" and safe(lambda: str(call(ns, \"R\", 4700))) == \"4.7 kΩ\" and safe(lambda: str(call(ns, \"R\", 1000))) == \"1.0 kΩ\", \"str: '470 Ω', '4.7 kΩ' und '1.0 kΩ'\", \"str: '470 Ω', '4.7 kΩ' and '1.0 kΩ'\")\n", "require": ["class", "magic"], "refs": ["10.7"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-polynomial", "ch": "10", "lvl": 3, "title": {"de": "Klasse Polynom", "en": "Class Polynomial"}, "task": {"de": "Schreiben Sie `Polynomial(coeffs)`. `coeffs` ist eine Liste der Koeffizienten, beginnend beim konstanten Glied: `[1, 0, -2]` steht für $1 - 2x^2$.\n- `evaluate(x)`: Wert an der Stelle x\n- `derivative()`: neues `Polynomial` der Ableitung (`[1, 0, -2]` → `[0, -4]`; die Ableitung einer Konstanten ist `[0]`)\n- `__add__`: Summe zweier Polynome (auch unterschiedlichen Grades)\n- `degree()`: Grad (Index des höchsten Koeffizienten ≠ 0; für das Nullpolynom 0)", "en": "Write `Polynomial(coeffs)`. `coeffs` is a list of coefficients starting with the constant term: `[1, 0, -2]` means $1 - 2x^2$.\n- `evaluate(x)`: value at x\n- `derivative()`: new `Polynomial` of the derivative (`[1, 0, -2]` → `[0, -4]`; the derivative of a constant is `[0]`)\n- `__add__`: sum of two polynomials (even of different degree)\n- `degree()`: degree (index of the highest coefficient ≠ 0; 0 for the zero polynomial)"}, "starter": {"de": "class Polynomial:\n    def __init__(self, coeffs):\n        self.coeffs = list(coeffs)\n", "en": "class Polynomial:\n    def __init__(self, coeffs):\n        self.coeffs = list(coeffs)\n"}, "solution": "class Polynomial:\n    def __init__(self, coeffs):\n        self.coeffs = list(coeffs)\n\n    def evaluate(self, x):\n        total = 0\n        for k, c in enumerate(self.coeffs):\n            total += c * x**k\n        return total\n\n    def derivative(self):\n        if len(self.coeffs) <= 1:\n            return Polynomial([0])\n        return Polynomial([k * self.coeffs[k] for k in range(1, len(self.coeffs))])\n\n    def __add__(self, other):\n        n = max(len(self.coeffs), len(other.coeffs))\n        a = self.coeffs + [0] * (n - len(self.coeffs))\n        b = other.coeffs + [0] * (n - len(other.coeffs))\n        return Polynomial([x + y for x, y in zip(a, b)])\n\n    def degree(self):\n        d = 0\n        for k, c in enumerate(self.coeffs):\n            if c != 0:\n                d = k\n        return d\n\np = Polynomial([-1, -2, 1, 1])\nprint(p.evaluate(1.0), p.derivative().coeffs, p.degree())\n", "tests": "\nns, out = run()\nP = ns.get(\"Polynomial\")\np = call(ns, \"Polynomial\", [1, 0, -2])\nfor x in [0, 1.5, -2]:\n    check(approx(method(p, \"evaluate\", x), 1 - 2 * x * x), f\"1 − 2x² bei x = {x}: {1 - 2*x*x}\", f\"1 − 2x² at x = {x}: {1 - 2*x*x}\")\nd = method(p, \"derivative\")\ncheck(isinstance(d, P) and d.coeffs == [0, -4], \"Ableitung von [1, 0, -2] ist [0, -4]\", \"Derivative of [1, 0, -2] is [0, -4]\")\ncheck(method(call(ns, \"Polynomial\", [5]), \"derivative\").coeffs == [0] and method(call(ns, \"Polynomial\", [3, 5]), \"derivative\").coeffs == [5], \"Ableitung einer Konstanten ist [0], von 3 + 5x ist sie [5]\", \"Derivative of a constant is [0], of 3 + 5x it is [5]\")\ns = safe(lambda: call(ns, \"Polynomial\", [1, 2]) + call(ns, \"Polynomial\", [0, 1, 3]))\ns2 = safe(lambda: call(ns, \"Polynomial\", [0, 1, 3]) + call(ns, \"Polynomial\", [1, 2]))\ncheck(isinstance(s, P) and s.coeffs == [1, 3, 3] and isinstance(s2, P) and s2.coeffs == [1, 3, 3], \"[1, 2] + [0, 1, 3] = [0, 1, 3] + [1, 2] = [1, 3, 3]\", \"[1, 2] + [0, 1, 3] = [0, 1, 3] + [1, 2] = [1, 3, 3]\")\ncheck(method(call(ns, \"Polynomial\", [-1, -2, 1, 1]), \"degree\") == 3 and method(call(ns, \"Polynomial\", [2, 0, 0]), \"degree\") == 0 and method(call(ns, \"Polynomial\", [0]), \"degree\") == 0, \"degree(): 3 für x³+…, 0 für [2, 0, 0] und [0]\", \"degree(): 3 for x³+…, 0 for [2, 0, 0] and [0]\")\n", "require": ["class", "magic"], "refs": ["10.7", "10.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-fraction", "ch": "10", "lvl": 3, "title": {"de": "Exakte Übersetzungen mit Brüchen", "en": "Exact ratios with fractions"}, "task": {"de": "Gleitkommazahlen sind bei Getriebeübersetzungen ungenau (z.B. 1/3). Schreiben Sie eine Klasse `Ratio(num, den)` für Brüche, die **immer gekürzt** gespeichert werden (Attribute `num`, `den`; der Nenner ist immer positiv).\n- Kürzen mit dem größten gemeinsamen Teiler – programmieren Sie ihn selbst (z.B. als Methode oder Funktion mit dem euklidischen Algorithmus).\n- `__mul__`: Produkt zweier Brüche (Gesamtübersetzung zweier Stufen) → neues `Ratio`\n- `__add__`: Summe zweier Brüche → neues `Ratio`\n- `__eq__`: Gleichheit (gekürzte Brüche vergleichen)\n- `__float__`: Wert als Gleitkommazahl\n- `__str__`: z.B. `3/1` oder `-2/5`\n\nIst der Nenner 0, soll ein `ZeroDivisionError` entstehen. Tipp: Der entsteht automatisch, wenn Sie im Konstruktor einmal `num / den` berechnen.", "en": "Floats are inaccurate for gear ratios (e.g. 1/3). Write a class `Ratio(num, den)` for fractions that are **always stored in lowest terms** (attributes `num`, `den`; the denominator is always positive).\n- Reduce with the greatest common divisor – program it yourself (e.g. as a method or function using the Euclidean algorithm).\n- `__mul__`: product of two fractions (overall ratio of two stages) → new `Ratio`\n- `__add__`: sum of two fractions → new `Ratio`\n- `__eq__`: equality (compare reduced fractions)\n- `__float__`: value as a float\n- `__str__`: e.g. `3/1` or `-2/5`\n\nIf the denominator is 0, a `ZeroDivisionError` should occur. Tip: it happens automatically if you compute `num / den` once in the constructor."}, "starter": {"de": "class Ratio:\n    def __init__(self, num, den):\n        ...\n", "en": "class Ratio:\n    def __init__(self, num, den):\n        ...\n"}, "solution": "def gcd(a, b):\n    while b != 0:\n        a, b = b, a % b\n    return abs(a)\n\n\nclass Ratio:\n    def __init__(self, num, den):\n        value = num / den  # löst bei Nenner 0 einen ZeroDivisionError aus\n        if den < 0:\n            num, den = -num, -den\n        g = gcd(num, den)\n        self.num = num // g\n        self.den = den // g\n\n    def __mul__(self, other):\n        return Ratio(self.num * other.num, self.den * other.den)\n\n    def __add__(self, other):\n        return Ratio(self.num * other.den + other.num * self.den, self.den * other.den)\n\n    def __eq__(self, other):\n        return isinstance(other, Ratio) and self.num == other.num and self.den == other.den\n\n    def __float__(self):\n        return self.num / self.den\n\n    def __str__(self):\n        return f\"{self.num}/{self.den}\"\n\nstage1 = Ratio(51, 17)\nstage2 = Ratio(38, 19)\nprint(stage1 * stage2, float(stage1 * stage2))\n", "tests": "\nns, out = run()\nR = ns.get(\"Ratio\")\na = call(ns, \"Ratio\", 51, 17)\ncheck(a.num == 3 and a.den == 1, \"Ratio(51, 17) wird zu 3/1 gekürzt\", \"Ratio(51, 17) is reduced to 3/1\")\nb = call(ns, \"Ratio\", 4, -10)\ncheck(b.num == -2 and b.den == 5 and safe(lambda: str(b)) == \"-2/5\", \"Ratio(4, -10) = -2/5 (Nenner positiv)\", \"Ratio(4, -10) = -2/5 (denominator positive)\")\np = safe(lambda: call(ns, \"Ratio\", 51, 17) * call(ns, \"Ratio\", 38, 19))\ncheck(isinstance(p, R) and p.num == 6 and p.den == 1, \"3/1 · 2/1 = 6/1\", \"3/1 · 2/1 = 6/1\")\np2 = safe(lambda: call(ns, \"Ratio\", 1, 3) * call(ns, \"Ratio\", 3, 4))\ncheck(isinstance(p2, R) and p2.num == 1 and p2.den == 4, \"1/3 · 3/4 = 1/4\", \"1/3 · 3/4 = 1/4\")\ns = safe(lambda: call(ns, \"Ratio\", 1, 3) + call(ns, \"Ratio\", 1, 6))\ncheck(isinstance(s, R) and s.num == 1 and s.den == 2, \"1/3 + 1/6 = 1/2\", \"1/3 + 1/6 = 1/2\")\ncheck(safe(lambda: call(ns, \"Ratio\", 2, 4) == call(ns, \"Ratio\", 1, 2)) is True and safe(lambda: call(ns, \"Ratio\", 1, 3) == call(ns, \"Ratio\", 1, 2)) is False, \"2/4 == 1/2, aber 1/3 != 1/2\", \"2/4 == 1/2, but 1/3 != 1/2\")\ncheck(approx(safe(lambda: float(call(ns, \"Ratio\", 1, 3))), 1 / 3) and safe(lambda: str(call(ns, \"Ratio\", 0, 7))) == \"0/1\", \"float(1/3) ≈ 0.3333, Ratio(0, 7) = 0/1\", \"float(1/3) ≈ 0.3333, Ratio(0, 7) = 0/1\")\ncheck(raises(ZeroDivisionError, lambda: R(1, 0)), \"Nenner 0 → ZeroDivisionError\", \"Denominator 0 → ZeroDivisionError\")\ncheck(\"gcd(\" not in SOURCE.replace(\"def gcd(\", \"\") or \"math\" not in SOURCE, \"ggT selbst programmiert\", \"gcd programmed yourself\")\n", "require": ["class", "magic"], "refs": ["10.7", "6.2a"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-matrix2", "ch": "10", "lvl": 3, "title": {"de": "Klasse für 2×2-Matrizen", "en": "Class for 2×2 matrices"}, "task": {"de": "Schreiben Sie die Klasse `Matrix2(a, b, c, d)` für die Matrix $\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}$ (Attribute `a`, `b`, `c`, `d`).\n- `det()`: Determinante $ad - bc$\n- `__add__`: Summe zweier Matrizen\n- `__mul__`: Ist `other` eine `Matrix2`, wird das Matrixprodukt berechnet; ist es eine Zahl (`int` oder `float`), wird jedes Element damit multipliziert. Prüfen Sie mit `isinstance`.\n- `inverse()`: die inverse Matrix ($\\frac{1}{\\det} \\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}$); bei det = 0 (singuläre Matrix) wird `None` zurückgegeben\n- `__eq__`: Gleichheit aller vier Elemente (mit einer Toleranz von 1e-9, weil Gleitkommazahlen im Spiel sind)\n- `__str__`: `[[1, 2], [3, 4]]`\n\nAlle Operationen liefern **neue** Objekte.", "en": "Write the class `Matrix2(a, b, c, d)` for the matrix $\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}$ (attributes `a`, `b`, `c`, `d`).\n- `det()`: determinant $ad - bc$\n- `__add__`: sum of two matrices\n- `__mul__`: if `other` is a `Matrix2`, the matrix product is computed; if it is a number (`int` or `float`), each element is multiplied by it. Check with `isinstance`.\n- `inverse()`: the inverse matrix ($\\frac{1}{\\det} \\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}$); for det = 0 (singular matrix) `None` is returned\n- `__eq__`: equality of all four elements (with a tolerance of 1e-9, since floats are involved)\n- `__str__`: `[[1, 2], [3, 4]]`\n\nAll operations return **new** objects."}, "starter": {"de": "class Matrix2:\n    def __init__(self, a, b, c, d):\n        self.a = a\n        self.b = b\n        self.c = c\n        self.d = d\n", "en": "class Matrix2:\n    def __init__(self, a, b, c, d):\n        self.a = a\n        self.b = b\n        self.c = c\n        self.d = d\n"}, "solution": "class Matrix2:\n    def __init__(self, a, b, c, d):\n        self.a = a\n        self.b = b\n        self.c = c\n        self.d = d\n\n    def det(self):\n        return self.a * self.d - self.b * self.c\n\n    def __add__(self, other):\n        return Matrix2(self.a + other.a, self.b + other.b, self.c + other.c, self.d + other.d)\n\n    def __mul__(self, other):\n        if isinstance(other, Matrix2):\n            return Matrix2(self.a * other.a + self.b * other.c, self.a * other.b + self.b * other.d,\n                           self.c * other.a + self.d * other.c, self.c * other.b + self.d * other.d)\n        if isinstance(other, int) or isinstance(other, float):\n            return Matrix2(self.a * other, self.b * other, self.c * other, self.d * other)\n        return None\n\n    def inverse(self):\n        det = self.det()\n        if det == 0:\n            return None\n        return Matrix2(self.d / det, -self.b / det, -self.c / det, self.a / det)\n\n    def __eq__(self, other):\n        if not isinstance(other, Matrix2):\n            return False\n        return (abs(self.a - other.a) < 1e-9 and abs(self.b - other.b) < 1e-9\n                and abs(self.c - other.c) < 1e-9 and abs(self.d - other.d) < 1e-9)\n\n    def __str__(self):\n        return f\"[[{self.a}, {self.b}], [{self.c}, {self.d}]]\"\n\nM = Matrix2(4, 7, 2, 6)\nprint(M * M.inverse(), M * 2, M.det())\n", "tests": "\nns, out = run()\nX = ns.get(\"Matrix2\")\nM = call(ns, \"Matrix2\", 4, 7, 2, 6); N = call(ns, \"Matrix2\", 1, 2, 3, 4)\ncheck(method(M, \"det\") == 10 and method(N, \"det\") == -2, \"det: 10 bzw. −2\", \"det: 10 and −2\")\ns = safe(lambda: M + N)\ncheck(isinstance(s, X) and (s.a, s.b, s.c, s.d) == (5, 9, 5, 10), \"M + N = [[5, 9], [5, 10]]\", \"M + N = [[5, 9], [5, 10]]\")\np = safe(lambda: M * N)\ncheck(isinstance(p, X) and (p.a, p.b, p.c, p.d) == (25, 36, 20, 28), \"M · N = [[25, 36], [20, 28]]\", \"M · N = [[25, 36], [20, 28]]\")\nk = safe(lambda: N * 2.5)\ncheck(isinstance(k, X) and (k.a, k.b, k.c, k.d) == (2.5, 5.0, 7.5, 10.0) and (N.a, N.b) == (1, 2), \"N · 2.5 skaliert alle Elemente, N bleibt unverändert\", \"N · 2.5 scales all elements, N stays unchanged\")\nI = safe(lambda: M * method(M, \"inverse\"))\ncheck(safe(lambda: I == call(ns, \"Matrix2\", 1, 0, 0, 1)) is True, \"M · M⁻¹ = Einheitsmatrix (Vergleich mit Toleranz)\", \"M · M⁻¹ = identity (comparison with tolerance)\")\ncheck(method(call(ns, \"Matrix2\", 1, 2, 2, 4), \"inverse\") is None, \"Singuläre Matrix → None\", \"Singular matrix → None\")\ncheck(safe(lambda: N == call(ns, \"Matrix2\", 1, 2, 3, 5)) is False and safe(lambda: N == call(ns, \"Matrix2\", 1.5, 2, 3, 4)) is False and safe(lambda: N == call(ns, \"Matrix2\", 1, -2, 3, 4)) is False, \"Matrizen, die sich in einem Element unterscheiden, sind ungleich\", \"Matrices differing in one element are not equal\")\ncheck(safe(lambda: str(N)) == \"[[1, 2], [3, 4]]\" and safe(lambda: N == \"x\") is False, \"str(N) = '[[1, 2], [3, 4]]', Vergleich mit anderem Typ → False\", \"str(N) = '[[1, 2], [3, 4]]', comparison with another type → False\")\n", "require": ["class", "magic", "isinstance"], "refs": ["10.7", "7.4", "6.3b"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-abstractsensor", "ch": "10", "lvl": 3, "title": {"de": "Abstrakte Sensorklasse", "en": "Abstract sensor class"}, "task": {"de": "Alle Sensoren eines Prüfstands liefern Rohwerte, die in physikalische Größen umgerechnet werden. Definieren Sie die abstrakte Klasse `Sensor(ABC)`:\n- Konstruktor `__init__(self, name, unit)` speichert `name` und `unit`\n- abstrakte Methode `convert(raw)`: rechnet einen Rohwert um\n- konkrete Methode `read(raws)`: gibt die Liste der umgerechneten Werte einer Liste von Rohwerten in derselben Reihenfolge zurück (nutzt `convert`)\n- konkrete Methode `__str__`: z.B. `T1 [°C]`\n\nAbgeleitete Klassen (Konstruktor mit `super()`):\n- `LinearSensor(name, unit, gain, offset)`: convert $= \\mathit{gain} \\cdot \\mathit{raw} + \\mathit{offset}$\n- `PolySensor(name, unit, coeffs)`: convert $= \\sum_k \\mathit{coeffs}_k \\cdot \\mathit{raw}^k$ (Polynom, `coeffs` beginnt beim konstanten Glied)\n\nEine Unterklasse, die `convert` nicht implementiert, darf sich nicht instanziieren lassen.", "en": "All sensors of a test bench deliver raw values that are converted into physical quantities. Define the abstract class `Sensor(ABC)`:\n- constructor `__init__(self, name, unit)` stores `name` and `unit`\n- abstract method `convert(raw)`: converts one raw value\n- concrete method `read(raws)`: returns the list of converted values of a list of raw values in the same order (uses `convert`)\n- concrete method `__str__`: e.g. `T1 [°C]`\n\nDerived classes (constructor with `super()`):\n- `LinearSensor(name, unit, gain, offset)`: convert $= \\mathit{gain} \\cdot \\mathit{raw} + \\mathit{offset}$\n- `PolySensor(name, unit, coeffs)`: convert $= \\sum_k \\mathit{coeffs}_k \\cdot \\mathit{raw}^k$ (polynomial, `coeffs` starts with the constant term)\n\nA subclass that doesn't implement `convert` must not be instantiable."}, "starter": {"de": "from abc import ABC, abstractmethod\n\nclass Sensor(ABC):\n    ...\n", "en": "from abc import ABC, abstractmethod\n\nclass Sensor(ABC):\n    ...\n"}, "solution": "from abc import ABC, abstractmethod\n\nclass Sensor(ABC):\n    def __init__(self, name, unit):\n        self.name = name\n        self.unit = unit\n\n    @abstractmethod\n    def convert(self, raw):\n        pass\n\n    def read(self, raws):\n        return [self.convert(r) for r in raws]\n\n    def __str__(self):\n        return f\"{self.name} [{self.unit}]\"\n\n\nclass LinearSensor(Sensor):\n    def __init__(self, name, unit, gain, offset):\n        super().__init__(name, unit)\n        self.gain = gain\n        self.offset = offset\n\n    def convert(self, raw):\n        return self.gain * raw + self.offset\n\n\nclass PolySensor(Sensor):\n    def __init__(self, name, unit, coeffs):\n        super().__init__(name, unit)\n        self.coeffs = coeffs\n\n    def convert(self, raw):\n        total = 0\n        for k in range(len(self.coeffs)):\n            total += self.coeffs[k] * raw**k\n        return total\n\np = LinearSensor(\"p1\", \"bar\", 0.01, -0.5)\nt = PolySensor(\"T1\", \"°C\", [-20.0, 0.05, 1e-6])\nprint(p, p.read([50, 650]), t, t.read([1000]))\n", "tests": "\nns, out = run()\nS = ns.get(\"Sensor\")\ncheck(raises(TypeError, lambda: S(\"x\", \"y\")), \"Sensor selbst ist abstrakt\", \"Sensor itself is abstract\")\nlin = call(ns, \"LinearSensor\", \"p1\", \"bar\", 0.01, -0.5)\npol = call(ns, \"PolySensor\", \"T1\", \"°C\", [-20.0, 0.05, 1e-6])\ncheck(isinstance(lin, S) and isinstance(pol, S) and safe(lambda: str(lin)) == \"p1 [bar]\" and safe(lambda: str(pol)) == \"T1 [°C]\", \"Beide erben von Sensor; str: 'p1 [bar]', 'T1 [°C]'\", \"Both inherit from Sensor; str: 'p1 [bar]', 'T1 [°C]'\")\nr = method(lin, \"read\", [50, 650, 0])\ncheck(isinstance(r, list) and all(approx(a, b) for a, b in zip(r, [0.0, 6.0, -0.5])) and len(r) == 3, \"LinearSensor.read([50, 650, 0]) = [0.0, 6.0, −0.5]\", \"LinearSensor.read([50, 650, 0]) = [0.0, 6.0, −0.5]\")\ncheck(approx(method(pol, \"convert\", 1000), -20 + 50 + 1), \"PolySensor.convert(1000) = 31.0\", \"PolySensor.convert(1000) = 31.0\")\ncheck(\"read\" not in vars(ns[\"LinearSensor\"]) and \"read\" not in vars(ns[\"PolySensor\"]), \"read() steht nur in der Basisklasse\", \"read() is only in the base class\")\ncode = \"class Broken(Sensor):\\n    pass\\n\"\nenv = dict(ns); exec(code, env)\ncheck(raises(TypeError, lambda: env[\"Broken\"](\"b\", \"-\")), \"Unterklasse ohne convert lässt sich nicht instanziieren\", \"A subclass without convert cannot be instantiated\")\n", "require": ["class", "abc", "super"], "refs": ["10.8", "10.5"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-ringbuffer", "ch": "10", "lvl": 3, "title": {"de": "Ringpuffer für Messwerte", "en": "Ring buffer for readings"}, "task": {"de": "Ein Mikrocontroller speichert nur die letzten `capacity` Messwerte. Schreiben Sie die Klasse `RingBuffer(capacity)`:\n- `push(value)`: fügt einen Wert hinzu; ist der Puffer voll, wird der **älteste** Wert verworfen\n- `__len__`: Anzahl der gespeicherten Werte (dann funktioniert `len(buffer)`)\n- `values()`: Liste der gespeicherten Werte vom ältesten zum neuesten (als Kopie – Änderungen an der Liste dürfen den Puffer nicht verändern)\n- `is_full()`\n- `mean()`: Mittelwert, `None` bei leerem Puffer\n- `trend()`: neuester minus ältester Wert (`None`, wenn weniger als zwei Werte gespeichert sind)\n\nSpeichern Sie die Werte intern in einem **protected** Attribut `_data`.", "en": "A microcontroller only keeps the last `capacity` readings. Write the class `RingBuffer(capacity)`:\n- `push(value)`: adds a value; if the buffer is full, the **oldest** value is discarded\n- `__len__`: number of stored values (then `len(buffer)` works)\n- `values()`: list of the stored values from oldest to newest (as a copy – changes to the list must not change the buffer)\n- `is_full()`\n- `mean()`: mean, `None` for an empty buffer\n- `trend()`: newest minus oldest value (`None` if fewer than two values are stored)\n\nStore the values internally in a **protected** attribute `_data`."}, "starter": {"de": "class RingBuffer:\n    def __init__(self, capacity):\n        ...\n", "en": "class RingBuffer:\n    def __init__(self, capacity):\n        ...\n"}, "solution": "class RingBuffer:\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self._data = []\n\n    def push(self, value):\n        if len(self._data) == self.capacity:\n            self._data.pop(0)\n        self._data.append(value)\n\n    def __len__(self):\n        return len(self._data)\n\n    def values(self):\n        return self._data[:]\n\n    def is_full(self):\n        return len(self._data) == self.capacity\n\n    def mean(self):\n        if len(self._data) == 0:\n            return None\n        return sum(self._data) / len(self._data)\n\n    def trend(self):\n        if len(self._data) < 2:\n            return None\n        return self._data[-1] - self._data[0]\n\nbuf = RingBuffer(3)\nfor v in [1.0, 2.0, 3.0, 4.0]:\n    buf.push(v)\nprint(buf.values(), len(buf), buf.mean(), buf.trend())\n", "tests": "\nns, out = run()\nb = call(ns, \"RingBuffer\", 3)\ncheck(hasattr(b, \"_data\") and safe(lambda: len(b)) == 0 and method(b, \"mean\") is None and method(b, \"trend\") is None, \"Leerer Puffer: len 0, mean/trend None, Attribut _data\", \"Empty buffer: len 0, mean/trend None, attribute _data\")\nmethod(b, \"push\", 1.0)\ncheck(method(b, \"trend\") is None and method(b, \"is_full\") is False, \"Ein Wert: trend None, nicht voll\", \"One value: trend None, not full\")\nmethod(b, \"push\", 2.0)\ncheck(approx(method(b, \"trend\"), 1.0), \"Zwei Werte: trend = 1.0\", \"Two values: trend = 1.0\")\nfor v in [3.0]:\n    method(b, \"push\", v)\ncheck(method(b, \"is_full\") is True and method(b, \"values\") == [1.0, 2.0, 3.0], \"Nach drei Werten voll: [1.0, 2.0, 3.0]\", \"Full after three values: [1.0, 2.0, 3.0]\")\nmethod(b, \"push\", 4.0); method(b, \"push\", 6.0)\ncheck(method(b, \"values\") == [3.0, 4.0, 6.0] and safe(lambda: len(b)) == 3, \"Älteste Werte werden verworfen: [3.0, 4.0, 6.0]\", \"Oldest values are discarded: [3.0, 4.0, 6.0]\")\ncheck(approx(method(b, \"mean\"), 13 / 3) and approx(method(b, \"trend\"), 3.0), \"mean ≈ 4.33, trend = 3.0\", \"mean ≈ 4.33, trend = 3.0\")\nv = method(b, \"values\"); v.append(99)\ncheck(method(b, \"values\") == [3.0, 4.0, 6.0], \"values() liefert eine Kopie\", \"values() returns a copy\")\n", "require": ["class", "magic"], "refs": ["10.7", "10.6", "8.7"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-assembly", "ch": "10", "lvl": 3, "title": {"de": "Baugruppen und Einzelteile", "en": "Assemblies and parts"}, "task": {"de": "Eine Stückliste ist hierarchisch: Eine Baugruppe enthält Einzelteile **und** weitere Baugruppen, jeweils mit einer Stückzahl. Schreiben Sie zwei Klassen mit denselben drei Methoden:\n\n`Part(name, mass_kg)` – ein Einzelteil:\n- `total_mass()`: seine Masse\n- `count(name)`: 1, wenn es so heißt, sonst 0\n- `parts_list()`: das Dictionary `{name: 1}`\n\n`Assembly(name)` – eine Baugruppe mit dem Attribut `children` (anfangs leere Liste):\n- `add(component, qty=1)`: hängt das Tupel `(component, qty)` an `children` an; `component` ist ein `Part` oder eine `Assembly`\n- `total_mass()`: Summe aus Stückzahl · Masse aller Bestandteile\n- `count(name)`: wie viele Einzelteile dieses Namens insgesamt enthalten sind (auch in Unterbaugruppen, mit Stückzahlen multipliziert)\n- `parts_list()`: Dictionary Name → Gesamtzahl für **alle** enthaltenen Einzelteile\n\nTipp: Jede Methode von `Assembly` ruft einfach dieselbe Methode ihrer Bestandteile auf – egal, ob das ein `Part` oder eine `Assembly` ist.", "en": "A bill of materials is hierarchical: an assembly contains parts **and** further assemblies, each with a quantity. Write two classes with the same three methods:\n\n`Part(name, mass_kg)` – a single part:\n- `total_mass()`: its mass\n- `count(name)`: 1 if that is its name, otherwise 0\n- `parts_list()`: the dictionary `{name: 1}`\n\n`Assembly(name)` – an assembly with the attribute `children` (initially an empty list):\n- `add(component, qty=1)`: appends the tuple `(component, qty)` to `children`; `component` is a `Part` or an `Assembly`\n- `total_mass()`: sum of quantity · mass of all components\n- `count(name)`: how many parts of this name are contained in total (also in sub-assemblies, multiplied by the quantities)\n- `parts_list()`: dictionary name → total number for **all** contained parts\n\nTip: each method of `Assembly` simply calls the same method of its components – no matter whether that is a `Part` or an `Assembly`."}, "starter": {"de": "class Part:\n    def __init__(self, name, mass_kg):\n        self.name = name\n        self.mass_kg = mass_kg\n\n\nclass Assembly:\n    def __init__(self, name):\n        self.name = name\n        self.children = []\n", "en": "class Part:\n    def __init__(self, name, mass_kg):\n        self.name = name\n        self.mass_kg = mass_kg\n\n\nclass Assembly:\n    def __init__(self, name):\n        self.name = name\n        self.children = []\n"}, "solution": "class Part:\n    def __init__(self, name, mass_kg):\n        self.name = name\n        self.mass_kg = mass_kg\n\n    def total_mass(self):\n        return self.mass_kg\n\n    def count(self, name):\n        return 1 if self.name == name else 0\n\n    def parts_list(self):\n        return {self.name: 1}\n\n\nclass Assembly:\n    def __init__(self, name):\n        self.name = name\n        self.children = []\n\n    def add(self, component, qty=1):\n        self.children.append((component, qty))\n\n    def total_mass(self):\n        total = 0\n        for component, qty in self.children:\n            total += qty * component.total_mass()\n        return total\n\n    def count(self, name):\n        n = 0\n        for component, qty in self.children:\n            n += qty * component.count(name)\n        return n\n\n    def parts_list(self):\n        result = {}\n        for component, qty in self.children:\n            for part, n in component.parts_list().items():\n                result[part] = result.get(part, 0) + qty * n\n        return result\n\n\nscrew = Part(\"Schraube M6\", 0.004)\nbearing = Part(\"Lager 6204\", 0.11)\nhub = Assembly(\"Nabe\")\nhub.add(bearing, 2)\nhub.add(screw, 6)\nwheel = Assembly(\"Laufrad\")\nwheel.add(hub)\nwheel.add(Part(\"Felge\", 1.8))\nwheel.add(screw, 12)\nprint(round(wheel.total_mass(), 3), wheel.count(\"Schraube M6\"), wheel.parts_list())\n", "tests": "\nns, out = run()\nP = lambda n, m: call(ns, \"Part\", n, m)\ns = P(\"Schraube\", 0.004); b = P(\"Lager\", 0.11); f = P(\"Felge\", 1.8)\ncheck(approx(method(s, \"total_mass\"), 0.004) and method(s, \"count\", \"Schraube\") == 1 and method(s, \"count\", \"Lager\") == 0 and method(s, \"parts_list\") == {\"Schraube\": 1}, \"Part: total_mass, count, parts_list\", \"Part: total_mass, count, parts_list\")\nhub = call(ns, \"Assembly\", \"Nabe\")\nmethod(hub, \"add\", b, 2); method(hub, \"add\", s, 6)\ncheck(len(hub.children) == 2 and hub.children[0] == (b, 2), \"add() hängt (Bauteil, Stückzahl) an children an\", \"add() appends (component, quantity) to children\")\ncheck(approx(method(hub, \"total_mass\"), 2 * 0.11 + 6 * 0.004) and method(hub, \"count\", \"Schraube\") == 6, \"Nabe: 2 Lager + 6 Schrauben = 0.244 kg\", \"hub: 2 bearings + 6 screws = 0.244 kg\")\nwheel = call(ns, \"Assembly\", \"Laufrad\")\nmethod(wheel, \"add\", hub); method(wheel, \"add\", f); method(wheel, \"add\", s, 12)\nem = 0.244 + 1.8 + 12 * 0.004\ncheck(approx(method(wheel, \"total_mass\"), em) and method(wheel, \"count\", \"Schraube\") == 18 and method(wheel, \"count\", \"Lager\") == 2, f\"Laufrad: {em:.3f} kg, 18 Schrauben (auch in der Nabe), 2 Lager\", f\"wheel: {em:.3f} kg, 18 screws (also inside the hub), 2 bearings\")\ncart = call(ns, \"Assembly\", \"Wagen\")\nmethod(cart, \"add\", wheel, 4); method(cart, \"add\", P(\"Rahmen\", 12.0))\ncheck(approx(method(cart, \"total_mass\"), 4 * em + 12.0) and method(cart, \"parts_list\") == {\"Lager\": 8, \"Schraube\": 72, \"Felge\": 4, \"Rahmen\": 1}, \"Drei Ebenen: Wagen mit 4 Laufrädern – parts_list = {Lager: 8, Schraube: 72, Felge: 4, Rahmen: 1}\", \"Three levels: cart with 4 wheels – parts_list = {Lager: 8, Schraube: 72, Felge: 4, Rahmen: 1}\")\ncheck(method(call(ns, \"Assembly\", \"leer\"), \"total_mass\") == 0 and method(call(ns, \"Assembly\", \"leer\"), \"parts_list\") == {}, \"Leere Baugruppe: Masse 0, parts_list {}\", \"Empty assembly: mass 0, parts_list {}\")\n", "require": ["class", "dict_methods"], "refs": ["10.3", "8.3"], "forbid": [], "stdin": "", "topics": []}, {"id": "k10-signal", "ch": "10", "lvl": 3, "title": {"de": "Messsignal als Objekt", "en": "Measurement signal as an object"}, "task": {"de": "Schreiben Sie die Klasse `Signal(values, dt)` für ein abgetastetes Messsignal: `values` ist die Liste der Messwerte, `dt` der zeitliche Abstand in s. Speichern Sie eine **Kopie** der Liste im Attribut `values` und `dt` im gleichnamigen Attribut.\n- `__len__`: Anzahl der Messwerte\n- `__add__`: Summe zweier Signale Wert für Wert → neues `Signal`; haben die Signale unterschiedliche Länge oder unterschiedliches `dt`, wird `None` zurückgegeben\n- `__mul__`: Multiplikation mit einer Zahl (`int` oder `float`, prüfen mit `isinstance`) → neues `Signal`; bei anderen Typen `None`\n- `integral()`: das Integral nach der Trapezregel: $\\Delta t \\cdot \\left(\\sum_k v_k - \\dfrac{v_0 + v_{n-1}}{2}\\right)$ (0 bei weniger als zwei Werten)\n- `derivative()`: neues `Signal` aus den Differenzenquotienten $(v_{k+1} - v_k) / \\Delta t$ (ein Wert weniger, gleiches `dt`)\n- `__str__`: genau im Format `Signal: <Anzahl> × <dt> s`, z.B. `Signal: 5 × 0.1 s`\n\nAlle Operationen lassen die beteiligten Signale unverändert.", "en": "Write the class `Signal(values, dt)` for a sampled measurement signal: `values` is the list of readings, `dt` the time step in s. Store a **copy** of the list in the attribute `values` and `dt` in the attribute of the same name.\n- `__len__`: number of readings\n- `__add__`: sum of two signals value by value → new `Signal`; if the signals differ in length or in `dt`, `None` is returned\n- `__mul__`: multiplication by a number (`int` or `float`, check with `isinstance`) → new `Signal`; `None` for other types\n- `integral()`: the integral by the trapezoidal rule: $\\Delta t \\cdot \\left(\\sum_k v_k - \\dfrac{v_0 + v_{n-1}}{2}\\right)$ (0 for fewer than two values)\n- `derivative()`: new `Signal` of the difference quotients $(v_{k+1} - v_k) / \\Delta t$ (one value fewer, same `dt`)\n- `__str__`: exactly in the format `Signal: <count> × <dt> s`, e.g. `Signal: 5 × 0.1 s`\n\nNo operation changes the signals involved."}, "starter": {"de": "class Signal:\n    def __init__(self, values, dt):\n        pass   # Ihr Code\n", "en": "class Signal:\n    def __init__(self, values, dt):\n        pass   # your code\n"}, "solution": "class Signal:\n    def __init__(self, values, dt):\n        self.values = list(values)\n        self.dt = dt\n\n    def __len__(self):\n        return len(self.values)\n\n    def __add__(self, other):\n        if len(self) != le
