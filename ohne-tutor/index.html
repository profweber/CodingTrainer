    const key = { "cfg-count": "count", "cfg-minutes": "minutes", "cfg-mix": "mix" }[id];
    S.examCfg[key] = key === "mix" ? b.dataset.v : Number(b.dataset.v);
    save(); renderExam();
  });
});
$("cfg-run").onchange = e => { S.examCfg.allowRun = e.target.checked; save(); };
$("cfg-ack").onchange = e => { S.examAck = e.target.checked; save(); renderExam(); };
$("exam-start").onclick = startExam;

function renderExam() {
  const inExam = S.view === "exam", running = examRunning(), done = examDone();
  document.querySelectorAll("#view-seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === S.view)));
  $("diff-panel").hidden = inExam;
  $("chap-panel").hidden = running || done;
  $("exam-setup").hidden = !inExam || running || done;
  $("exam-run").hidden = !(running || done);
  $("exam-intro").hidden = !inExam || running || done;
  $("exam-result").hidden = !done;
  $("task-panel").hidden = inExam && !running;
  if (inExam) $("result-panel").hidden = true;
  // Werkzeugleiste
  $("check-btn").hidden = inExam;
  const runOk = !inExam || (running && S.exam.allowRun);
  $("run-btn").hidden = !runOk;
  document.querySelector(".io").hidden = !runOk;
  if (!inExam) return;
  // Einstellungen
  segSet("cfg-count", S.examCfg.count); segSet("cfg-minutes", S.examCfg.minutes); segSet("cfg-mix", S.examCfg.mix);
  $("cfg-run").checked = !!S.examCfg.allowRun;
  $("cfg-ack").checked = !!S.examAck;
  $("exam-start").disabled = !S.selected.size || !S.examAck;
  $("exam-start").textContent = !S.selected.size ? t("examStartNo") : !S.examAck ? t("examStartAck") : t("examStart");
  $("history-wrap").innerHTML = S.examHistory.length ? `<span class="eyebrow">${esc(t("examHistory"))}</span><ul class="history">${S.examHistory.slice(0, 5).map(h => {
    const d = new Date(h.when);
    const when = d.toLocaleDateString(LANG === "de" ? "de-DE" : "en-GB", { day: "2-digit", month: "2-digit" });
    return `<li><span class="when">${esc(when)}</span><span class="chs">${esc((LANG === "de" ? "Kap. " : "Ch. ") + h.chapters.join(", "))}</span><span class="pct">${h.pct} %</span></li>`;
  }).join("")}</ul>` : "";
  renderExamIntro();
  renderExamRun();
  if (done) renderExamResult();
}

function renderExamIntro() {
  if ($("exam-intro").hidden) return;
  const de = LANG === "de";
  const chs = CH_ORDER.filter(c => S.selected.has(c));
  $("exam-intro").innerHTML = `<div class="intro">
    <h2>${esc(t("examIntroTitle"))}</h2>
    <div class="disclaimer" role="note"><h3>${esc(t("disclaimerTitle"))}</h3><ul>${I18N.disclaimerItems[LANG].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    ${de ? `<p>Hier üben Sie unter Klausurbedingungen: Sie wählen unter „Kapitel“ aus, was in der Klausur drankommt, und erhalten eine zufällige Auswahl an Aufgaben aus diesen Kapiteln.</p>
    <ul>
      <li>Kein KI-Tutor, keine Tipps, keine Tests und keine Musterlösungen bis zur Abgabe.</li>
      <li>Mit Zeitlimit wird die Klausur bei Ablauf der Zeit automatisch abgegeben.</li>
      <li>Ohne „Code ausführen“ schreiben Sie den Code wie in einer Papierklausur, ohne ihn testen zu können.</li>
      <li>Nach der Abgabe werden alle Aufgaben automatisch getestet. Teilpunkte gibt es anteilig für bestandene Tests. Nutzt eine Lösung Konstrukte außerhalb des Skripts, gibt es die halbe Punktzahl.</li>
    </ul>` : `<p>Practise under exam conditions: select the chapters covered by the exam under “Chapters” and get a random selection of exercises from them.</p>
    <ul>
      <li>No AI tutor, no hints, no tests and no reference solutions until you submit.</li>
      <li>With a time limit, the exam is submitted automatically when time runs out.</li>
      <li>Without “Running code allowed”, you write code as in a paper exam, without being able to test it.</li>
      <li>After submitting, every exercise is tested automatically. Partial points are given proportionally to the passed tests. If a solution uses constructs outside the notes, it gets half points.</li>
    </ul>`}
    <table class="points-table"><tr><th>${esc(t("levelLabel"))}</th><th>${esc(t("points"))}</th></tr>
      ${[1, 2, 3].map(l => `<tr><td>${pips(l)} ${esc(I18N.levelNames[LANG][l])}</td><td>${PTS[l]}</td></tr>`).join("")}</table>
    <p>${esc(chs.length ? (de ? "Gewählt: Kapitel " : "Selected: chapters ") + chs.join(", ") : t("noChapters"))}</p>
  </div>`;
}

function renderExamRun() {
  const box = $("exam-run");
  if (box.hidden || !S.exam) return;
  const exam = S.exam, done = !!exam.submitted;
  const names = I18N.levelNames[LANG];
  let head;
  if (gradingInfo) head = `<div class="exam-timer" style="font-size:22px">${esc(t("examGrading", gradingInfo))}</div>`;
  else if (done) {
    const got = exam.ids.reduce((s, id) => s + exam.results[id].pts, 0), max = exam.ids.reduce((s, id) => s + exam.results[id].max, 0);
    head = `<div class="exam-timer">${Math.round(100 * got / max)} %</div><div class="exam-sub">${esc(t("examScore", { p: fmtPts(got), m: max }))}</div>`;
  } else if (exam.minutes > 0) head = `<div class="exam-timer" id="exam-clock">--:--</div><div class="exam-sub">${esc(t("examLeft"))} · ${exam.minutes} min</div>`;
  else head = `<div class="exam-timer" id="exam-clock">00:00</div><div class="exam-sub">${esc(t("examNoLimit"))}</div>`;
  const nav = exam.ids.map((id, i) => {
    const ex = byId(id);
    let st;
    if (done) {
      const r = exam.results[id];
      st = `<span class="state ${r.pts >= r.max ? "full" : r.pts > 0 ? "part" : "zero"}">${fmtPts(r.pts)}/${r.max}</span>`;
    } else {
      const edited = exam.codes[id] !== undefined && exam.codes[id] !== L(ex.starter);
      st = `<span class="state ${edited ? "edited" : ""}">${esc(edited ? t("examEdited") : t("examOpen"))}</span>`;
    }
    return `<li><button type="button" data-exam-i="${i}" aria-current="${!done && i === exam.idx}"><span class="num">${i + 1}</span><span>${esc(L(ex.title))}<span class="meta">${LANG === "de" ? "Kap." : "Ch."} ${esc(ex.ch)} · ${esc(names[ex.lvl])} · ${PTS[ex.lvl]} ${esc(t("points"))}</span></span>${st}</button></li>`;
  }).join("");
  let actions;
  if (gradingInfo) actions = "";
  else if (done) actions = `<div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" id="exam-new">${esc(t("examNew"))}</button><button type="button" class="btn" id="exam-back">${esc(t("examToPractice"))}</button></div>`;
  else if (examConfirm === "submit") actions = `<div class="confirm"><span>${esc(t("examSubmitQ"))}</span><div class="row"><button type="button" class="btn danger" id="exam-submit-yes">${esc(t("examSubmitYes"))}</button><button type="button" class="btn" id="exam-cancel">${esc(t("examContinue"))}</button></div></div>`;
  else if (examConfirm === "abort") actions = `<div class="confirm"><span>${esc(t("examAbortQ"))}</span><div class="row"><button type="button" class="btn danger" id="exam-abort-yes">${esc(t("examAbortYes"))}</button><button type="button" class="btn" id="exam-cancel">${esc(t("examContinue"))}</button></div></div>`;
  else actions = `<button type="button" class="btn primary" id="exam-submit" style="justify-content:center">${esc(t("examSubmit"))}</button><button type="button" class="btn ghost" id="exam-abort" style="justify-content:center">${esc(t("examAbort"))}</button>`;
  box.innerHTML = `<div class="panel-h"><h2>${esc(done ? t("examReview") : t("examRunning"))}</h2></div>
    <div class="panel-b" style="display:grid;gap:4px">${head}</div>
    <ul class="exam-nav">${nav}</ul>
    <div class="panel-b" style="display:grid;gap:8px;border-top:1px solid var(--line)">${actions}</div>`;
  tickExam();
}
function fmtPts(p) { return Number.isInteger(p) ? String(p) : p.toFixed(1).replace(".", LANG === "de" ? "," : "."); }

$("exam-run").addEventListener("click", e => {
  const nb = e.target.closest("[data-exam-i]");
  if (nb) {
    const i = Number(nb.dataset.examI);
    if (examRunning()) openExamTask(i);
    else if (examDone()) { const d = document.getElementById("res-" + i); if (d) { d.open = true; d.scrollIntoView({ block: "start", behavior: "smooth" }); } }
    return;
  }
  const id = e.target.closest("button")?.id;
  if (id === "exam-submit") { examConfirm = "submit"; renderExamRun(); }
  else if (id === "exam-abort") { examConfirm = "abort"; renderExamRun(); }
  else if (id === "exam-cancel") { examConfirm = null; renderExamRun(); }
  else if (id === "exam-submit-yes") submitExam(false);
  else if (id === "exam-abort-yes") discardExam();
  else if (id === "exam-new") discardExam();
  else if (id === "exam-back") { setView("practice"); }
});

function renderExamResult() {
  const exam = S.exam, names = I18N.levelNames[LANG];
  const got = exam.ids.reduce((s, id) => s + exam.results[id].pts, 0), max = exam.ids.reduce((s, id) => s + exam.results[id].max, 0);
  const pct = Math.round(100 * got / max);
  let minutes = Math.max(1, Math.round((exam.end - exam.start) / 60000));
  if (exam.minutes) minutes = Math.min(minutes, exam.minutes);
  const repeat = [];
  let html = `<div class="score-head">
    <span class="eyebrow">${esc(t("examReview"))}</span>
    <div class="big">${esc(fmtPts(got))} <small>/ ${max} ${esc(t("points"))} · ${pct} %</small></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p>${esc(t("examTimeUsed", { m: minutes }))}${exam.minutes ? " / " + exam.minutes + " min" : ""}${exam.auto ? " · " + esc(t("examAuto")) : ""}</p>
    <p>${esc(t("resultNotice"))}</p>
  </div>`;
  exam.ids.forEach((id, i) => {
    const ex = byId(id), res = exam.results[id], r = res.r;
    if (res.pts < res.max) (ex.refs || []).forEach(x => { if (!repeat.includes(x)) repeat.push(x); });
    const cls = res.pts >= res.max ? "full" : res.pts > 0 ? "part" : "zero";
    const rep = r.constructs || { items: [], missing: [], forbidden: [] };
    const notes = [];
    if (res.penalty) notes.push(`<div class="note absent">${esc(t("examPenalty"))}</div>`);
    rep.missing.forEach(m => notes.push(`<div class="note missing">${esc(t("constructMissing"))} <strong>${esc(m[LANG])}</strong>${m.section ? refChip(m.section) : ""}</div>`));
    rep.forbidden.forEach(m => notes.push(`<div class="note forbidden">${esc(t("constructForbidden"))} <strong>${esc(m[LANG])}</strong> (${esc(t("line"))} ${m.line})</div>`));
    rep.items.filter(it => !rep.forbidden.some(f => f.key === it.key)).forEach(it => notes.push(`<div class="note ${it.status}"><code>${esc(it[LANG])}</code> (${esc(t("line"))} ${it.line}) ${esc(noteText(it))}${it.section && it.status !== "off" ? refChip(it.section) : ""}</div>`));
    html += `<details class="task-res" id="res-${i}" ${res.pts < res.max ? "open" : ""}>
      <summary><span class="num">${i + 1}</span><span><strong>${esc(L(ex.title))}</strong><span class="meta" style="display:block;font-size:12px;color:var(--muted)">${LANG === "de" ? "Kapitel" : "Chapter"} ${esc(ex.ch)} · ${esc(names[ex.lvl])}${res.edited ? "" : " · " + esc(t("examNotEdited"))}</span></span><span class="pts ${cls}">${esc(fmtPts(res.pts))}/${res.max}</span></summary>
      <div class="body">
        <div class="task-body" style="padding:0">${md(L(ex.task))}</div>
        ${r.error ? `<pre class="console stderr" style="margin:0;border:1px solid var(--line);border-radius:4px">${esc(r.error)}</pre>` : ""}
        ${r.checks.length ? `<ul class="checks">${r.checks.map(c => `<li class="${c.ok ? "ok" : "no"}">${esc(c[LANG] || c.de)}</li>`).join("")}</ul>` : ""}
        ${notes.length ? `<div class="notes">${notes.join("")}</div>` : ""}
        <details class="code"><summary>${esc(t("examYourCode"))}</summary><pre class="codeblock">${highlight(res.code)}</pre></details>
        <details class="code"><summary>${esc(t("showSolution"))}</summary><pre class="codeblock">${highlight(ex.solution)}</pre></details>
        ${(ex.refs || []).length ? `<div class="refs" style="padding:0"><span class="eyebrow">${esc(t("scriptRefs"))}</span>${ex.refs.map(refChip).join("")}</div>` : ""}
      </div>
    </details>`;
  });
  html += repeat.length
    ? `<div class="review-refs"><span class="eyebrow">${esc(t("examRepeat"))}</span>${repeat.sort((a, b) => chIdx(SEC[a]?.ch) - chIdx(SEC[b]?.ch)).map(refChip).join("")}</div>`
    : `<div class="review-refs"><strong>${esc(t("examAllFull"))}</strong></div>`;
  $("exam-result").innerHTML = html;
}

/* ====================================================================== Info */
function renderInfo() {
  const de = LANG === "de";
  $("info-body").innerHTML = de ? `
    <p>Der CodingTrainer enthält ${allExercises().length} Aufgaben zu den Kapiteln 4–10 und den Anhängen A und B des Skripts (Version 4.0). Jede Aufgabe lässt sich nur mit dem lösen, was bis zu ihrem Kapitel im Skript steht.</p>
    <ul>

      <li><b>Automatische Stufe:</b> Zwei saubere Lösungen in Folge (höchstens zwei Prüfversuche, höchstens ein Tipp) heben die Stufe im Kapitel an; wer die Musterlösung ansieht oder lange hängt, bekommt leichtere Aufgaben.</li>
      <li><b>Klausurtraining:</b> zufällige Aufgaben aus den gewählten Kapiteln, optional mit Zeitlimit und ohne Ausführen (wie auf Papier). Kein Tutor und keine Tests bis zur Abgabe, danach Punkte, Musterlösungen und die Skriptabschnitte zum Wiederholen.</li>
      <li><b>KI-Tutor:</b> gibt Feedback und gestufte Tipps und verweist auf die passenden Abschnitte im Skript. Er nutzt das Claude-Konto der Person, die übt (ein kostenloses Konto genügt).</li>
      <li>Python läuft vollständig im Browser (Pyodide, Python 3.13, inkl. NumPy und pandas). Ihr Fortschritt wird nur in diesem Browser gespeichert.</li>
    </ul>
    <h3 style="font-size:16px;margin:12px 0 6px">Bedienung</h3>
    <ul>
      <li><b>Tastatur:</b> ${IS_MAC ? "⌘" : "Strg"}+Enter führt aus, Umschalt+${IS_MAC ? "⌘" : "Strg"}+Enter prüft. Im Editor rückt Tab ein; Escape und danach Tab verlässt den Editor.</li>
      <li><b>Kapitel:</b> Ein Klick auf den Kapitelnamen klappt die Aufgaben auf oder zu. Das Häkchen legt fest, aus welchen Kapiteln „Nächste Aufgabe“ und das Klausurtraining auswählen.</li>
      <li><b>Symbole:</b> ○ offen · <span style="color:var(--warn)">◍</span> versucht · <span style="color:var(--ok)">●</span> gelöst · Balken = Stufe 1 (Einstieg) bis 3 (Transfer).</li>
    </ul>
    <p><a href="https://profweber.github.io/programming/" target="_blank" rel="noopener">Zum Skript ↗</a></p>
    <p style="color:var(--muted);font-size:13px">CodingTrainer v${VERSION} · abgestimmt auf Skriptversion 4.0 · ${allExercises().length} Aufgaben${CONFIG.semester ? " · " + esc(CONFIG.semester) : ""}${offKeys().length ? " · ohne " + esc(offKeys().join(", ")) : ""}</p>` : `
    <p>The CodingTrainer contains ${allExercises().length} exercises for chapters 4–10 and appendices A and B of the lecture notes (version 4.0). Each exercise can be solved using only what the notes cover up to its chapter.</p>
    <ul>
      <li><b>Check</b> runs your code several times with different inputs, so hard-coded results are caught.</li>
      <li><b>Construct check:</b> if you use something that only appears in a later chapter or not at all in the notes (e.g. <code>lambda</code>, <code>.join()</code>), the trainer points it out. With “Only accept constructs from the notes”, the exercise doesn't count as solved yet.</li>
      <li><b>Adaptive level:</b> two clean solutions in a row (at most two checks, at most one hint) raise the level in that chapter; viewing the solution or getting stuck makes the next exercise easier.</li>
      <li><b>Exam practice:</b> random exercises from the selected chapters, optionally with a time limit and without running code (like on paper). No tutor and no tests until you submit; afterwards you get points, reference solutions and the sections of the notes to review.</li>
      <li><b>AI tutor:</b> gives feedback and graded hints and links to the matching sections of the notes. It uses the Claude account of the person practising (a free account is enough).</li>
      <li>Python runs entirely in your browser (Pyodide, Python 3.13, incl. NumPy and pandas). Your progress is stored in this browser only.</li>
    </ul>
    <h3 style="font-size:16px;margin:12px 0 6px">Using the trainer</h3>
    <ul>
      <li><b>Keyboard:</b> ${IS_MAC ? "⌘" : "Ctrl"}+Enter runs, Shift+${IS_MAC ? "⌘" : "Ctrl"}+Enter checks. In the editor Tab indents; Escape followed by Tab leaves the editor.</li>
      <li><b>Chapters:</b> clicking a chapter name expands or collapses its exercises. The tick decides which chapters “Next exercise” and exam practice choose from.</li>
      <li><b>Symbols:</b> ○ open · <span style="color:var(--warn)">◍</span> attempted · <span style="color:var(--ok)">●</span> solved · bars = level 1 (basics) to 3 (transfer).</li>
    </ul>
    <p><a href="https://profweber.github.io/programming/" target="_blank" rel="noopener">Open the lecture notes ↗</a></p>
    <p style="color:var(--muted);font-size:13px">CodingTrainer v${VERSION} · matched to lecture notes version 4.0 · ${allExercises().length} exercises${CONFIG.semester ? " · " + esc(CONFIG.semester) : ""}${offKeys().length ? " · without " + esc(offKeys().join(", ")) : ""}</p>`;

$("info-btn").onclick = () => { renderInfo(); $("info-dlg").showModal(); };
$("info-close").onclick = () => $("info-dlg").close();


/* ====================================================================== Mobile Navigation (Schublade) & Begrüßung */
const mqMobile = window.matchMedia("(max-width: 860px)");
function openNav() {
  if (!mqMobile.matches || S.view === "exam") return;
  document.body.classList.add("nav-open");
  $("nav-toggle").setAttribute("aria-expanded", "true");
  ["task-panel", "result-panel", "tutor", "welcome"].forEach(id => { const el = $(id); if (el) el.inert = true; });
  document.querySelector(".titleblock").inert = true; $("mbar").inert = true;
  setTimeout(() => { const cur = document.querySelector('#chapters [aria-current="true"]') || $("nav-close"); cur.focus(); if (cur.scrollIntoView) cur.scrollIntoView({ block: "center" }); }, 60);
}
function closeNav(toTask) {
  if (!document.body.classList.contains("nav-open")) return;
  document.body.classList.remove("nav-open");
  $("nav-toggle").setAttribute("aria-expanded", "false");
  ["task-panel", "result-panel", "tutor", "welcome"].forEach(id => { const el = $(id); if (el) el.inert = false; });
  document.querySelector(".titleblock").inert = false; $("mbar").inert = false;
  if (toTask) { window.scrollTo({ top: 0 }); $("task-panel").focus({ preventScroll: true }); }
  else $("nav-toggle").focus();
}
$("nav-toggle").onclick = () => document.body.classList.contains("nav-open") ? closeNav() : openNav();
$("nav-close").onclick = () => closeNav();
$("nav-backdrop").onclick = () => closeNav();
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("nav-open")) { e.preventDefault(); closeNav(); } });
mqMobile.addEventListener?.("change", () => { if (!mqMobile.matches) closeNav(); });
function renderMbar() {
  const ex = current();
  $("mbar-info").textContent = ex ? `${LANG === "de" ? "Kap." : "Ch."} ${ex.ch} · ${L(ex.title)}` : "";
}
function renderWelcome() {
  const w = $("welcome");
  if (S.welcomed || S.view === "exam") { w.hidden = true; return; }
  w.hidden = false;
  w.innerHTML = `<h2>${esc(t("welcomeTitle"))}</h2><ol>${t("welcomeSteps").map(s => `<li>${md(s).replace(/^<p>|<\/p>$/g, "")}</li>`).join("")}</ol><p>${esc(t("welcomeNote"))}</p><button type="button" class="btn dark" id="welcome-ok">${esc(t("welcomeOk"))}</button>`;
  $("welcome-ok").onclick = () => { S.welcomed = true; save(); w.hidden = true; $("task-panel").focus({ preventScroll: true }); };
}

/* ====================================================================== Start */
function setLang(l) { LANG = S.lang = l; save(); Tutor.reset(); renderAll(); const ex = current(); const store_ = examRunning() ? S.exam.codes : S.drafts; if (ex && store_[ex.id] === undefined) { ta.value = L(ex.starter); renderEditor(); } }
$("lang-de").onclick = () => setLang("de");
$("lang-en").onclick = () => setLang("en");

(async function boot() {
  await loadConfig();
  S.selected = new Set([...S.selected].filter(chapterOn));
  if (!S.selected.size) visibleChapters().slice(0, 3).forEach(c => S.selected.add(c.id));
  if (!current() || !S.selected.has(current().ch)) {
    const n = pickNext();
    if (n) S.currentId = n.id;
  }
  if (S.view === "exam" && S.exam && !S.exam.submitted && !S.exam.ids.every(id => byId(id))) S.exam = null;
  loadEditor();
  renderAll();
  Engine.start();
  Tutor.init();
  setInterval(tickExam, 1000);
  tickExam();
})();
</script>
