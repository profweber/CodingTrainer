<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CodingTrainer</title>
<meta name="description" content="Python-Übungen zum Skript „Programmierung für Ingenieurinnen und Ingenieure“ (Hochschule Trier)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
/* Layout: Zeichnungs-Schriftfeld als Kopf, darunter drei Spalten – Kapitel | Aufgabe + Editor | KI-Tutor. Millimeterpapier als Grund. */
:root {
  --paper: #edf1ef;
  --sheet: #fbfcfb;
  --ink: #17242c;
  --muted: #586972;
  --line: #cbd6d2;
  --grid: rgba(23, 36, 44, .045);
  --accent: #2344c4;
  --accent-soft: #e3e8fb;
  --accent-ink: #ffffff;
  --hi: #f6dc7a;
  --ok: #1b7546;
  --ok-soft: #e1f2e8;
  --warn: #9a5d06;
  --warn-soft: #fbf0dc;
  --bad: #b3232b;
  --bad-soft: #fbe5e6;
  --code-bg: #f5f7f6;
  --code-ink: #1e2a31;
  --tk-kw: #8b1fa6;
  --tk-str: #1b7546;
  --tk-num: #b2520b;
  --tk-com: #627177;
  --field: #7f8e93;
  --tk-fn: #2344c4;
  --tk-bi: #0f6f86;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1417; --sheet: #151d21; --ink: #e1e8e5; --muted: #93a39d; --line: #283439; --grid: rgba(225, 232, 229, .035);
    --accent: #93a8ff; --accent-soft: #1d2747; --accent-ink: #0e1417; --hi: #5f5216;
    --ok: #63cf93; --ok-soft: #12291d; --warn: #e7ae55; --warn-soft: #2c220f; --bad: #ff8086; --bad-soft: #321619;
    --code-bg: #10171a; --code-ink: #dfe7e4;
    --tk-kw: #d99cf0; --tk-str: #8fd8a9; --tk-num: #f2ad6f; --tk-com: #7d8e95; --field: #617176; --tk-fn: #93a8ff; --tk-bi: #6fd0e2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1417; --sheet: #151d21; --ink: #e1e8e5; --muted: #93a39d; --line: #283439; --grid: rgba(225, 232, 229, .035);
  --accent: #93a8ff; --accent-soft: #1d2747; --accent-ink: #0e1417; --hi: #5f5216;
  --ok: #63cf93; --ok-soft: #12291d; --warn: #e7ae55; --warn-soft: #2c220f; --bad: #ff8086; --bad-soft: #321619;
  --code-bg: #10171a; --code-ink: #dfe7e4;
  --tk-kw: #d99cf0; --tk-str: #8fd8a9; --tk-num: #f2ad6f; --tk-com: #7d8e95; --field: #617176; --tk-fn: #93a8ff; --tk-bi: #6fd0e2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 8px 8px;
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre, kbd { font-family: var(--font-mono); font-size: .88em; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }

/* ---------- Kopf: Schriftfeld */
.titleblock {
  max-width: 1560px; margin: 0 auto 12px;
  display: grid; grid-template-columns: auto 1fr auto; align-items: stretch;
  border: 1.5px solid var(--ink); background: var(--sheet);
}
.tb-mark {
  display: grid; place-items: center; padding: 6px 14px; border-right: 1.5px solid var(--ink);
  font: 700 22px/1 var(--font-display); letter-spacing: .04em;
}
.tb-mark span { display: block; font-size: 10px; letter-spacing: .14em; font-weight: 600; color: var(--muted); margin-top: 3px; }
.tb-name { padding: 8px 14px; min-width: 0; }
.tb-name h1 { font-size: 22px; line-height: 1.1; font-weight: 700; }
.tb-name p { margin: 2px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.tb-tools { display: flex; align-items: stretch; border-left: 1.5px solid var(--ink); }
.tb-cell { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 6px 12px; border-left: 1px solid var(--line); }
.tb-cell:first-child { border-left: 0; }
.tb-label { font: 600 11px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tb-value { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 6px; vertical-align: 1px; }
.dot.ready { background: var(--ok); }
.dot.err { background: var(--bad); }

.tb-cell .seg { align-self: flex-start; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: transparent; padding: 3px 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

/* ---------- Grundraster */
.app {
  max-width: 1560px; margin: 0 auto;
  display: grid; gap: 12px;
  grid-template-columns: 280px minmax(0, 1fr) 380px;
  align-items: start;
}
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.panel-h h2 { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.panel-b { padding: 12px 14px; }
.eyebrow { font: 600 11px/1.2 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- Kapitel */
.side { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); display: grid; gap: 12px; align-content: start;
  max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 1px; margin: -1px; }
.chapters { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.chap { border-radius: var(--r); }
.chap-row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 8px; padding: 6px 6px; border-radius: var(--r); }
.chap-row > label { display: grid; place-items: center; padding: 4px; margin: -4px; cursor: pointer; }
.chap-open { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 14px; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; color: inherit; border-radius: 4px; }
.chap-open .caret { color: var(--muted); font-size: 11px; transition: transform .15s; }
.chap-open[aria-expanded="true"] .caret { transform: rotate(90deg); }
.chap-row:hover { background: var(--code-bg); }
.chap-row label.chap-label { display: contents; }
.chap-row input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }
.chap-num { font: 700 15px/1 var(--font-display); border: 1.5px solid var(--ink); height: 26px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.chap-title { font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.chap-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chap-bar { grid-column: 2 / 3; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.chap-bar i { display: block; height: 100%; background: var(--ok); }
.chap.off .chap-num { border-color: var(--line); color: var(--muted); }
.chap.off .chap-title { color: var(--muted); }
.ex-list { list-style: none; margin: 2px 0 6px 44px; padding: 0; display: grid; gap: 1px; }
.ex-list button { width: 100%; text-align: left; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 6px; align-items: center; border: 0; background: transparent; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.ex-list button:hover { background: var(--code-bg); }
.ex-list button > span:nth-child(2) { overflow-wrap: anywhere; min-width: 0; }
.ex-list button.off-level { color: var(--muted); }
.ex-list button.off-level .pips i.on { background: var(--muted); border-color: var(--muted); }
.ex-list button[aria-current="true"] { background: var(--accent-soft); }
.ex-state { width: 10px; height: 10px; border: 1.5px solid var(--muted); border-radius: 50%; }
.ex-state.solved { background: var(--ok); border-color: var(--ok); }
.ex-state.tried { border-color: var(--warn); background: var(--warn-soft); }
.ex-state.peek { border-color: var(--muted); background: var(--line); }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 6px; height: 10px; border: 1px solid var(--muted); }
.pips i.on { background: var(--ink); border-color: var(--ink); }
.ex-ai { font-size: 10px; font-weight: 700; color: var(--accent); margin-left: 4px; }

.field { display: grid; gap: 6px; }
.field + .field { margin-top: 12px; }
.switch { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.switch input { margin-top: 3px; accent-color: var(--accent); }
.levelnote { font-size: 13px; color: var(--muted); margin: 0; }
.levelnote b { color: var(--ink); }

/* ---------- Aufgabe */
.main { display: grid; gap: 12px; min-width: 0; }
.task-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 14px 16px 6px; }
.task-head h2 { font-size: 26px; font-weight: 700; line-height: 1.1; flex: 1 1 260px; }
.tag { display: inline-flex; gap: 6px; align-items: center; font: 600 12px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tag .pips i { height: 11px; }
.badge-ai { font: 600 11px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 3px 6px; border-radius: 3px; }
.task-body { padding: 4px 16px 12px; max-width: 78ch; }
.task-body p { margin: 0 0 .6em; }
.task-body ul, .task-body ol { margin: 0 0 .6em; padding-left: 1.3em; }
.task-body code, .md code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 16px 14px; }
.ref {
  display: inline-flex; align-items: baseline; gap: 6px; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 13px; background: var(--sheet);
}
.ref:hover { border-color: var(--accent); }
.ref b { font: 700 11px/1 var(--font-mono); background: var(--ink); color: var(--sheet); border-radius: 999px; padding: 3px 6px; }
.ref::after { content: "↗"; color: var(--muted); font-size: 11px; }

/* ---------- Editor */
.editor-wrap { border-top: 1px solid var(--line); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--sheet); }
.toolbar .grow { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--sheet);
  padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
#subtitle a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
#subtitle a:hover { color: var(--accent); text-decoration-color: currentColor; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.dark { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.kbd { font: 500 11px/1 var(--font-mono); opacity: .7; }

.ed { --ed-lh: 21px; position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--code-bg); font: 14px/var(--ed-lh) var(--font-mono); }
.ed-gutter { padding: 12px 8px 12px 12px; text-align: right; color: var(--tk-com); user-select: none; border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: pre; min-width: 3.2em; }
.ed-gutter .err { color: var(--bad); font-weight: 600; }
.ed-area { position: relative; min-width: 0; overflow: hidden; }
.ed-area pre, .ed-area textarea {
  margin: 0; padding: 12px 14px; border: 0; font: inherit; white-space: pre; tab-size: 4; letter-spacing: 0;
  width: 100%; min-height: 100%;
}
.ed-area pre { position: absolute; inset: 0; color: var(--code-ink); pointer-events: none; overflow: hidden; }
.ed-area textarea {
  position: relative; display: block; resize: none; background: transparent; color: transparent; caret-color: var(--ink);
  overflow-x: auto; overflow-y: hidden; outline: none;
}
.ed-area textarea::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); color: transparent; }
.ed:has(textarea:focus-visible) { box-shadow: inset 0 0 0 2px var(--accent); }
.tk-kw { color: var(--tk-kw); font-weight: 600; }
.tk-str { color: var(--tk-str); }
.tk-num { color: var(--tk-num); }
.tk-com { color: var(--tk-com); font-style: italic; }
.tk-fn { color: var(--tk-fn); font-weight: 600; }
.tk-bi { color: var(--tk-bi); }
.tk-self { color: var(--tk-kw); font-style: italic; }
.errline { position: absolute; left: 0; right: 0; height: var(--ed-lh, 21px); background: var(--bad-soft); pointer-events: none; }

.io { display: grid; grid-template-columns: minmax(0, 1fr) 200px; border-top: 1px solid var(--line); }
.io > div { min-width: 0; }
.io .io-out { border-right: 1px solid var(--line); }
.io-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.console { margin: 0; padding: 10px 12px; font: 13px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 280px; overflow: auto; min-height: 64px; }
.console .stderr { color: var(--bad); }
.console .muted { color: var(--muted); }
#stdin { width: 100%; height: calc(100% - 31px); min-height: 72px; border: 0; padding: 10px 12px; font: 13px/1.5 var(--font-mono); resize: vertical; background: transparent; }

/* ---------- Ergebnisse */
.verdict { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.verdict strong { font: 700 18px/1.1 var(--font-display); letter-spacing: .02em; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.warn { background: var(--warn-soft); color: var(--warn); }
.verdict p { margin: 0; color: var(--ink); font-size: 14px; }
.meter { margin-left: auto; font: 700 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.checks { list-style: none; margin: 0; padding: 8px 16px 12px; display: grid; gap: 4px; }
.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.checks li::before { font-weight: 700; }
.checks li.ok::before { content: "✓"; color: var(--ok); }
.checks li.no::before { content: "✗"; color: var(--bad); }
.notes { padding: 0 16px 14px; display: grid; gap: 6px; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 6px 10px; font-size: 14px; border-radius: 0 4px 4px 0; }
.note.absent, .note.forbidden { border-color: var(--bad); background: var(--bad-soft); }
.note.missing { border-color: var(--accent); background: var(--accent-soft); }
.note a { margin-left: 4px; }
.solution { margin: 0 16px 16px; border: 1px dashed var(--line); border-radius: var(--r); }
.solution summary { cursor: pointer; padding: 8px 12px; font-weight: 600; }
.codeblock { margin: 0; padding: 10px 12px; background: var(--code-bg); font: 13px/1.5 var(--font-mono); overflow-x: auto; white-space: pre; border-radius: 0 0 var(--r) var(--r); }

/* ---------- KI-Tutor */
.tutor { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; max-height: calc(100vh - 24px); }
.tutor-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tutor-actions .btn { font-size: 13px; padding: 5px 10px; }
.hintmeter { display: inline-flex; gap: 2px; margin-left: 2px; }
.hintmeter i { width: 5px; height: 9px; border: 1px solid currentColor; opacity: .5; }
.hintmeter i.on { background: currentColor; opacity: 1; }
.chat { flex: 1; overflow-y: auto; padding: 12px 14px; display: grid; gap: 10px; align-content: start; min-height: 200px; }
.msg { font-size: 14px; line-height: 1.5; max-width: 100%; min-width: 0; }
.msg.user { justify-self: end; background: var(--accent-soft); border-radius: 10px 10px 2px 10px; padding: 6px 10px; max-width: 88%; }
.msg.ai { border-left: 2px solid var(--ink); padding-left: 10px; }
.msg.ai .who { font: 600 11px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.msg.sys { color: var(--muted); font-size: 13px; font-style: italic; }
.md p { margin: 0 0 .5em; }
.md ul, .md ol { margin: 0 0 .5em; padding-left: 1.2em; }
.md pre { margin: 0 0 .5em; padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; overflow-x: auto; font: 12.5px/1.45 var(--font-mono); white-space: pre; }
.md pre code { background: none; border: 0; padding: 0; }
.md .ref { font-size: 12px; margin: 1px 0; }
.thinking { color: var(--muted); font-style: italic; }
.chat-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); }
.chat-form textarea { resize: none; height: 40px; border: 1px solid var(--field); border-radius: var(--r); padding: 8px 10px; background: var(--sheet); font-size: 14px; }
.ai-off { padding: 14px; font-size: 14px; color: var(--muted); }
.gen { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.gen p { margin: 0; font-size: 13px; color: var(--muted); }

dialog { border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--sheet); color: var(--ink); max-width: min(640px, calc(100vw - 32px)); padding: 0; }
dialog::backdrop { background: rgba(10, 16, 20, .45); }
dialog .panel-b p { margin: 0 0 .7em; }
dialog .panel-b ul { margin: 0 0 .7em; padding-left: 1.2em; }

.empty { padding: 24px 16px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Klausurtraining */
.seg-wide { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
.seg-wide button { padding: 6px 8px; font-size: 14px; }
.seg-fill { width: 100%; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.exam-timer { font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.exam-timer.low { color: var(--bad); }
.exam-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.exam-nav { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.exam-nav button { width: 100%; text-align: left; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 0; background: transparent; padding: 6px; border-radius: var(--r); cursor: pointer; font-size: 14px; }
.exam-nav button:hover { background: var(--code-bg); }
.exam-nav button[aria-current="true"] { background: var(--accent-soft); }
.exam-nav .num { font: 700 15px/1 var(--font-display); border: 1.5px solid var(--ink); height: 26px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.exam-nav .meta { display: block; font-size: 12px; color: var(--muted); }
.exam-nav .state { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.exam-nav .state.edited { color: var(--ok); }
.exam-nav .state.full { color: var(--ok); font-weight: 600; }
.exam-nav .state.part { color: var(--warn); font-weight: 600; }
.exam-nav .state.zero { color: var(--bad); font-weight: 600; }

<script type="application/json" id="bank-data">[{"id": "k4-ohm", "ch": "4", "lvl": 1, "title": {"de": "Ohmsches Gesetz", "en": "Ohm's law"}, "task": {"de": "Die Spannung `U` (in V) und der Widerstand `R` (in Ω) sind vorgegeben. Berechnen Sie den Strom `I = U / R` und speichern Sie ihn in der Variable `I`. Geben Sie ihn anschließend mit zwei Nachkommastellen aus, z.B. `I = 4.89 A`.", "en": "Voltage `U` (in V) and resistance `R` (in Ω) are given. Compute the current `I = U / R`, store it in the variable `I` and print it with two decimal places, e.g. `I = 4.89 A`."}, "starter": {"de": "U = 230.0  # Spannung in V\nR = 47.0   # Widerstand in Ohm\n\n# Ihr Code:\n", "en": "U = 230.0  # voltage in V\nR = 47.0   # resistance in Ohm\n\n# your code:\n"}, "solution": "U = 230.0\nR = 47.0\nI = U / R\nprint(f\"I = {I:.2f} A\")\n", "tests": "\nns, out = run()\nI = need(ns, \"I\")\ncheck(approx(I, 230/47), \"I wird korrekt aus U und R berechnet\", \"I is computed correctly from U and R\")\ncheck(\"4.89\" in out, \"Ausgabe enthält den Strom mit zwei Nachkommastellen (4.89)\", \"Output shows the current with two decimals (4.89)\")\nns, out = run(sub={\"U\": 12.0, \"R\": 4.0})\ncheck(approx(ns.get(\"I\"), 3.0), \"Mit U = 12 V und R = 4 Ω ergibt sich I = 3 A (keine festen Zahlen verwenden!)\", \"With U = 12 V and R = 4 Ω the result is I = 3 A (don't hard-code numbers!)\")\ncheck(\"3.00\" in out, \"Ausgabe für U = 12 V, R = 4 Ω lautet ‚3.00‘\", \"Output for U = 12 V, R = 4 Ω shows '3.00'\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-temp", "ch": "4", "lvl": 1, "title": {"de": "Temperatur umrechnen", "en": "Converting temperatures"}, "task": {"de": "Gegeben ist eine Temperatur `celsius`. Berechnen Sie `fahrenheit` ($\\vartheta_\\mathrm{F} = \\vartheta_\\mathrm{C} \\cdot \\frac{9}{5} + 32$) und `kelvin` ($T = \\vartheta_\\mathrm{C} + 273.15$). Geben Sie beides in einer Zeile aus, z.B. `21.5 °C = 70.7 °F = 294.65 K` (Fahrenheit mit einer, Kelvin mit zwei Nachkommastellen).", "en": "A temperature `celsius` is given. Compute `fahrenheit` ($\\vartheta_\\mathrm{F} = \\vartheta_\\mathrm{C} \\cdot \\frac{9}{5} + 32$) and `kelvin` ($T = \\vartheta_\\mathrm{C} + 273.15$). Print both in one line, e.g. `21.5 °C = 70.7 °F = 294.65 K` (Fahrenheit with one, Kelvin with two decimals)."}, "starter": {"de": "celsius = 21.5\n\n# Ihr Code:\n", "en": "celsius = 21.5\n\n# your code:\n"}, "solution": "celsius = 21.5\nfahrenheit = celsius * 9 / 5 + 32\nkelvin = celsius + 273.15\nprint(f\"{celsius} °C = {fahrenheit:.1f} °F = {kelvin:.2f} K\")\n", "tests": "\nfor c in [21.5, -40.0, 100.0]:\n    ns, out = run(sub={\"celsius\": c})\n    f, k = need(ns, \"fahrenheit\", \"kelvin\")\n    check(approx(f, c * 9 / 5 + 32), f\"fahrenheit stimmt für {c} °C\", f\"fahrenheit is correct for {c} °C\")\n    check(approx(k, c + 273.15), f\"kelvin stimmt für {c} °C\", f\"kelvin is correct for {c} °C\")\n    check(f\"{c*9/5+32:.1f}\" in out and f\"{c+273.15:.2f}\" in out, f\"Ausgabe für {c} °C ist korrekt formatiert\", f\"Output for {c} °C is formatted correctly\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-energy", "ch": "4", "lvl": 1, "title": {"de": "Stromkosten", "en": "Electricity costs"}, "task": {"de": "Ein Gerät mit der Leistung `P` (in W) läuft `hours` Stunden am Tag. Berechnen Sie den Energiebedarf pro Tag in kWh (`energy_kwh`) und die Kosten pro Jahr (365 Tage) in Euro (`cost_year`) beim Preis `price` (€/kWh). Ausgabe mit jeweils zwei Nachkommastellen, z.B. `0.96 kWh pro Tag, 112.13 € pro Jahr`.", "en": "A device with power `P` (in W) runs `hours` hours a day. Compute the energy per day in kWh (`energy_kwh`) and the cost per year (365 days) in euros (`cost_year`) at the price `price` (€/kWh). Output with two decimals each, e.g. `0.96 kWh per day, 112.13 € per year`."}, "starter": {"de": "P = 40        # W\nhours = 24    # h pro Tag\nprice = 0.32  # € pro kWh\n\n# Ihr Code:\n", "en": "P = 40        # W\nhours = 24    # h per day\nprice = 0.32  # € per kWh\n\n# your code:\n"}, "solution": "P = 40\nhours = 24\nprice = 0.32\nenergy_kwh = P * hours / 1000\ncost_year = energy_kwh * 365 * price\nprint(f\"{energy_kwh:.2f} kWh pro Tag, {cost_year:.2f} € pro Jahr\")\n", "tests": "\nfor P, h, pr in [(40, 24, 0.32), (2000, 0.5, 0.40), (7, 10, 0.30)]:\n    ns, out = run(sub={\"P\": P, \"hours\": h, \"price\": pr})\n    e, c = need(ns, \"energy_kwh\", \"cost_year\")\n    ee = P * h / 1000; ec = ee * 365 * pr\n    check(approx(e, ee), f\"{P} W, {h} h: {ee:.3f} kWh pro Tag\", f\"{P} W, {h} h: {ee:.3f} kWh per day\")\n    check(approx(c, ec), f\"Jahreskosten {ec:.2f} €\", f\"yearly cost {ec:.2f} €\")\n    check(f\"{ec:.2f}\" in out, f\"Ausgabe zeigt {ec:.2f} €\", f\"Output shows {ec:.2f} €\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-pressure", "ch": "4", "lvl": 1, "title": {"de": "Druck umrechnen", "en": "Converting pressure"}, "task": {"de": "Ein Reifendruck ist in bar gegeben (`p_bar`). Rechnen Sie ihn in Pascal (`p_pa`, $1\\,\\mathrm{bar} = 10^5\\,\\mathrm{Pa}$) und in psi (`p_psi`, $1\\,\\mathrm{psi} = 6894.76\\,\\mathrm{Pa}$) um. Geben Sie Pascal in Exponentialschreibweise mit zwei Nachkommastellen aus (z.B. `2.40e+05 Pa`) und psi mit einer Nachkommastelle.", "en": "A tyre pressure is given in bar (`p_bar`). Convert it to pascal (`p_pa`, $1\\,\\mathrm{bar} = 10^5\\,\\mathrm{Pa}$) and to psi (`p_psi`, $1\\,\\mathrm{psi} = 6894.76\\,\\mathrm{Pa}$). Print pascal in scientific notation with two decimals (e.g. `2.40e+05 Pa`) and psi with one decimal."}, "starter": {"de": "p_bar = 2.4\n\n# Ihr Code:\n", "en": "p_bar = 2.4\n\n# your code:\n"}, "solution": "p_bar = 2.4\np_pa = p_bar * 1e5\np_psi = p_pa / 6894.76\nprint(f\"{p_pa:.2e} Pa = {p_psi:.1f} psi\")\n", "tests": "\nfor p in [2.4, 0.5, 200.0]:\n    ns, out = run(sub={\"p_bar\": p})\n    pa, psi = need(ns, \"p_pa\", \"p_psi\")\n    check(approx(pa, p * 1e5) and approx(psi, p * 1e5 / 6894.76), f\"{p} bar = {p*1e5:.0f} Pa = {p*1e5/6894.76:.2f} psi\", f\"{p} bar = {p*1e5:.0f} Pa = {p*1e5/6894.76:.2f} psi\")\n    check(f\"{p*1e5:.2e}\" in out, f\"Pascal in Exponentialschreibweise: {p*1e5:.2e}\", f\"Pascal in scientific notation: {p*1e5:.2e}\")\n    check(f\"{p*1e5/6894.76:.1f}\" in out, f\"psi mit einer Nachkommastelle: {p*1e5/6894.76:.1f}\", f\"psi with one decimal: {p*1e5/6894.76:.1f}\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-cylinder", "ch": "4", "lvl": 1, "title": {"de": "Masse eines Stahlzylinders", "en": "Mass of a steel cylinder"}, "task": {"de": "Ein Zylinder aus Stahl hat den Durchmesser `d` und die Höhe `h` (beide in mm). Berechnen Sie das Volumen `V_cm3` in cm³ ($V = \\pi r^2 h$, verwenden Sie `pi = 3.14159`) und die Masse `m_kg` in kg bei der Dichte `rho = 7.85` g/cm³. Achtung bei den Einheiten: $1\\,\\mathrm{cm^3} = 1000\\,\\mathrm{mm^3}$.", "en": "A steel cylinder has diameter `d` and height `h` (both in mm). Compute the volume `V_cm3` in cm³ ($V = \\pi r^2 h$, use `pi = 3.14159`) and the mass `m_kg` in kg for the density `rho = 7.85` g/cm³. Watch the units: $1\\,\\mathrm{cm^3} = 1000\\,\\mathrm{mm^3}$."}, "starter": {"de": "pi = 3.14159\nd = 40.0    # mm\nh = 100.0   # mm\nrho = 7.85  # g/cm³\n\n# Ihr Code:\n", "en": "pi = 3.14159\nd = 40.0    # mm\nh = 100.0   # mm\nrho = 7.85  # g/cm³\n\n# your code:\n"}, "solution": "pi = 3.14159\nd = 40.0\nh = 100.0\nrho = 7.85\nr = d / 2\nV_cm3 = pi * r**2 * h / 1000\nm_kg = V_cm3 * rho / 1000\nprint(f\"V = {V_cm3:.1f} cm³, m = {m_kg:.3f} kg\")\n", "tests": "\nfor d, h in [(40.0, 100.0), (10.0, 10.0), (120.0, 35.0)]:\n    ns, out = run(sub={\"d\": d, \"h\": h})\n    V, m = need(ns, \"V_cm3\", \"m_kg\")\n    eV = 3.14159 * (d / 2) ** 2 * h / 1000\n    check(approx(V, eV, 1e-5), f\"d = {d} mm, h = {h} mm: V ≈ {eV:.2f} cm³\", f\"d = {d} mm, h = {h} mm: V ≈ {eV:.2f} cm³\")\n    check(approx(m, eV * 7.85 / 1000, 1e-5), f\"Masse ≈ {eV*7.85/1000:.4f} kg\", f\"mass ≈ {eV*7.85/1000:.4f} kg\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-speed", "ch": "4", "lvl": 1, "title": {"de": "Durchschnittsgeschwindigkeit", "en": "Average speed"}, "task": {"de": "Ein Lieferwagen legt die Strecke `s_km` (in km) in `t_min` Minuten zurück. Berechnen Sie die Durchschnittsgeschwindigkeit in km/h (`v_kmh`) und in m/s (`v_ms`). Geben Sie beide Werte mit einer Nachkommastelle aus, z.B. `v = 64.0 km/h = 17.8 m/s`.\n\nTipp: Rechnen Sie die Minuten zuerst in Stunden um.", "en": "A delivery van covers the distance `s_km` (in km) in `t_min` minutes. Compute the average speed in km/h (`v_kmh`) and in m/s (`v_ms`). Print both values with one decimal, e.g. `v = 64.0 km/h = 17.8 m/s`.\n\nTip: convert the minutes to hours first."}, "starter": {"de": "s_km = 48.0   # Strecke in km\nt_min = 45    # Fahrzeit in Minuten\n\n# Ihr Code:\n", "en": "s_km = 48.0   # distance in km\nt_min = 45    # travel time in minutes\n\n# your code:\n"}, "solution": "s_km = 48.0\nt_min = 45\nv_kmh = s_km / (t_min / 60)\nv_ms = v_kmh / 3.6\nprint(f\"v = {v_kmh:.1f} km/h = {v_ms:.1f} m/s\")\n", "tests": "\nfor s, t in [(48.0, 45), (12.5, 10), (300.0, 150)]:\n    ns, out = run(sub={\"s_km\": s, \"t_min\": t})\n    vk, vm = need(ns, \"v_kmh\", \"v_ms\")\n    ek = s / (t / 60)\n    check(approx(vk, ek), f\"{s} km in {t} min: {ek:.2f} km/h\", f\"{s} km in {t} min: {ek:.2f} km/h\")\n    check(approx(vm, ek / 3.6), f\"= {ek/3.6:.3f} m/s\", f\"= {ek/3.6:.3f} m/s\")\n    check(f\"{ek:.1f}\" in out and f\"{ek/3.6:.1f}\" in out, \"Ausgabe mit einer Nachkommastelle\", \"Output with one decimal\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-density", "ch": "4", "lvl": 1, "title": {"de": "Werkstoff bestimmen", "en": "Identifying a material"}, "task": {"de": "Ein quaderförmiges Probestück hat die Kantenlängen `a`, `b`, `c` (in mm) und die Masse `m_g` (in g). Berechnen Sie das Volumen `V_cm3` in cm³ und die Dichte `rho` in g/cm³. Speichern Sie in `is_aluminium`, ob die Dichte zwischen 2.6 und 2.8 g/cm³ liegt (Comparison Chain). Ausgabe z.B. `Dichte: 2.70 g/cm³, Aluminium: True`.", "en": "A cuboid specimen has the edge lengths `a`, `b`, `c` (in mm) and the mass `m_g` (in g). Compute the volume `V_cm3` in cm³ and the density `rho` in g/cm³. Store in `is_aluminium` whether the density lies between 2.6 and 2.8 g/cm³ (comparison chain). Output e.g. `Density: 2.70 g/cm³, aluminium: True`."}, "starter": {"de": "a = 50.0   # mm\nb = 20.0   # mm\nc = 10.0   # mm\nm_g = 27.0 # g\n\n# Ihr Code:\n", "en": "a = 50.0   # mm\nb = 20.0   # mm\nc = 10.0   # mm\nm_g = 27.0 # g\n\n# your code:\n"}, "solution": "a = 50.0\nb = 20.0\nc = 10.0\nm_g = 27.0\nV_cm3 = a * b * c / 1000\nrho = m_g / V_cm3\nis_aluminium = 2.6 <= rho <= 2.8\nprint(f\"Dichte: {rho:.2f} g/cm³, Aluminium: {is_aluminium}\")\n", "tests": "\nfor a, b, c, m in [(50.0, 20.0, 10.0, 27.0), (40.0, 40.0, 10.0, 125.6), (100.0, 10.0, 10.0, 26.5), (50.0, 20.0, 10.0, 29.0)]:\n    ns, out = run(sub={\"a\": a, \"b\": b, \"c\": c, \"m_g\": m})\n    V, r, al = need(ns, \"V_cm3\", \"rho\", \"is_aluminium\")\n    eV = a * b * c / 1000; er = m / eV\n    check(approx(V, eV), f\"{a}×{b}×{c} mm = {eV:g} cm³\", f\"{a}×{b}×{c} mm = {eV:g} cm³\")\n    check(approx(r, er), f\"Dichte = {er:.3f} g/cm³\", f\"density = {er:.3f} g/cm³\")\n    check(al is (2.6 <= er <= 2.8), f\"is_aluminium = {2.6 <= er <= 2.8}\", f\"is_aluminium = {2.6 <= er <= 2.8}\")\n", "refs": ["4.2", "4.4"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-label", "ch": "4", "lvl": 1, "title": {"de": "Typenschild drucken", "en": "Printing a nameplate"}, "task": {"de": "Lesen Sie mit `input()` die Gerätebezeichnung (`device`) und den Standort (`location`) ein. Setzen Sie daraus mit einem f-String den Text `label` zusammen, z.B. `Gerät: Pumpe P-301 | Standort: Halle 2`, und geben Sie ihn aus. Speichern Sie in `n_chars` die Anzahl der Zeichen von `label` – der Etikettendrucker schafft höchstens 40 Zeichen; speichern Sie in `fits`, ob das Etikett passt.\n\nEingaben für „Ausführen“ tragen Sie im Feld *Eingaben für input()* ein, eine pro Zeile.", "en": "Use `input()` to read the device name (`device`) and the location (`location`). Build the text `label` from them with an f-string, e.g. `Device: Pump P-301 | Location: Hall 2`, and print it. Store the number of characters of `label` in `n_chars` – the label printer can handle at most 40 characters; store in `fits` whether the label fits.\n\nInputs for “Run” go into the field *Input for input()*, one per line."}, "starter": {"de": "# Bezeichnung und Standort einlesen\n", "en": "# read name and location\n"}, "solution": "device = input(\"Gerät: \")\nlocation = input(\"Standort: \")\nlabel = f\"Gerät: {device} | Standort: {location}\"\nprint(label)\nn_chars = len(label)\nfits = n_chars <= 40\n", "tests": "\nfor d, l in [(\"Pumpe P-301\", \"Halle 2\"), (\"Kompressor K1\", \"Technikraum Untergeschoss Nord\"), (\"X\", \"Y\")]:\n    ns, out = run(inputs=[d, l])\n    dev, loc, lab, n, f = need(ns, \"device\", \"location\", \"label\", \"n_chars\", \"fits\")\n    check(dev == d and loc == l, \"device und location enthalten die Eingaben\", \"device and location hold the inputs\")\n    check(isinstance(lab, str) and d in lab and l in lab and lab.index(d) < lab.index(l), f\"label enthält {d!r} und danach {l!r}\", f\"label contains {d!r} followed by {l!r}\")\n    check(n == len(lab) and f is (len(lab) <= 40), f\"n_chars = {len(lab)}, fits = {len(lab) <= 40}\", f\"n_chars = {len(lab)}, fits = {len(lab) <= 40}\")\n    check(lab in out, \"label wird ausgegeben\", \"label is printed\")\nns, out = run(inputs=[\"X\", \"Y\"])\nbase = len(ns[\"label\"]) - 1 if isinstance(ns.get(\"label\"), str) else 99\nfor k in [40 - base, 41 - base]:\n    if k < 1:\n        continue\n    ns, out = run(inputs=[\"X\" * k, \"Y\"])\n    lab, f = ns.get(\"label\"), ns.get(\"fits\")\n    if isinstance(lab, str) and len(lab) in (40, 41):\n        check(f is (len(lab) <= 40), f\"Etikett mit genau {len(lab)} Zeichen: fits = {len(lab) <= 40}\", f\"label with exactly {len(lab)} characters: fits = {len(lab) <= 40}\")\n", "stdin": "Pumpe P-301\nHalle 2\n", "require": ["input", "fstring"], "refs": ["4.3e", "4.3", "4.5"], "forbid": [], "topics": []}, {"id": "k4-lineloss", "ch": "4", "lvl": 1, "title": {"de": "Leitungsverluste", "en": "Line losses"}, "task": {"de": "Über eine Zuleitung mit dem Widerstand `R_line` (Ω) fließt der Strom `I` (A) zu einem Verbraucher mit der Leistung `P_load` (W). Berechnen Sie die Verlustleistung in der Leitung `P_loss = I² · R` und ihren Anteil an der Verbraucherleistung in Prozent (`loss_percent`). Geben Sie beides mit zwei Nachkommastellen aus.\n\nAchtung: Potenz mit `**`, nicht mit `^`!", "en": "The current `I` (A) flows through a supply line with resistance `R_line` (Ω) to a load with power `P_load` (W). Compute the power loss in the line `P_loss = I² · R` and its share of the load power in percent (`loss_percent`). Print both with two decimals.\n\nCareful: power with `**`, not with `^`!"}, "starter": {"de": "R_line = 0.35   # Ohm\nI = 16.0        # A\nP_load = 3500.0 # W\n\n# Ihr Code:\n", "en": "R_line = 0.35   # Ohm\nI = 16.0        # A\nP_load = 3500.0 # W\n\n# your code:\n"}, "solution": "R_line = 0.35\nI = 16.0\nP_load = 3500.0\nP_loss = I**2 * R_line\nloss_percent = P_loss / P_load * 100\nprint(f\"Verlust: {P_loss:.2f} W ({loss_percent:.2f} %)\")\n", "tests": "\nfor R, I, P in [(0.35, 16.0, 3500.0), (0.1, 10.0, 2000.0), (1.2, 2.5, 500.0)]:\n    ns, out = run(sub={\"R_line\": R, \"I\": I, \"P_load\": P})\n    pl, lp = need(ns, \"P_loss\", \"loss_percent\")\n    e = I * I * R\n    check(approx(pl, e), f\"I = {I} A, R = {R} Ω: P_loss = {e:.2f} W\", f\"I = {I} A, R = {R} Ω: P_loss = {e:.2f} W\")\n    check(approx(lp, e / P * 100), f\"Anteil = {e/P*100:.2f} %\", f\"share = {e/P*100:.2f} %\")\n    check(f\"{e:.2f}\" in out and f\"{e/P*100:.2f}\" in out, \"Ausgabe mit zwei Nachkommastellen\", \"Output with two decimals\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-wavelength", "ch": "4", "lvl": 1, "title": {"de": "Wellenlänge und Exponentialschreibweise", "en": "Wavelength and scientific notation"}, "task": {"de": "Eine Funkwelle hat die Frequenz `f` (Hz). Mit der Lichtgeschwindigkeit `c = 3e8` m/s gilt für die Wellenlänge $\\lambda = c / f$. Berechnen Sie `wavelength` (m) und die Periodendauer `T = 1 / f` (s). Geben Sie beide Werte in Exponentialschreibweise mit zwei Nachkommastellen aus (Formatangabe `.2e`), z.B. `λ = 3.46e-01 m, T = 1.15e-09 s`.", "en": "A radio wave has the frequency `f` (Hz). With the speed of light `c = 3e8` m/s, the wavelength is $\\lambda = c / f$. Compute `wavelength` (m) and the period `T = 1 / f` (s). Print both values in scientific notation with two decimals (format spec `.2e`), e.g. `λ = 3.46e-01 m, T = 1.15e-09 s`."}, "starter": {"de": "c = 3e8      # m/s\nf = 868e6    # Hz (LoRa-Funk)\n\n# Ihr Code:\n", "en": "c = 3e8      # m/s\nf = 868e6    # Hz (LoRa radio)\n\n# your code:\n"}, "solution": "c = 3e8\nf = 868e6\nwavelength = c / f\nT = 1 / f\nprint(f\"λ = {wavelength:.2e} m, T = {T:.2e} s\")\n", "tests": "\nfor f in [868e6, 50.0, 2.4e9]:\n    ns, out = run(sub={\"f\": f})\n    w, T = need(ns, \"wavelength\", \"T\")\n    check(approx(w, 3e8 / f) and approx(T, 1 / f), f\"f = {f:g} Hz: λ = {3e8/f:.3e} m, T = {1/f:.3e} s\", f\"f = {f:g} Hz: λ = {3e8/f:.3e} m, T = {1/f:.3e} s\")\n    check(f\"{3e8/f:.2e}\" in out and f\"{1/f:.2e}\" in out, \"Ausgabe im Format .2e\", \"Output in .2e format\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-time", "ch": "4", "lvl": 2, "title": {"de": "Messdauer zerlegen", "en": "Splitting a measurement duration"}, "task": {"de": "Ein Datenlogger hat `seconds` Sekunden lang gemessen. Zerlegen Sie die Dauer mit Ganzzahl-Division `//` und Modulo `%` in Stunden `h`, Minuten `m` und Sekunden `s` und geben Sie z.B. `2 h 3 min 4 s` aus.", "en": "A data logger measured for `seconds` seconds. Use integer division `//` and modulo `%` to split the duration into hours `h`, minutes `m` and seconds `s`, and print e.g. `2 h 3 min 4 s`."}, "starter": {"de": "seconds = 7384\n\n# Ihr Code:\n", "en": "seconds = 7384\n\n# your code:\n"}, "solution": "seconds = 7384\nh = seconds // 3600\nm = seconds % 3600 // 60\ns = seconds % 60\nprint(f\"{h} h {m} min {s} s\")\n", "tests": "\nfor sec in [7384, 59, 3600, 86399]:\n    ns, out = run(sub={\"seconds\": sec})\n    h, m, s = need(ns, \"h\", \"m\", \"s\")\n    eh, em, es = sec // 3600, sec % 3600 // 60, sec % 60\n    check((h, m, s) == (eh, em, es), f\"{sec} s = {eh} h {em} min {es} s\", f\"{sec} s = {eh} h {em} min {es} s\")\n    check(f\"{eh} h {em} min {es} s\" in out, f\"Ausgabe für {sec} s lautet ‚{eh} h {em} min {es} s‘\", f\"Output for {sec} s is '{eh} h {em} min {es} s'\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-tol", "ch": "4", "lvl": 2, "title": {"de": "Toleranzprüfung", "en": "Tolerance check"}, "task": {"de": "Eine Welle hat das Nennmaß `nominal` (mm) und die Toleranz `tol` (± mm). Speichern Sie in `in_tolerance` den Wahrheitswert, ob das Messmaß `measured` innerhalb der Toleranz liegt (Grenzen eingeschlossen). Nutzen Sie dafür eine Comparison Chain. Geben Sie `Maß in Toleranz: True` bzw. `False` aus.", "en": "A shaft has the nominal size `nominal` (mm) and tolerance `tol` (± mm). Store in `in_tolerance` whether the measured size `measured` lies within the tolerance (limits included). Use a comparison chain. Print `In tolerance: True` or `False`."}, "starter": {"de": "nominal = 25.0   # mm\ntol = 0.05       # mm\nmeasured = 25.03 # mm\n\n# Ihr Code:\n", "en": "nominal = 25.0   # mm\ntol = 0.05       # mm\nmeasured = 25.03 # mm\n\n# your code:\n"}, "solution": "nominal = 25.0\ntol = 0.05\nmeasured = 25.03\nin_tolerance = nominal - tol <= measured <= nominal + tol\nprint(\"Maß in Toleranz:\", in_tolerance)\n", "tests": "\ncases = [(25.03, True), (24.96, True), (25.06, False), (24.90, False), (25.0, True)]\nfor m, exp in cases:\n    ns, out = run(sub={\"measured\": m})\n    v = need(ns, \"in_tolerance\")\n    check(v is exp, f\"Für {m} mm ist das Ergebnis {exp}\", f\"For {m} mm the result is {exp}\")\n    check(str(exp) in out, f\"Ausgabe für {m} mm enthält {exp}\", f\"Output for {m} mm contains {exp}\")\n", "refs": ["4.4"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-current-loop", "ch": "4", "lvl": 2, "title": {"de": "4–20-mA-Signal", "en": "4–20 mA signal"}, "task": {"de": "Ein Drucksensor liefert ein 4–20-mA-Signal: 4 mA entsprechen 0 bar, 20 mA entsprechen `p_max` bar. Für den Strom `i_mA` berechnen Sie:\n- `valid`: ob der Strom im Bereich 4 bis 20 mA liegt (Grenzen eingeschlossen, Comparison Chain)\n- `wire_break`: ob der Strom unter 3.8 mA liegt (Hinweis auf Drahtbruch)\n- `pressure`: den Druck in bar (lineare Umrechnung)\n\nGeben Sie den Druck mit zwei Nachkommastellen aus.", "en": "A pressure sensor delivers a 4–20 mA signal: 4 mA corresponds to 0 bar, 20 mA to `p_max` bar. For the current `i_mA` compute:\n- `valid`: whether the current lies within 4 to 20 mA (limits included, comparison chain)\n- `wire_break`: whether the current is below 3.8 mA (indicates a broken wire)\n- `pressure`: the pressure in bar (linear conversion)\n\nPrint the pressure with two decimals."}, "starter": {"de": "p_max = 10.0  # bar bei 20 mA\ni_mA = 12.0\n\n# Ihr Code:\n", "en": "p_max = 10.0  # bar at 20 mA\ni_mA = 12.0\n\n# your code:\n"}, "solution": "p_max = 10.0\ni_mA = 12.0\nvalid = 4 <= i_mA <= 20\nwire_break = i_mA < 3.8\npressure = (i_mA - 4) / 16 * p_max\nprint(f\"Druck: {pressure:.2f} bar, gültig: {valid}, Drahtbruch: {wire_break}\")\n", "tests": "\nfor i, pm in [(12.0, 10.0), (4.0, 10.0), (20.0, 250.0), (3.5, 10.0), (21.0, 16.0), (3.9, 10.0), (3.8, 10.0)]:\n    ns, out = run(sub={\"i_mA\": i, \"p_max\": pm})\n    v, w, p = need(ns, \"valid\", \"wire_break\", \"pressure\")\n    check(v is (4 <= i <= 20), f\"{i} mA: valid = {4 <= i <= 20}\", f\"{i} mA: valid = {4 <= i <= 20}\")\n    check(w is (i < 3.8), f\"{i} mA: wire_break = {i < 3.8}\", f\"{i} mA: wire_break = {i < 3.8}\")\n    check(approx(p, (i - 4) / 16 * pm), f\"{i} mA bei p_max = {pm} bar: {(i-4)/16*pm:.2f} bar\", f\"{i} mA with p_max = {pm} bar: {(i-4)/16*pm:.2f} bar\")\n", "refs": ["4.4", "4.2"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-resistors", "ch": "4", "lvl": 2, "title": {"de": "Reihen- und Parallelschaltung", "en": "Series and parallel circuits"}, "task": {"de": "Zwei Widerstände `R1` und `R2` (Ω) sind gegeben. Berechnen Sie den Gesamtwiderstand der Reihenschaltung `R_series` und der Parallelschaltung `R_parallel` $= \\dfrac{R_1 R_2}{R_1 + R_2}$. Speichern Sie in `smaller_than_both`, ob `R_parallel` kleiner als beide Einzelwiderstände ist. Geben Sie beide Widerstände auf eine Nachkommastelle aus.", "en": "Two resistors `R1` and `R2` (Ω) are given. Compute the total resistance of the series circuit `R_series` and of the parallel circuit `R_parallel` $= \\dfrac{R_1 R_2}{R_1 + R_2}$. Store in `smaller_than_both` whether `R_parallel` is smaller than both individual resistors. Print both resistances with one decimal."}, "starter": {"de": "R1 = 220.0\nR2 = 330.0\n\n# Ihr Code:\n", "en": "R1 = 220.0\nR2 = 330.0\n\n# your code:\n"}, "solution": "R1 = 220.0\nR2 = 330.0\nR_series = R1 + R2\nR_parallel = R1 * R2 / (R1 + R2)\nsmaller_than_both = R_parallel < R1 and R_parallel < R2\nprint(f\"Reihe: {R_series:.1f} Ohm, parallel: {R_parallel:.1f} Ohm\")\n", "tests": "\nfor a, b in [(220.0, 330.0), (100.0, 100.0), (4.7, 1000.0)]:\n    ns, out = run(sub={\"R1\": a, \"R2\": b})\n    s, p, sm = need(ns, \"R_series\", \"R_parallel\", \"smaller_than_both\")\n    ep = a * b / (a + b)\n    check(approx(s, a + b), f\"Reihe {a} + {b} = {a+b} Ω\", f\"Series {a} + {b} = {a+b} Ω\")\n    check(approx(p, ep), f\"Parallel ≈ {ep:.2f} Ω\", f\"Parallel ≈ {ep:.2f} Ω\")\n    check(sm is True, \"smaller_than_both ist True\", \"smaller_than_both is True\")\n    check(f\"{ep:.1f}\" in out, f\"Ausgabe zeigt {ep:.1f}\", f\"Output shows {ep:.1f}\")\n", "refs": ["4.2", "4.4"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-serial", "ch": "4", "lvl": 2, "title": {"de": "Seriennummer prüfen", "en": "Checking a serial number"}, "task": {"de": "Eine Seriennummer `serial` ist gültig, wenn sie genau 12 Zeichen lang ist, `\"TR\"` enthält und das Jahr `year` (als Text gegeben) enthält, aber **nicht** das Wort `\"TEST\"`. Speichern Sie die Teilergebnisse in `length_ok`, `has_prefix`, `has_year`, `is_test` und das Gesamtergebnis in `valid`. Geben Sie `valid` aus.", "en": "A serial number `serial` is valid if it is exactly 12 characters long, contains `\"TR\"` and the year `year` (given as text), but does **not** contain the word `\"TEST\"`. Store the partial results in `length_ok`, `has_prefix`, `has_year`, `is_test` and the overall result in `valid`. Print `valid`."}, "starter": {"de": "serial = \"TR-2026-0457\"\nyear = \"2026\"\n\n# Ihr Code:\n", "en": "serial = \"TR-2026-0457\"\nyear = \"2026\"\n\n# your code:\n"}, "solution": "serial = \"TR-2026-0457\"\nyear = \"2026\"\nlength_ok = len(serial) == 12\nhas_prefix = \"TR\" in serial\nhas_year = year in serial\nis_test = \"TEST\" in serial\nvalid = length_ok and has_prefix and has_year and not is_test\nprint(\"Gültig:\", valid)\n", "tests": "\ncases = [(\"TR-2026-0457\", \"2026\", True), (\"TR-2025-0457\", \"2026\", False), (\"TR-2026-457\", \"2026\", False), (\"XX-2026-0457\", \"2026\", False), (\"TR-TEST-2026\", \"2026\", False)]\nfor s, y, e in cases:\n    ns, out = run(sub={\"serial\": s, \"year\": y})\n    v = need(ns, \"valid\")\n    check(v is e, f\"{s!r} (Jahr {y}): valid = {e}\", f\"{s!r} (year {y}): valid = {e}\")\nns, out = run(sub={\"serial\": \"TR-TEST-2026\"})\ncheck(ns.get(\"is_test\") is True and ns.get(\"length_ok\") is True, \"Teilergebnisse für 'TR-TEST-2026' stimmen\", \"Partial results for 'TR-TEST-2026' are correct\")\n", "refs": ["4.4", "4.5"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-stock", "ch": "4", "lvl": 2, "title": {"de": "Lagerbuchungen", "en": "Stock bookings"}, "task": {"de": "Der Bestand `stock` eines Lagerartikels wird im Laufe eines Tages verändert. Verwenden Sie **nur erweiterte Zuweisungen** (`+=`, `-=`, `*=`) auf `stock`:\n1. Wareneingang `incoming` Stück\n2. Entnahme `outgoing` Stück\n3. Bei der Inventur werden `damaged_percent` Prozent des Bestands als beschädigt ausgebucht (Bestand mit dem passenden Faktor multiplizieren).\n\nSpeichern Sie außerdem in `reorder`, ob der Bestand danach unter dem Meldebestand `min_stock` liegt, und geben Sie Bestand (eine Nachkommastelle) und `reorder` aus.", "en": "The quantity `stock` of a stock item changes during a day. Use **only augmented assignments** (`+=`, `-=`, `*=`) on `stock`:\n1. Goods receipt of `incoming` pieces\n2. Withdrawal of `outgoing` pieces\n3. At the stock-take, `damaged_percent` percent of the stock are written off as damaged (multiply the stock by the matching factor).\n\nAlso store in `reorder` whether the stock is then below the reorder level `min_stock`, and print the stock (one decimal) and `reorder`."}, "starter": {"de": "stock = 120\nincoming = 40\noutgoing = 95\ndamaged_percent = 5\nmin_stock = 60\n\n# Ihr Code:\n", "en": "stock = 120\nincoming = 40\noutgoing = 95\ndamaged_percent = 5\nmin_stock = 60\n\n# your code:\n"}, "solution": "stock = 120\nincoming = 40\noutgoing = 95\ndamaged_percent = 5\nmin_stock = 60\nstock += incoming\nstock -= outgoing\nstock *= 1 - damaged_percent / 100\nreorder = stock < min_stock\nprint(f\"Bestand: {stock:.1f} Stück, nachbestellen: {reorder}\")\n", "tests": "\nfor st, i, o, d, mn in [(120, 40, 95, 5, 60), (500, 0, 100, 0, 100), (30, 10, 0, 50, 25)]:\n    ns, out = run(sub={\"stock\": st, \"incoming\": i, \"outgoing\": o, \"damaged_percent\": d, \"min_stock\": mn})\n    s, r = need(ns, \"stock\", \"reorder\")\n    e = (st + i - o) * (1 - d / 100)\n    check(approx(s, e), f\"Start {st}, +{i}, −{o}, −{d} %: Bestand {e:g}\", f\"start {st}, +{i}, −{o}, −{d} %: stock {e:g}\")\n    check(r is (e < mn), f\"reorder = {e < mn} (Meldebestand {mn})\", f\"reorder = {e < mn} (reorder level {mn})\")\ncheck(\"+=\" in SOURCE and \"-=\" in SOURCE and \"*=\" in SOURCE, \"Mit +=, -= und *= gelöst\", \"Solved with +=, -= and *=\")\n", "require": ["augassign"], "refs": ["4.3", "4.4"], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-holes", "ch": "4", "lvl": 2, "title": {"de": "Lochreihe in einem Flachstahl", "en": "Row of holes in a flat bar"}, "task": {"de": "In einen Flachstahl der Länge `L` (mm) soll eine Lochreihe gebohrt werden. Zu beiden Enden muss der Randabstand `e` eingehalten werden, die Löcher haben den Abstand `p` (Teilung). Berechnen Sie mit Ganzzahl-Division und Modulo\n- `usable`: die nutzbare Länge $L - 2e$\n- `n_holes`: die Anzahl der Löcher (das erste Loch sitzt genau am Randabstand, dann alle `p` mm eins – also `usable // p + 1`)\n- `rest`: wie viel nutzbare Länge hinter dem letzten Loch übrig bleibt (`%`)\n\nAusgabe z.B. `9 Löcher, Rest 0 mm`.", "en": "A row of holes is to be drilled into a flat bar of length `L` (mm). The edge distance `e` must be kept at both ends; the holes are `p` apart (pitch). Using integer division and modulo, compute\n- `usable`: the usable length $L - 2e$\n- `n_holes`: the number of holes (the first hole sits exactly at the edge distance, then one every `p` mm – i.e. `usable // p + 1`)\n- `rest`: how much usable length remains after the last hole (`%`)\n\nOutput e.g. `9 holes, rest 0 mm`."}, "starter": {"de": "L = 1000   # mm\ne = 40     # mm Randabstand\np = 115    # mm Teilung\n\n# Ihr Code:\n", "en": "L = 1000   # mm\ne = 40     # mm edge distance\np = 115    # mm pitch\n\n# your code:\n"}, "solution": "L = 1000\ne = 40\np = 115\nusable = L - 2 * e\nn_holes = usable // p + 1\nrest = usable % p\nprint(f\"{n_holes} Löcher, Rest {rest} mm\")\n", "tests": "\nfor L, e, p in [(1000, 40, 115), (600, 30, 60), (250, 25, 300), (2400, 50, 100)]:\n    ns, out = run(sub={\"L\": L, \"e\": e, \"p\": p})\n    u, n, r = need(ns, \"usable\", \"n_holes\", \"rest\")\n    eu = L - 2 * e\n    check(u == eu, f\"L = {L}, e = {e}: nutzbar {eu} mm\", f\"L = {L}, e = {e}: usable {eu} mm\")\n    check(n == eu // p + 1 and r == eu % p, f\"Teilung {p}: {eu // p + 1} Löcher, Rest {eu % p} mm\", f\"pitch {p}: {eu // p + 1} holes, rest {eu % p} mm\")\n    check(f\"{eu // p + 1}\" in out and f\"{eu % p}\" in out, \"Ausgabe enthält Anzahl und Rest\", \"Output contains count and rest\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-grid", "ch": "4", "lvl": 2, "title": {"de": "Netzqualität prüfen", "en": "Checking power quality"}, "task": {"de": "Ein Netzanalysator misst Spannung `U` (V), Frequenz `f` (Hz) und Oberschwingungsgehalt `thd` (%). Nach der Norm gelten (vereinfacht) folgende Grenzen:\n- Spannung zwischen 207 und 253 V (Grenzen eingeschlossen)\n- Frequenz zwischen 49.8 und 50.2 Hz (Grenzen eingeschlossen)\n- THD kleiner als 8 %\n\nSpeichern Sie die drei Teilergebnisse in `u_ok`, `f_ok`, `thd_ok` (Comparison Chains, wo es passt), das Gesamtergebnis in `grid_ok` und in `alarm` das Gegenteil davon (mit `not`).", "en": "A power analyser measures voltage `U` (V), frequency `f` (Hz) and harmonic content `thd` (%). According to the standard (simplified), these limits apply:\n- voltage between 207 and 253 V (limits included)\n- frequency between 49.8 and 50.2 Hz (limits included)\n- THD less than 8 %\n\nStore the three partial results in `u_ok`, `f_ok`, `thd_ok` (comparison chains where they fit), the overall result in `grid_ok` and its opposite (using `not`) in `alarm`."}, "starter": {"de": "U = 231.4   # V\nf = 50.03   # Hz\nthd = 3.2   # %\n\n# Ihr Code:\n", "en": "U = 231.4   # V\nf = 50.03   # Hz\nthd = 3.2   # %\n\n# your code:\n"}, "solution": "U = 231.4\nf = 50.03\nthd = 3.2\nu_ok = 207 <= U <= 253\nf_ok = 49.8 <= f <= 50.2\nthd_ok = thd < 8\ngrid_ok = u_ok and f_ok and thd_ok\nalarm = not grid_ok\nprint(\"Netz ok:\", grid_ok, \"Alarm:\", alarm)\n", "tests": "\ncases = [(231.4, 50.03, 3.2), (207.0, 49.8, 7.99), (253.0, 50.2, 2.0), (206.9, 50.0, 1.0), (240.0, 50.21, 2.0), (230.0, 50.0, 8.0), (253.1, 50.0, 2.0), (260.0, 48.0, 12.0)]\nfor U, f, t in cases:\n    ns, out = run(sub={\"U\": U, \"f\": f, \"thd\": t})\n    a, b, c, g, al = need(ns, \"u_ok\", \"f_ok\", \"thd_ok\", \"grid_ok\", \"alarm\")\n    ea, eb, ec = 207 <= U <= 253, 49.8 <= f <= 50.2, t < 8\n    check((a, b, c) == (ea, eb, ec), f\"U = {U}, f = {f}, THD = {t}: Teilergebnisse {ea}, {eb}, {ec}\", f\"U = {U}, f = {f}, THD = {t}: partial results {ea}, {eb}, {ec}\")\n    check(g is (ea and eb and ec) and al is (not (ea and eb and ec)), f\"grid_ok = {ea and eb and ec}, alarm = {not (ea and eb and ec)}\", f\"grid_ok = {ea and eb and ec}, alarm = {not (ea and eb and ec)}\")\n", "require": ["boolop"], "refs": ["4.4"], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-cutting", "ch": "4", "lvl": 2, "title": {"de": "Stangen zuschneiden", "en": "Cutting bars to length"}, "task": {"de": "Eine Stange der Länge `L` (mm) wird mit einer Säge in `n` gleich lange Stücke geteilt. Jeder Schnitt kostet die Sägeblattbreite `kerf` (mm), bei $n$ Stücken gibt es $n - 1$ Schnitte. Berechnen Sie\n- `piece`: die Länge eines Stücks, auf 0.1 mm gerundet (`round(…, 1)`)\n- `loss`: den gesamten Verschnitt durch die Schnitte in mm\n- `loss_percent`: den Verschnitt in Prozent der Stangenlänge, auf zwei Nachkommastellen gerundet\n\nAusgabe z.B. `8 Stücke zu 747.4 mm, Verschnitt 0.35 %`.", "en": "A bar of length `L` (mm) is sawn into `n` pieces of equal length. Every cut costs the blade width `kerf` (mm); $n$ pieces need $n - 1$ cuts. Compute\n- `piece`: the length of one piece, rounded to 0.1 mm (`round(…, 1)`)\n- `loss`: the total material lost by the cuts in mm\n- `loss_percent`: the loss in percent of the bar length, rounded to two decimals\n\nOutput e.g. `8 pieces of 747.4 mm, loss 0.35 %`."}, "starter": {"de": "L = 6000.0   # mm\nn = 8\nkerf = 3.0   # mm\n\n# Ihr Code:\n", "en": "L = 6000.0   # mm\nn = 8\nkerf = 3.0   # mm\n\n# your code:\n"}, "solution": "L = 6000.0\nn = 8\nkerf = 3.0\nloss = (n - 1) * kerf\npiece = round((L - loss) / n, 1)\nloss_percent = round(loss / L * 100, 2)\nprint(f\"{n} Stücke zu {piece} mm, Verschnitt {loss_percent} %\")\n", "tests": "\nfor L, n, k in [(6000.0, 8, 3.0), (1000.0, 4, 2.5), (3000.0, 1, 3.0), (2500.0, 7, 4.2)]:\n    ns, out = run(sub={\"L\": L, \"n\": n, \"kerf\": k})\n    p, lo, lp = need(ns, \"piece\", \"loss\", \"loss_percent\")\n    el = (n - 1) * k\n    check(approx(lo, el), f\"{n} Stücke, Schnittbreite {k} mm: Verschnitt {el:g} mm\", f\"{n} pieces, kerf {k} mm: loss {el:g} mm\")\n    check(approx(p, round((L - el) / n, 1)), f\"Stücklänge {round((L - el) / n, 1)} mm\", f\"piece length {round((L - el) / n, 1)} mm\")\n    check(approx(lp, round(el / L * 100, 2)), f\"Verschnitt {round(el / L * 100, 2)} %\", f\"loss {round(el / L * 100, 2)} %\")\n", "require": ["round"], "refs": ["4.2", "4.4"], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-password", "ch": "4", "lvl": 2, "title": {"de": "Passwort für die Steuerung", "en": "Password for the controller"}, "task": {"de": "Eine Maschinensteuerung verlangt beim Ändern des Passworts:\n- mindestens 10 Zeichen\n- das Passwort darf den Benutzernamen nicht enthalten\n- es darf nicht das Standardpasswort `\"admin1234\"` enthalten\n- es muss mindestens eines der Sonderzeichen `!`, `#` oder `?` enthalten\n\nLesen Sie zuerst den Benutzernamen `user`, dann das Passwort `pw` mit `input()` ein. Speichern Sie die vier Teilprüfungen in `long_enough`, `no_user`, `no_default`, `has_special` und das Gesamtergebnis in `accepted`. Geben Sie `accepted` aus.", "en": "A machine controller requires when changing the password:\n- at least 10 characters\n- the password must not contain the user name\n- it must not contain the default password `\"admin1234\"`\n- it must contain at least one of the special characters `!`, `#` or `?`\n\nFirst read the user name `user`, then the password `pw` with `input()`. Store the four partial checks in `long_enough`, `no_user`, `no_default`, `has_special` and the overall result in `accepted`. Print `accepted`."}, "starter": {"de": "# Benutzername und Passwort einlesen\n", "en": "# read user name and password\n"}, "solution": "user = input(\"Benutzer: \")\npw = input(\"Passwort: \")\nlong_enough = len(pw) >= 10\nno_user = user not in pw\nno_default = \"admin1234\" not in pw\nhas_special = \"!\" in pw or \"#\" in pw or \"?\" in pw\naccepted = long_enough and no_user and no_default and has_special\nprint(\"Passwort akzeptiert:\", accepted)\n", "tests": "\ncases = [(\"weber\", \"Fraese#2026x\", True), (\"weber\", \"kurz#1\", False), (\"weber\", \"weber#2026abc\", False),\n         (\"weber\", \"xadmin1234!y\", False), (\"weber\", \"OhneSonderzeichen\", False), (\"op\", \"Linie?Drei!!\", True), (\"op\", \"Abcdefgh#1\", True), (\"op\", \"Abcdefg#1\", False)]\nfor u, p, e in cases:\n    ns, out = run(inputs=[u, p])\n    a = need(ns, \"accepted\")\n    check(a is e, f\"Benutzer {u!r}, Passwort {p!r}: accepted = {e}\", f\"user {u!r}, password {p!r}: accepted = {e}\")\nns, out = run(inputs=[\"weber\", \"weber#2026abc\"])\ncheck(ns.get(\"long_enough\") is True and ns.get(\"no_user\") is False and ns.get(\"has_special\") is True, \"Teilprüfungen für 'weber#2026abc' stimmen\", \"Partial checks for 'weber#2026abc' are correct\")\n", "stdin": "weber\nFraese#2026x\n", "require": ["in", "boolop"], "refs": ["4.4", "4.3e"], "forbid": [], "topics": []}, {"id": "k4-brake", "ch": "4", "lvl": 3, "title": {"de": "Anhalteweg", "en": "Stopping distance"}, "task": {"de": "Faustformeln der Fahrschule ($v$ in km/h): Reaktionsweg = $(v/10) \\cdot 3$, Bremsweg = $(v/10)^2$. Berechnen Sie `reaction`, `braking` und `total` (Summe, in m). Speichern Sie in `safe`, ob `total` kleiner als der Abstand `distance` zum Hindernis ist. Ausgabe mit dem Anhalteweg auf eine Nachkommastelle, z.B.: `Anhalteweg: 40.0 m, sicher: True`.", "en": "Driving-school rules of thumb ($v$ in km/h): reaction distance = $(v/10) \\cdot 3$, braking distance = $(v/10)^2$. Compute `reaction`, `braking` and `total` (sum, in m). Store in `safe` whether `total` is less than `distance` to the obstacle. Output with the stopping distance to one decimal, e.g.: `Stopping distance: 40.0 m, safe: True`."}, "starter": {"de": "v = 50          # km/h\ndistance = 45.0 # m\n\n# Ihr Code:\n", "en": "v = 50          # km/h\ndistance = 45.0 # m\n\n# your code:\n"}, "solution": "v = 50\ndistance = 45.0\nreaction = (v / 10) * 3\nbraking = (v / 10) ** 2\ntotal = reaction + braking\nsafe = total < distance\nprint(f\"Anhalteweg: {total:.1f} m, sicher: {safe}\")\n", "tests": "\nfor v, d in [(50, 45.0), (100, 120.0), (30, 20.0)]:\n    ns, out = run(sub={\"v\": v, \"distance\": d})\n    r, b, t, s = need(ns, \"reaction\", \"braking\", \"total\", \"safe\")\n    er, eb = v / 10 * 3, (v / 10) ** 2\n    check(approx(r, er) and approx(b, eb), f\"Reaktions- und Bremsweg stimmen für v = {v}\", f\"Reaction and braking distance correct for v = {v}\")\n    check(approx(t, er + eb), f\"Anhalteweg für v = {v} km/h ist {er+eb:.1f} m\", f\"Stopping distance for v = {v} km/h is {er+eb:.1f} m\")\n    check(s is (er + eb < d), f\"safe ist korrekt für Abstand {d} m\", f\"safe is correct for distance {d} m\")\n    check(f\"{er+eb:.1f}\" in out, f\"Ausgabe zeigt {er+eb:.1f} m\", f\"Output shows {er+eb:.1f} m\")\n", "refs": ["4.2", "4.4"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-pq", "ch": "4", "lvl": 3, "title": {"de": "p-q-Formel", "en": "Quadratic formula"}, "task": {"de": "Lösen Sie $x^2 + p x + q = 0$ mit der p-q-Formel $x_{1,2} = -\\frac{p}{2} \\pm \\sqrt{\\frac{p^2}{4} - q}$. Die Wurzel berechnen Sie mit `** 0.5`. Speichern Sie die Lösungen in `x1` (mit +) und `x2` (mit −) und geben Sie beide auf drei Nachkommastellen aus. Achten Sie auf die Klammern! Sie dürfen voraussetzen, dass es zwei reelle Lösungen gibt.", "en": "Solve $x^2 + p x + q = 0$ with the p-q formula $x_{1,2} = -\\frac{p}{2} \\pm \\sqrt{\\frac{p^2}{4} - q}$. Compute the root with `** 0.5`. Store the solutions in `x1` (with +) and `x2` (with −) and print both with three decimals. Mind the parentheses! You may assume that two real solutions exist."}, "starter": {"de": "p = -3.0\nq = 2.0\n\n# Ihr Code:\n", "en": "p = -3.0\nq = 2.0\n\n# your code:\n"}, "solution": "p = -3.0\nq = 2.0\nroot = (p**2 / 4 - q) ** 0.5\nx1 = -p / 2 + root\nx2 = -p / 2 - root\nprint(f\"x1 = {x1:.3f}, x2 = {x2:.3f}\")\n", "tests": "\nfor p, q in [(-3.0, 2.0), (2.0, -8.0), (1.5, -1.0)]:\n    ns, out = run(sub={\"p\": p, \"q\": q})\n    x1, x2 = need(ns, \"x1\", \"x2\")\n    r = (p * p / 4 - q) ** 0.5\n    check(approx(x1, -p / 2 + r) and approx(x2, -p / 2 - r), f\"Lösungen für p = {p}, q = {q} stimmen\", f\"Solutions for p = {p}, q = {q} are correct\")\n    check(f\"{-p/2+r:.3f}\" in out and f\"{-p/2-r:.3f}\" in out, f\"Ausgabe mit drei Nachkommastellen für p = {p}, q = {q}\", f\"Output with three decimals for p = {p}, q = {q}\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-heating", "ch": "4", "lvl": 3, "title": {"de": "Heizdauer eines Wasserkochers", "en": "Heating time of a kettle"}, "task": {"de": "Ein Wasserkocher mit der Leistung `P` (W) und dem Wirkungsgrad `eta` erwärmt `m` kg Wasser von `T_start` auf `T_end` (°C). Die benötigte Wärme ist $Q = m \\cdot c \\cdot \\Delta T$ mit $c = 4190\\,\\mathrm{J/(kg\\cdot K)}$. Berechnen Sie die Heizdauer in Sekunden, gerundet auf ganze Sekunden (`t_s`, mit `round`), und zerlegen Sie sie in `minutes` und `seconds`. Ausgabe: `Heizdauer: 4 min 57 s`.", "en": "A kettle with power `P` (W) and efficiency `eta` heats `m` kg of water from `T_start` to `T_end` (°C). The heat required is $Q = m \\cdot c \\cdot \\Delta T$ with $c = 4190\\,\\mathrm{J/(kg\\cdot K)}$. Compute the heating time in seconds, rounded to whole seconds (`t_s`, using `round`), and split it into `minutes` and `seconds`. Output: `Heating time: 4 min 57 s`."}, "starter": {"de": "P = 2000.0     # W\neta = 0.9\nm = 1.5        # kg\nT_start = 15.0 # °C\nT_end = 100.0  # °C\n\n# Ihr Code:\n", "en": "P = 2000.0     # W\neta = 0.9\nm = 1.5        # kg\nT_start = 15.0 # °C\nT_end = 100.0  # °C\n\n# your code:\n"}, "solution": "P = 2000.0\neta = 0.9\nm = 1.5\nT_start = 15.0\nT_end = 100.0\nQ = m * 4190 * (T_end - T_start)\nt_s = round(Q / (P * eta))\nminutes = t_s // 60\nseconds = t_s % 60\nprint(f\"Heizdauer: {minutes} min {seconds} s\")\n", "tests": "\nfor P, eta, m, a, b in [(2000.0, 0.9, 1.5, 15.0, 100.0), (3000.0, 0.95, 0.5, 20.0, 80.0), (1200.0, 0.8, 1.0, 10.0, 100.0), (800.0, 0.8, 3.0, 10.0, 100.0)]:\n    ns, out = run(sub={\"P\": P, \"eta\": eta, \"m\": m, \"T_start\": a, \"T_end\": b})\n    t, mi, se = need(ns, \"t_s\", \"minutes\", \"seconds\")\n    et = round(m * 4190 * (b - a) / (P * eta))\n    check(t == et, f\"{P} W, {m} kg, {a}→{b} °C: t = {et} s\", f\"{P} W, {m} kg, {a}→{b} °C: t = {et} s\")\n    check((mi, se) == (et // 60, et % 60), f\"= {et//60} min {et%60} s\", f\"= {et//60} min {et%60} s\")\n    check(f\"{et//60} min {et%60} s\" in out, \"Ausgabe im Format 'x min y s'\", \"Output in the format 'x min y s'\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-gearbox", "ch": "4", "lvl": 3, "title": {"de": "Zweistufiges Getriebe", "en": "Two-stage gearbox"}, "task": {"de": "Ein zweistufiges Zahnradgetriebe hat die Zähnezahlen `z1`→`z2` (Stufe 1) und `z3`→`z4` (Stufe 2). Die Gesamtübersetzung ist $i = \\dfrac{z_2}{z_1} \\cdot \\dfrac{z_4}{z_3}$. Berechnen Sie `i`, die Abtriebsdrehzahl `n_out = n_in / i` und das Abtriebsmoment `M_out = M_in · i · eta²` (jede Stufe hat den Wirkungsgrad `eta`). Ausgabe (`i` mit zwei, `n_out` und `M_out` mit einer Nachkommastelle): `i = 9.00, n_out = 161.1 1/min, M_out = 169.4 Nm`.", "en": "A two-stage gearbox has the tooth counts `z1`→`z2` (stage 1) and `z3`→`z4` (stage 2). The overall ratio is $i = \\dfrac{z_2}{z_1} \\cdot \\dfrac{z_4}{z_3}$. Compute `i`, the output speed `n_out = n_in / i` and the output torque `M_out = M_in · i · eta²` (each stage has efficiency `eta`). Output (`i` with two, `n_out` and `M_out` with one decimal): `i = 9.00, n_out = 161.1 1/min, M_out = 169.4 Nm`."}, "starter": {"de": "n_in = 1450.0  # 1/min\nM_in = 20.0    # Nm\nz1 = 17\nz2 = 51\nz3 = 19\nz4 = 57\neta = 0.97\n\n# Ihr Code:\n", "en": "n_in = 1450.0  # 1/min\nM_in = 20.0    # Nm\nz1 = 17\nz2 = 51\nz3 = 19\nz4 = 57\neta = 0.97\n\n# your code:\n"}, "solution": "n_in = 1450.0\nM_in = 20.0\nz1 = 17\nz2 = 51\nz3 = 19\nz4 = 57\neta = 0.97\ni = (z2 / z1) * (z4 / z3)\nn_out = n_in / i\nM_out = M_in * i * eta**2\nprint(f\"i = {i:.2f}, n_out = {n_out:.1f} 1/min, M_out = {M_out:.1f} Nm\")\n", "tests": "\nfor nin, Min, eta in [(1450.0, 20.0, 0.97), (3000.0, 5.0, 0.9), (960.0, 100.0, 0.98)]:\n    ns, out = run(sub={\"n_in\": nin, \"M_in\": Min, \"eta\": eta})\n    i, n, M = need(ns, \"i\", \"n_out\", \"M_out\")\n    check(approx(i, 9.0), \"Übersetzung i = 9\", \"Ratio i = 9\")\n    check(approx(n, nin / 9) and approx(M, Min * 9 * eta ** 2), f\"n_in = {nin}: n_out ≈ {nin/9:.1f}, M_out ≈ {Min*9*eta**2:.1f}\", f\"n_in = {nin}: n_out ≈ {nin/9:.1f}, M_out ≈ {Min*9*eta**2:.1f}\")\n    check(f\"{M*1:.1f}\" in out and f\"{nin/9:.1f}\" in out, \"Ausgabe mit einer Nachkommastelle\", \"Output with one decimal\")\nns, out = run(sub={\"z1\": 20, \"z2\": 40, \"z3\": 10, \"z4\": 50})\ncheck(approx(ns.get(\"i\"), 10.0), \"Mit anderen Zähnezahlen (20/40, 10/50) ergibt sich i = 10\", \"With other tooth counts (20/40, 10/50), i = 10\")\n", "refs": ["4.2", "4.3"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-triangle", "ch": "4", "lvl": 3, "title": {"de": "Dreiecksblech", "en": "Triangular sheet"}, "task": {"de": "Aus einem Blech soll ein Dreieck mit den Seiten `a ≤ b ≤ c` (mm, aufsteigend gegeben) geschnitten werden.\n- `valid`: Ein Dreieck existiert nur, wenn a + b > c.\n- `area`: Fläche nach Heron: $s = \\frac{a+b+c}{2}$, $A = \\sqrt{s(s-a)(s-b)(s-c)}$, Wurzel mit `** 0.5`\n- `right_angle`: ob das Dreieck rechtwinklig ist ($a^2 + b^2 = c^2$). Gleitkommazahlen nie mit `==` vergleichen: prüfen Sie mit einer Comparison Chain, ob die Differenz zwischen −1e-9 und 1e-9 liegt.", "en": "A triangle with sides `a ≤ b ≤ c` (mm, given in ascending order) is to be cut from a sheet.\n- `valid`: a triangle only exists if a + b > c.\n- `area`: area by Heron: $s = \\frac{a+b+c}{2}$, $A = \\sqrt{s(s-a)(s-b)(s-c)}$, root with `** 0.5`\n- `right_angle`: whether the triangle is right-angled ($a^2 + b^2 = c^2$). Never compare floats with `==`: use a comparison chain to check whether the difference lies between −1e-9 and 1e-9."}, "starter": {"de": "a = 30.0\nb = 40.0\nc = 50.0\n\n# Ihr Code:\n", "en": "a = 30.0\nb = 40.0\nc = 50.0\n\n# your code:\n"}, "solution": "a = 30.0\nb = 40.0\nc = 50.0\nvalid = a + b > c\ns = (a + b + c) / 2\narea = (s * (s - a) * (s - b) * (s - c)) ** 0.5\nright_angle = -1e-9 < a**2 + b**2 - c**2 < 1e-9\nprint(valid, area, right_angle)\n", "tests": "\nfor a, b, c in [(30.0, 40.0, 50.0), (5.0, 5.0, 8.0), (0.3, 0.4, 0.5), (7.0, 7.0, 7.0), (3.0, 4.0, 5.01)]:\n    ns, out = run(sub={\"a\": a, \"b\": b, \"c\": c})\n    v, A, r = need(ns, \"valid\", \"area\", \"right_angle\")\n    s = (a + b + c) / 2; eA = (s * (s - a) * (s - b) * (s - c)) ** 0.5\n    check(v is True and approx(A, eA), f\"{a}, {b}, {c}: Fläche ≈ {eA:.3f} mm²\", f\"{a}, {b}, {c}: area ≈ {eA:.3f} mm²\")\n    check(r is (abs(a*a + b*b - c*c) < 1e-9), f\"{a}, {b}, {c}: right_angle = {abs(a*a+b*b-c*c) < 1e-9}\", f\"{a}, {b}, {c}: right_angle = {abs(a*a+b*b-c*c) < 1e-9}\")\nfor a, b, c in [(2.0, 3.0, 6.0), (2.0, 3.0, 5.0)]:\n    ns, out = run(sub={\"a\": a, \"b\": b, \"c\": c})\n    check(ns.get(\"valid\") is False, f\"{a:g}, {b:g}, {c:g} ist kein Dreieck (valid = False)\", f\"{a:g}, {b:g}, {c:g} is no triangle (valid = False)\")\n", "refs": ["4.2", "4.4"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-cantilever", "ch": "4", "lvl": 3, "title": {"de": "Durchbiegung eines Kragträgers", "en": "Deflection of a cantilever"}, "task": {"de": "Ein Kragträger mit Rechteckquerschnitt (Breite `b`, Höhe `h` in mm) und der Länge `L` (mm) wird am freien Ende mit der Kraft `F` (N) belastet. Mit dem E-Modul `E` (N/mm²) gilt:\n- Flächenträgheitsmoment $I = \\dfrac{b h^3}{12}$ (mm⁴)\n- Durchbiegung am Ende $f = \\dfrac{F L^3}{3 E I}$ (mm)\n\nBerechnen Sie `I` und `f`. Die zulässige Durchbiegung ist `f_max = L / 250`. Speichern Sie in `ok`, ob `f` höchstens `f_max` ist, und in `utilisation` die Ausnutzung `f / f_max` in Prozent (eine Nachkommastelle, `round`). Ausgabe z.B. `f = 2.41 mm (zulässig 4.80 mm), Ausnutzung 50.2 %`.", "en": "A cantilever with rectangular cross-section (width `b`, height `h` in mm) and length `L` (mm) carries the force `F` (N) at its free end. With Young's modulus `E` (N/mm²):\n- second moment of area $I = \\dfrac{b h^3}{12}$ (mm⁴)\n- deflection at the end $f = \\dfrac{F L^3}{3 E I}$ (mm)\n\nCompute `I` and `f`. The permissible deflection is `f_max = L / 250`. Store in `ok` whether `f` is at most `f_max`, and in `utilisation` the utilisation `f / f_max` in percent (one decimal, `round`). Output e.g. `f = 2.41 mm (permissible 4.80 mm), utilisation 50.2 %`."}, "starter": {"de": "b = 40.0       # mm\nh = 80.0       # mm\nL = 1200.0     # mm\nF = 1500.0     # N\nE = 210000.0   # N/mm² (Stahl)\n\n# Ihr Code:\n", "en": "b = 40.0       # mm\nh = 80.0       # mm\nL = 1200.0     # mm\nF = 1500.0     # N\nE = 210000.0   # N/mm² (steel)\n\n# your code:\n"}, "solution": "b = 40.0\nh = 80.0\nL = 1200.0\nF = 1500.0\nE = 210000.0\nI = b * h**3 / 12\nf = F * L**3 / (3 * E * I)\nf_max = L / 250\nok = f <= f_max\nutilisation = round(f / f_max * 100, 1)\nprint(f\"f = {f:.2f} mm (zulässig {f_max:.2f} mm), Ausnutzung {utilisation} %\")\n", "tests": "\nfor b, h, L, F, E in [(40.0, 80.0, 1200.0, 1500.0, 210000.0), (30.0, 30.0, 500.0, 200.0, 70000.0), (60.0, 120.0, 3000.0, 4000.0, 210000.0)]:\n    ns, out = run(sub={\"b\": b, \"h\": h, \"L\": L, \"F\": F, \"E\": E})\n    I, f, ok, u = need(ns, \"I\", \"f\", \"ok\", \"utilisation\")\n    eI = b * h**3 / 12; ef = F * L**3 / (3 * E * eI); fm = L / 250\n    check(approx(I, eI), f\"b = {b}, h = {h}: I = {eI:.4g} mm⁴\", f\"b = {b}, h = {h}: I = {eI:.4g} mm⁴\")\n    check(approx(f, ef), f\"Durchbiegung f = {ef:.3f} mm\", f\"deflection f = {ef:.3f} mm\")\n    check(ok is (ef <= fm) and approx(u, round(ef / fm * 100, 1)), f\"ok = {ef <= fm}, Ausnutzung {round(ef / fm * 100, 1)} %\", f\"ok = {ef <= fm}, utilisation {round(ef / fm * 100, 1)} %\")\n", "refs": ["4.2", "4.4"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-payback", "ch": "4", "lvl": 3, "title": {"de": "Lohnt sich die LED-Umrüstung?", "en": "Is the LED retrofit worth it?"}, "task": {"de": "Eine Halle wird auf LED umgerüstet. Die Investition kostet `invest` €, die Stromkosten sinken im ersten Jahr um `saving` €. Weil der Strompreis jedes Jahr um `p` Prozent steigt, wächst die Ersparnis entsprechend: Im Jahr $k$ beträgt sie $\\mathit{saving} \\cdot q^{k-1}$ mit $q = 1 + p/100$.\n\nDie Summe der Ersparnisse über $n$ Jahre ist eine geometrische Reihe: $S = \\mathit{saving} \\cdot \\dfrac{q^n - 1}{q - 1}$.\n\nBerechnen Sie `q`, die Ersparnis im letzten Jahr `last_year`, die Gesamtersparnis `total` nach `n` Jahren und speichern Sie in `pays_off`, ob sich die Investition in dieser Zeit amortisiert ($\\mathit{total} \\ge \\mathit{invest}$). Geben Sie Gesamtersparnis und `pays_off` aus (Ersparnis auf ganze Euro gerundet).\n\nSie dürfen voraussetzen, dass p größer als 0 ist.", "en": "A hall is retrofitted with LEDs. The investment costs `invest` €; the electricity costs drop by `saving` € in the first year. Because the electricity price rises by `p` percent every year, the saving grows accordingly: in year $k$ it is $\\mathit{saving} \\cdot q^{k-1}$ with $q = 1 + p/100$.\n\nThe sum of the savings over $n$ years is a geometric series: $S = \\mathit{saving} \\cdot \\dfrac{q^n - 1}{q - 1}$.\n\nCompute `q`, the saving in the last year `last_year`, the total saving `total` after `n` years, and store in `pays_off` whether the investment pays for itself in that time ($\\mathit{total} \\ge \\mathit{invest}$). Print the total saving and `pays_off` (saving rounded to whole euros).\n\nYou may assume that p is greater than 0."}, "starter": {"de": "invest = 18000.0  # €\nsaving = 2400.0   # € im ersten Jahr\np = 4.0           # % Preissteigerung pro Jahr\nn = 6             # Jahre\n\n# Ihr Code:\n", "en": "invest = 18000.0  # €\nsaving = 2400.0   # € in the first year\np = 4.0           # % price increase per year\nn = 6             # years\n\n# your code:\n"}, "solution": "invest = 18000.0\nsaving = 2400.0\np = 4.0\nn = 6\nq = 1 + p / 100\nlast_year = saving * q**(n - 1)\ntotal = saving * (q**n - 1) / (q - 1)\npays_off = total >= invest\nprint(f\"Ersparnis nach {n} Jahren: {round(total)} €, amortisiert: {pays_off}\")\n", "tests": "\nfor inv, s, p, n in [(18000.0, 2400.0, 4.0, 6), (18000.0, 2400.0, 4.0, 7), (5000.0, 1000.0, 10.0, 4), (100.0, 50.0, 2.5, 1), (1000.0, 1000.0, 5.0, 1)]:\n    ns, out = run(sub={\"invest\": inv, \"saving\": s, \"p\": p, \"n\": n})\n    q, ly, t, po = need(ns, \"q\", \"last_year\", \"total\", \"pays_off\")\n    eq = 1 + p / 100; et = s * (eq**n - 1) / (eq - 1)\n    check(approx(q, eq) and approx(ly, s * eq**(n - 1)), f\"p = {p} %: q = {eq}, letztes Jahr {s * eq**(n-1):.2f} €\", f\"p = {p} %: q = {eq}, last year {s * eq**(n-1):.2f} €\")\n    check(approx(t, et), f\"Gesamtersparnis nach {n} Jahren: {et:.2f} €\", f\"total saving after {n} years: {et:.2f} €\")\n    check(po is (et >= inv), f\"pays_off = {et >= inv} (Investition {inv:g} €)\", f\"pays_off = {et >= inv} (investment {inv:g} €)\")\n    check(str(round(et)) in out, f\"Ausgabe zeigt {round(et)} €\", f\"Output shows {round(et)} €\")\n", "refs": ["4.2", "4.4"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-gas", "ch": "4", "lvl": 3, "title": {"de": "Druckbehälter in der Sonne", "en": "Pressure vessel in the sun"}, "task": {"de": "Ein geschlossener Druckluftbehälter (Volumen konstant) wurde bei `T1_C` °C auf den Überdruck `p1_gauge` bar gefüllt. In der Sonne erwärmt er sich auf `T2_C` °C. Für ein ideales Gas bei konstantem Volumen gilt $p_2 / p_1 = T_2 / T_1$ – aber nur mit **absoluten** Drücken und Temperaturen!\n- Absolutdruck = Überdruck + 1.013 bar, absolute Temperatur $T = \\vartheta + 273.15\\,\\mathrm{K}$\n\nBerechnen Sie `p1_abs`, `T1_K`, `T2_K`, den neuen Absolutdruck `p2_abs` und den neuen Überdruck `p2_gauge`. Speichern Sie in `valve_opens`, ob das Sicherheitsventil anspricht (Überdruck **größer** als `p_valve`). Ausgabe: neuer Überdruck mit zwei Nachkommastellen und `valve_opens`.", "en": "A closed compressed-air vessel (constant volume) was filled at `T1_C` °C to the gauge pressure `p1_gauge` bar. In the sun it heats up to `T2_C` °C. For an ideal gas at constant volume, $p_2 / p_1 = T_2 / T_1$ – but only with **absolute** pressures and temperatures!\n- absolute pressure = gauge pressure + 1.013 bar, absolute temperature $T = \\vartheta + 273.15\\,\\mathrm{K}$\n\nCompute `p1_abs`, `T1_K`, `T2_K`, the new absolute pressure `p2_abs` and the new gauge pressure `p2_gauge`. Store in `valve_opens` whether the safety valve responds (gauge pressure **greater** than `p_valve`). Output: new gauge pressure with two decimals and `valve_opens`."}, "starter": {"de": "p1_gauge = 10.0  # bar Überdruck\nT1_C = 15.0      # °C\nT2_C = 60.0      # °C\np_valve = 11.5   # bar Ansprechdruck\n\n# Ihr Code:\n", "en": "p1_gauge = 10.0  # bar gauge\nT1_C = 15.0      # °C\nT2_C = 60.0      # °C\np_valve = 11.5   # bar set pressure\n\n# your code:\n"}, "solution": "p1_gauge = 10.0\nT1_C = 15.0\nT2_C = 60.0\np_valve = 11.5\np1_abs = p1_gauge + 1.013\nT1_K = T1_C + 273.15\nT2_K = T2_C + 273.15\np2_abs = p1_abs * T2_K / T1_K\np2_gauge = p2_abs - 1.013\nvalve_opens = p2_gauge > p_valve\nprint(f\"Neuer Überdruck: {p2_gauge:.2f} bar, Ventil öffnet: {valve_opens}\")\n", "tests": "\nfor p1, t1, t2, pv in [(10.0, 15.0, 60.0, 11.5), (10.0, 15.0, 40.0, 11.5), (6.0, -10.0, 25.0, 8.0), (2.0, 20.0, 20.0, 2.0)]:\n    ns, out = run(sub={\"p1_gauge\": p1, \"T1_C\": t1, \"T2_C\": t2, \"p_valve\": pv})\n    pa, T1, T2, p2a, p2g, vo = need(ns, \"p1_abs\", \"T1_K\", \"T2_K\", \"p2_abs\", \"p2_gauge\", \"valve_opens\")\n    ep2 = (p1 + 1.013) * (t2 + 273.15) / (t1 + 273.15)\n    check(approx(pa, p1 + 1.013) and approx(T1, t1 + 273.15) and approx(T2, t2 + 273.15), \"Absolutdruck und absolute Temperaturen stimmen\", \"Absolute pressure and absolute temperatures are correct\")\n    check(approx(p2a, ep2) and approx(p2g, ep2 - 1.013), f\"{p1} bar bei {t1} °C → {ep2 - 1.013:.3f} bar Überdruck bei {t2} °C\", f\"{p1} bar at {t1} °C → {ep2 - 1.013:.3f} bar gauge at {t2} °C\")\n    check(vo is (ep2 - 1.013 > pv), f\"valve_opens = {ep2 - 1.013 > pv}\", f\"valve_opens = {ep2 - 1.013 > pv}\")\n", "refs": ["4.2", "4.4"], "require": [], "forbid": [], "stdin": "", "topics": []}, {"id": "k4-throw", "ch": "4", "lvl": 3, "title": {"de": "Waagerechter Wurf vom Förderband", "en": "Horizontal throw from a conveyor"}, "task": {"de": "Am Ende eines Förderbands (Höhe `h` in m über dem Behälterboden) fallen Teile mit der Bandgeschwindigkeit `v0` (m/s) waagerecht ab (Luftwiderstand vernachlässigt, $g = 9.81\\,\\mathrm{m/s^2}$).\n- Fallzeit $t = \\sqrt{2h/g}$\n- Wurfweite $x = v_0 \\cdot t$\n- Aufprallgeschwindigkeit $v = \\sqrt{v_0^2 + (g t)^2}$\n\nWurzeln berechn
