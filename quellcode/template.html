<title>CodingTrainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--FONTS--><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap"><!--/FONTS-->
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
/* Layout: Zeichnungs-Schriftfeld als Kopf, darunter drei Spalten – Kapitel | Aufgabe + Editor | KI-Tutor. Millimeterpapier als Grund. */
:root {
  --paper: #edf1ef;
  --sheet: #fbfcfb;
  --ink: #17242c;
  --muted: #586972;
  --line: #cbd6d2;
  --grid: rgba(23, 36, 44, .045);
  --accent: #2344c4;
  --accent-soft: #e3e8fb;
  --accent-ink: #ffffff;
  --hi: #f6dc7a;
  --ok: #1b7546;
  --ok-soft: #e1f2e8;
  --warn: #9a5d06;
  --warn-soft: #fbf0dc;
  --bad: #b3232b;
  --bad-soft: #fbe5e6;
  --code-bg: #f5f7f6;
  --code-ink: #1e2a31;
  --tk-kw: #8b1fa6;
  --tk-str: #1b7546;
  --tk-num: #b2520b;
  --tk-com: #627177;
  --field: #7f8e93;
  --tk-fn: #2344c4;
  --tk-bi: #0f6f86;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1417; --sheet: #151d21; --ink: #e1e8e5; --muted: #93a39d; --line: #283439; --grid: rgba(225, 232, 229, .035);
    --accent: #93a8ff; --accent-soft: #1d2747; --accent-ink: #0e1417; --hi: #5f5216;
    --ok: #63cf93; --ok-soft: #12291d; --warn: #e7ae55; --warn-soft: #2c220f; --bad: #ff8086; --bad-soft: #321619;
    --code-bg: #10171a; --code-ink: #dfe7e4;
    --tk-kw: #d99cf0; --tk-str: #8fd8a9; --tk-num: #f2ad6f; --tk-com: #7d8e95; --field: #617176; --tk-fn: #93a8ff; --tk-bi: #6fd0e2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1417; --sheet: #151d21; --ink: #e1e8e5; --muted: #93a39d; --line: #283439; --grid: rgba(225, 232, 229, .035);
  --accent: #93a8ff; --accent-soft: #1d2747; --accent-ink: #0e1417; --hi: #5f5216;
  --ok: #63cf93; --ok-soft: #12291d; --warn: #e7ae55; --warn-soft: #2c220f; --bad: #ff8086; --bad-soft: #321619;
  --code-bg: #10171a; --code-ink: #dfe7e4;
  --tk-kw: #d99cf0; --tk-str: #8fd8a9; --tk-num: #f2ad6f; --tk-com: #7d8e95; --field: #617176; --tk-fn: #93a8ff; --tk-bi: #6fd0e2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 8px 8px;
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre, kbd { font-family: var(--font-mono); font-size: .88em; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }

/* ---------- Kopf: Schriftfeld */
.titleblock {
  max-width: 1560px; margin: 0 auto 12px;
  display: grid; grid-template-columns: auto 1fr auto; align-items: stretch;
  border: 1.5px solid var(--ink); background: var(--sheet);
}
.tb-mark {
  display: grid; place-items: center; padding: 6px 14px; border-right: 1.5px solid var(--ink);
  font: 700 22px/1 var(--font-display); letter-spacing: .04em;
}
.tb-mark span { display: block; font-size: 10px; letter-spacing: .14em; font-weight: 600; color: var(--muted); margin-top: 3px; }
.tb-name { padding: 8px 14px; min-width: 0; }
.tb-name h1 { font-size: 22px; line-height: 1.1; font-weight: 700; }
.tb-name p { margin: 2px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.tb-tools { display: flex; align-items: stretch; border-left: 1.5px solid var(--ink); }
.tb-cell { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 6px 12px; border-left: 1px solid var(--line); }
.tb-cell:first-child { border-left: 0; }
.tb-label { font: 600 11px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tb-value { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 6px; vertical-align: 1px; }
.dot.ready { background: var(--ok); }
.dot.err { background: var(--bad); }

.tb-cell .seg { align-self: flex-start; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: transparent; padding: 3px 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

/* ---------- Grundraster */
.app {
  max-width: 1560px; margin: 0 auto;
  display: grid; gap: 12px;
  grid-template-columns: 280px minmax(0, 1fr) 380px;
  align-items: start;
}
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.panel-h h2 { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.panel-b { padding: 12px 14px; }
.eyebrow { font: 600 11px/1.2 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- Kapitel */
.side { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); display: grid; gap: 12px; align-content: start;
  max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 1px; margin: -1px; }
.chapters { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.chap { border-radius: var(--r); }
.chap-row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 8px; padding: 6px 6px; border-radius: var(--r); }
.chap-row > label { display: grid; place-items: center; padding: 4px; margin: -4px; cursor: pointer; }
.chap-open { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 14px; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; color: inherit; border-radius: 4px; }
.chap-open .caret { color: var(--muted); font-size: 11px; transition: transform .15s; }
.chap-open[aria-expanded="true"] .caret { transform: rotate(90deg); }
.chap-row:hover { background: var(--code-bg); }
.chap-row label.chap-label { display: contents; }
.chap-row input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }
.chap-num { font: 700 15px/1 var(--font-display); border: 1.5px solid var(--ink); height: 26px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.chap-title { font-size: 14px; line-height: 1.25; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.chap-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chap-bar { grid-column: 2 / 3; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.chap-bar i { display: block; height: 100%; background: var(--ok); }
.chap.off .chap-num { border-color: var(--line); color: var(--muted); }
.chap.off .chap-title { color: var(--muted); }
.ex-list { list-style: none; margin: 2px 0 6px 44px; padding: 0; display: grid; gap: 1px; }
.ex-list button { width: 100%; text-align: left; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 6px; align-items: center; border: 0; background: transparent; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.ex-list button:hover { background: var(--code-bg); }
.ex-list button > span:nth-child(2) { overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; min-width: 0; }
.ex-list button.off-level { color: var(--muted); }
.ex-list button.off-level .pips i.on { background: var(--muted); border-color: var(--muted); }
.ex-list button[aria-current="true"] { background: var(--accent-soft); }
.ex-state { width: 10px; height: 10px; border: 1.5px solid var(--muted); border-radius: 50%; }
.ex-state.solved { background: var(--ok); border-color: var(--ok); }
.ex-state.tried { border-color: var(--warn); background: var(--warn-soft); }
.ex-state.peek { border-color: var(--muted); background: var(--line); }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 6px; height: 10px; border: 1px solid var(--muted); }
.pips i.on { background: var(--ink); border-color: var(--ink); }
.ex-ai { font-size: 10px; font-weight: 700; color: var(--accent); margin-left: 4px; }

.field { display: grid; gap: 6px; }
.field + .field { margin-top: 12px; }
.switch { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.switch input { margin-top: 3px; accent-color: var(--accent); }
.levelnote { font-size: 13px; color: var(--muted); margin: 0; }
.levelnote b { color: var(--ink); }

/* ---------- Aufgabe */
.main { display: grid; gap: 12px; min-width: 0; }
.task-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 14px 16px 6px; }
.task-head h2 { font-size: 26px; font-weight: 700; line-height: 1.1; flex: 1 1 260px; }
.tag { display: inline-flex; gap: 6px; align-items: center; font: 600 12px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tag .pips i { height: 11px; }
.badge-ai { font: 600 11px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 3px 6px; border-radius: 3px; }
.task-body { padding: 4px 16px 12px; max-width: 78ch; }
.task-body p { margin: 0 0 .6em; }
.task-body ul, .task-body ol { margin: 0 0 .6em; padding-left: 1.3em; }
.task-body code, .md code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 16px 14px; }
.ref {
  display: inline-flex; align-items: baseline; gap: 6px; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 13px; background: var(--sheet);
}
.ref:hover { border-color: var(--accent); }
.ref b { font: 700 11px/1 var(--font-mono); background: var(--ink); color: var(--sheet); border-radius: 999px; padding: 3px 6px; }
.ref::after { content: "↗"; color: var(--muted); font-size: 11px; }

/* ---------- Editor */
.editor-wrap { border-top: 1px solid var(--line); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--sheet); }
.toolbar .grow { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--sheet);
  padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
#subtitle a { color: var(--accent); font-weight: 600; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-underline-offset: 2px; }
#subtitle a:hover { text-decoration-color: currentColor; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.dark { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.kbd { font: 500 11px/1 var(--font-mono); opacity: .7; }

.ed { --ed-lh: 21px; position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--code-bg); font: 14px/var(--ed-lh) var(--font-mono); }
.ed-gutter { padding: 12px 8px 12px 12px; text-align: right; color: var(--tk-com); user-select: none; border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: pre; min-width: 3.2em; }
.ed-gutter .err { color: var(--bad); font-weight: 600; }
.ed-area { position: relative; min-width: 0; overflow: hidden; }
.ed-area pre, .ed-area textarea {
  margin: 0; padding: 12px 14px; border: 0; font: inherit; white-space: pre; tab-size: 4; letter-spacing: 0;
  width: 100%; min-height: 100%;
}
.ed-area pre { position: absolute; inset: 0; color: var(--code-ink); pointer-events: none; overflow: hidden; }
.ed-area textarea {
  position: relative; display: block; resize: none; background: transparent; color: transparent; caret-color: var(--ink);
  overflow-x: auto; overflow-y: hidden; outline: none;
}
.ed-area textarea::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); color: transparent; }
.ed:has(textarea:focus-visible) { box-shadow: inset 0 0 0 2px var(--accent); }
.tk-kw { color: var(--tk-kw); font-weight: 600; }
.tk-str { color: var(--tk-str); }
.tk-num { color: var(--tk-num); }
.tk-com { color: var(--tk-com); font-style: italic; }
.tk-fn { color: var(--tk-fn); font-weight: 600; }
.tk-bi { color: var(--tk-bi); }
.tk-self { color: var(--tk-kw); font-style: italic; }
.errline { position: absolute; left: 0; right: 0; height: var(--ed-lh, 21px); background: var(--bad-soft); pointer-events: none; }

.io { display: grid; grid-template-columns: minmax(0, 1fr) 200px; border-top: 1px solid var(--line); }
.io > div { min-width: 0; }
.io .io-out { border-right: 1px solid var(--line); }
.io-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.console { margin: 0; padding: 10px 12px; font: 13px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 280px; overflow: auto; min-height: 64px; }
.console .stderr { color: var(--bad); }
.console .muted { color: var(--muted); }
#stdin { width: 100%; height: calc(100% - 31px); min-height: 72px; border: 0; padding: 10px 12px; font: 13px/1.5 var(--font-mono); resize: vertical; background: transparent; }

/* ---------- Ergebnisse */
.verdict { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.verdict strong { font: 700 18px/1.1 var(--font-display); letter-spacing: .02em; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.warn { background: var(--warn-soft); color: var(--warn); }
.verdict p { margin: 0; color: var(--ink); font-size: 14px; }
.meter { margin-left: auto; font: 700 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.checks { list-style: none; margin: 0; padding: 8px 16px 12px; display: grid; gap: 4px; }
.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.checks li::before { font-weight: 700; }
.checks li.ok::before { content: "✓"; color: var(--ok); }
.checks li.no::before { content: "✗"; color: var(--bad); }
.notes { padding: 0 16px 14px; display: grid; gap: 6px; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 6px 10px; font-size: 14px; border-radius: 0 4px 4px 0; }
.note.absent, .note.forbidden { border-color: var(--bad); background: var(--bad-soft); }
.note.missing { border-color: var(--accent); background: var(--accent-soft); }
.note a { margin-left: 4px; }
.solution { margin: 0 16px 16px; border: 1px dashed var(--line); border-radius: var(--r); }
.solution summary { cursor: pointer; padding: 8px 12px; font-weight: 600; }
.codeblock { margin: 0; padding: 10px 12px; background: var(--code-bg); font: 13px/1.5 var(--font-mono); overflow-x: auto; white-space: pre; border-radius: 0 0 var(--r) var(--r); }

/* ---------- KI-Tutor */
.tutor { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; max-height: calc(100vh - 24px); }
.tutor-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tutor-actions .btn { font-size: 13px; padding: 5px 10px; }
.hintmeter { display: inline-flex; gap: 2px; margin-left: 2px; }
.hintmeter i { width: 5px; height: 9px; border: 1px solid currentColor; opacity: .5; }
.hintmeter i.on { background: currentColor; opacity: 1; }
.chat { flex: 1; overflow-y: auto; padding: 12px 14px; display: grid; gap: 10px; align-content: start; min-height: 200px; }
.msg { font-size: 14px; line-height: 1.5; max-width: 100%; min-width: 0; }
.msg.user { justify-self: end; background: var(--accent-soft); border-radius: 10px 10px 2px 10px; padding: 6px 10px; max-width: 88%; }
.msg.ai { border-left: 2px solid var(--ink); padding-left: 10px; }
.msg.ai .who { font: 600 11px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.msg.sys { color: var(--muted); font-size: 13px; font-style: italic; }
.md p { margin: 0 0 .5em; }
.md ul, .md ol { margin: 0 0 .5em; padding-left: 1.2em; }
.md pre { margin: 0 0 .5em; padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; overflow-x: auto; font: 12.5px/1.45 var(--font-mono); white-space: pre; }
.md pre code { background: none; border: 0; padding: 0; }
.md .ref { font-size: 12px; margin: 1px 0; }
.thinking { color: var(--muted); font-style: italic; }
.chat-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); }
.chat-form textarea { resize: none; height: 40px; border: 1px solid var(--field); border-radius: var(--r); padding: 8px 10px; background: var(--sheet); font-size: 14px; }
.ai-off { padding: 14px; font-size: 14px; color: var(--muted); }
.gen { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.gen p { margin: 0; font-size: 13px; color: var(--muted); }
.progress { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 10px 12px; font-size: 13.5px; display: grid; gap: 6px; }
.progress .row { display: flex; align-items: center; gap: 8px; }
.progress .row strong { font-weight: 600; }
.progress .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; color: var(--muted); }
.progress .steps li.now { color: var(--ink); font-weight: 600; }
.progress .steps li.done { color: var(--ok); }
.progress .steps li::before { content: "○ "; }
.progress .steps li.now::before { content: "▸ "; color: var(--accent); }
.progress .steps li.done::before { content: "✓ "; }
.progress .hint { color: var(--muted); font-size: 12.5px; }
.progress .btn { justify-self: start; font-size: 13px; padding: 4px 10px; }
.spin { display: inline-block; flex: none; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; color: var(--accent); }
.thinking .spin { width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; }
.thinking .secs { font-style: normal; }
.check-status.busy { color: var(--muted); background: var(--code-bg); }

dialog { border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--sheet); color: var(--ink); max-width: min(640px, calc(100vw - 32px)); padding: 0; }
dialog::backdrop { background: rgba(10, 16, 20, .45); }
dialog .panel-b p { margin: 0 0 .7em; }
dialog .panel-b ul { margin: 0 0 .7em; padding-left: 1.2em; }

.empty { padding: 24px 16px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Klausurtraining */
.seg-wide { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
.seg-wide button { padding: 6px 8px; font-size: 14px; }
.seg-fill { width: 100%; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.exam-timer { font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.exam-timer.low { color: var(--bad); }
.exam-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  if (vars) for (const [a, b] of Object.entries(vars)) s = s.split("{" + a + "}").join(b);
  return s;
};
const L = obj => (obj && typeof obj === "object") ? (obj[LANG] ?? obj.de ?? "") : (obj ?? "");
const chName = id => L(CHAPTERS.find(c => c.id === id));
const chIdx = id => CH_ORDER.indexOf(id);

/* ====================================================================== Speicher (nur dieser Browser) */
const store = {

  set(k, v) { try { localStorage.setItem("ct." + k, JSON.stringify(v)); } catch (e) {} },
};
const S = {
  lang: store.get("lang", (navigator.language || "de").startsWith("de") ? "de" : "en"),
  selected: new Set(store.get("selected", ["4", "5", "6"])),

  progress: store.get("progress", {}),     // id -> {solved, attempts, hints, peeked, clean}

  drafts: store.get("drafts", {}),         // id -> code
  generated: store.get("generated", []),   // von Claude erzeugte, geprüfte Aufgaben
  currentId: store.get("current", null),
  expanded: new Set(store.get("expanded", [])),
  view: store.get("view", "practice"),             // "practice" | "exam"
  exam: store.get("exam", null),                   // laufende oder zuletzt abgegebene Klausur
  examCfg: store.get("examCfg", { count: 5, minutes: 60, mix: "mixed", allowRun: true }),

  lastResult: null, lastError: null, lastOut: "",

LANG = S.lang;
const save = () => {
  store.set("lang", S.lang); store.set("selected", [...S.selected]); store.set("mode", S.mode); store.set("strict", S.strict);
  store.set("progress", S.progress); store.set("levels", S.levels); store.set("drafts", S.drafts);

  store.set("view", S.view); store.set("exam", S.exam); store.set("examCfg", S.examCfg); store.set("examHistory", S.examHistory); store.set("examAck", S.examAck); store.set("welcomed", S.welcomed); store.set("copyHidden", S.copyHidden);
};
const examRunning = () => S.view === "exam" && !!S.exam && !S.exam.submitted;

const byId = id => allExercises().find(e => e.id === id);
const prog = id => (S.progress[id] ||= { solved: false, attempts: 0, hints: 0, peeked: false, clean: false });

/* ====================================================================== Hilfsfunktionen */
const $ = id => document.getElementById(id);
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || "");
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// Zählt Sekunden hoch, solange etwas läuft; gibt eine Stopp-Funktion zurück
function ticker(fn) { const t0 = Date.now(); fn(0); const id = setInterval(() => fn(Math.round((Date.now() - t0) / 1000)), 1000); return () => clearInterval(id); }
const fmtSecs = s => s < 60 ? s + " s" : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + " min";
function announce(text) { const a = $("announce"); if (!a) return; a.textContent = ""; setTimeout(() => { a.textContent = text; }, 30); }
function setCheckStatus(text, cls) { const b = $("check-status"); if (!b) return; b.textContent = text || ""; b.className = "check-status" + (cls ? " " + cls : ""); }
function revealIfHidden(el) {
  if (!el) return;
  const r = el.getBoundingClientRect();

}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pips = (n, max = 3) => `<span class="pips" role="img" aria-label="${esc(t("levelOf", { l: n }))}">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;

function refChip(id) {
  const s = SEC[id];
  if (!s) return esc(id);
  return `<a class="ref" href="${s.url}" target="_blank" rel="noopener"><b>${esc(s.num)}</b>${esc(L(s))}</a>`;
}

/* ---- Python-Hervorhebung */
const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const BI = new Set("print input len range int float str bool list dict set tuple type sum min max sorted abs round enumerate zip isinstance super open id bin hex oct ord chr divmod help complex".split(" "));
const TOKEN_RE = /(#[^\n]*)|((?:[rRbBuUfF]{1,2})?(?:"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?))|(\b\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?j?\b|\.\d+(?:[eE][+-]?\d+)?)|([A-Za-z_\u00C0-\u024F][\w\u00C0-\u024F]*)|([\s\S])/g;
function highlight(src) {
  let out = "", prev = "", m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(src))) {
    const [tok, com, str, num, word] = m;
    if (com) out += `<span class="tk-com">${esc(tok)}</span>`;
    else if (str) out += `<span class="tk-str">${esc(tok)}</span>`;
    else if (num) out += `<span class="tk-num">${esc(tok)}</span>`;
    else if (word) {
      let cls = "";
      if (KW.has(word)) cls = "tk-kw";
      else if (prev === "def" || prev === "class") cls = "tk-fn";
      else if (word === "self") cls = "tk-self";
      else if (BI.has(word)) cls = "tk-bi";
      out += cls ? `<span class="${cls}">${esc(word)}</span>` : esc(word);
    } else out += esc(tok);
    if (word) prev = word; else if (!/^\s$/.test(tok)) prev = "";
  }
  return out;
}

/* ---- Formeln: $…$ im Text, $$…$$ abgesetzt (LaTeX-Schreibweise), gesetzt mit KaTeX (lokal unter katex/) */
function texHtml(src, display) {
  if (window.katex) {
    try { return katex.renderToString(src, { displayMode: display, throwOnError: false, output: "html", strict: "ignore" }); } catch (e) {}
  }
  return `<code class="tex">${esc(src)}</code>`;
}
function mathOut(text, store) {
  const keep = html => { store.push(html); return "\u0000" + (store.length - 1) + "\u0000"; };
  // nur außerhalb von `Code`
  return text.split(/(`[^`\n]*`)/).map((seg, i) => i % 2 ? seg : seg
    .replace(/\$\$([^$]+?)\$\$/g, (a, m) => keep(texHtml(m.trim(), true)))
    .replace(/(^|[^\\$\w])\$(?=\S)([^$\n]*?\S)\$(?![\w$])/g, (a, pre, m) => pre + keep(texHtml(m, false)))
  ).join("");
}
const mathIn = (html, store) => html.replace(/\u0000(\d+)\u0000/g, (a, n) => store[+n]);

/* ---- Mini-Markdown (Aufgaben & Tutor) */
function inlineMd(s) {
  // s ist bereits escaped; Code-Abschnitte zuerst herausnehmen, damit * darin nicht als Hervorhebung gilt
  const codes = [];
  return s
    .replace(/`([^`\n]+)`/g, (all, c) => { codes.push(c); return "\u0001" + (codes.length - 1) + "\u0001"; })
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[\[\s*([0-9AB]+(?:\.[0-9]+)?[a-z]?)\s*\]\]/g, (all, id) => SEC[id] ? refChip(id) : all)
    .replace(/\u0001(\d+)\u0001/g, (all, n) => `<code>${codes[+n]}</code>`);
}
function md(text) {
  const parts = String(text).split(/```[a-zA-Z]*\n?/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1) { html += `<pre><code>${highlight(part.replace(/\n$/, ""))}</code></pre>`; return; }
    const store = [], start = html.length;
    const lines = esc(mathOut(part, store)).split("\n");
    let list = null, para = [];
    const flush = () => { if (para.length) { html += `<p>${inlineMd(para.join("<br>"))}</p>`; para = []; } };
    const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const raw of lines) {
      const line = raw.trimEnd();
      const ul = /^\s*[-*]\s+(.*)$/.exec(line), ol = /^\s*\d+\.\s+(.*)$/.exec(line);
      if (ul || ol) {
        flush();
        const type = ul ? "ul" : "ol";
        if (list !== type) { closeList(); html += `<${type}>`; list = type; }
        html += `<li>${inlineMd((ul || ol)[1])}</li>`;
      } else if (line.trim() === "") { flush(); closeList(); }
      else if (/^#{1,4}\s/.test(line)) { flush(); closeList(); html += `<p><strong>${inlineMd(line.replace(/^#+\s/, ""))}</strong></p>`; }
      else { closeList(); para.push(line); }
    }
    flush(); closeList();
    if (store.length) html = html.slice(0, start) + mathIn(html.slice(start), store);
  });
  return html;
}

/* ====================================================================== Python-Laufzeit */
const Engine = {
  worker: null, local: null, ready: null, seq: 0, pending: new Map(), failed: false, version: "",
  status(state, text) {
    const el = $("py-status");
    el.firstElementChild.className = "dot" + (state === "ready" ? " ready" : state === "error" ? " err" : "");
    // „Python 3.13.2 · bereit“: die Versionsnummer darf auf schmalen Bildschirmen wegfallen
    const i = text.indexOf(" · ");
    el.lastElementChild.innerHTML = i < 0 ? esc(text) : `<span class="pyver">${esc(text.slice(0, i))} · </span>${esc(text.slice(i + 3))}`;
    el.title = text;
  },
  start() {
    this.status("loading", t("pyLoading"));
    this.ready = this._startWorker().catch(() => this._startLocal()).then(info => {
      this.version = info.version; this.status("ready", "Python " + info.version + " · " + t("pyReady"));
      const c = $("console"); if (c && c.textContent === t("outLoading")) writeConsole([{ cls: "muted", text: t("outHint") }]);
      liveCheck();
      return true;
    }).catch(err => {
      this.failed = true; this.status("error", t("pyError"));
      writeConsole([{ cls: "stderr", text: t("engineFail") + "\n" + err }]);
      return false;
    });
    return this.ready;
  },
  _startWorker() {
    return new Promise((resolve, reject) => {
      let w;
      try { w = new Worker("worker.js"); } catch (e) { reject(e); return; }
      this.worker = w;
      w.onmessage = e => this._onMessage(e.data);
      w.onerror = e => { e.preventDefault && e.preventDefault(); if (!this._booted) { w.terminate(); this.worker = null; reject(new Error("worker error")); } };
      this._send({ type: "init" }, 120000).then(r => { this._booted = true; resolve(r); }, err => { try { w.terminate(); } catch (e) {} this.worker = null; reject(err); });
    });
  },
  async _startLocal() {
    await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "worker.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    this.local = window.CTLocalEngine;
    if (!this.local) throw new Error("no local engine");
    return this._send({ type: "init" }, 120000);
  },
  _onMessage(msg) {
    const p = this.pending.get(msg.id);
    if (!p) return;
    if (msg.status) {
      if (msg.status === "packages") {
        this.status("loading", t("pyPackages"));
        const c = $("console"); if (c && c.textContent === t("running")) writeConsole([{ cls: "muted", text: t("pkgLoading") }]);
        if ($("check-status").classList.contains("busy")) setCheckStatus(t("pkgLoading"), "busy");
      }
      return;
    }
    clearTimeout(p.timer);
    this.pending.delete(msg.id);
    if (this.version) this.status("ready", "Python " + this.version + " · " + t("pyReady"));
    msg.ok ? p.resolve(msg.result) : p.reject(new Error(msg.error));
  },
  _send(msg, timeout) {
    const id = ++this.seq;
    msg.id = id;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        this.pending.delete(id);
        reject(Object.assign(new Error("timeout"), { timeout: true }));
        if (this.worker && this._booted) this._restart();
      }, timeout);
      this.pending.set(id, { resolve, reject, timer });
      if (this.worker) this.worker.postMessage(msg);
      else if (this.local) this.local.handle(msg, r => this._onMessage(r));
      else { clearTimeout(timer); this.pending.delete(id); reject(new Error("no engine")); }
    });
  },
  _restart() {
    try { this.worker.terminate(); } catch (e) {}
    this.worker = null; this._booted = false;
    for (const p of this.pending.values()) { clearTimeout(p.timer); p.reject(new Error("restart")); }
    this.pending.clear();
    this.start();
  },
  async call(type, payload) {
    const ok = await this.ready;
    if (!ok) throw new Error("engine unavailable");
    const heavy = /\b(numpy|pandas)\b/.test((payload.code || "") + (payload.tests || ""));
    return this._send(Object.assign({ type }, payload), heavy ? 120000 : 25000);
  },
};

const ta = $("ed-ta"), hl = $("ed-hl"), gutter = $("ed-gutter");

function renderEditor() {

  gutter.innerHTML = g;

function replaceSel(text, selStart, selEnd) {
  ta.focus();
  ta.setSelectionRange(selStart, selEnd);
  if (!document.execCommand || !document.execCommand("insertText", false, text)) {
    ta.setRangeText(text, selStart, selEnd, "end");
    ta.dispatchEvent(new Event("input"));
  }
}
let tabLeaves = false;
ta.addEventListener("blur", () => { tabLeaves = false; });
ta.addEventListener("keydown", e => {
  const { selectionStart: a, selectionEnd: b, value: v } = ta;
  if (e.key === "Escape") { tabLeaves = true; return; }
  if (e.key === "Tab" && tabLeaves) { tabLeaves = false; return; }
  if (e.key !== "Shift") tabLeaves = false;
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); e.shiftKey ? doCheck() : doRun(); return; }
  if (e.key === "Tab" && !e.altKey && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    const ls = v.lastIndexOf("\n", a - 1) + 1;
    const block = v.slice(ls, b);
    if (a === b && !e.shiftKey) { replaceSel("    ", a, b); return; }
    const lines = block.split("\n");
    const out = lines.map(l => e.shiftKey ? l.replace(/^ {1,4}/, "") : "    " + l).join("\n");
    replaceSel(out, ls, b);
    ta.setSelectionRange(ls, ls + out.length);
    return;
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const ls = v.lastIndexOf("\n", a - 1) + 1;
    const line = v.slice(ls, a);
    let ind = (/^\s*/.exec(line) || [""])[0];
    if (/:\s*(#.*)?$/.test(line)) ind += "    ";
    else if (/^\s*(return|break|continue|pass|raise)\b/.test(line)) ind = ind.slice(0, Math.max(0, ind.length - 4));
    replaceSel("\n" + ind, a, b);
    return;
  }
  if (e.key === "Backspace" && a === b && a > 0) {
    const ls = v.lastIndexOf("\n", a - 1) + 1;
    const before = v.slice(ls, a);
    if (before.length && /^ +$/.test(before) && before.length % 4 === 0) { e.preventDefault(); replaceSel("", a - 4, a); }
  }
});

function current() { return examRunning() ? byId(S.exam.ids[S.exam.idx]) : byId(S.currentId); }
function chapterExercises(ch) { return allExercises().filter(e => e.ch === ch); }

function targetLevel(ch) { return S.mode === "auto" ? lvlState(ch).level : Number(S.mode); }
function pickNext(excludeId, preferCh) {
  const chs = CH_ORDER.filter(c => S.selected.has(c));
  if (!chs.length) return null;
  // Kapitel mit dem geringsten Fortschritt bevorzugen, bei Gleichstand zufällig
  const score = c => { const ex = chapterExercises(c); return ex.length ? ex.filter(e => prog(e.id).solved).length / ex.length : 1; };
  const order = chs.map(c => ({ c, s: (c === preferCh ? -1 : 0) + score(c) + Math.random() * 0.25 })).sort((x, y) => x.s - y.s).map(x => x.c);
  const cand = [];
  order.forEach((c, rank) => {
    const want = targetLevel(c);
    chapterExercises(c).filter(e => !prog(e.id).solved && e.id !== excludeId)
      .forEach(e => cand.push({ e, d: Math.abs(e.lvl - want), rank }));
  });
  if (!cand.length) return null;
  const bestD = Math.min(...cand.map(x => x.d));
  const close = cand.filter(x => x.d === bestD);
  const bestRank = Math.min(...close.map(x => x.rank));
  const pool = close.filter(x => x.rank === bestRank).map(x => x.e);
  return pool[Math.floor(Math.random() * pool.length)];
}

function openExercise(id) {
  const ex = byId(id);
  if (!ex) return;
  S.currentId = id;
  S.lastResult = null; S.lastError = null; S.lastOut = "";

  S.expanded.add(ex.ch);

}

  if (!b) return;
  S.mode = b.dataset.mode === "auto" ? "auto" : Number(b.dataset.mode);
  save();
  const ex = current();
  if (!ex || ex.lvl !== targetLevel(ex.ch)) {
    const n = pickNext(null, ex ? ex.ch : null);
    if (n && (!ex || n.id !== ex.id)) { openExercise(n.id); return; }
  }
  renderLevel(); renderChapters();
});
$("strict").onchange = e => { S.strict = e.target.checked; save(); if (S.lastResult) renderResult(S.lastResult); };

function renderTask() {
  const ex = current();
  const panel = $("task-panel");
  if (!ex) {
    $("task-title").textContent = "";
    $("task-tag").innerHTML = "";
    $("task-body").innerHTML = `<p class="empty">${esc(S.selected.size ? t(Tutor.available() ? "allDone" : "allDoneNoAi") : t("noChapters"))}</p>`;
    $("task-refs").innerHTML = "";
    panel.querySelector(".editor-wrap").hidden = true;
    return;
  }
  panel.querySelector(".editor-wrap").hidden = false;
  $("task-title").textContent = L(ex.title);
  const names = I18N.levelNames[LANG];
  const examPrefix = examRunning() ? `${esc(t("examTaskOf", { i: S.exam.idx + 1, n: S.exam.ids.length }))} · ${PTS[ex.lvl]} ${esc(t("points"))} · ` : "";
  $("task-tag").innerHTML = `${examPrefix}${LANG === "de" ? "Kapitel" : "Chapter"} ${esc(ex.ch)} · ${pips(ex.lvl)} ${esc(names[ex.lvl])}${ex.generated ? ` <span class="badge-ai">${esc(t("aiMade"))}</span>` : ""}`;
  $("task-body").innerHTML = md(L(ex.task));
  $("task-refs").innerHTML = (!examRunning() && (ex.refs || []).length) ? `<span class="eyebrow">${esc(t("scriptRefs"))}</span>` + ex.refs.map(refChip).join("") : "";
  renderEditor();
}

function renderAll() {
  renderStatic(); renderChapters(); renderLevel(); renderTask(); Tutor.renderChrome();
  if (S.lastResult && current() && S.view === "practice") renderResult(S.lastResult);
  renderExam();
  Tutor.renderChat();
  renderMbar();
}

/* ====================================================================== Ausführen & Prüfen */
function parseErrorLine(tb) {
  const m = [...String(tb || "").matchAll(/File "<dein Code>", line (\d+)/g)];
  return m.length ? Number(m[m.length - 1][1]) : null;
}

async function doRun() {
  const ex = current();
  if (!ex || Engine.failed) return;
  if (S.view === "exam" && (!examRunning() || !S.exam.allowRun)) return;
  $("run-btn").disabled = true; $("run-btn").setAttribute("aria-busy", "true");
  writeConsole([{ cls: "muted", text: Engine.version ? t("running") : t("waitPython") }]);
  if (!Engine.version) { await Engine.ready; if (Engine.version) writeConsole([{ cls: "muted", text: t("running") }]); }
  try {
    const r = await Engine.call("run", { code: ta.value, stdin: $("stdin").value, lang: LANG, files: ex.files || null });
    if (current() !== ex) return;
    S.lastOut = r.out || "";
    S.lastError = r.error || null;
    const parts = [];
    if (r.out) parts.push({ text: r.out });
    if (r.error) parts.push({ cls: "stderr", text: (r.out && !r.out.endsWith("\n") ? "\n" : "") + r.error });
    if (!parts.length) parts.push({ cls: "muted", text: t("noOutput") });
    writeConsole(parts);
    errorLine = r.error ? parseErrorLine(r.error) : null;
    renderEditor();
    announce(r.error ? (errorLine ? t("runErr", { l: errorLine }) : t("runtimeError")) : t("runDone"));
    revealIfHidden($("console"));
  } catch (e) {
    writeConsole([{ cls: "stderr", text: e.timeout ? t("timeout") : String(e.message || e) }]);
  } finally { $("run-btn").disabled = false; $("run-btn").removeAttribute("aria-busy"); }
}

async function doCheck() {
  const ex = current();
  if (!ex || Engine.failed || S.view === "exam") return;
  $("check-btn").disabled = true; $("check-btn").setAttribute("aria-busy", "true");
  setCheckStatus(Engine.version ? t("checking") : t("waitPython"), "busy");
  const p = prog(ex.id);
  try {
    const r = await Engine.call("check", { off: offKeys(), code: ta.value, tests: ex.tests, chapter: ex.ch, require: ex.require || [], forbid: ex.forbid || [], lang: LANG });
    p.attempts += 1;
    if (current() !== ex) { save(); renderChapters(); return; }
    S.lastResult = r;
    S.lastError = r.error || null;
    errorLine = r.error ? parseErrorLine(r.error) : null;
    renderEditor();
    if (r.out) { S.lastOut = r.out; }
    const solved = isSolved(r);
    if (solved && !p.solved) {
      p.solved = true;
      p.clean = p.attempts <= 2 && p.hints <= 1 && !p.peeked;
      adapt(ex, p.clean ? "clean" : "solved");
    } else if (!solved && p.attempts >= 4 && p.attempts % 2 === 0) {
      adapt(ex, "struggle");
    }
    save();
    renderResult(r);
    renderChapters();
    const passed = r.checks.filter(c => c.ok).length, n = r.checks.length;
    const msg = r.error ? t("checkErr") : solved ? t("checkOk", { n }) : (n && passed === n) ? t("checkWarn") : t("checkSome", { p: passed, n });
    setCheckStatus(msg, r.error ? "bad" : solved ? "ok" : (n && passed === n) ? "warn" : "bad");
    announce(msg);
    revealIfHidden($("result-panel").querySelector(".verdict"));
  } catch (e) {
    S.lastResult = null;
    const panel = $("result-panel");
    panel.hidden = false;
    panel.innerHTML = `<div class="verdict bad"><strong>${esc(e.timeout ? t("timeout") : String(e.message || e))}</strong></div>`;
  } finally { $("check-btn").disabled = false; $("check-btn").removeAttribute("aria-busy"); Tutor.renderChrome(); }
}

function constructBlocking(rep) {
  if (!rep) return false;
  if (rep.missing.length || rep.forbidden.length) return true;
  return S.strict && rep.items.length > 0;
}
function isSolved(r) {
  return !r.error && r.checks.length > 0 && r.checks.every(c => c.ok) && !constructBlocking(r.constructs);
}

const noteText = it => it.status === "later" ? t("constructLater", { ch: it.chapter }) : it.status === "off" ? t("constructOff") : t("constructAbsent");
let adaptMsg = "";
function adapt(ex, kind) {
  const st = lvlState(ex.ch);
  adaptMsg = "";
  if (kind === "clean") {
    st.streak += 1; st.struggle = 0;
    if (st.streak >= 2 && st.level < 3) { st.level += 1; st.streak = 0; adaptMsg = t("levelUp", { ch: ex.ch, l: st.level }); }
  } else if (kind === "solved") {
    st.streak = 0;
  } else if (kind === "struggle" || kind === "peek") {
    st.streak = 0; st.struggle += 1;
    if (st.struggle >= (kind === "peek" ? 1 : 2) && st.level > 1) { st.level -= 1; st.struggle = 0; adaptMsg = t("levelDown", { ch: ex.ch, l: st.level }); }
  }
  save(); renderLevel();
}

function renderResult(r) {
  const ex = current();
  const panel = $("result-panel");
  panel.hidden = false;
  const p = prog(ex.id);
  const passed = r.checks.filter(c => c.ok).length;
  const allOk = !r.error && r.checks.length && passed === r.checks.length;
  const blocking = constructBlocking(r.constructs);
  let cls, head;
  if (r.kind === "syntax") { cls = "bad"; head = t("syntaxError"); }
  else if (r.error) { cls = "bad"; head = t("runtimeError"); }
  else if (allOk && blocking) { cls = "warn"; head = t("passedButConstructs"); }
  else if (allOk) { cls = "ok"; head = t("allPassed"); }
  else { cls = "bad"; head = t("someFailed"); }
  let html = `<div class="verdict ${cls}"><div><strong>${esc(head)}</strong>${allOk && !blocking ? `<p>${esc(adaptMsg || t("solvedMsg"))}</p>` : ""}</div>
    ${r.checks.length ? `<span class="meter">${passed}/${r.checks.length}</span>` : ""}</div>`;
  if (r.error) html += `<pre class="console stderr" style="margin:12px 16px;border:1px solid var(--line);border-radius:4px">${esc(r.error)}</pre>`;
  if (r.checks.length) html += `<ul class="checks">${r.checks.map(c => `<li class="${c.ok ? "ok" : "no"}">${esc(c[LANG] || c.de)}</li>`).join("")}</ul>`;
  const rep = r.constructs || { items: [], missing: [], forbidden: [] };
  const notes = [];
  rep.missing.forEach(m => notes.push(`<div class="note missing">${esc(t("constructMissing"))} <strong>${esc(m[LANG])}</strong>${m.section ? refChip(m.section) : ""}</div>`));
  rep.forbidden.forEach(m => notes.push(`<div class="note forbidden">${esc(t("constructForbidden"))} <strong>${esc(m[LANG])}</strong> (${esc(t("line"))} ${m.line})</div>`));
  rep.items.filter(it => !rep.forbidden.some(f => f.key === it.key)).forEach(it => notes.push(`<div class="note ${it.status}"><code>${esc(it[LANG])}</code> (${esc(t("line"))} ${it.line}) ${esc(noteText(it))}${it.section && it.status !== "off" ? refChip(it.section) : ""}</div>`));
  if (notes.length) html += `<div class="notes">${notes.join("")}</div>`;
  if (allOk && !blocking) html += `<div style="padding:0 16px 16px"><button type="button" class="btn dark" id="res-next">${esc(t("next"))}</button></div>`;
  // Musterlösung
  const unlocked = p.solved || p.attempts >= 2 || Tutor.hintLevel() >= 3;
  if (ex.solution) {
    html += unlocked
      ? `<details class="solution" id="sol-details"><summary>${esc(t("showSolution"))}</summary>${p.solved ? "" : `<p style="margin:0;padding:0 12px 8px;color:var(--muted);font-size:13px">${esc(t("solutionNote"))}</p>`}<pre class="codeblock">${highlight(ex.solution)}</pre></details>`
      : `<p style="margin:0;padding:0 16px 14px;color:var(--muted);font-size:13px">${esc(t(Tutor.available() ? "solutionLocked" : "solutionLockedNoAi"))}</p>`;
  }
  panel.innerHTML = html;
  const nb = $("res-next");
  if (nb) nb.onclick = goNext;
  const sd = $("sol-details");
  if (sd) sd.addEventListener("toggle", () => {
    if (sd.open && !p.solved && !p.peeked) { p.peeked = true; adapt(ex, "peek"); save(); renderChapters(); }
  });
}

function goNext() {
  const n = pickNext(S.currentId);
  if (n) openExercise(n.id);
  else { S.currentId = null; S.lastResult = null; S.lastError = null; save(); renderAll(); }   // alles gelöst
}
$("next-btn").onclick = goNext;
$("mbar-next").onclick = goNext;
$("mbar-practice").onclick = () => { setView("practice"); window.scrollTo({ top: 0 }); };
$("check-status").onclick = () => { const p = $("result-panel"); if (!p.hidden) { p.scrollIntoView({ block: "start", behavior: reduceMotion() ? "auto" : "smooth" }); } };
$("run-btn").onclick = doRun;
$("check-btn").onclick = doCheck;
let resetTimer = null;
$("reset-btn").onclick = () => {
  const ex = current(); if (!ex) return;
  const btn = $("reset-btn");
  if (ta.value !== L(ex.starter) && !btn.classList.contains("confirming")) {
    btn.classList.add("confirming"); btn.textContent = t("resetConfirm");
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { btn.classList.remove("confirming"); btn.textContent = t("reset"); }, 4000);
    return;
  }
  clearTimeout(resetTimer); btn.classList.remove("confirming"); btn.textContent = t("reset");
  if (examRunning()) delete S.exam.codes[ex.id]; else delete S.drafts[ex.id];
  save();
  ta.value = L(ex.starter); errorLine = null; renderEditor(); liveCheckSoon();
  if (examRunning()) renderExamRun();
};

  } catch (e) {}
}

/* ====================================================================== KI-Tutor */
const Tutor = {
  sample: undefined, turns: [], hints: {}, ctl: null, busy: false, disabled: false,
  async init() {
    if (!STANDALONE) {
      const use = n => Promise.resolve().then(() => window.claude?.use?.(n)).catch(() => null);
      [this.sample, this.perm] = await Promise.all([use("sample"), use("permissions")]);
      // früher verweigert? Dann gleich die passende Erklärung statt eines Fehlers beim ersten Klick
      if (await this.permState() === "denied") { this.disabled = !!this.sample; this.offCode = "denied"; }
    }
    if (!this.sample) this.sample = null;
    // Tutor-Bereich nur ausblenden, wenn er per config.json abgeschaltet ist; sonst erklärt er, warum er nicht verfügbar ist
    document.documentElement.classList.toggle("no-tutor", STANDALONE && CONFIG.tutor.claude_link === false);
    this.renderChrome(); this.renderChat();
  },
  // "inline": Claude direkt in der Seite · "link": Anfrage wird in claude.ai (eigenes Konto) geöffnet · "off"
  mode() {
    if (this.sample && !this.disabled) return "inline";
    if (this.sample === undefined && !STANDALONE) return "pending";
    if (!STANDALONE) return "off";   // in Claude geöffnet, aber ohne Tutor (nicht angemeldet oder nicht erlaubt)
    if (CONFIG.tutor.claude_link === false) return "off";
    return CONFIG.tutor.artifact_url ? "goto" : "link";
  },
  async permState() { try { return this.perm ? await this.perm.state("sample") : null; } catch (e) { return null; } },
  // Claude-Aufruf endgültig abgelehnt: Ursache merken (verweigert, Konto, Anmeldung, geteilte Ansicht)
  async fail(code) {
    this.disabled = true;
    this.offCode = code === "not_granted" && await this.permState() === "denied" ? "denied" : code;
    this.renderChrome(); this.renderChat();
  },
  async openPerms() {
    let ok = true;
    try { await this.perm.manage(); } catch (e) { ok = false; }
    const st = await this.permState();
    if (this.sample && (st === "granted" || st === "prompt")) { this.disabled = false; this.offCode = null; this.turns = []; }
    this.renderChrome(); this.renderChat();
    if (!ok && this.mode() === "off") { const m = $("chat").querySelector(".xmsg"); if (m) m.textContent = t("aiPermFail"); }
  },
  hintLevel() { const ex = current(); return ex ? (this.hints[ex.id] || 0) : 0; },
  reset() {
    this.stop();
    this.turns = [];
    this.renderChat();
  },
  stop() { if (this.ctl) { this.ctl.abort(); this.ctl = null; } },
  available() { return this.sample && !this.disabled; },
  renderChrome() {
    const inExam = S.view === "exam";
    const mode = this.mode();
    $("tutor").classList.toggle("link-mode", mode === "link");
    ["tutor-actions", "chat-form"].forEach(id => { $(id).hidden = inExam || mode === "goto"; });
    $("hintmeter").hidden = mode === "goto";
    document.querySelector(".gen").hidden = inExam || mode !== "inline";
    const on = (mode === "inline" || mode === "link") && !inExam;
    const ex = current();
    ["ai-feedback", "ai-hint", "ai-error"].forEach(id => { $(id).disabled = !on || this.busy || !ex; });
    $("chat-form").querySelector("button").disabled = !on || this.busy || !ex;
    $("chat-input").disabled = !on || !ex;
    $("gen-btn").disabled = !on || this.busy || Gen.busy;
    $("stop-btn").hidden = !this.busy;
    const h = this.hintLevel();
    $("hintmeter").innerHTML = [0, 1, 2].map(i => `<i class="${i < h ? "on" : ""}"></i>`).join("");
    renderCopyBanner();
  },
  // Tutor nur wegen der geteilten Ansicht aus (nicht: verweigert, Konto, Anmeldung)
  needsCopy() { return !STANDALONE && this.sample !== undefined && this.mode() === "off" && !["denied", "sampling_disabled", "session_expired"].includes(this.offCode); },
  renderChat(streamText) {
    const chat = $("chat");
    if (S.view === "exam") { chat.innerHTML = `<div class="ai-off">${esc(examRunning() ? t("tutorExamOff") : t("tutorExamDone"))}</div>`; return; }
    const mode = this.mode();
    if (mode === "pending") { chat.innerHTML = ""; return; }
    if (mode === "off") {
      const c = this.offCode;
      if (STANDALONE) chat.innerHTML = `<div class="ai-off">${esc(t("aiOffConfig"))}</div>`;
      else if (c === "session_expired") chat.innerHTML = `<div class="ai-off">${esc(t("aiExpired"))}</div>`;
      else if (c === "sampling_disabled") chat.innerHTML = `<div class="ai-off">${esc(t("aiNoAccount"))}</div>`;
      else if (c === "denied") {
        chat.innerHTML = `<div class="ai-off">${esc(t("aiDenied"))}${this.perm ? `<br><button type="button" class="btn" id="perm-btn">${esc(t("aiPermBtn"))}</button>` : ""}<span class="xmsg" role="status"></span></div>`;
        if (this.perm) $("perm-btn").onclick = () => this.openPerms();
        else chat.querySelector(".xmsg").textContent = t("aiPermFail");
      } else {
        chat.innerHTML = `<div class="ai-off">${esc(t("aiCopy"))}<br><button type="button" class="btn primary" id="copy-btn">${esc(t("aiCopyBtn"))}</button></div>`;
        $("copy-btn").onclick = () => openCopyDlg();
      }
      return;
    }
    if (mode === "goto") {
      chat.innerHTML = `<div class="link-intro">${md(t("gotoIntro"))}<p style="margin-top:10px"><a class="btn primary" style="text-decoration:none" href="${esc(CONFIG.tutor.artifact_url)}" target="_top">${esc(t("gotoBtn"))}</a></p></div>`;
      return;
    }
    if (mode === "link") {
      let h = `<div class="link-intro">${md(t("linkIntro"))}</div>`;
      this.turns.forEach((turn, i) => {
        if (turn.role === "link") h += `<div class="msg user">${esc(turn.shown)} ↗</div><div class="msg sys">${esc(turn.long ? t("linkOpenedLong") : t("linkOpened"))} <a href="${esc(turn.href)}" target="_blank" rel="noopener">${esc(t("openAgain"))}</a> · <button type="button" class="btn ghost" data-copy="${i}" style="padding:1px 6px;font-size:12px">${esc(t("copyPrompt"))}</button></div>`;
        else if (turn.role === "sys") h += `<div class="msg sys">${esc(turn.content)}</div>`;
      });
      chat.innerHTML = h;
      chat.scrollTop = chat.scrollHeight;
      return;
    }
    let html = `<div class="msg ai"><div class="who">${esc(t("tutor"))}</div><div class="md">${md(t("aiWelcome"))}</div></div>`;
    if (!this.turns.length) html += `<div class="msg sys">${esc(t("aiConsent"))}</div>`;
    for (const turn of this.turns) {
      if (turn.role === "user") html += `<div class="msg user">${esc(turn.shown)}</div>`;
      else if (turn.role === "assistant") html += `<div class="msg ai"><div class="who">${esc(t("tutor"))}</div><div class="md">${md(turn.content)}</div></div>`;
      else html += `<div class="msg sys">${esc(turn.content)}</div>`;
    }
    if (streamText !== undefined) html += `<div class="msg ai"><div class="who">${esc(t("tutor"))}</div><div class="md">${streamText ? md(streamText) : `<span class="thinking"><span class="spin" aria-hidden="true"></span>${esc(t("aiThinking"))}<span class="secs" id="think-secs"></span></span> <button type="button" class="btn ghost" data-stop style="padding:0 6px;font-size:12px">${esc(t("cancel"))}</button>`}</div></div>`;
    chat.innerHTML = html;
    chat.scrollTop = chat.scrollHeight;
  },
  async ask(kind, userText) {
    const ex = current();
    const mode = this.mode();
    if (!ex || this.busy || S.view === "exam" || (mode !== "inline" && mode !== "link")) return;
    let shown, request;
    if (kind === "hint") {
      const lvl = Math.min(3, (this.hints[ex.id] || 0) + 1);
      this.hints[ex.id] = lvl;
      prog(ex.id).hints = lvl; save();
      shown = `${t("aiHint")} ${lvl}/3`;
      request = hintRequest(lvl);
    } else if (kind === "feedback") {
      shown = t("aiFeedback");
      request = LANG === "de"
        ? "Gib mir Feedback zu meinem aktuellen Code: Was ist schon richtig? Was fehlt oder ist falsch (beziehe dich auf die fehlgeschlagenen Tests)? Ein Hinweis zum Stil (Variablennamen, Lesbarkeit) nach den Konventionen im Skript. Schließe mit genau einem konkreten nächsten Schritt. Keine vollständige Lösung."
        : "Give me feedback on my current code: What is already right? What is missing or wrong (refer to the failed tests)? One remark on style (variable names, readability) following the conventions in the notes. End with exactly one concrete next step. No complete solution.";
    } else if (kind === "error") {
      if (!S.lastError) { this.turns.push({ role: "sys", content: t("noError") }); this.renderChat(); return; }
      shown = t("aiError");
      request = LANG === "de"
        ? "Erkläre mir die Fehlermeldung in einfachen Worten: Was bedeutet der Fehlertyp, in welcher Zeile entsteht er und warum? Wie lese ich so einen Traceback (siehe Skript)? Wie kann ich ihn beheben – als Hinweis, nicht als fertige Lösung."
        : "Explain the error message in simple words: What does the error type mean, in which line does it occur and why? How do I read a traceback like this (see the notes)? How can I fix it – as a hint, not as a finished solution.";
    } else {
      shown = userText;
      request = userText;
    }
    if (mode === "link") { this.openInClaude(linkPrompt(ex, request), shown); return; }
    const content = contextBlock(ex) + "\n\n" + (LANG === "de" ? "ANFRAGE DES STUDIERENDEN:\n" : "STUDENT'S REQUEST:\n") + request;
    this.turns.push({ role: "user", content, shown });
    await this._send();
  },
  openInClaude(prompt, shown) {
    // läuft synchron im Klick-Handler, damit Zwischenablage und neuer Tab erlaubt sind
    copyText(prompt);
    const enc = encodeURIComponent(prompt);
    const long = enc.length > 14000;
    const href = long ? "https://claude.ai/new" : "https://claude.ai/new?q=" + enc;
    const a = document.createElement("a");
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    this.turns.push({ role: "link", shown, long, prompt, href });
    this.renderChat();
  },
  async _send() {
    this.busy = true; this.renderChrome();
    this.ctl = new AbortController();
    this.renderChat("");
    announce(t("aiThinking"));
    const stopTick = ticker(s => { const el = document.getElementById("think-secs"); if (el && s >= 3) el.textContent = ` · ${fmtSecs(s)} – ${t("thinkHint")}`; });
    const msgs = [{ role: "user", content: tutorRules() }];
    // nur die letzten Runden mitschicken
    const hist = this.turns.filter(x => x.role !== "sys").slice(-8);
    for (const x of hist) msgs.push({ role: x.role, content: x.content });
    try {
      const { text } = await this.sample(msgs, {
        signal: this.ctl.signal, cache: false,

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function weightedPick(list, w) {
  const total = list.reduce((s, e) => s + w(e), 0);
  let r = Math.random() * total;
  for (const e of list) { r -= w(e); if (r <= 0) return e; }
  return list[list.length - 1];
}
function pickExam(cfg) {
  const chs = shuffle(CH_ORDER.filter(c => S.selected.has(c)));
  const weights = cfg.mix === "hard" ? { 1: 0, 2: 1, 3: 2 } : { 1: 1, 2: 2, 3: 2 };
  let pool = allExercises().filter(e => S.selected.has(e.ch) && weights[e.lvl] > 0);
  if (!pool.length) pool = allExercises().filter(e => S.selected.has(e.ch));
  const w = e => weights[e.lvl] || 1;
  const picked = [];
  for (let k = 0; picked.length < cfg.count && k < cfg.count * 4; k++) {
    const c = chs[k % chs.length];
    let cand = pool.filter(e => e.ch === c && !picked.includes(e));
    if (!cand.length) cand = pool.filter(e => !picked.includes(e));
    if (!cand.length) break;
    picked.push(weightedPick(cand, w));
  }
  picked.sort((a, b) => chIdx(a.ch) - chIdx(b.ch) || a.lvl - b.lvl);
  return picked.map(e => e.id);
}

function fmtClock(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function tickExam() {
  if (!S.exam || S.exam.submitted || gradingInfo) return;
  const el = $("exam-clock");
  if (S.exam.minutes > 0) {
    const left = S.exam.start + S.exam.minutes * 60000 - Date.now();
    if (el) { el.textContent = fmtClock(left); el.classList.toggle("low", left < 5 * 60000); }
    if (left <= 0) submitExam(true);
  } else if (el) {
    el.textContent = fmtClock(Date.now() - S.exam.start);
  }
}

function scoreTask(ex, r) {
  const max = PTS[ex.lvl];
  const total = r.checks.length, passed = r.checks.filter(c => c.ok).length;
  let pts = total ? max * passed / total : 0;
  const penalty = pts > 0 && constructBlocking(r.constructs);
  if (penalty) pts /= 2;
  return { pts: Math.round(pts * 2) / 2, max, passed, total, penalty };
}

async function submitExam(auto) {
  if (!S.exam || S.exam.submitted || gradingInfo) return;
  const exam = S.exam;
  examConfirm = null;
  gradingInfo = { i: 0, n: exam.ids.length };
  renderExamRun();
  const results = {};
  try {
    for (let k = 0; k < exam.ids.length; k++) {
      gradingInfo.i = k + 1; renderExamRun();
      const ex = byId(exam.ids[k]);
      const code = exam.codes[ex.id] ?? L(ex.starter);
      const r = await Engine.call("check", { off: offKeys(), code, tests: ex.tests, chapter: ex.ch, require: ex.require || [], forbid: ex.forbid || [], lang: LANG });
      const edited = exam.codes[ex.id] !== undefined && exam.codes[ex.id].trim() !== L(ex.starter).trim();
      const sc = scoreTask(ex, r);
      if (!edited) { sc.pts = 0; sc.penalty = false; }   // unveränderter Startcode gibt keine Punkte
      results[ex.id] = Object.assign(sc, { r, code, edited });
    }
  } catch (e) {
    gradingInfo = null;
    renderExamRun();
    const box = $("exam-run").querySelector(".panel-b");
    if (box) box.insertAdjacentHTML("afterbegin", `<div class="note absent">${esc(t("examGradeFail"))}</div>`);
    return;
  }
  gradingInfo = null;
  exam.results = results; exam.submitted = true; exam.end = Date.now(); exam.auto = !!auto;
  const got = Object.values(results).reduce((s, x) => s + x.pts, 0), max = Object.values(results).reduce((s, x) => s + x.max, 0);
  S.examHistory.unshift({ when: exam.end, pct: Math.round(100 * got / max), got, max, chapters: exam.chapters, n: exam.ids.length });
  S.examHistory = S.examHistory.slice(0, 8);
  save(); renderAll();
  window.scrollTo({ top: 0 });
}

    html += `<details class="task-res" id="res-${i}" ${res.pts < res.max ? "open" : ""}>

// Kapitel- und Bibliotheksangaben aus config.json, damit keine Zahl fest im Text steht
function joinList(xs, de) { return xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + (de ? " und " : " and ") + xs[xs.length - 1]; }
function chapterPhrase(de) {
  const ids = visibleChapters().map(c => c.id);
  const nums = ids.filter(i => /^\d+$/.test(i)).map(Number).sort((a, b) => a - b);
  const apps = ids.filter(i => !/^\d+$/.test(i));
  const ranges = [];
  for (const n of nums) { const r = ranges[ranges.length - 1]; if (r && n === r[1] + 1) r[1] = n; else ranges.push([n, n]); }
  const parts = [];
  if (nums.length) parts.push((de ? (nums.length > 1 ? "den Kapiteln " : "dem Kapitel ") : (nums.length > 1 ? "chapters " : "chapter ")) + joinList(ranges.map(([a, b]) => a === b ? String(a) : a + "–" + b), de));
  if (apps.length) parts.push((de ? (apps.length > 1 ? "den Anhängen " : "dem Anhang ") : (apps.length > 1 ? "appendices " : "appendix ")) + joinList(apps, de));
  return parts.join(de ? " und " : " and ");
}
function libsPhrase(de) {
  const libs = [["numpy", "NumPy"], ["pandas", "pandas"]].filter(([k]) => CONFIG.topics[k] !== false).map(([, n]) => n);
  return libs.length ? (de ? ", inkl. " : ", incl. ") + joinList(libs, de) : "";
}

  // Versionsprüfung nur in eigenen Kopien (in der geteilten Ansicht und der Version ohne Tutor ist der Stand immer aktuell)
  const ver = STANDALONE || Tutor.needsCopy() ? "" : `<p><a href="${HOME_URL}?v=${encodeURIComponent(VERSION)}&amp;lang=${LANG}" target="_blank" rel="noopener">${esc(t("verCheck"))} ↗</a> – ${esc(t("verNote"))}</p>`;
  $("info-body").innerHTML = de ? `
    <p>Der CodingTrainer enthält ${n} Aufgaben ${("zu " + chapterPhrase(true)).replace(/^zu dem /, "zum ")} des Skripts (Version 4.0)${gen ? `, davon ${gen} von Claude erzeugt` : ""}. Die Kapitelnummern entsprechen dem Skript; die Kapitel 1–3 (Vorwort, Einleitung, Vorbereitungen) enthalten keine Programmieraufgaben. Jede Aufgabe lässt sich nur mit dem lösen, was bis zu ihrem Kapitel im Skript steht.</p>
    <ul>
      <li><b>Prüfen</b> führt Ihren Code mehrfach mit unterschiedlichen Eingaben aus. Fest eingetippte Ergebnisse fallen dabei auf.</li>
      <li><b>Konstrukt-Prüfung:</b> Verwenden Sie etwas, das erst in einem späteren Kapitel kommt oder gar nicht im Skript steht (z.B. <code>lambda</code>, <code>.join()</code>), weist der Trainer darauf hin. Mit „Nur Konstrukte aus dem Skript“ zählt die Aufgabe dann noch nicht als gelöst.</li>
      <li><b>Automatische Stufe:</b> Zwei saubere Lösungen in Folge (höchstens zwei Prüfversuche, höchstens ein Tipp) heben die Stufe im Kapitel an; wer die Musterlösung ansieht oder lange hängt, bekommt leichtere Aufgaben.</li>
      <li><b>Klausurtraining:</b> zufällige Aufgaben aus den gewählten Kapiteln, optional mit Zeitlimit und ohne Ausführen (wie auf Papier). Kein Tutor und keine Tests bis zur Abgabe, danach Punkte, Musterlösungen und die Skriptabschnitte zum Wiederholen.</li>
      ${tutorDe}
      ${STANDALONE ? "" : `<li><b>Neue Aufgaben:</b> Mit „Neue Aufgabe von Claude erzeugen“ (unten im Tutor-Bereich) erfindet Claude eine zusätzliche Aufgabe zum aktuellen Kapitel und Niveau. Bevor sie erscheint, prüft der Trainer sie automatisch: Die Musterlösung muss alle Tests bestehen, der Startcode darf es nicht, und es dürfen nur Konstrukte aus dem Skript vorkommen. Erzeugte Aufgaben tragen die Markierung „AI“ und werden in Ihrem Browser gespeichert.</li>`}
      <li>Python läuft vollständig im Browser (Pyodide, Python 3.13${libsPhrase(true)}). Ihr Fortschritt wird nur in diesem Browser gespeichert – sichern und übertragen können Sie ihn unten unter „Fortschritt übertragen“.</li>
    </ul>
    <h3 style="font-size:16px;margin:12px 0 6px">Bedienung</h3>
    <ul>
      <li><b>Tastatur:</b> ${IS_MAC ? "⌘" : "Strg"}+Enter führt aus, Umschalt+${IS_MAC ? "⌘" : "Strg"}+Enter prüft. Im Editor rückt Tab ein; Escape und danach Tab verlässt den Editor.</li>
      <li><b>Kapitel:</b> Ein Klick auf den Kapitelnamen klappt die Aufgaben auf oder zu. Das Häkchen legt fest, aus welchen Kapiteln „Nächste Aufgabe“ und das Klausurtraining auswählen.</li>
      <li><b>Symbole:</b> ○ offen · <span style="color:var(--warn)">◍</span> versucht · <span style="color:var(--ok)">●</span> gelöst · Balken = Stufe 1 (Einstieg) bis 3 (Transfer).</li>
    </ul>
    <p><a href="https://profweber.github.io/programming/" target="_blank" rel="noopener">Zum Skript ↗</a></p>
    ${ver}
    <p style="color:var(--muted);font-size:13px">CodingTrainer v${VERSION} · abgestimmt auf Skriptversion 4.0 · ${n} Aufgaben${CONFIG.semester ? " · " + esc(CONFIG.semester) : ""}${offKeys().length ? " · ohne " + esc(offKeys().join(", ")) : ""}</p>` : `
    <p>The CodingTrainer contains ${n} exercises for ${chapterPhrase(false)} of the lecture notes (version 4.0)${gen ? `, ${gen} of them generated by Claude` : ""}. Chapter numbers follow the notes; chapters 1–3 (preface, introduction, preparations) contain no programming exercises. Each exercise can be solved using only what the notes cover up to its chapter.</p>
    <ul>
      <li><b>Check</b> runs your code several times with different inputs, so hard-coded results are caught.</li>
      <li><b>Construct check:</b> if you use something that only appears in a later chapter or not at all in the notes (e.g. <code>lambda</code>, <code>.join()</code>), the trainer points it out. With “Only accept constructs from the notes”, the exercise doesn't count as solved yet.</li>
      <li><b>Adaptive level:</b> two clean solutions in a row (at most two checks, at most one hint) raise the level in that chapter; viewing the solution or getting stuck makes the next exercise easier.</li>
      <li><b>Exam practice:</b> random exercises from the selected chapters, optionally with a time limit and without running code (like on paper). No tutor and no tests until you submit; afterwards you get points, reference solutions and the sections of the notes to review.</li>
      ${tutorEn}
      ${STANDALONE ? "" : `<li><b>New exercises:</b> with “Generate a new exercise with Claude” (at the bottom of the tutor panel), Claude invents an additional exercise for the current chapter and level. Before it appears, the trainer checks it automatically: the reference solution must pass all tests, the starter code must not, and only constructs from the notes may be used. Generated exercises are marked “AI” and stored in your browser.</li>`}
      <li>Python runs entirely in your browser (Pyodide, Python 3.13${libsPhrase(false)}). Your progress is stored in this browser only – you can save and transfer it below under “Transfer progress”.</li>
    </ul>
    <h3 style="font-size:16px;margin:12px 0 6px">Using the trainer</h3>
    <ul>
      <li><b>Keyboard:</b> ${IS_MAC ? "⌘" : "Ctrl"}+Enter runs, Shift+${IS_MAC ? "⌘" : "Ctrl"}+Enter checks. In the editor Tab indents; Escape followed by Tab leaves the editor.</li>
      <li><b>Chapters:</b> clicking a chapter name expands or collapses its exercises. The tick decides which chapters “Next exercise” and exam practice choose from.</li>
      <li><b>Symbols:</b> ○ open · <span style="color:var(--warn)">◍</span> attempted · <span style="color:var(--ok)">●</span> solved · bars = level 1 (basics) to 3 (transfer).</li>
    </ul>
    <p><a href="https://profweber.github.io/programming/" target="_blank" rel="noopener">Open the lecture notes ↗</a></p>
    ${ver}
    <p style="color:var(--muted);font-size:13px">CodingTrainer v${VERSION} · matched to lecture notes version 4.0 · ${n} exercises${CONFIG.semester ? " · " + esc(CONFIG.semester) : ""}${offKeys().length ? " · without " + esc(offKeys().join(", ")) : ""}</p>`;
  $("info-body").insertAdjacentHTML("beforeend", xferHtml());
  bindXfer($("info-body"));
}

/* ====================================================================== Eigene Kopie & Fortschritt übertragen */
function renderCopyBanner() {
  const b = $("copy-banner");
  if (!b) return;
  const show = Tutor.needsCopy() && !S.copyHidden && S.view !== "exam";
  if (!show) { b.hidden = true; return; }
  if (b.hidden || b.dataset.lang !== LANG) {
    b.innerHTML = `<p>${md(t("copyBanner")).replace(/^<p>|<\/p>$/g, "")}</p><div class="row"><button type="button" class="btn primary" id="copy-how">${esc(t("copyHow"))}</button><button type="button" class="btn ghost" id="copy-hide">${esc(t("copyHide"))}</button></div>`;
    b.dataset.lang = LANG;
    $("copy-how").onclick = () => openCopyDlg();
    $("copy-hide").onclick = () => { S.copyHidden = true; save(); b.hidden = true; };
  }
  b.hidden = false;
}
function openCopyDlg() {
  $("copy-h").textContent = t("copyTitle");
  const body = $("copy-body");
  body.innerHTML = `<p>${esc(t("copyIntro"))}</p><ol class="steps">${t("copySteps").map(s => `<li>${md(s).replace(/^<p>|<\/p>$/g, "")}</li>`).join("")}</ol>${md(t("copyProgress"))}${xferHtml()}`;
  bindXfer(body);
  $("copy-dlg").showModal();
}
function xferHtml() {
  return `<section class="xfer"><h3>${esc(t("xferTitle"))}</h3><p>${esc(t("xferText"))}</p><div class="row"><button type="button" class="btn" data-xfer="export">${esc(t("xferExport"))}</button><button type="button" class="btn" data-xfer="import">${esc(t("xferImport"))}</button></div><div data-xfer-box hidden></div></section>`;
}
function bindXfer(root) {
  const box = root.querySelector("[data-xfer-box]");
  root.querySelectorAll("[data-xfer]").forEach(btn => btn.onclick = () => {
    box.hidden = false;
    if (btn.dataset.xfer === "export") {
      const code = exportProgress();
      box.innerHTML = `<label class="xmsg">${esc(t("xferExportNote"))}<textarea readonly rows="4" spellcheck="false">${esc(code)}</textarea></label><div class="row"><button type="button" class="btn dark" data-xcopy>${esc(t("xferCopy"))}</button><span class="xmsg" role="status"></span></div>`;
      const area = box.querySelector("textarea");
      area.focus(); area.select();
      box.querySelector("[data-xcopy]").onclick = async () => {
        let ok = false;
        try { await navigator.clipboard.writeText(code); ok = true; } catch (e) { area.select(); try { ok = document.execCommand("copy"); } catch (e2) {} }
        if (!ok) { area.focus(); area.select(); }
        box.querySelector('[role="status"]').textContent = t(ok ? "xferCopied" : "xferCopyFail");
      };
    } else {
      box.innerHTML = `<label class="xmsg">${esc(t("xferPaste"))}<textarea rows="4" spellcheck="false"></textarea></label><div class="row"><button type="button" class="btn dark" data-xapply>${esc(t("xferApply"))}</button><span class="xmsg" role="status"></span></div>`;
      const area = box.querySelector("textarea");
      area.focus();
      box.querySelector("[data-xapply]").onclick = () => {
        const r = importProgress(area.value);
        box.querySelector('[role="status"]').textContent = r ? t("xferOk", { n: r.solved }) : t("xferBad");
        if (r) { area.value = ""; renderAll(); loadEditor(); renderWelcome(); }
      };
    }
  });
}
function exportProgress() {
  const d = { app: "CodingTrainer", v: 1, progress: S.progress, levels: S.levels, drafts: S.drafts, generated: S.generated, selected: [...S.selected], mode: S.mode, strict: S.strict, examHistory: S.examHistory };
  const bytes = new TextEncoder().encode(JSON.stringify(d));
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return "CT1-" + btoa(bin);
}
function importProgress(code) {
  try {
    const m = String(code).replace(/\s+/g, "").match(/^CT1-([A-Za-z0-9+/]+={0,2})$/);
    if (!m) return null;
    const bin = atob(m[1]);
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    const obj = x => (x && typeof x === "object" && !Array.isArray(x)) ? x : {};
    if (!d || d.app !== "CodingTrainer" || !d.progress || typeof d.progress !== "object") return null;
    S.progress = obj(d.progress); S.levels = obj(d.levels);
    S.drafts = Object.fromEntries(Object.entries(obj(d.drafts)).filter(([, v]) => typeof v === "string"));
    S.generated = Array.isArray(d.generated) ? d.generated.filter(g => g && typeof g.id === "string" && g.generated && g.title && g.tests) : [];
    if (Array.isArray(d.selected)) { const sel = d.selected.filter(c => typeof c === "string" && chapterOn(c)); if (sel.length) S.selected = new Set(sel); }
    if (d.mode === "auto" || [1, 2, 3].includes(d.mode)) S.mode = d.mode;
    if (typeof d.strict === "boolean") S.strict = d.strict;
    if (Array.isArray(d.examHistory)) S.examHistory = d.examHistory;
    S.welcomed = true; S.lastResult = null; S.lastError = null;
    if (!current() || !S.selected.has(current().ch)) { const n = pickNext(); if (n) S.currentId = n.id; }
    save();
    return { solved: Object.values(S.progress).filter(p => p && p.solved).length };
  } catch (e) { return null; }
}
$("info-btn").onclick = () => { renderInfo(); $("info-dlg").showModal(); };
$("info-close").onclick = () => $("info-dlg").close();
$("copy-close").onclick = () => $("copy-dlg").close();


/* ====================================================================== Mobile Navigation (Schublade) & Begrüßung */
const mqMobile = window.matchMedia("(max-width: 860px)");
function openNav() {
  if (!mqMobile.matches || S.view === "exam") return;
  document.body.classList.add("nav-open");
  $("nav-toggle").setAttribute("aria-expanded", "true");
  ["task-panel", "result-panel", "tutor", "welcome"].forEach(id => { const el = $(id); if (el) el.inert = true; });
  document.querySelector(".titleblock").inert = true; $("mbar").inert = true;
  setTimeout(() => { const cur = document.querySelector('#chapters [aria-current="true"]') || $("nav-close"); cur.focus(); if (cur.scrollIntoView) cur.scrollIntoView({ block: "center" }); }, 60);
}
function closeNav(toTask) {
  if (!document.body.classList.contains("nav-open")) return;
  document.body.classList.remove("nav-open");
  $("nav-toggle").setAttribute("aria-expanded", "false");
  ["task-panel", "result-panel", "tutor", "welcome"].forEach(id => { const el = $(id); if (el) el.inert = false; });
  document.querySelector(".titleblock").inert = false; $("mbar").inert = false;
  if (toTask) { window.scrollTo({ top: 0 }); $("task-panel").focus({ preventScroll: true }); }
  else $("nav-toggle").focus();
}
$("nav-toggle").onclick = () => document.body.classList.contains("nav-open") ? closeNav() : openNav();
$("nav-close").onclick = () => closeNav();
$("nav-backdrop").onclick = () => closeNav();
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("nav-open")) { e.preventDefault(); closeNav(); } });
mqMobile.addEventListener?.("change", () => { if (!mqMobile.matches) closeNav(); });
function renderMbar() {
  const ex = current();
  $("mbar-info").textContent = ex ? `${LANG === "de" ? "Kap." : "Ch."} ${ex.ch} · ${L(ex.title)}` : "";
}
function renderWelcome() {
  const w = $("welcome");
  if (S.welcomed || S.view === "exam") { w.hidden = true; return; }
  w.hidden = false;
  const steps = t("welcomeSteps").slice();
  if (STANDALONE && Tutor.mode() === "goto") steps[3] = t("welcomeStep4NoAi");   // Version ohne eingebauten Tutor
  if (STANDALONE && Tutor.mode() === "off") steps[3] = t("welcomeStep4Off");
  w.innerHTML = `<h2>${esc(t("welcomeTitle"))}</h2><ol>${steps.map(s => `<li>${md(s).replace(/^<p>|<\/p>$/g, "")}</li>`).join("")}</ol><p>${md(t("welcomeNote")).replace(/^<p>|<\/p>$/g, "")}</p><button type="button" class="btn dark" id="welcome-ok">${esc(t("welcomeOk"))}</button>`;
  $("welcome-ok").onclick = () => { S.welcomed = true; save(); w.hidden = true; $("task-panel").focus({ preventScroll: true }); };
}

/* ====================================================================== Start */
function setLang(l) { LANG = S.lang = l; save(); Tutor.reset(); renderAll(); const ex = current(); const store_ = examRunning() ? S.exam.codes : S.drafts; if (ex && store_[ex.id] === undefined) { ta.value = L(ex.starter); renderEditor(); } }
$("lang-de").onclick = () => setLang("de");
$("lang-en").onclick = () => setLang("en");

(async function boot() {
  await loadConfig();
  S.selected = new Set([...S.selected].filter(chapterOn));
  if (!S.selected.size) visibleChapters().slice(0, 3).forEach(c => S.selected.add(c.id));
  if (!current() || !S.selected.has(current().ch)) {
    const n = pickNext();
    if (n) S.currentId = n.id;
  }
  if (S.view === "exam" && S.exam && !S.exam.submitted && !S.exam.ids.every(id => byId(id))) S.exam = null;
  loadEditor();
  renderAll();
  Engine.start();
  Tutor.init();
  setInterval(tickExam, 1000);
  tickExam();
})();
</script>
